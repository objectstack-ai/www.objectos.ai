<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Cost of changing the system over time: generated code rises exponentially, generated metadata stays flat">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .ax{stroke:#c4d3cc;stroke-width:1.5}.gl{stroke:#e6efe9;stroke-width:1}
      .lbl{font-size:15px;fill:#5d736b}.cap{font-size:14px;fill:#5d736b}
    </style>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="60" y="50" font-size="22" font-weight="760">The same system: how the cost of changing it moves over time</text>
  <text x="60" y="78" class="cap">Y: the cost of safely changing one thing · X: time after launch</text>

  <g>
    <line class="gl" x1="110" y1="170" x2="900" y2="170"/>
    <line class="gl" x1="110" y1="240" x2="900" y2="240"/>
    <line class="gl" x1="110" y1="310" x2="900" y2="310"/>
    <line class="gl" x1="110" y1="380" x2="900" y2="380"/>
    <line class="ax" x1="110" y1="130" x2="110" y2="440"/>
    <line class="ax" x1="110" y1="440" x2="900" y2="440"/>
  </g>
  <g class="lbl" text-anchor="middle">
    <text x="170" y="466">Week 1</text>
    <text x="370" y="466">Month 1</text>
    <text x="600" y="466">Month 6</text>
    <text x="850" y="466">Month 12</text>
  </g>
  <text x="40" y="290" class="lbl" transform="rotate(-90 40 290)" text-anchor="middle">cost to change</text>

  <!-- metadata: flat low line -->
  <path d="M150 400 C 320 396, 560 392, 860 388" fill="none" stroke="#1f6b4a" stroke-width="4"/>
  <circle cx="150" cy="400" r="5" fill="#1f6b4a"/>
  <circle cx="860" cy="388" r="5" fill="#1f6b4a"/>

  <!-- code-gen: low then exponential rise -->
  <path d="M150 405 C 330 392, 500 350, 620 250 C 700 184, 780 156, 860 150" fill="none" stroke="#9a3b1f" stroke-width="4"/>
  <circle cx="150" cy="405" r="5" fill="#9a3b1f"/>
  <circle cx="860" cy="150" r="5" fill="#9a3b1f"/>

  <line x1="600" y1="130" x2="600" y2="440" stroke="#e8b04b" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="610" y="150" font-size="14" fill="#9a6212">Months 6–12: comprehension debt erupts</text>

  <text x="150" y="430" class="cap" text-anchor="middle">both start fast</text>

  <g transform="translate(150 500)">
    <rect width="22" height="6" y="-4" rx="3" fill="#9a3b1f"/>
    <text x="32" y="2" class="lbl">Generated code: each change lacks context, debt compounds</text>
  </g>
  <g transform="translate(150 522)">
    <rect width="22" height="6" y="-4" rx="3" fill="#1f6b4a"/>
    <text x="32" y="2" class="lbl">Generated metadata: declarative, always readable and revertible</text>
  </g>
</svg>
