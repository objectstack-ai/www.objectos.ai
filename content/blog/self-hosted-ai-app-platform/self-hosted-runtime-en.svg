<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Self-hosted AI application platform runtime boundary</title>
  <desc id="desc">The open-source ObjectStack Runtime runs inside customer infrastructure, ObjectOS is an optional commercial operating layer for the same application, and AI model access is optional.</desc>
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#0f172a"/>
  <rect x="56" y="72" width="704" height="584" rx="22" fill="#10201b" stroke="#10b981" stroke-width="2"/>
  <text x="88" y="126" fill="#86efac" font-size="28" font-weight="800">Your infrastructure</text>
  <text x="88" y="162" fill="#cbd5e1" font-size="18">VPC / private cloud / on-prem / isolated network</text>
  <rect x="114" y="230" width="260" height="120" rx="16" fill="#111827" stroke="#334155"/>
  <text x="142" y="278" fill="#f8fafc" font-size="22" font-weight="800">ObjectStack Runtime</text>
  <text x="142" y="312" fill="#94a3b8" font-size="16">Open source · permissions · flows · audit</text>
  <rect x="446" y="230" width="226" height="120" rx="16" fill="#10213a" stroke="#2563eb"/>
  <text x="474" y="278" fill="#dbeafe" font-size="22" font-weight="800">AI Agent</text>
  <text x="474" y="312" fill="#93c5fd" font-size="16">Works through governed tools</text>
  <rect x="112" y="460" width="170" height="88" rx="14" fill="#172033" stroke="#475569"/>
  <text x="140" y="497" fill="#f8fafc" font-size="20" font-weight="750">Database</text>
  <text x="140" y="524" fill="#94a3b8" font-size="15">Business records</text>
  <rect x="318" y="460" width="170" height="88" rx="14" fill="#172033" stroke="#475569"/>
  <text x="346" y="497" fill="#f8fafc" font-size="20" font-weight="750">Identity</text>
  <text x="346" y="524" fill="#94a3b8" font-size="15">SSO / roles</text>
  <rect x="524" y="460" width="170" height="88" rx="14" fill="#172033" stroke="#475569"/>
  <text x="552" y="497" fill="#f8fafc" font-size="20" font-weight="750">File storage</text>
  <text x="552" y="524" fill="#94a3b8" font-size="15">Attachments / docs</text>
  <path d="M374 290H446M244 460V350M403 460V350M609 460V350" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M374 330H394V407H414" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
  <rect x="414" y="380" width="258" height="54" rx="14" fill="#142033" stroke="#60a5fa" stroke-dasharray="8 8"/>
  <text x="543" y="414" text-anchor="middle" fill="#bfdbfe" font-size="14" font-weight="700">ObjectOS · optional ops layer</text>
  <rect x="834" y="120" width="300" height="190" rx="18" fill="#172033" stroke="#64748b" stroke-width="2" stroke-dasharray="10 10"/>
  <text x="864" y="168" fill="#e2e8f0" font-size="24" font-weight="800">Optional AI model</text>
  <text x="864" y="206" fill="#94a3b8" font-size="16">External API or local model</text>
  <text x="864" y="252" fill="#cbd5e1" font-size="16">Only approved minimum context is sent</text>
  <path d="M672 290H834" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>
  <rect x="834" y="420" width="300" height="132" rx="18" fill="#201a11" stroke="#f59e0b" stroke-width="2"/>
  <text x="864" y="470" fill="#fde68a" font-size="24" font-weight="800">Governance plane</text>
  <text x="864" y="508" fill="#fef3c7" font-size="16">Approval / audit / rollback / policy</text>
  <path d="M984 420V310" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
</svg>
