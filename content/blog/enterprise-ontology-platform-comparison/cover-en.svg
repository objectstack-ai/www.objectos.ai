<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The 2026 ontology comparison: Fabric IQ, Unity Catalog, Snowflake, Looker and Palantir Foundry compared on objects, relationships, actions and agent interface. All five model objects and relationships; on actions Fabric IQ declares, Unity Catalog and Snowflake are read-only, Looker triggers downstream actions, Palantir executes.">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f3f6fb"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#16243f" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#142540}
      .title{font-size:52px;font-weight:780}
      .sub{font-size:21px;fill:#566480}
      .vendor{font-size:19px;font-weight:740;fill:#eaf1ff}
      .head{font-size:15px;fill:#8fa4c8;font-weight:640;letter-spacing:.06em}
      .rowlbl{font-size:16px;fill:#c8d6f0;font-weight:640}
      .rowkey{font-size:16px;fill:#ffd98a;font-weight:740}
      .dot{font-size:26px;font-weight:760;fill:#4ec59a}
      .yes{font-size:17px;font-weight:740;fill:#7fe3bd}
      .warn{font-size:17px;font-weight:740;fill:#ffd98a}
      .no{font-size:17px;font-weight:700;fill:#8494b0}
      .foot{font-size:16px;fill:#566480}
      .footdim{font-size:16px;fill:#5e7092}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="86" y="98" class="title">The 2026 ontology comparison</text>
  <text x="86" y="136" class="sub">Five platforms, one question: where does each stop describing and start acting?</text>

  <g transform="translate(86 186)" filter="url(#shadow)">
    <rect width="1028" height="366" rx="26" fill="#142540"/>

    <text x="40" y="52" class="head">CAPABILITY</text>
    <text x="190" y="52" class="vendor">Fabric IQ</text>
    <text x="350" y="52" class="vendor">Unity Catalog</text>
    <text x="510" y="52" class="vendor">Snowflake</text>
    <text x="670" y="52" class="vendor">Looker</text>
    <text x="830" y="52" class="vendor">Palantir</text>
    <line x1="40" y1="70" x2="988" y2="70" stroke="#2b4373"/>

    <text x="40" y="124" class="rowlbl">Objects</text>
    <text x="190" y="126" class="dot">&#8226;</text>
    <text x="350" y="126" class="dot">&#8226;</text>
    <text x="510" y="126" class="dot">&#8226;</text>
    <text x="670" y="126" class="dot">&#8226;</text>
    <text x="830" y="126" class="dot">&#8226;</text>
    <line x1="40" y1="146" x2="988" y2="146" stroke="#1d3258"/>

    <text x="40" y="190" class="rowlbl">Relationships</text>
    <text x="190" y="192" class="dot">&#8226;</text>
    <text x="350" y="192" class="dot">&#8226;</text>
    <text x="510" y="192" class="dot">&#8226;</text>
    <text x="670" y="192" class="dot">&#8226;</text>
    <text x="830" y="192" class="dot">&#8226;</text>
    <line x1="40" y1="212" x2="988" y2="212" stroke="#1d3258"/>

    <rect x="24" y="226" width="964" height="62" rx="12" fill="#1d3258"/>
    <text x="40" y="264" class="rowkey">Actions</text>
    <text x="190" y="264" class="warn">declared</text>
    <text x="350" y="264" class="no">read-only</text>
    <text x="510" y="264" class="no">read-only</text>
    <text x="670" y="264" class="warn">triggers</text>
    <text x="830" y="264" class="yes">executes</text>

    <text x="40" y="330" class="rowlbl">Agent interface</text>
    <text x="190" y="332" class="dot">&#8226;</text>
    <text x="350" y="332" class="dot">&#8226;</text>
    <text x="510" y="332" class="dot">&#8226;</text>
    <text x="670" y="332" class="dot">&#8226;</text>
    <text x="830" y="332" class="dot">&#8226;</text>
  </g>

  <text x="86" y="596" class="foot">The read&#8211;write line is the row that eliminates two of the five.</text>
  <text x="86" y="626" class="footdim">Every cell sourced to the vendor&#8217;s own docs or announcement.</text>
</svg>
