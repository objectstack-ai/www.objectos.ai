<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="The mistake ledger for the run, as a four-row table: a bare predicate status != resolved would have evaluated to null and hidden the Resolve button on every ticket, caught by the Validated gate as expression-invalid; a row action named resolve would have rendered a button that does nothing, caught as action-name-undefined; an object with no sharingModel would have fallen closed to private with its baseline an accident, caught as security-owd-unset; and required: 'yes' on a field is refused by the Typed gate as TS2322 before anything else runs">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1b2a41}
      .h{font-size:24px;font-weight:780}
      .note{font-size:14px;fill:#4a5a70}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#5b6a7c}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600}
      .cell{font-size:13px;fill:#1b2a41}
      .small{font-size:13px;fill:#5b6a7c}
      .chip{font-size:13px;font-weight:760}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#fbfcfe"/>

  <text x="40" y="48" class="h">The mistake ledger: three deliberate mistakes, one run of the gate</text>
  <text x="40" y="74" class="note">For a target format, list each mistake an agent can make, the gate that catches it, and what would have shipped otherwise.</text>

  <!-- header -->
  <text x="52" y="110" class="cap">THE MISTAKE</text>
  <text x="364" y="110" class="cap">WOULD HAVE SHIPPED AS (THE GATE'S OWN WORDS)</text>
  <text x="756" y="110" class="cap">CAUGHT BY</text>
  <text x="928" y="110" class="cap">RULE</text>
  <line x1="40" y1="120" x2="1160" y2="120" stroke="#c9d0dd" stroke-width="1.5"/>

  <!-- row 1 -->
  <g transform="translate(40 130)">
    <rect width="1120" height="84" rx="14" fill="#ffffff" stroke="#dde2ec"/>
    <text x="12" y="34" class="mono">visible: P`status != "resolved"`</text>
    <text x="12" y="58" class="small">a bare identifier in a CEL predicate</text>
    <text x="324" y="34" class="cell">the expression "silently evaluates to null":</text>
    <text x="324" y="56" class="cell">the Resolve button hidden on every ticket</text>
    <g transform="translate(716 26)"><rect width="104" height="32" rx="16" fill="#e6f4f1" stroke="#8fcdc0"/><text x="52" y="21" class="chip" text-anchor="middle" style="fill:#176a5c">Validated</text></g>
    <text x="888" y="48" class="mono" style="fill:#b3433a">expression-invalid</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(40 224)">
    <rect width="1120" height="84" rx="14" fill="#ffffff" stroke="#dde2ec"/>
    <text x="12" y="34" class="mono">rowActions: ['resolve']</text>
    <text x="12" y="58" class="small">a row action naming no defined action</text>
    <text x="324" y="34" class="cell">"the button renders and does nothing when</text>
    <text x="324" y="56" class="cell">clicked — a dead affordance"</text>
    <g transform="translate(716 26)"><rect width="104" height="32" rx="16" fill="#e6f4f1" stroke="#8fcdc0"/><text x="52" y="21" class="chip" text-anchor="middle" style="fill:#176a5c">Validated</text></g>
    <text x="888" y="48" class="mono" style="fill:#b3433a">action-name-undefined</text>
  </g>

  <!-- row 3 -->
  <g transform="translate(40 318)">
    <rect width="1120" height="84" rx="14" fill="#ffffff" stroke="#dde2ec"/>
    <text x="12" y="34" class="mono">(no sharingModel on the object)</text>
    <text x="12" y="58" class="small">the org-wide default left unsaid</text>
    <text x="324" y="34" class="cell">the runtime "fails CLOSED to 'private'", but</text>
    <text x="324" y="56" class="cell">the baseline is an accident, not a decision</text>
    <g transform="translate(716 26)"><rect width="104" height="32" rx="16" fill="#e6f4f1" stroke="#8fcdc0"/><text x="52" y="21" class="chip" text-anchor="middle" style="fill:#176a5c">Validated</text></g>
    <text x="888" y="48" class="mono" style="fill:#b3433a">security-owd-unset</text>
  </g>

  <!-- row 4 -->
  <g transform="translate(40 412)">
    <rect width="1120" height="84" rx="14" fill="#ffffff" stroke="#dde2ec"/>
    <text x="12" y="34" class="mono">required: 'yes'</text>
    <text x="12" y="58" class="small">a string where a boolean belongs</text>
    <text x="324" y="34" class="cell">nothing — tsc refuses it first: "Type 'string' is</text>
    <text x="324" y="56" class="cell">not assignable to type 'boolean | undefined'"</text>
    <g transform="translate(716 26)"><rect width="84" height="32" rx="16" fill="#e8edfb" stroke="#8ea3e6"/><text x="42" y="21" class="chip" text-anchor="middle" style="fill:#2f4bb8">Typed</text></g>
    <text x="888" y="48" class="mono" style="fill:#b3433a">TS2322</text>
  </g>

  <text x="40" y="530" class="small">49 author-time rules at ObjectStack 17.7.0. Each message was located and corrective; the fixed app passed the same 49 rules in 240 ms.</text>
</svg>
