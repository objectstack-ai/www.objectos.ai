<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="An enterprise ontology projected into MCP tools: one wide read tool over many object types, one narrow write tool per action type">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}
      .soft{fill:#5d736b;font-size:13px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
      .dim{fill:#a8cdc2;font-size:13px}
      .box{fill:#fffefa;stroke:#d7dfdb}.dark{fill:#173a36}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="80" font-size="34" font-weight="780">The ontology becomes the tool surface</text>
  <text x="96" y="116" class="tiny">Object types, action types and functions, projected into tools any MCP agent can call</text>

  <!-- ontology side -->
  <g transform="translate(96 168)">
    <rect width="300" height="392" rx="26" class="box"/>
    <text x="150" y="46" text-anchor="middle" class="label">Enterprise ontology</text>
    <g transform="translate(28 76)">
      <rect width="244" height="86" rx="18" fill="#edf2ff"/>
      <text x="122" y="35" text-anchor="middle" font-size="16" font-weight="700">Object types</text>
      <text x="122" y="62" text-anchor="middle" class="soft">Case · Account · Invoice …</text>

      <rect y="104" width="244" height="86" rx="18" fill="#fff3d6"/>
      <text x="122" y="139" text-anchor="middle" font-size="16" font-weight="700">Action types</text>
      <text x="122" y="166" text-anchor="middle" class="soft">Escalate · Approve · Close …</text>

      <rect y="208" width="244" height="86" rx="18" fill="#eef7f2"/>
      <text x="122" y="243" text-anchor="middle" font-size="16" font-weight="700">Query functions</text>
      <text x="122" y="270" text-anchor="middle" class="soft">Authored read / compute logic</text>
    </g>
  </g>

  <!-- projection band -->
  <g transform="translate(432 168)">
    <rect width="150" height="392" rx="24" class="dark"/>
    <text x="75" y="176" text-anchor="middle" class="invert" font-size="17" font-weight="740">Ontology</text>
    <text x="75" y="202" text-anchor="middle" class="invert" font-size="17" font-weight="740">MCP</text>
    <text x="75" y="232" text-anchor="middle" class="dim">projection</text>
  </g>
  <path d="M400 290 H428 M400 380 H428 M400 470 H428" stroke="#2a7468" stroke-width="4" stroke-linecap="round"/>
  <path d="M586 330 H616 M586 430 H616" stroke="#2a7468" stroke-width="4" stroke-linecap="round"/>

  <!-- tool surface -->
  <g transform="translate(620 168)">
    <rect width="484" height="392" rx="26" class="box"/>
    <text x="242" y="46" text-anchor="middle" class="label">MCP tool surface</text>

    <g transform="translate(28 74)">
      <rect width="428" height="98" rx="18" fill="#edf2ff"/>
      <text x="20" y="34" font-size="15" font-weight="700">One wide read tool</text>
      <text x="20" y="60" class="mono">sql( SELECT … FROM case )</text>
      <text x="20" y="82" class="soft">Reaches every exposed object type</text>
    </g>

    <g transform="translate(28 194)">
      <rect width="428" height="170" rx="18" fill="#fff3d6"/>
      <text x="20" y="34" font-size="15" font-weight="700">Many narrow write tools</text>
      <text x="20" y="62" class="mono">escalate_support_case( … )</text>
      <text x="20" y="86" class="mono">approve_invoice( … )</text>
      <text x="20" y="110" class="mono">close_case( … )</text>
      <text x="20" y="140" class="soft">One tool per action type — each does exactly one thing</text>
    </g>
  </g>

  <text x="96" y="612" class="tiny">Reads collapse many-to-one. Writes expand one-to-one. The two halves need different gates.</text>
</svg>
