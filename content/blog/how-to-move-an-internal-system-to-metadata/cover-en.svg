<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Four stages from a legacy internal system to declared metadata: connect read-only, reconcile the rules, move writes, cut over — with the reversible boundary falling after stage three">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#24342f" flood-opacity=".14"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .kicker{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#5d736b}
      .stage{font-size:13px;font-weight:700;letter-spacing:1.1px;fill:#5d736b}
      .name{font-size:25px;font-weight:780}
      .desc{font-size:14.5px;fill:#41564f}
      .cost{font-size:14px;font-weight:680;fill:#1f6b4a}
      .cost-warn{font-size:14px;font-weight:680;fill:#9a3b1f}
      .band-ok{font-size:14px;font-weight:700;letter-spacing:.6px;fill:#1f6b4a}
      .band-warn{font-size:14px;font-weight:700;letter-spacing:.6px;fill:#9a3b1f}
      .foot{font-size:15px;fill:#41564f}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="80" y="76" class="kicker">MIGRATING A LEGACY INTERNAL SYSTEM</text>
  <text x="80" y="122" font-size="34" font-weight="780">Four stages, and only the last one is a one-way door</text>
  <text x="80" y="156" class="foot">The stage everyone skips is the second one — and it decides whether the last two go well</text>

  <g transform="translate(80 200)" filter="url(#shadow)">
    <rect width="242" height="248" rx="18" fill="#ffffff"/>
    <rect width="242" height="6" rx="3" fill="#1f6b4a"/>
    <text x="24" y="48" class="stage">STAGE 1</text>
    <text x="24" y="82" class="name">Connect</text>
    <text x="24" y="118" class="desc">Bind the existing</text>
    <text x="24" y="140" class="desc">database read-only.</text>
    <text x="24" y="162" class="desc">Declare tables as objects.</text>
    <text x="24" y="206" class="cost">An afternoon</text>
    <text x="24" y="228" class="desc">Runtime forbids DDL</text>
  </g>

  <g transform="translate(346 200)" filter="url(#shadow)">
    <rect width="242" height="248" rx="18" fill="#ffffff"/>
    <rect width="242" height="6" rx="3" fill="#c2762a"/>
    <text x="24" y="48" class="stage">STAGE 2</text>
    <text x="24" y="82" class="name">Reconcile</text>
    <text x="24" y="118" class="desc">Check the rules you</text>
    <text x="24" y="140" class="desc">think you have against</text>
    <text x="24" y="162" class="desc">the rows it already wrote.</text>
    <text x="24" y="206" class="cost-warn">Weeks — and the risk</text>
    <text x="24" y="228" class="desc">Finds the unwritten rules</text>
  </g>

  <g transform="translate(612 200)" filter="url(#shadow)">
    <rect width="242" height="248" rx="18" fill="#ffffff"/>
    <rect width="242" height="6" rx="3" fill="#1f6b4a"/>
    <text x="24" y="48" class="stage">STAGE 3</text>
    <text x="24" y="82" class="name">Move writes</text>
    <text x="24" y="118" class="desc">One object at a time,</text>
    <text x="24" y="140" class="desc">behind two explicit</text>
    <text x="24" y="162" class="desc">opt-in gates.</text>
    <text x="24" y="206" class="cost">Steady, per object</text>
    <text x="24" y="228" class="desc">Flip a gate back to undo</text>
  </g>

  <g transform="translate(878 200)" filter="url(#shadow)">
    <rect width="242" height="248" rx="18" fill="#fffaf3"/>
    <rect width="242" height="6" rx="3" fill="#9a3b1f"/>
    <text x="24" y="48" class="stage">STAGE 4</text>
    <text x="24" y="82" class="name">Cut over</text>
    <text x="24" y="118" class="desc">The rows move into a</text>
    <text x="24" y="140" class="desc">table the platform</text>
    <text x="24" y="162" class="desc">owns.</text>
    <text x="24" y="206" class="cost-warn">The one-way door</text>
    <text x="24" y="228" class="desc">Per object, not per system</text>
  </g>

  <g transform="translate(80 486)">
    <rect width="774" height="40" rx="20" fill="#dcefe3"/>
    <text x="387" y="26" class="band-ok" text-anchor="middle">REVERSIBLE — stop here and nothing has happened to the old system</text>
    <rect x="798" width="242" height="40" rx="20" fill="#f6ded2"/>
    <text x="919" y="26" class="band-warn" text-anchor="middle">NOT REVERSIBLE</text>
  </g>

  <text x="80" y="580" class="foot">Most systems should stop after stage one. Owning the schema, rules that actually change, and behaviour of</text>
  <text x="80" y="604" class="foot">the repeating kind are what make stages two to four worth paying for.</text>
  <text x="80" y="644" class="kicker">OBJECTOS — OPEN RUNTIME FOR AI-WRITTEN ENTERPRISE SOFTWARE</text>
</svg>
