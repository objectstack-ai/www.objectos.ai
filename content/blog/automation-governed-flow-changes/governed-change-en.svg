<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="The path of one flow change: a sentence becomes a draft, the publish gate refuses or arms it, and the two populations of runs it then meets - new runs and runs already parked">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:29px;font-weight:780}.t{font-size:18px;font-weight:740}.s{font-size:14px;fill:#647872}
      .box{fill:#fffefa;stroke:#d7dfdb}.green{fill:#eef7f3}.yellow{fill:#fff3d6}.blue{fill:#edf2ff}
      .dark{fill:#173a36}.white{fill:#eafff6}.soft{fill:#a8cdc2}
      .mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;fill:#647872}
      .warn{fill:#9a3b1f}
    </style>
  </defs>
  <rect width="1200" height="660" fill="#f8faf7"/>
  <text x="70" y="58" class="h">The gate is on publish. The runs already parked are a separate question.</text>
  <text x="70" y="90" class="s" font-size="16">A draft always saves. Publishing arms the flow &#8212; and a parked run resumes into whatever is registered now.</text>

  <g transform="translate(70 118)">
    <rect width="1060" height="500" rx="30" class="box"/>

    <!-- the publish chain -->
    <g transform="translate(44 56)">
      <rect width="180" height="96" rx="22" class="dark"/>
      <text x="90" y="40" text-anchor="middle" class="white" font-size="17" font-weight="760">Sentence</text>
      <text x="90" y="68" text-anchor="middle" class="soft" font-size="13">threshold 20% &#8594; 15%</text>
    </g>
    <g transform="translate(272 56)">
      <rect width="180" height="96" rx="22" class="green"/>
      <text x="90" y="40" text-anchor="middle" class="t">Draft saved</text>
      <text x="90" y="68" text-anchor="middle" class="mono">state: draft</text>
    </g>
    <g transform="translate(500 56)">
      <rect width="216" height="96" rx="22" class="yellow" stroke="#efc86c"/>
      <text x="108" y="40" text-anchor="middle" class="t">Publish gate</text>
      <text x="108" y="68" text-anchor="middle" class="mono">7 flow rules, 4 doors</text>
    </g>
    <g transform="translate(764 56)">
      <rect width="252" height="96" rx="22" class="blue"/>
      <text x="126" y="40" text-anchor="middle" class="t">Active and armed</text>
      <text x="126" y="68" text-anchor="middle" class="mono">history row written</text>
    </g>
    <path d="M224 104 H268 M452 104 H496 M716 104 H760" stroke="#2a7468" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- refusal branch -->
    <path d="M608 152 V186" stroke="#c0653f" stroke-width="4" stroke-linecap="round" fill="none"/>
    <g transform="translate(478 186)">
      <rect width="260" height="72" rx="20" fill="#fff0ec" stroke="#e6b6a4"/>
      <text x="130" y="30" text-anchor="middle" class="t warn">Refused &#183; 422</text>
      <text x="130" y="54" text-anchor="middle" class="mono">issues[]: rule / path / hint</text>
    </g>

    <line x1="44" y1="292" x2="1016" y2="292" stroke="#e6ece8"/>
    <text x="44" y="322" class="s">After publish, one change meets two populations of runs:</text>

    <!-- the two populations -->
    <path d="M890 152 V346 M279 346 H890 M279 346 V368 M781 346 V368" stroke="#9db3ab" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7" fill="none"/>
    <g transform="translate(44 368)">
      <rect width="470" height="104" rx="22" class="green"/>
      <text x="28" y="38" class="t">New runs</text>
      <text x="28" y="68" class="s">Start on the new definition. Nothing surprising here.</text>
    </g>
    <g transform="translate(546 368)">
      <rect width="470" height="104" rx="22" fill="#fff6e4"/>
      <text x="28" y="38" class="t">Runs already parked</text>
      <text x="28" y="68" class="s">Resume into the CURRENT definition. The version stamp</text>
      <text x="28" y="90" class="s">on the run still says the one it started on.</text>
    </g>

    <text x="44" y="494" class="s warn">Remove the node a run is parked on and its resume answers 404 &#8212; and the paused row is never swept.</text>
  </g>
</svg>
