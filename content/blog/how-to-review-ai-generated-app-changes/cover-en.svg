<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A three-rung ladder: declared, enforceable, correct. The validation gate covers the first two rungs; the reviewer owns the third.">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7f9fb"/>
      <stop offset="1" stop-color="#eef1fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1d2440" flood-opacity=".14"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1b2338}
      .title{font-size:42px;font-weight:780}
      .lead{font-size:19px;fill:#5b6480}
      .cap{font-size:13px;font-weight:780;letter-spacing:.09em;fill:#6b7492}
      .rung{font-size:26px;font-weight:760}
      .rungnote{font-size:15px;fill:#5b6480}
      .oncap{font-size:13px;font-weight:780;letter-spacing:.09em;fill:#b9c6ea}
      .onrung{font-size:26px;font-weight:760;fill:#f2f6ff}
      .onnote{font-size:15px;fill:#c2cdea}
      .side{font-size:14px;font-weight:720;fill:#3d4665}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="80" y="92" class="title">How to review AI-generated code</text>
  <text x="80" y="130" class="lead">The gate proves the change is enforceable. Only a human proves it is correct.</text>

  <g transform="translate(80 178)" filter="url(#shadow)">
    <rect width="1040" height="416" rx="30" fill="#ffffff" stroke="#dfe4f2"/>

    <!-- rung 1 -->
    <g transform="translate(300 40)">
      <rect width="600" height="96" rx="20" fill="#eef2fb" stroke="#d3dbf0"/>
      <text x="32" y="38" class="cap">RUNG 1</text>
      <text x="32" y="70" class="rung">Declared</text>
      <text x="250" y="68" class="rungnote">The key exists and parses.</text>
    </g>

    <!-- rung 2 -->
    <g transform="translate(300 152)">
      <rect width="600" height="96" rx="20" fill="#e2e9f9" stroke="#c6d2ee"/>
      <text x="32" y="38" class="cap">RUNG 2</text>
      <text x="32" y="70" class="rung">Enforceable</text>
      <text x="250" y="68" class="rungnote">Something actually checks it at run time.</text>
    </g>

    <!-- rung 3 -->
    <g transform="translate(300 264)">
      <rect width="600" height="112" rx="20" fill="#1f2a4a"/>
      <text x="32" y="40" class="oncap">RUNG 3</text>
      <text x="32" y="76" class="onrung">Correct</text>
      <text x="250" y="74" class="onnote">This permission, this threshold, this business.</text>
    </g>

    <!-- left brackets -->
    <g transform="translate(56 40)">
      <rect width="8" height="208" rx="4" fill="#8fa3d8"/>
      <text x="26" y="86" class="side">42 rules ship in the</text>
      <text x="26" y="108" class="side">shared registry.</text>
      <text x="26" y="140" class="side">29 of them can fail</text>
      <text x="26" y="162" class="side">your build.</text>
    </g>
    <g transform="translate(56 264)">
      <rect width="8" height="112" rx="4" fill="#1f2a4a"/>
      <text x="26" y="46" class="side">Zero rules reach</text>
      <text x="26" y="68" class="side">this rung.</text>
      <text x="26" y="98" class="side">It is your review.</text>
    </g>
  </g>
</svg>
