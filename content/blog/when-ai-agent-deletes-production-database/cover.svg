<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="影响半径应该是权限，而不是提示词">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f4f6f9"/>
      <stop offset="1" stop-color="#eef0f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1c2330" flood-opacity=".18"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1b2330}.title{font-size:42px;font-weight:780}.sub{font-size:20px;fill:#5c6675}.label{font-size:19px;font-weight:720}.tiny{font-size:14px;fill:#5c6675}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}.warn{fill:#c0392b}.ok{fill:#1d7a5f}.invert{fill:#eaf1ff}.soft{fill:#9fb2d6}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="86" y="92" class="title">影响半径应该是一条权限，</text>
  <text x="86" y="140" class="title">而不是一句提示词</text>
  <text x="86" y="178" class="sub">"别碰生产"只是一条指令。指令是建议性的。</text>

  <g transform="translate(86 222)" filter="url(#shadow)">
    <rect width="470" height="384" rx="28" fill="#ffffff" stroke="#dfe3ea"/>
    <text x="34" y="52" class="label">指令（提示词）</text>
    <rect x="34" y="74" width="402" height="70" rx="16" fill="#eef1f6"/>
    <text x="52" y="104" class="tiny">人类：</text>
    <text x="52" y="128" class="mono" fill="#1b2330">代码冻结 — 不要改动生产</text>
    <rect x="74" y="158" width="362" height="64" rx="16" fill="#eef1f6"/>
    <text x="92" y="186" class="tiny">agent：</text>
    <text x="92" y="210" class="mono" fill="#c0392b">DROP DATABASE production; ✓</text>
    <g transform="translate(150 244)">
      <text x="0" y="44" font-size="44">💥</text>
      <text x="64" y="26" class="warn" font-size="17" font-weight="720">伪造约 4,000 条记录</text>
      <text x="64" y="50" class="warn" font-size="17" font-weight="720">给出虚假测试结果</text>
      <text x="64" y="74" class="warn" font-size="15">谎称"无法回滚"（其实可以）</text>
    </g>
  </g>

  <g transform="translate(644 222)" filter="url(#shadow)">
    <rect width="470" height="384" rx="28" fill="#16233c"/>
    <text x="34" y="52" class="invert" font-size="19" font-weight="760">护栏（运行时）</text>
    <rect x="34" y="74" width="402" height="60" rx="14" fill="#21314f"/>
    <text x="52" y="111" class="soft" font-size="15">受限身份 — 最小权限</text>
    <rect x="34" y="146" width="402" height="60" rx="14" fill="#21314f"/>
    <text x="52" y="183" class="mono" style="fill:#e8758a">DROP DATABASE  ⛔ 不在授权内</text>
    <rect x="34" y="218" width="402" height="60" rx="14" fill="#21314f"/>
    <text x="52" y="255" class="soft" font-size="15">破坏性动作 → 审批一个 diff</text>
    <rect x="34" y="290" width="402" height="60" rx="14" fill="#1c3a2f"/>
    <text x="52" y="327" style="fill:#6fd3a8" font-size="15">可审计 · 可回滚 · 可私有化</text>
  </g>
</svg>
