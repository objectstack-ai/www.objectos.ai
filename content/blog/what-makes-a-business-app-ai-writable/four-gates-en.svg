<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Four gates between the agent and your users, as a pipeline: the agent writes typed metadata, then Typed (strict TypeScript and Zod, shape errors die in the editor), Validated (os validate rejects dangling bindings, bad CEL predicates and missing security posture), Reviewed (a human approves a small readable diff) and Governed (the runtime enforces permissions and audit on every call); the run's type error stopped at Typed and its three metadata mistakes stopped at Validated; the review in this run was a git diff of 127 lines in 11 files and the runtime was not started">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5a70"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b3433a"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1b2a41}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#4a5a70}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em}
      .name{font-size:19px;font-weight:780}
      .where{font-size:13px;fill:#4a5a70}
      .small{font-size:13px;fill:#5b6a7c}
      .stop{font-size:13px;fill:#1b2a41}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600}
      .label{font-size:15px;font-weight:760}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fbfcfe"/>

  <text x="40" y="50" class="h">Four gates between the agent and your users</text>
  <text x="40" y="78" class="note">What each gate catches is the README's own wording; what stopped at each is from one run at 17.7.0.</text>

  <!-- the agent -->
  <g transform="translate(40 132)">
    <rect width="138" height="226" rx="16" fill="#ffffff" stroke="#c9d0dd"/>
    <text x="16" y="30" class="cap" style="fill:#5b6a7c">THE AGENT</text>
    <text x="16" y="62" class="label">writes typed</text>
    <text x="16" y="84" class="label">metadata</text>
    <text x="16" y="116" class="small">not a codebase:</text>
    <text x="16" y="134" class="small">objects, actions,</text>
    <text x="16" y="152" class="small">views, permissions</text>
    <text x="16" y="186" class="small">and makes</text>
    <text x="16" y="204" class="small">mistakes</text>
  </g>

  <!-- arrows along the pipeline -->
  <line x1="180" y1="245" x2="196" y2="245" stroke="#4a5a70" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="398" y1="245" x2="428" y2="245" stroke="#4a5a70" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="630" y1="245" x2="660" y2="245" stroke="#4a5a70" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="862" y1="245" x2="892" y2="245" stroke="#4a5a70" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1094" y1="245" x2="1124" y2="245" stroke="#4a5a70" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1132" y="240" class="label">your</text>
  <text x="1132" y="258" class="label">users</text>

  <!-- gate 1: typed -->
  <g transform="translate(200 120)">
    <rect width="196" height="250" rx="18" fill="#e8edfb" stroke="#8ea3e6" stroke-width="2"/>
    <text x="18" y="30" class="cap" style="fill:#2f4bb8">GATE 1</text>
    <text x="18" y="60" class="name">Typed</text>
    <text x="18" y="82" class="where">in the editor, in seconds</text>
    <text x="18" y="112" class="cap" style="fill:#2f4bb8">CATCHES</text>
    <text x="18" y="134" class="stop">shape errors —</text>
    <text x="18" y="152" class="stop">strict TypeScript</text>
    <text x="18" y="170" class="stop">plus Zod schemas</text>
    <text x="18" y="206" class="small">cost: a second of</text>
    <text x="18" y="224" class="small">the agent's time</text>
  </g>

  <!-- gate 2: validated -->
  <g transform="translate(432 120)">
    <rect width="196" height="250" rx="18" fill="#e6f4f1" stroke="#8fcdc0" stroke-width="2"/>
    <text x="18" y="30" class="cap" style="fill:#176a5c">GATE 2</text>
    <text x="18" y="60" class="name">Validated</text>
    <text x="18" y="82" class="where">os validate, 49 rules</text>
    <text x="18" y="112" class="cap" style="fill:#176a5c">CATCHES</text>
    <text x="18" y="134" class="stop">what type-checks but</text>
    <text x="18" y="152" class="stop">fails silently: dangling</text>
    <text x="18" y="170" class="stop">bindings, bad CEL,</text>
    <text x="18" y="188" class="stop">missing security posture</text>
    <text x="18" y="224" class="small">cost: one agent turn</text>
  </g>

  <!-- gate 3: reviewed -->
  <g transform="translate(664 120)">
    <rect width="196" height="250" rx="18" fill="#fdf1e3" stroke="#e9c48f" stroke-width="2"/>
    <text x="18" y="30" class="cap" style="fill:#8a4f0c">GATE 3</text>
    <text x="18" y="60" class="name">Reviewed</text>
    <text x="18" y="82" class="where">a human reads a diff</text>
    <text x="18" y="112" class="cap" style="fill:#8a4f0c">CATCHES</text>
    <text x="18" y="134" class="stop">what is well-formed</text>
    <text x="18" y="152" class="stop">but not what you</text>
    <text x="18" y="170" class="stop">meant — a small diff,</text>
    <text x="18" y="188" class="stop">not generated glue</text>
    <text x="18" y="224" class="small">cost: human minutes</text>
  </g>

  <!-- gate 4: governed -->
  <g transform="translate(896 120)">
    <rect width="196" height="250" rx="18" fill="#eeeef5" stroke="#b9b9d3" stroke-width="2"/>
    <text x="18" y="30" class="cap" style="fill:#4b4a7a">GATE 4</text>
    <text x="18" y="60" class="name">Governed</text>
    <text x="18" y="82" class="where">the runtime, every call</text>
    <text x="18" y="112" class="cap" style="fill:#4b4a7a">CONTAINS</text>
    <text x="18" y="134" class="stop">a wrong app that still</text>
    <text x="18" y="152" class="stop">shipped: permissions</text>
    <text x="18" y="170" class="stop">and audit enforced,</text>
    <text x="18" y="188" class="stop">so it stays in the fence</text>
    <text x="18" y="224" class="small">cost: a contained incident</text>
  </g>

  <!-- what stopped where, from the run -->
  <text x="40" y="412" class="cap" style="fill:#5b6a7c">STOPPED HERE, IN THE RUN</text>

  <line x1="298" y1="376" x2="298" y2="420" stroke="#b3433a" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#arrRed)"/>
  <g transform="translate(200 426)">
    <rect width="196" height="34" rx="10" fill="#fff5f4" stroke="#efc6c2"/>
    <text x="12" y="22" class="mono" style="fill:#b3433a">required: 'yes'  → TS2322</text>
  </g>

  <line x1="530" y1="376" x2="530" y2="420" stroke="#b3433a" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#arrRed)"/>
  <g transform="translate(432 426)">
    <rect width="196" height="34" rx="10" fill="#fff5f4" stroke="#efc6c2"/>
    <text x="12" y="22" class="mono" style="fill:#b3433a">status != "resolved"</text>
  </g>
  <g transform="translate(432 468)">
    <rect width="196" height="34" rx="10" fill="#fff5f4" stroke="#efc6c2"/>
    <text x="12" y="22" class="mono" style="fill:#b3433a">rowActions: ['resolve']</text>
  </g>
  <g transform="translate(432 510)">
    <rect width="196" height="34" rx="10" fill="#fff5f4" stroke="#efc6c2"/>
    <text x="12" y="22" class="mono" style="fill:#b3433a">(no sharingModel)</text>
  </g>

  <g transform="translate(664 426)">
    <rect width="196" height="52" rx="10" fill="#ffffff" stroke="#e9c48f"/>
    <text x="12" y="22" class="small">in this run: a git diff,</text>
    <text x="12" y="40" class="small">127 lines across 11 files</text>
  </g>

  <g transform="translate(896 426)">
    <rect width="196" height="52" rx="10" fill="#ffffff" stroke="#b9b9d3"/>
    <text x="12" y="22" class="small">not started in this run:</text>
    <text x="12" y="40" class="small">os validate boots nothing</text>
  </g>

  <text x="40" y="596" class="note">What none of the four catch: whether the app is what you meant. The docs say it plainly — well-formed is not the same as right.</text>
  <text x="40" y="618" class="small">Sources: the ObjectStack README, "Why the mistakes don't ship"; the Validating Metadata page; one run of npm run validate at 17.7.0.</text>
</svg>
