<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" role="img" aria-label="一份可执行的业务本体，从 objectstack.config.ts 编译成 objectstack.json，供给三样东西。世界：声明对象与字段、关系，运行时从中推导出数据库、REST 与实时 API、Console 界面和 describe_object 工具。双手：声明带 ai exposed true 的动作、流程和记录，运行时在 /api/v1/mcp 提供一个 MCP 服务器，十二个工具，run_action 在调用时把关。围栏：声明权限集、行级与字段级安全和共享，运行时以安全中间件在引擎的每一次调用上强制执行，并在每一次插入、更新、删除时写入审计行。">
