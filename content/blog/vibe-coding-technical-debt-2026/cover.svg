<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="AI 生成一堆代码与 AI 生成一份元数据的对比">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:19px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:15px}
      .warn{font-size:15px;font-weight:650;fill:#9a3b1f}.ok{font-size:15px;font-weight:650;fill:#1f6b4a}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="78" font-size="34" font-weight="780">第一版很快，半年后没人敢动</text>
  <text x="96" y="113" class="tiny">同样一句话，生成"一堆代码"还是"一份定义"，决定了它能活多久</text>

  <!-- Left: a pile of generated code -->
  <g transform="translate(86 168)" filter="url(#shadow)">
    <rect width="440" height="400" rx="22" fill="#ffffff"/>
    <text x="36" y="52" class="label">一句话 → 一堆代码</text>
    <text x="36" y="78" class="soft">看起来能跑，底下全是没人读过的实现</text>
    <g transform="translate(36 100)">
      <rect width="368" height="150" rx="14" fill="#fbece6"/>
      <g stroke="#d98b6a" stroke-width="3" opacity=".7">
        <path d="M28 38 h150"/><path d="M28 64 h220"/><path d="M28 90 h120"/><path d="M28 116 h190"/>
      </g>
      <path d="M250 20 l40 110" stroke="#9a3b1f" stroke-width="3" stroke-dasharray="6 6"/>
      <text x="300" y="56" font-size="34" fill="#9a3b1f" font-weight="800">!</text>
    </g>
    <g transform="translate(36 270)">
      <rect width="120" height="34" rx="17" fill="#fbece6"/><text x="20" y="23" class="warn">45% 含漏洞</text>
      <rect x="132" y="0" width="132" height="34" rx="17" fill="#fbece6"/><text x="152" y="23" class="warn">漏洞率 2.74x</text>
    </g>
    <text x="36" y="346" class="warn">6–12 个月后 → 维护危机</text>
  </g>

  <!-- Right: one metadata definition -->
  <g transform="translate(674 168)" filter="url(#shadow)">
    <rect width="440" height="400" rx="22" fill="#ffffff"/>
    <text x="36" y="52" class="label">一句话 → 一份元数据</text>
    <text x="36" y="78" class="soft">几百行声明就是系统，AI 能完整读懂</text>
    <g transform="translate(36 100)" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#2c4a43">
      <rect width="368" height="150" rx="14" fill="#eef7f1"/>
      <text x="24" y="40">object: crm_opportunity</text>
      <text x="24" y="70">  amount, probability</text>
      <text x="24" y="100">permission: sales (no delete)</text>
      <text x="24" y="130">flow: discount &gt; 30% → 审批</text>
    </g>
    <g transform="translate(36 270)">
      <rect width="100" height="34" rx="17" fill="#e3f1ea"/><text x="18" y="23" class="ok">可 diff</text>
      <rect x="112" y="0" width="100" height="34" rx="17" fill="#e3f1ea"/><text x="130" y="23" class="ok">可回滚</text>
      <rect x="224" y="0" width="140" height="34" rx="17" fill="#e3f1ea"/><text x="244" y="23" class="ok">运行时管权限</text>
    </g>
    <text x="36" y="346" class="ok">6 个月后 → 还能放心改</text>
  </g>
</svg>
