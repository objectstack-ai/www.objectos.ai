<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="The lifecycle of one automation run: trigger, decide, pause durably, resume, terminal record, and what each stage persists">
  <defs>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#24342f" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fae9f"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:15px;font-weight:740}.soft{fill:#5d736b;font-size:13px}
      .mono{font-family:ui-monospace,Menlo,monospace}.mono text{font-family:inherit}.invert{fill:#eafff6}
      .cap{font-size:19px;font-weight:780}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#fbfdfb"/>

  <text x="60" y="52" class="cap">One run, five stages — and what survives each one</text>
  <text x="60" y="80" class="soft">Every box below is state the runtime persists for you. None of it is application code you write.</text>

  <!-- stages -->
  <g transform="translate(60 116)" filter="url(#s2)">
    <rect width="196" height="96" rx="16" fill="#22433d"/>
    <text x="20" y="34" class="h invert">1 &#183; Trigger</text>
    <text x="20" y="58" class="soft mono" style="fill:#a9c4ba">record-after-update</text>
    <text x="20" y="78" class="soft mono" style="fill:#a9c4ba">schedule &#183; api</text>
  </g>
  <g transform="translate(292 116)" filter="url(#s2)">
    <rect width="196" height="96" rx="16" fill="#eef7f1"/>
    <text x="20" y="34" class="h">2 &#183; Decide</text>
    <text x="20" y="58" class="soft">Edge conditions open</text>
    <text x="20" y="78" class="soft">one branch, close others</text>
  </g>
  <g transform="translate(524 116)" filter="url(#s2)">
    <rect width="196" height="96" rx="16" fill="#fff6e4"/>
    <text x="20" y="34" class="h">3 &#183; Pause</text>
    <text x="20" y="58" class="soft">approval &#183; screen &#183; wait</text>
    <text x="20" y="78" class="soft mono">status: paused</text>
  </g>
  <g transform="translate(756 116)" filter="url(#s2)">
    <rect width="196" height="96" rx="16" fill="#eef7f1"/>
    <text x="20" y="34" class="h">4 &#183; Resume</text>
    <text x="20" y="58" class="soft">Down the approve or</text>
    <text x="20" y="78" class="soft">reject out-edge</text>
  </g>
  <g transform="translate(988 116)" filter="url(#s2)">
    <rect width="152" height="96" rx="16" fill="#22433d"/>
    <text x="20" y="34" class="h invert">5 &#183; Terminal</text>
    <text x="20" y="58" class="soft mono" style="fill:#a9c4ba">completed</text>
    <text x="20" y="78" class="soft mono" style="fill:#a9c4ba">failed</text>
  </g>

  <g stroke="#7fae9f" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M262 164 h24"/><path d="M494 164 h24"/><path d="M726 164 h24"/><path d="M958 164 h24"/>
  </g>

  <!-- persistence lanes -->
  <g transform="translate(60 262)">
    <rect width="660" height="150" rx="16" fill="#fff" stroke="#dbe5df"/>
    <text x="24" y="40" class="h mono">sys_automation_run &#183; paused row</text>
    <text x="24" y="68" class="soft">Live resumable state: current node, variables, completed nodes, correlation</text>
    <text x="24" y="92" class="soft">to the approval request. Rehydrates after a process restart or a cold boot.</text>
    <text x="24" y="124" class="soft" style="fill:#1f6b4a">Never pruned while the run is still waiting.</text>
  </g>
  <g transform="translate(752 262)">
    <rect width="388" height="150" rx="16" fill="#fff" stroke="#dbe5df"/>
    <text x="24" y="40" class="h mono">terminal history row</text>
    <text x="24" y="68" class="soft">Per-step log plus the run summary</text>
    <text x="24" y="92" class="soft">(selected / acted / skipped / gates).</text>
    <text x="24" y="124" class="soft" style="fill:#9a3b1f">Bounded: per-flow cap and an age sweep.</text>
  </g>

  <!-- evidence strip -->
  <g transform="translate(60 448)" filter="url(#s2)">
    <rect width="1080" height="122" rx="16" fill="#22433d"/>
    <text x="28" y="42" class="h invert">What one step of the log carries</text>
    <g class="mono invert" font-size="13">
      <text x="28" y="76" style="fill:#eafff6">nodeId &#183; nodeType &#183; status &#183; startedAt &#183; durationMs &#183; input &#183; output</text>
      <text x="28" y="100" style="fill:#eafff6">error{ code, message } &#183; retryAttempt &#183; metrics{ selected, acted } &#183; skippedBy{ nodeId, edgeId }</text>
    </g>
  </g>
</svg>
