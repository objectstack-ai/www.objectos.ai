<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Three columns: a knowledge-representation ontology (OWL, RDF, knowledge graphs) describes a domain with class inheritance and axioms and is reasoned over by an inference engine; a semantic layer is a read-only mapping over systems you already run that describes the business but does not run it; an executable business ontology is one business's application, validated by Zod schemas and os validate and then run, from which the database, API, UI and agent tools are derived. A footer adds that it is not a formal ontology in the philosophical sense either">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5e716b}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em}
      .name{font-size:20px;font-weight:780}
      .sub{font-size:13px;fill:#5e716b}
      .row{font-size:14px;fill:#173a36}
      .small{font-size:13px;fill:#657872}
      .verdict{font-size:13px;font-weight:760}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">Validated, not reasoned over: three things the word can mean</text>
  <text x="60" y="80" class="note">The same word, three different objects. Only the third one is what "the ontology is the software" means.</text>

  <!-- 1 · knowledge-representation ontology -->
  <g transform="translate(60 112)">
    <rect width="350" height="440" rx="22" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="34" class="cap" style="fill:#5e716b">1 · KNOWLEDGE-REPRESENTATION</text>
    <text x="22" y="66" class="name">A knowledge ontology</text>
    <text x="22" y="90" class="sub">OWL · RDF · knowledge graphs</text>
    <line x1="22" y1="108" x2="328" y2="108" stroke="#e1e8e4"/>
    <text x="22" y="140" class="row">Describes a domain</text>
    <text x="22" y="170" class="row">Carries class inheritance and axioms</text>
    <text x="22" y="200" class="row">Is reasoned over by an inference engine</text>
    <text x="22" y="262" class="cap" style="fill:#5e716b">WHAT COMES OUT</text>
    <text x="22" y="286" class="small">Inferred facts, derived at runtime —</text>
    <text x="22" y="304" class="small">never written where a reviewer reads them</text>
    <g transform="translate(22 356)">
      <rect width="306" height="60" rx="12" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="16" y="25" class="verdict" style="fill:#8a6a3a">Not this.</text>
      <text x="16" y="45" class="small">No inheritance, no axioms, no reasoner.</text>
    </g>
  </g>

  <!-- 2 · semantic layer -->
  <g transform="translate(435 112)">
    <rect width="350" height="440" rx="22" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="34" class="cap" style="fill:#5e716b">2 · SEMANTIC LAYER</text>
    <text x="22" y="66" class="name">A layer over systems</text>
    <text x="22" y="90" class="sub">the ones you already run</text>
    <line x1="22" y1="108" x2="328" y2="108" stroke="#e1e8e4"/>
    <text x="22" y="140" class="row">A read-only mapping over existing data</text>
    <text x="22" y="170" class="row">Describes the business</text>
    <text x="22" y="200" class="row">Does not run it</text>
    <text x="22" y="262" class="cap" style="fill:#5e716b">WHAT COMES OUT</text>
    <text x="22" y="286" class="small">Consistent metrics and queries</text>
    <text x="22" y="304" class="small">over data that lives somewhere else</text>
    <g transform="translate(22 356)">
      <rect width="306" height="60" rx="12" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="16" y="25" class="verdict" style="fill:#8a6a3a">Not this.</text>
      <text x="16" y="45" class="small">Here the ontology is the system itself.</text>
    </g>
  </g>

  <!-- 3 · executable business ontology -->
  <g transform="translate(810 112)">
    <rect width="350" height="440" rx="22" fill="#eef7f2" stroke="#2a7468" stroke-width="2"/>
    <text x="22" y="34" class="cap" style="fill:#2a7468">3 · EXECUTABLE BUSINESS ONTOLOGY</text>
    <text x="22" y="66" class="name">The definition that runs</text>
    <text x="22" y="90" class="sub">one business's application, precisely</text>
    <line x1="22" y1="108" x2="328" y2="108" stroke="#b9dcd0"/>
    <text x="22" y="140" class="row">Six kinds: objects and fields, relations,</text>
    <text x="22" y="160" class="row">actions, permissions, flows, agents and tools</text>
    <text x="22" y="190" class="row">Validated: Zod schemas and os validate</text>
    <text x="22" y="220" class="row">Then run — nothing reasoned over at runtime</text>
    <text x="22" y="262" class="cap" style="fill:#2a7468">WHAT COMES OUT</text>
    <text x="22" y="286" class="small">The database, the API, the UI</text>
    <text x="22" y="304" class="small">and the agent tools, derived from it</text>
    <g transform="translate(22 356)">
      <rect width="306" height="60" rx="12" fill="#ffffff" stroke="#2a7468" stroke-width="1.5"/>
      <text x="16" y="25" class="verdict" style="fill:#2a7468">This.</text>
      <text x="16" y="45" class="small">What runs is what was validated.</text>
    </g>
  </g>

  <text x="60" y="596" class="small">Nor a formal ontology in the philosophical sense: it makes no claim about what exists in general. It is one business's application, defined precisely enough to run.</text>
  <text x="60" y="618" class="small" style="fill:#2a7468">Source: the ObjectStack README, "What we mean by ontology", and the Business Ontology concepts page.</text>
</svg>
