<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="The naming test. In the centre, the five-line diff adding budget: Field.currency to todo_task. On the left, seven surfaces that name only the object and followed the definition with no edit: the SQLite table went from 27 to 28 columns, the REST record from 27 to 28 keys, the REST write from 400 to 201, the metadata endpoint from 27 to 28 fields, MCP describe_object from 19 to 20 fields, MCP query_records returned the new record, and the Console create form went from 16 to 17 inputs. On the right, four projections that name the field and stayed as authored: the All Tasks view with 6 columns, the overdue and due-today views with 5 each, the task_metrics dataset with 3 measures, and the zh-CN translation where budget falls through to Budget. At the foot, the build gate's warning: field budget is declared but nothing in this stack displays or reads it, rule field-no-consumers">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .h{font-size:22px;font-weight:780}
      .kicker{font-size:12px;font-weight:780;letter-spacing:.12em}
      .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
      .monoB{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:700}
      .row{font-size:14px}
      .num{font-size:14px;font-weight:760}
      .sub{font-size:12px}
      .note{font-size:13px}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f7d75"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#fbfdfc"/>

  <text x="60" y="52" class="h" fill="#173a36">The naming test: does the projection name the field, or only the object?</text>

  <!-- centre: the diff -->
  <g transform="translate(450 96)">
    <rect width="300" height="150" rx="14" fill="#173a36"/>
    <text x="20" y="30" class="kicker" fill="#9fd3c4">THE DIFF · src/objects/task.object.ts</text>
    <text x="20" y="62" class="monoB" fill="#b6f0d8" xml:space="preserve">+ budget: Field.currency({</text>
    <text x="20" y="84" class="monoB" fill="#b6f0d8" xml:space="preserve">+   label: 'Budget',</text>
    <text x="20" y="106" class="monoB" fill="#b6f0d8" xml:space="preserve">+   min: 0,</text>
    <text x="20" y="128" class="monoB" fill="#b6f0d8" xml:space="preserve">+ }),</text>
  </g>

  <!-- arrows -->
  <path d="M 450 171 L 388 171" stroke="#5f7d75" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 750 171 L 812 171" stroke="#5f7d75" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- left: derived -->
  <g transform="translate(60 96)">
    <rect width="328" height="150" rx="14" fill="#f4faf7" stroke="#c9d8d1"/>
    <text x="22" y="34" class="kicker" fill="#2a7468">NAMES ONLY THE OBJECT</text>
    <text x="22" y="64" class="h" fill="#173a36">Derived: it followed</text>
    <text x="22" y="92" class="row" fill="#3f554f">Generated from the object on every</text>
    <text x="22" y="112" class="row" fill="#3f554f">call. The diff is the whole review.</text>
    <text x="22" y="134" class="sub" fill="#657872">7 surfaces · 0 edits</text>
  </g>

  <!-- right: pinned -->
  <g transform="translate(812 96)">
    <rect width="328" height="150" rx="14" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="22" y="34" class="kicker" fill="#a35a1f">NAMES THE FIELD</text>
    <text x="22" y="64" class="h" fill="#173a36">Pinned: it stayed</text>
    <text x="22" y="92" class="row" fill="#3f554f">An authored choice per field. Still</text>
    <text x="22" y="112" class="row" fill="#3f554f">as written; whether it should move</text>
    <text x="22" y="134" class="sub" fill="#657872">is the reviewer's call · 4 projections</text>
  </g>

  <!-- left rows -->
  <g transform="translate(60 270)">
    <rect width="540" height="356" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="22" y="30" class="kicker" fill="#2a7468">BEFORE → AFTER, MEASURED</text>
    <line x1="22" y1="44" x2="518" y2="44" stroke="#e3ece8"/>

    <text x="22" y="72" class="row" fill="#173a36">SQLite table todo_task (PRAGMA table_info)</text>
    <text x="518" y="72" class="num" text-anchor="end" fill="#2a7468">27 → 28 columns</text>
    <text x="22" y="90" class="sub" fill="#657872">budget float, added to the existing table by the additive sync</text>

    <text x="22" y="120" class="row" fill="#173a36">GET /api/v1/data/todo_task</text>
    <text x="518" y="120" class="num" text-anchor="end" fill="#2a7468">27 → 28 keys</text>

    <text x="22" y="152" class="row" fill="#173a36">POST /api/v1/data/todo_task with budget: 1200</text>
    <text x="518" y="152" class="num" text-anchor="end" fill="#2a7468">400 → 201</text>
    <text x="22" y="170" class="sub" fill="#657872">before: Unknown field 'budget' on object 'todo_task' (INVALID_FIELD)</text>

    <text x="22" y="200" class="row" fill="#173a36">GET /api/v1/meta/object/todo_task</text>
    <text x="518" y="200" class="num" text-anchor="end" fill="#2a7468">27 → 28 fields</text>

    <text x="22" y="232" class="row" fill="#173a36">MCP describe_object</text>
    <text x="518" y="232" class="num" text-anchor="end" fill="#2a7468">19 → 20 fields</text>

    <text x="22" y="264" class="row" fill="#173a36">MCP query_records, where budget ≥ 1000</text>
    <text x="518" y="264" class="num" text-anchor="end" fill="#2a7468">1 record, 1200</text>

    <text x="22" y="296" class="row" fill="#173a36">Console create form (no form view declared)</text>
    <text x="518" y="296" class="num" text-anchor="end" fill="#2a7468">16 → 17 inputs</text>
    <text x="22" y="314" class="sub" fill="#657872">Budget placed between Actual Hours and Notes, in declaration order</text>

    <text x="22" y="340" class="sub" fill="#657872">Unchanged by design, not projections: OpenAPI (14 paths), MCP tools/list (12 tools)</text>
  </g>

  <!-- right rows -->
  <g transform="translate(624 270)">
    <rect width="516" height="356" rx="14" fill="#ffffff" stroke="#e6d3b6"/>
    <text x="22" y="30" class="kicker" fill="#a35a1f">AS AUTHORED, UNCHANGED</text>
    <line x1="22" y1="44" x2="494" y2="44" stroke="#f0e4d2"/>

    <text x="22" y="72" class="row" fill="#173a36">todo_task.default — All Tasks</text>
    <text x="494" y="72" class="num" text-anchor="end" fill="#a35a1f">6 columns</text>
    <text x="22" y="90" class="mono" fill="#657872">columns: [{ field: 'subject' }, { field: 'status' }, …]</text>

    <text x="22" y="120" class="row" fill="#173a36">todo_task.overdue · todo_task.due_today</text>
    <text x="494" y="120" class="num" text-anchor="end" fill="#a35a1f">5 + 5 columns</text>

    <text x="22" y="152" class="row" fill="#173a36">Dataset task_metrics (feeds the dashboard)</text>
    <text x="494" y="152" class="num" text-anchor="end" fill="#a35a1f">3 measures</text>
    <text x="22" y="170" class="mono" fill="#657872">measures: [{ name: 'est_hours', field: 'estimated_hours' }, …]</text>

    <text x="22" y="200" class="row" fill="#173a36">Translation bundle, zh-CN</text>
    <text x="494" y="200" class="num" text-anchor="end" fill="#a35a1f">19 labels</text>
    <text x="22" y="218" class="mono" fill="#657872">budget → "Budget" (declared label falls through)</text>

    <text x="22" y="254" class="note" fill="#3f554f">Each one spells the field name, so each one is a</text>
    <text x="22" y="272" class="note" fill="#3f554f">decision the runtime honours exactly. The reviewer</text>
    <text x="22" y="290" class="note" fill="#3f554f">asks the gate's question: should this field have a</text>
    <text x="22" y="308" class="note" fill="#3f554f">consumer, and which one?</text>

    <text x="22" y="340" class="sub" fill="#657872">Removals differ: the sync never drops a column, so the table lags as drift</text>
  </g>

  <!-- gate band -->
  <g transform="translate(60 650)">
    <rect width="1080" height="70" rx="12" fill="#fff7ea" stroke="#e6d3b6"/>
    <text x="22" y="28" class="kicker" fill="#a35a1f">THE GATE SAID SO BEFORE BOOT · os dev --compile, 49 author-time rules</text>
    <text x="22" y="52" class="mono" fill="#5a4630">⚠ object "todo_task" · field "budget": declared, but nothing in this stack displays or reads it (inert) — rule: field-no-consumers</text>
  </g>
</svg>
