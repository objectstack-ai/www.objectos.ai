<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="统一触发模型">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.h{font-size:30px;font-weight:780}.t{font-size:18px;font-weight:740}.s{font-size:14px;fill:#647872}.box{fill:#fffefa;stroke:#d7dfdb}.green{fill:#eef7f3}.yellow{fill:#fff3d6}.blue{fill:#edf2ff}.red{fill:#fff0ec}.dark{fill:#173a36}.white{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f8faf8"/>
  <text x="70" y="64" class="h">触发方式不同，后续业务规则应该统一</text>
  <g transform="translate(70 108)">
    <rect width="1060" height="418" rx="30" class="box"/>
    <g transform="translate(60 52)">
      <rect width="170" height="66" rx="18" class="green"/>
      <text x="85" y="42" text-anchor="middle" class="t">记录变化</text>
      <rect y="88" width="170" height="66" rx="18" class="yellow"/>
      <text x="85" y="130" text-anchor="middle" class="t">定时任务</text>
      <rect y="176" width="170" height="66" rx="18" class="blue"/>
      <text x="85" y="218" text-anchor="middle" class="t">人工按钮</text>
      <rect y="264" width="170" height="66" rx="18" class="red"/>
      <text x="85" y="306" text-anchor="middle" class="t">外部事件</text>
    </g>
    <g transform="translate(410 100)">
      <rect width="230" height="160" rx="28" class="dark"/>
      <text x="115" y="54" text-anchor="middle" class="white" font-size="20" font-weight="780">流程运行时</text>
      <text x="115" y="94" text-anchor="middle" class="soft" font-size="14">统一变量</text>
      <text x="115" y="124" text-anchor="middle" class="soft" font-size="14">统一条件和动作</text>
    </g>
    <g transform="translate(790 88)">
      <rect width="190" height="86" rx="22" class="box"/>
      <text x="95" y="35" text-anchor="middle" class="t">审批</text>
      <text x="95" y="60" text-anchor="middle" class="s">等待人</text>
      <rect y="132" width="190" height="86" rx="22" class="box"/>
      <text x="95" y="167" text-anchor="middle" class="t">执行</text>
      <text x="95" y="192" text-anchor="middle" class="s">更新和通知</text>
    </g>
    <path d="M234 85 H406 M234 173 H406 M234 261 H406 M234 349 C330 349 330 180 406 180 M644 150 H786 M644 214 H786" stroke="#2a7468" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
