<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="两条并排的流水线。知识本体为推理而建：类、属性、个体和公理（OWL 2 / RDF）经过推理器，产出推导结论——计算出的层级、分类、一致性，在运行时推导出来，不在 diff 里，是审阅者读不到的第二个真相来源。可执行业务本体为运行而建：类型化元数据（对象与字段、关系、动作、权限、流程、Agent 与工具定义）经过校验（严格 TypeScript 与 Zod、os validate：要么给出定位的错误，要么什么都没有），然后运行成数据库、REST 与实时 API、UI 和 MCP 服务器；运行时不做任何推理，跑的就是被校验过的东西。下方是三个「不」：没有继承，每个对象的文件就是完整答案；没有公理，约束用来拒绝而不用来推导；没有推理器，不存在没人写过的事实。">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#52655f}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#52655f}
      .capB{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#256a5e}
      .name{font-size:17px;font-weight:780}
      .sub{font-size:13px;fill:#52655f}
      .arrow{font-size:16px;font-weight:700;fill:#52655f}
      .arrowB{font-size:16px;font-weight:700;fill:#256a5e}
      .verdictA{font-size:13px;font-weight:780;fill:#7a5a2c}
      .verdictB{font-size:13px;font-weight:780;fill:#256a5e}
      .chipT{font-size:14px;font-weight:780;fill:#173a36}
      .chipS{font-size:13px;fill:#52655f}
      .small{font-size:13px;fill:#52655f}
    </style>
  </defs>
  <rect width="1200" height="660" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">两种本体，两条流水线</text>
  <text x="60" y="80" class="note">前者推导出没人写过的东西；后者拒绝跑不起来的东西——并且什么都不推导。</text>

  <!-- 左：知识本体 -->
  <g transform="translate(60 108)">
    <rect width="500" height="372" rx="22" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="32" class="cap">知识本体——为推理而建</text>

    <g transform="translate(22 48)">
      <rect width="456" height="74" rx="12" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="16" y="28" class="name">类 · 属性 · 个体 · 公理</text>
      <text x="16" y="52" class="sub">OWL 2 / RDF：子类、互斥、基数、属性链</text>
    </g>
    <text x="250" y="148" class="arrow" text-anchor="middle">↓</text>

    <g transform="translate(22 160)">
      <rect width="456" height="62" rx="12" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="16" y="28" class="name">推理器</text>
      <text x="16" y="50" class="sub">推理引擎读取整个模型，推导出随之成立的事实</text>
    </g>
    <text x="250" y="248" class="arrow" text-anchor="middle">↓</text>

    <g transform="translate(22 260)">
      <rect width="456" height="92" rx="12" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="16" y="28" class="name">推导结论</text>
      <text x="16" y="50" class="sub">计算出的层级 · 分类 · 一致性</text>
      <text x="16" y="70" class="sub">在运行时推导出来——不在 diff 里</text>
    </g>
  </g>
  <g transform="translate(82 492)">
    <rect width="456" height="34" rx="17" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="228" y="22" class="verdictA" text-anchor="middle">审阅者读不到的第二个真相来源</text>
  </g>

  <!-- 右：可执行业务本体 -->
  <g transform="translate(640 108)">
    <rect width="500" height="372" rx="22" fill="#eef7f2" stroke="#256a5e" stroke-width="2"/>
    <text x="22" y="32" class="capB">可执行业务本体——为运行而建</text>

    <g transform="translate(22 48)">
      <rect width="456" height="74" rx="12" fill="#ffffff" stroke="#b9dcd0"/>
      <text x="16" y="28" class="name">类型化元数据</text>
      <text x="16" y="50" class="sub">对象与字段 · 关系 · 动作 · 权限 · 流程</text>
      <text x="16" y="66" class="sub">Agent 与工具定义</text>
    </g>
    <text x="250" y="148" class="arrowB" text-anchor="middle">↓</text>

    <g transform="translate(22 160)">
      <rect width="456" height="62" rx="12" fill="#ffffff" stroke="#b9dcd0"/>
      <text x="16" y="28" class="name">校验</text>
      <text x="16" y="50" class="sub">严格 TypeScript + Zod · os validate——定位的错误，或什么都没有</text>
    </g>
    <text x="250" y="248" class="arrowB" text-anchor="middle">↓</text>

    <g transform="translate(22 260)">
      <rect width="456" height="92" rx="12" fill="#ffffff" stroke="#256a5e" stroke-width="1.5"/>
      <text x="16" y="28" class="name">运行</text>
      <text x="16" y="50" class="sub">数据库 · REST / 实时 API · UI · MCP 服务器</text>
      <text x="16" y="70" class="sub">运行时不做任何推理</text>
    </g>
  </g>
  <g transform="translate(662 492)">
    <rect width="456" height="34" rx="17" fill="#eef7f2" stroke="#256a5e" stroke-width="1.5"/>
    <text x="228" y="22" class="verdictB" text-anchor="middle">跑的就是被校验过的东西</text>
  </g>

  <!-- 三个「不」 -->
  <g transform="translate(60 552)">
    <rect width="350" height="56" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="24" class="chipT">没有继承</text>
    <text x="18" y="44" class="chipS">每个对象的文件就是完整答案</text>
  </g>
  <g transform="translate(425 552)">
    <rect width="350" height="56" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="24" class="chipT">没有公理</text>
    <text x="18" y="44" class="chipS">约束用来拒绝，不用来推导</text>
  </g>
  <g transform="translate(790 552)">
    <rect width="350" height="56" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="24" class="chipT">没有推理器</text>
    <text x="18" y="44" class="chipS">不存在没人写过的事实</text>
  </g>

  <text x="60" y="638" class="small">来源：ObjectStack README「What we mean by ontology」；Business Ontology 概念页「How the runtime executes it」。</text>
</svg>
