<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="AI 自动化从业务语言进入受控流程">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#153b35}.h{font-size:30px;font-weight:780}.t{font-size:18px;font-weight:740}.s{font-size:14px;fill:#637772}.box{fill:#fffefa;stroke:#d7dfdb}.green{fill:#ecf7f2}.yellow{fill:#fff2cf}.blue{fill:#edf2ff}.red{fill:#fff0ec}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f7faf8"/>
  <text x="70" y="64" class="h">一条 AI 自动化流程应该被业务看懂</text>
  <g transform="translate(70 106)">
    <rect width="1060" height="430" rx="30" class="box"/>
    <g transform="translate(48 58)">
      <rect width="190" height="86" rx="22" class="green"/>
      <text x="95" y="35" text-anchor="middle" class="t">触发</text>
      <text x="95" y="60" text-anchor="middle" class="s">续约风险变高</text>
    </g>
    <g transform="translate(298 58)">
      <rect width="190" height="86" rx="22" class="yellow"/>
      <text x="95" y="35" text-anchor="middle" class="t">判断</text>
      <text x="95" y="60" text-anchor="middle" class="s">合同金额超过阈值</text>
    </g>
    <g transform="translate(548 58)">
      <rect width="190" height="86" rx="22" class="blue"/>
      <text x="95" y="35" text-anchor="middle" class="t">等待确认</text>
      <text x="95" y="60" text-anchor="middle" class="s">负责人批准策略</text>
    </g>
    <g transform="translate(798 58)">
      <rect width="190" height="86" rx="22" class="green"/>
      <text x="95" y="35" text-anchor="middle" class="t">执行业务动作</text>
      <text x="95" y="60" text-anchor="middle" class="s">创建任务和提醒</text>
    </g>
    <path d="M242 101 H294 M492 101 H544 M742 101 H794" stroke="#2f7a6b" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(170 235)">
      <rect width="220" height="90" rx="22" class="red"/>
      <text x="110" y="38" text-anchor="middle" class="t">超时分支</text>
      <text x="110" y="64" text-anchor="middle" class="s">三天未跟进则升级</text>
    </g>
    <g transform="translate(480 235)">
      <rect width="220" height="90" rx="22" class="box"/>
      <text x="110" y="38" text-anchor="middle" class="t">异常处理</text>
      <text x="110" y="64" text-anchor="middle" class="s">失败、拒绝、补救</text>
    </g>
    <g transform="translate(790 235)">
      <rect width="170" height="90" rx="22" class="box"/>
      <text x="85" y="38" text-anchor="middle" class="t">审计日志</text>
      <text x="85" y="64" text-anchor="middle" class="s">每一步可追踪</text>
    </g>
    <path d="M645 148 C645 190 590 200 590 231" fill="none" stroke="#d46b5f" stroke-width="4" stroke-linecap="round"/>
    <path d="M895 148 C895 198 875 205 875 231" fill="none" stroke="#d46b5f" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
