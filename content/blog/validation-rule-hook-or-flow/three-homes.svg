<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="一棵三个家的决策树。问题一：只凭正在写入的那一条记录就能判定、不做 I/O 吗？是：对象上的校验规则，script、cross_field 或 state_machine，在 insert 和 update 上运行、从不在删除上运行，以数据审阅。否，问题二：必须在保存前改写记录，或拦截读取吗？是：前置钩子，内联运行、不能暂停，以代码审阅。否：流程，默认落点，用于副作用、审批、任何会暂停或按时钟走的东西，以数据审阅。页脚：阻止删除是一个 beforeDelete 钩子，因为校验规则没有删除事件">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5e716b}
      .q{font-size:17px;font-weight:760}
      .qs{font-size:13px;fill:#5e716b}
      .yn{font-size:12px;font-weight:780;letter-spacing:.08em;fill:#5e716b}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em}
      .name{font-size:21px;font-weight:780}
      .row{font-size:14px}
      .small{font-size:13px;fill:#5e716b}
      .verdict{font-size:13px;font-weight:760}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a9b95"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">三个家，两个问题</text>
  <text x="60" y="80" class="note">文档以一张表承载的决策，画成审阅者对 diff 里每一条规则要问的两个问题。</text>

  <!-- Question 1 -->
  <g transform="translate(60 118)">
    <rect width="330" height="120" rx="18" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="34" class="cap" style="fill:#5e716b">问题 1</text>
    <text x="22" y="64" class="q">只凭正在写入的那一条记录</text>
    <text x="22" y="88" class="q">就能判定，不做 I/O 吗？</text>
    <text x="22" y="108" class="qs">传入的写入 + 先前的记录，别无其他</text>
  </g>

  <!-- Question 2 -->
  <g transform="translate(60 372)">
    <rect width="330" height="120" rx="18" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="34" class="cap" style="fill:#5e716b">问题 2</text>
    <text x="22" y="64" class="q">必须在保存之前改写记录，</text>
    <text x="22" y="88" class="q">或者拦截一次读取吗？</text>
    <text x="22" y="108" class="qs">待保存的载荷，或 beforeFind / afterFind</text>
  </g>

  <!-- arrows -->
  <line x1="225" y1="238" x2="225" y2="368" stroke="#8a9b95" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="200" y="290" width="50" height="22" rx="11" fill="#fbfdfc"/>
  <text x="225" y="306" class="yn" text-anchor="middle">否</text>

  <line x1="390" y1="178" x2="470" y2="178" stroke="#8a9b95" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="405" y="156" width="50" height="22" rx="11" fill="#fbfdfc"/>
  <text x="430" y="172" class="yn" text-anchor="middle">是</text>

  <line x1="390" y1="432" x2="470" y2="432" stroke="#8a9b95" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="405" y="410" width="50" height="22" rx="11" fill="#fbfdfc"/>
  <text x="430" y="426" class="yn" text-anchor="middle">是</text>

  <line x1="225" y1="492" x2="225" y2="570" stroke="#8a9b95" stroke-width="2"/>
  <line x1="225" y1="570" x2="810" y2="570" stroke="#8a9b95" stroke-width="2"/>
  <line x1="810" y1="570" x2="810" y2="518" stroke="#8a9b95" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="200" y="520" width="50" height="22" rx="11" fill="#fbfdfc"/>
  <text x="225" y="536" class="yn" text-anchor="middle">否</text>

  <!-- Home 1: validation rule -->
  <g transform="translate(474 104)">
    <rect width="330" height="150" rx="18" fill="#f4faf7" stroke="#2a7468" stroke-width="1.5"/>
    <text x="22" y="32" class="cap" style="fill:#2a7468">家 1 · 以数据审阅</text>
    <text x="22" y="62" class="name">校验规则</text>
    <text x="22" y="86" class="row">在对象上：script · cross_field · state_machine</text>
    <text x="22" y="108" class="row">每次 insert 和 update 都运行，不论谁写</text>
    <text x="22" y="132" class="small">从不在删除上运行：删除没有可校验的载荷</text>
  </g>

  <!-- Home 2: before hook -->
  <g transform="translate(474 358)">
    <rect width="330" height="150" rx="18" fill="#fdf4e8" stroke="#e6d3b6" stroke-width="1.5"/>
    <text x="22" y="32" class="cap" style="fill:#8a6a3a">家 2 · 以代码审阅</text>
    <text x="22" y="62" class="name">前置钩子</text>
    <text x="22" y="86" class="row">beforeInsert / beforeUpdate 改写 ctx.input</text>
    <text x="22" y="108" class="row">内联运行——不能暂停，不能等待</text>
    <text x="22" y="132" class="small">节点图表达不了的东西的兜底</text>
  </g>

  <!-- Home 3: flow -->
  <g transform="translate(840 358)">
    <rect width="300" height="150" rx="18" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="22" y="32" class="cap" style="fill:#2a7468">家 3 · 以数据审阅</text>
    <text x="22" y="62" class="name">流程——默认落点</text>
    <text x="22" y="86" class="row">保存后的副作用、审批，</text>
    <text x="22" y="108" class="row">任何会暂停或按时钟走的东西</text>
    <text x="22" y="132" class="small">节点的写入是一张字面量的字段映射</text>
  </g>

  <!-- footer -->
  <g transform="translate(60 606)">
    <rect width="1080" height="56" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="22" y="24" class="verdict" style="fill:#8a6a3a">阻止一次删除，是一个 beforeDelete 钩子。</text>
    <text x="22" y="44" class="small">校验规则只在 insert 和 update 上运行；不存在 'delete' 校验事件。来源：@objectstack/cli 18.2.0 处的 ObjectStack 钩子文档与校验文档。</text>
  </g>
</svg>
