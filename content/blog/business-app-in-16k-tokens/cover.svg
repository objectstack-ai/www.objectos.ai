<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="上下文体量的软件：一个完整 CRM 只占 200k token 上下文窗口中的约 16k">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24342f" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}
      .label{font-size:18px;font-weight:720}
      .soft{fill:#5d736b;font-size:15px}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="76" font-size="34" font-weight="780">上下文体量的软件</text>
  <text x="96" y="111" class="tiny">一个完整业务系统只有 16k token——小到 AI 智能体能整体装入、整体推理、整体重构</text>

  <!-- context window -->
  <rect x="96" y="170" width="1008" height="220" rx="18" fill="#ffffff" stroke="#c7d6cf" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="206" class="label">一个智能体上下文窗口</text>
  <text x="984" y="206" class="soft mono" text-anchor="end">200k tokens</text>

  <!-- token ruler -->
  <rect x="120" y="252" width="960" height="76" rx="10" fill="#f1f6f3" stroke="#dbe7e0"/>
  <rect x="120" y="252" width="77" height="76" rx="10" fill="url(#fill)"/>
  <text x="214" y="284" class="label">一个完整 CRM ≈ 16k token</text>
  <text x="214" y="310" class="soft">31 个文件 · 1792 行类型化元数据——数据模型、界面、流程、权限</text>
  <text x="1064" y="298" class="soft mono" text-anchor="end">仍有 92% 空闲</text>

  <!-- what's inside -->
  <g class="soft">
    <rect x="96" y="430" width="232" height="64" rx="12" fill="#ffffff" stroke="#dbe7e0"/>
    <text x="212" y="458" text-anchor="middle" class="label">对象与字段</text>
    <text x="212" y="480" text-anchor="middle" class="soft">数据模型</text>

    <rect x="354" y="430" width="232" height="64" rx="12" fill="#ffffff" stroke="#dbe7e0"/>
    <text x="470" y="458" text-anchor="middle" class="label">视图与仪表盘</text>
    <text x="470" y="480" text-anchor="middle" class="soft">声明式界面</text>

    <rect x="612" y="430" width="232" height="64" rx="12" fill="#ffffff" stroke="#dbe7e0"/>
    <text x="728" y="458" text-anchor="middle" class="label">流程与动作</text>
    <text x="728" y="480" text-anchor="middle" class="soft">自动化</text>

    <rect x="870" y="430" width="234" height="64" rx="12" fill="#ffffff" stroke="#dbe7e0"/>
    <text x="987" y="458" text-anchor="middle" class="label">权限</text>
    <text x="987" y="480" text-anchor="middle" class="soft">谁能看到什么</text>
  </g>

  <text x="96" y="560" class="tiny">其余一切——数据表、REST API、管理界面、MCP 工具——由运行时派生，不占用任何 token 预算。</text>
  <text x="96" y="610" class="soft mono">find src -name '*.ts' | xargs cat | wc -l   →   1792</text>
</svg>
