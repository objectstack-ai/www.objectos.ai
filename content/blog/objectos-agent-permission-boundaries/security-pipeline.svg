<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="企业 Agent 的权限边界">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.h{font-size:30px;font-weight:780}.t{font-size:18px;font-weight:740}.s{font-size:14px;fill:#647872}.box{fill:#fffefa;stroke:#d7dfdb}.green{fill:#eef7f3}.yellow{fill:#fff3d6}.blue{fill:#edf2ff}.red{fill:#fff0ec}.dark{fill:#173a36}.white{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f8faf8"/>
  <text x="70" y="64" class="h">AI 的每一步都应该经过企业权限边界</text>
  <g transform="translate(70 108)">
    <rect width="1060" height="418" rx="30" class="box"/>
    <g transform="translate(48 68)">
      <rect width="180" height="104" rx="24" class="dark"/>
      <text x="90" y="42" text-anchor="middle" class="white" font-size="19" font-weight="760">用户提问</text>
      <text x="90" y="70" text-anchor="middle" class="soft" font-size="14">谁在问</text>
    </g>
    <g transform="translate(292 48)">
      <rect width="190" height="70" rx="20" class="green"/>
      <text x="95" y="43" text-anchor="middle" class="t">对象权限</text>
      <rect y="96" width="190" height="70" rx="20" class="yellow"/>
      <text x="95" y="139" text-anchor="middle" class="t">记录范围</text>
      <rect y="192" width="190" height="70" rx="20" class="blue"/>
      <text x="95" y="235" text-anchor="middle" class="t">字段屏蔽</text>
    </g>
    <g transform="translate(570 70)">
      <rect width="205" height="104" rx="24" class="red"/>
      <text x="102" y="42" text-anchor="middle" class="t">动作确认</text>
      <text x="102" y="70" text-anchor="middle" class="s">高风险先让人批准</text>
    </g>
    <g transform="translate(848 70)">
      <rect width="160" height="104" rx="24" class="box"/>
      <text x="80" y="42" text-anchor="middle" class="t">审计链</text>
      <text x="80" y="70" text-anchor="middle" class="s">查了什么 / 做了什么</text>
    </g>
    <path d="M232 120 H288 M486 84 H566 M486 148 H566 M486 244 C540 244 540 124 566 124 M778 122 H844" stroke="#2a7468" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="530" y="350" text-anchor="middle" class="s">AI 不直接拥有数据库后门，而是在用户权限内查询数据、发起动作、等待确认。</text>
  </g>
</svg>
