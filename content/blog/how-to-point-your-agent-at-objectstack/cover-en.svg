<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Three wires point a coding agent at ObjectStack — instructions, skills and tools — and one validation gate returns a corrective error the agent can act on">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f8b81"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4553f"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}
      .label{font-size:19px;font-weight:720}
      .soft{fill:#5d736b;font-size:13.5px}
      .mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;fill:#3d5a52}
      .box{fill:#fffefa;stroke:#d7dfdb}
      .num{font-size:13px;font-weight:760;fill:#7b9289}
      .invert{fill:#eafff6}
      .invertsoft{fill:#a8cdc2;font-size:13.5px}
      .red{fill:#b4553f}
      .redsoft{fill:#b4553f;font-size:13.5px}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="82" font-size="34" font-weight="780">Three wires in. One gate back.</text>
  <text x="96" y="118" class="tiny">How a coding agent gets pointed at ObjectStack — and how it finds out it was wrong</text>

  <!-- three wires -->
  <g transform="translate(96 168)">
    <rect width="322" height="118" rx="22" class="box"/>
    <text x="26" y="34" class="num">WIRE 1</text>
    <text x="26" y="62" class="label">Instructions</text>
    <text x="26" y="88" class="soft">Always in context — keep it small</text>
    <text x="26" y="108" class="mono">AGENTS.md</text>

    <rect y="138" width="322" height="118" rx="22" class="box"/>
    <text x="26" y="172" class="num">WIRE 2</text>
    <text x="26" y="200" class="label">Skills</text>
    <text x="26" y="226" class="soft">Retrieved by task — 11 domains</text>
    <text x="26" y="246" class="mono">.agents/skills/</text>

    <rect y="276" width="322" height="118" rx="22" class="box"/>
    <text x="26" y="310" class="num">WIRE 3</text>
    <text x="26" y="338" class="label">Tools</text>
    <text x="26" y="364" class="soft">Live state, under your permissions</text>
    <text x="26" y="384" class="mono">/api/v1/mcp</text>
  </g>

  <!-- arrows into the agent -->
  <path d="M424 232 C 470 232 486 300 528 300" fill="none" stroke="#6f8b81" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M424 370 C 470 370 486 344 528 344" fill="none" stroke="#6f8b81" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M424 508 C 470 508 486 388 528 388" fill="none" stroke="#6f8b81" stroke-width="2" marker-end="url(#ar)"/>

  <!-- agent -->
  <g transform="translate(546 244)">
    <rect width="212" height="200" rx="26" fill="#173a36"/>
    <text x="106" y="66" text-anchor="middle" class="label invert">Coding agent</text>
    <text x="106" y="98" text-anchor="middle" class="invertsoft">writes typed metadata</text>
    <text x="106" y="140" text-anchor="middle" class="mono" style="fill:#a8cdc2">task.object.ts</text>
    <text x="106" y="166" text-anchor="middle" class="mono" style="fill:#a8cdc2">requiredWhen: …</text>
  </g>

  <path d="M766 344 L 838 344" fill="none" stroke="#6f8b81" stroke-width="2" marker-end="url(#ar)"/>

  <!-- gate -->
  <g transform="translate(848 214)">
    <rect width="256" height="260" rx="26" class="box"/>
    <text x="128" y="48" text-anchor="middle" class="label">The gate</text>
    <text x="128" y="76" text-anchor="middle" class="mono">npm run validate</text>
    <rect x="30" y="100" width="196" height="60" rx="16" fill="#edf7f1"/>
    <text x="128" y="128" text-anchor="middle" font-size="26" font-weight="780">41</text>
    <text x="128" y="150" text-anchor="middle" class="soft">author-time rules</text>
    <text x="128" y="192" text-anchor="middle" class="soft">~130 ms · same rules</text>
    <text x="128" y="212" text-anchor="middle" class="soft">as the build</text>
    <text x="128" y="238" text-anchor="middle" class="mono">exit 1 on failure</text>
  </g>

  <!-- corrective error loop back -->
  <path d="M976 474 C 976 546 700 546 660 546 C 600 546 592 480 592 452" fill="none" stroke="#b4553f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arRed)"/>
  <text x="700" y="590" class="label red">The corrective error</text>
  <text x="700" y="616" class="redsoft">names the object, the field and the offending token — then prints the fix,</text>
  <text x="700" y="638" class="redsoft">so the agent repairs itself without asking a human</text>
</svg>
