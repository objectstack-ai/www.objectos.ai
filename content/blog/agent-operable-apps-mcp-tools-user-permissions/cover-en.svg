<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Agent-operable apps: every object and action is an MCP tool under the user's permissions. One endpoint, /api/v1/mcp; the same twelve tools for every user; and the permission decision made on every call. Real output: the same run_action approve_claim call refused for Sam, who lacks the approve_claims capability, and permitted for Ada, whose record comes back approved.">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f5f6fb"/>
      <stop offset=".6" stop-color="#eef0fa"/>
      <stop offset="1" stop-color="#fff4e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1e2a4a" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1e293b}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em;fill:#3730a3}
      .title{font-size:50px;font-weight:800}
      .lead{font-size:19px;fill:#3f4a63}
      .chip{font-size:14px;font-weight:760;fill:#3730a3}
      .cap{font-size:12px;font-weight:780;letter-spacing:.08em;fill:#3730a3}
      .who{font-size:15px;font-weight:760}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600}
      .no{fill:#b91c1c}
      .ok{fill:#166534}
      .small{font-size:13px;fill:#5b6478}
      .foot{font-size:13px;fill:#5b6478}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="112" class="eyebrow">AGENT-OPERABLE</text>
  <text x="78" y="176" class="title">Every object and</text>
  <text x="78" y="234" class="title">action is a tool.</text>
  <text x="78" y="292" class="title">Under whose rules?</text>
  <text x="78" y="344" class="lead">One endpoint. The same twelve tools for every user.</text>
  <text x="78" y="370" class="lead">The permission decision is made on every call.</text>

  <g transform="translate(78 412)"><rect width="146" height="36" rx="18" fill="#ffffff" stroke="#c7cdf0"/><text x="73" y="23" class="chip" text-anchor="middle">/api/v1/mcp</text></g>
  <g transform="translate(234 412)"><rect width="128" height="36" rx="18" fill="#ffffff" stroke="#c7cdf0"/><text x="64" y="23" class="chip" text-anchor="middle">on by default</text></g>
  <g transform="translate(372 412)"><rect width="186" height="36" rx="18" fill="#ffffff" stroke="#c7cdf0"/><text x="93" y="23" class="chip" text-anchor="middle">actions opt in: ai.exposed</text></g>

  <g transform="translate(640 104)" filter="url(#shadow)">
    <rect width="482" height="466" rx="28" fill="#fffefb" stroke="#d9dcec"/>
    <text x="28" y="40" class="cap">SAME CALL · SAME RECORD · TWO USERS</text>
    <text x="28" y="68" class="mono" style="fill:#3f4a63">run_action approve_claim · 9vBXoTWICx4MQupC</text>

    <g transform="translate(28 92)">
      <rect width="426" height="150" rx="16" fill="#fef2f2" stroke="#f3c2c2"/>
      <text x="20" y="32" class="who">as Sam · submitter key</text>
      <text x="20" y="62" class="mono no">Action 'approve_claim' on 'expense_desk_claim'</text>
      <text x="20" y="82" class="mono no">requires capability [approve_claims]</text>
      <text x="20" y="102" class="mono no">— caller is missing [approve_claims]</text>
      <text x="20" y="132" class="small">refused at invoke time, by the same gate the REST route checks</text>
    </g>

    <g transform="translate(28 258)">
      <rect width="426" height="150" rx="16" fill="#f0fdf4" stroke="#bfe3c8"/>
      <text x="20" y="32" class="who">as Ada · approver key</text>
      <text x="20" y="62" class="mono ok">{ "ok": true, "action": "approve_claim",</text>
      <text x="20" y="82" class="mono ok">  "result": { "operation": "update",</text>
      <text x="20" y="102" class="mono ok">              "status": "approved" } }</text>
      <text x="20" y="132" class="small">permitted; updated_by is Ada, owner_id is still Sam</text>
    </g>

    <text x="28" y="440" class="small">Both lists: 12 tools. Three refusals in the run, each decided at the call.</text>
  </g>

  <text x="78" y="618" class="foot">Real output from the published 17.7.0 packages, trimmed but not rewritten. No tool definition was written by hand.</text>
</svg>
