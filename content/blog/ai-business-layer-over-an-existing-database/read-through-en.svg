<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-label="A read-through ontology on ObjectStack 18.4.0: a member over REST, an AI agent over MCP and any writer reach an ObjectStack layer of objects, permissions and a write gate; every read runs live on the order system's own database, and ObjectStack's database holds 0 customer or order rows.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3d58f0"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1f7a4d"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#151a17}
      .h{font-size:26px;font-weight:800}
      .sub{font-size:15px;fill:#515b55}
      .tag{font-size:13px;font-weight:800;letter-spacing:.08em;fill:#3d58f0}
      .tagg{font-size:13px;font-weight:800;letter-spacing:.08em;fill:#1f7a4d}
      .card{font-size:15px;font-weight:760}
      .t{font-size:15px;fill:#515b55}
      .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;fill:#151a17}
      .ok{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;fill:#1f7a4d}
      .no{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;fill:#c2410c}
      .chip{font-size:18px;font-weight:800;fill:#1f7a4d}
    </style>
  </defs>
  <rect width="1200" height="730" fill="#f3f7f2"/>

  <text x="40" y="50" class="h">A read-through ontology over a database ObjectStack does not own</text>
  <text x="40" y="76" class="sub">a fresh @objectstack/cli 18.4.0 scaffold · every value below is from the transcript</text>

  <!-- callers -->
  <g transform="translate(40 104)">
    <rect width="270" height="134" rx="14" fill="#ffffff" stroke="#dfe7df"/>
    <text x="18" y="28" class="tag">MEMBER · REST</text>
    <text x="18" y="52" class="card">Mia, granted sales_reader</text>
    <text x="18" y="78" class="ok">200 · 2 EU customers</text>
    <text x="18" y="100" class="m">credit_limit not returned</text>
    <text x="18" y="122" class="no">orders → 403</text>
  </g>
  <g transform="translate(40 254)">
    <rect width="270" height="134" rx="14" fill="#ffffff" stroke="#dfe7df"/>
    <text x="18" y="28" class="tag">AI AGENT · MCP</text>
    <text x="18" y="52" class="card">signed in as Mia</text>
    <text x="18" y="78" class="ok">list_objects → 1 object</text>
    <text x="18" y="100" class="m">at most 50 rows a call</text>
    <text x="18" y="122" class="no">orders → 403</text>
  </g>
  <g transform="translate(40 404)">
    <rect width="270" height="134" rx="14" fill="#ffffff" stroke="#dfe7df"/>
    <text x="18" y="28" class="tag">ANY WRITE</text>
    <text x="18" y="52" class="card">the admin included</text>
    <text x="18" y="78" class="m">insert · update · delete</text>
    <text x="18" y="104" class="no">403 EXTERNAL_WRITE_FORBIDDEN</text>
  </g>

  <path d="M312 171H344" stroke="#3d58f0" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M312 321H344" stroke="#3d58f0" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M312 471H344" stroke="#3d58f0" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- the layer -->
  <rect x="350" y="104" width="480" height="434" rx="18" fill="#eef2ff" stroke="#3d58f0" stroke-width="2"/>
  <text x="372" y="134" class="tag">OBJECTSTACK LAYER · STORES NONE OF THESE ROWS</text>
  <g transform="translate(370 150)">
    <rect width="440" height="118" rx="12" fill="#ffffff" stroke="#dfe7df"/>
    <text x="18" y="30" class="card">Objects</text>
    <text x="18" y="56" class="m">sales_customer ← customers</text>
    <text x="18" y="80" class="m">columnMap cust_no→id · cust_name→name</text>
    <text x="18" y="104" class="m">sales_order ← orders</text>
  </g>
  <g transform="translate(370 280)">
    <rect width="440" height="118" rx="12" fill="#ffffff" stroke="#dfe7df"/>
    <text x="18" y="30" class="card">Permissions</text>
    <text x="18" y="56" class="m">sales_reader: read sales_customer</text>
    <text x="18" y="80" class="t">credit_limit hidden, and not filterable</text>
    <text x="18" y="104" class="t">no grant on orders</text>
  </g>
  <g transform="translate(370 410)">
    <rect width="440" height="112" rx="12" fill="#ffffff" stroke="#dfe7df"/>
    <text x="18" y="30" class="card">Write gate</text>
    <text x="18" y="56" class="m">datasource allowWrites: false</text>
    <text x="18" y="80" class="m">object writable: false</text>
    <text x="18" y="102" class="t">either off: every write refused</text>
  </g>

  <path d="M832 300H874" stroke="#1f7a4d" stroke-width="2.5" fill="none" marker-end="url(#arrg)"/>
  <path d="M874 340H836" stroke="#1f7a4d" stroke-width="2.5" fill="none" marker-end="url(#arrg)"/>

  <!-- the order system's database -->
  <rect x="880" y="160" width="280" height="350" fill="#ffffff" stroke="#dfe7df"/>
  <ellipse cx="1020" cy="510" rx="140" ry="24" fill="#ffffff" stroke="#dfe7df"/>
  <rect x="881" y="480" width="278" height="30" fill="#ffffff"/>
  <ellipse cx="1020" cy="160" rx="140" ry="24" fill="#e9efe9" stroke="#dfe7df"/>
  <text x="900" y="218" class="tagg">ORDER SYSTEM DATABASE</text>
  <text x="900" y="244" class="t">erp.db, written by the old app</text>
  <text x="900" y="290" class="m">customers · 5 rows</text>
  <text x="900" y="316" class="m">orders · 2,400 rows</text>
  <text x="900" y="362" class="card">every read runs here, live</text>
  <text x="900" y="390" class="t">an UPDATE made here shows</text>
  <text x="900" y="412" class="t">on the very next read</text>
  <text x="900" y="458" class="t">a column type change fails boot</text>

  <!-- ObjectStack's own database -->
  <rect x="40" y="566" width="1120" height="128" rx="16" fill="#ffffff" stroke="#dfe7df"/>
  <text x="64" y="600" class="tag">OBJECTSTACK’S OWN DATABASE</text>
  <text x="64" y="630" class="t">users, permission grants, native objects such as sales_visit</text>
  <text x="64" y="656" class="t">84 tables; none named customer or order</text>
  <rect x="790" y="600" width="340" height="60" rx="30" fill="#e3f3ea"/>
  <text x="960" y="637" class="chip" text-anchor="middle">0 customer or order rows</text>
</svg>
