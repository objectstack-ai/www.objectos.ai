<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="本体交接：FDE 离场后,本体要么锁在平台里,要么作为类型化文件留在客户仓库中">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24342f" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}
      .label{font-size:18px;font-weight:720}
      .soft{fill:#5d736b;font-size:15px}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
      .invert{fill:#eafff6}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="76" font-size="34" font-weight="780">本体交接</text>
  <text x="96" y="111" class="tiny">前沿部署项目终会结束。此后本体在哪里,决定这个项目值多少。</text>

  <!-- timeline -->
  <line x1="96" y1="180" x2="1104" y2="180" stroke="#c7d6cf" stroke-width="2"/>
  <circle cx="200" cy="180" r="7" fill="#0f766e"/>
  <text x="200" y="215" text-anchor="middle" class="soft">FDE 嵌入现场</text>
  <circle cx="560" cy="180" r="7" fill="#0f766e"/>
  <text x="560" y="215" text-anchor="middle" class="soft">本体建模 · 应用交付</text>
  <circle cx="920" cy="180" r="7" fill="#b45309"/>
  <text x="920" y="215" text-anchor="middle" class="soft">FDE 离场——交接时刻</text>

  <!-- outcome A: locked -->
  <rect x="96" y="270" width="470" height="230" rx="18" fill="#ffffff" stroke="#e2d6c3" stroke-width="2" filter="url(#shadow)"/>
  <text x="126" y="312" class="label">结局 A——锁在平台里</text>
  <text x="126" y="345" class="soft">本体留在供应商的围墙内。</text>
  <text x="126" y="378" class="soft">• 席位费无限期续下去</text>
  <text x="126" y="404" class="soft">• 改动依赖供应商培训的专家</text>
  <text x="126" y="430" class="soft">• 客户自己的 AI 碰不到它</text>
  <text x="126" y="472" class="tiny mono">续约筹码:在对方手里</text>

  <!-- outcome B: open -->
  <rect x="634" y="270" width="470" height="230" rx="18" fill="#0f766e" filter="url(#shadow)"/>
  <text x="664" y="312" class="label invert">结局 B——留在客户仓库里</text>
  <text x="664" y="345" style="fill:#c8ece2;font-size:15px">类型化的对象、流程、权限——开放文件。</text>
  <text x="664" y="378" style="fill:#c8ece2;font-size:15px">• Apache-2.0,没有 license 要续</text>
  <text x="664" y="404" style="fill:#c8ece2;font-size:15px">• 任意编码智能体 + 评审者即可维护</text>
  <text x="664" y="430" style="fill:#c8ece2;font-size:15px">• 客户的 AI 经 MCP 操作应用</text>
  <text x="664" y="472" class="mono" style="fill:#c8ece2;font-size:16px">续约筹码:不再需要</text>

  <text x="96" y="560" class="tiny">本体优先是被验证有效的打法。唯一悬而未决的问题,是本体最终落在哪里。</text>
  <text x="96" y="610" class="soft mono">一个完整 CRM ≈ 16k token 的类型化元数据——可整体审阅</text>
</svg>
