<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="可执行业务本体的六类核心——对象与字段、关系、动作、权限、流程、Agent 与工具定义——先被校验再由 ObjectStack 运行时运行；运行时推导出数据库结构、REST 与实时 API、控制台 UI 和 MCP 工具，并在每次调用时强制执行权限；钩子、动作体、CEL 和受限 JSX 在运行时的围栏内运行；视图、仪表盘、应用和翻译作为投影位于本体框之外">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a6a3a"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5e716b}
      .cap{font-size:13px;font-weight:780;letter-spacing:.06em}
      .label{font-size:16px;font-weight:760}
      .small{font-size:13px;fill:#657872}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600}
      .step{font-size:12px;font-weight:760;fill:#2a7468}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">六类进去，四个表面出来——以及什么留在框外</text>
  <text x="60" y="80" class="note">核心先校验、再运行。投影用同样的元数据、过同一道门禁，但不是本体的一部分。</text>

  <!-- 本体 -->
  <g transform="translate(60 112)">
    <rect width="320" height="400" rx="22" fill="#fdf4e8" stroke="#d9b98c" stroke-width="2"/>
    <text x="24" y="34" class="cap" style="fill:#8a6a3a">本体——六类核心</text>
    <g transform="translate(24 52)"><rect width="272" height="42" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="27" class="label">对象与字段</text></g>
    <g transform="translate(24 102)"><rect width="272" height="42" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="27" class="label">关系</text></g>
    <g transform="translate(24 152)"><rect width="272" height="42" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="27" class="label">动作</text></g>
    <g transform="translate(24 202)"><rect width="272" height="42" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="27" class="label">权限</text></g>
    <g transform="translate(24 252)"><rect width="272" height="42" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="27" class="label">流程</text></g>
    <g transform="translate(24 302)"><rect width="272" height="42" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="27" class="label">Agent 与工具定义</text></g>
    <text x="24" y="370" class="mono" style="fill:#8a6a3a">objectstack.config.ts</text>
    <text x="24" y="390" class="mono" style="fill:#8a6a3a">→ objectstack.json</text>
  </g>

  <!-- 核心 → 运行时 -->
  <text x="450" y="292" class="step" text-anchor="middle">先校验</text>
  <text x="450" y="308" class="small" text-anchor="middle">Zod · os validate</text>
  <line x1="384" y1="320" x2="514" y2="320" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="450" y="342" class="step" text-anchor="middle">再运行</text>

  <!-- 运行时 -->
  <g transform="translate(520 112)">
    <rect width="300" height="400" rx="22" fill="#eef7f2" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="34" class="cap" style="fill:#2a7468">OBJECTSTACK 运行时</text>
    <text x="24" y="64" class="label">先推导，再强制执行</text>
    <text x="24" y="86" class="small">每一次调用——REST 请求、</text>
    <text x="24" y="104" class="small">控制台点击、Agent 工具调用一视同仁</text>
    <text x="24" y="130" class="small" style="fill:#2a7468;font-weight:700">RBAC · RLS · FLS · 共享 · 审计</text>
    <g transform="translate(20 152)">
      <rect width="260" height="140" rx="14" fill="#ffffff" stroke="#2a7468" stroke-width="1.5" stroke-dasharray="7 5"/>
      <text x="16" y="28" class="cap" style="fill:#2a7468">代码在围栏内运行</text>
      <text x="16" y="56" class="label">钩子 · 动作体</text>
      <text x="16" y="80" class="label">CEL · 受限 JSX</text>
      <text x="16" y="106" class="small">接受与一次点击或一次工具调用</text>
      <text x="16" y="124" class="small">相同的权限与审计</text>
    </g>
    <text x="24" y="330" class="small">运行时不做任何推理：</text>
    <text x="24" y="348" class="small">跑的就是被校验过的东西。</text>
    <text x="24" y="378" class="mono" style="fill:#2a7468">objectstack.json → 运行中的应用</text>
  </g>

  <!-- 运行时 → 表面 -->
  <line x1="824" y1="152" x2="876" y2="152" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="824" y1="260" x2="876" y2="260" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="824" y1="368" x2="876" y2="368" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="824" y1="476" x2="876" y2="476" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(880 112)">
    <rect width="260" height="80" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="30" class="label">数据库结构</text>
    <text x="18" y="52" class="small">在可互换的驱动之上</text>
    <text x="18" y="68" class="small">Postgres · MySQL · SQLite · Mongo</text>
  </g>
  <g transform="translate(880 220)">
    <rect width="260" height="80" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="30" class="label">REST / 实时 API</text>
    <text x="18" y="52" class="small">自动生成——没有控制器要写</text>
    <text x="18" y="68" class="mono">/api/v1/data/&lt;object&gt;</text>
  </g>
  <g transform="translate(880 328)">
    <rect width="260" height="80" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="30" class="label">控制台 UI</text>
    <text x="18" y="52" class="small">服务端驱动：记录、看板、仪表盘</text>
    <text x="18" y="68" class="small">渲染出来的，不是写出来的</text>
  </g>
  <g transform="translate(880 436)">
    <rect width="260" height="80" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="30" class="label">MCP 工具</text>
    <text x="18" y="52" class="small">每个对象都是工具，默认开启；</text>
    <text x="18" y="68" class="small">动作主动开放——权限相同</text>
  </g>

  <!-- 本体 → 投影（框外） -->
  <line x1="220" y1="516" x2="220" y2="546" stroke="#8a6a3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr2)"/>
  <text x="236" y="536" class="small" style="fill:#8a6a3a">投影到页面、图表、菜单和语言上</text>

  <!-- 投影 -->
  <g transform="translate(60 552)">
    <rect width="760" height="128" rx="20" fill="#f4faf7" stroke="#8a6a3a" stroke-width="1.8" stroke-dasharray="8 6"/>
    <text x="24" y="32" class="cap" style="fill:#8a6a3a">投影——用元数据编写，但不是本体的一部分</text>
    <g transform="translate(24 48)"><rect width="164" height="38" rx="11" fill="#ffffff" stroke="#c9d8d1"/><text x="14" y="25" class="label">视图</text></g>
    <g transform="translate(204 48)"><rect width="164" height="38" rx="11" fill="#ffffff" stroke="#c9d8d1"/><text x="14" y="25" class="label">仪表盘</text></g>
    <g transform="translate(384 48)"><rect width="164" height="38" rx="11" fill="#ffffff" stroke="#c9d8d1"/><text x="14" y="25" class="label">应用</text></g>
    <g transform="translate(564 48)"><rect width="164" height="38" rx="11" fill="#ffffff" stroke="#c9d8d1"/><text x="14" y="25" class="label">翻译</text></g>
    <text x="24" y="110" class="small">由同一道门禁校验。删掉一个投影，它所展示的业务不变；改动核心，投影跟着变。</text>
  </g>

  <!-- 右侧说明 -->
  <text x="880" y="572" class="cap" style="fill:#5e716b">这个框为什么重要</text>
  <text x="880" y="596" class="small">Agent 为了推理业务必须装下的，</text>
  <text x="880" y="614" class="small">是核心——六类东西——</text>
  <text x="880" y="632" class="small">而不是每一个屏幕。</text>
  <text x="880" y="660" class="small" style="fill:#2a7468">来源：ObjectStack README 与</text>
  <text x="880" y="678" class="small" style="fill:#2a7468">「业务本体」概念页。</text>
</svg>
