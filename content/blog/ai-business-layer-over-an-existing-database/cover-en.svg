<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A business layer over the database you already run: live reads, read-only by default, permissions apply. Objects, permissions and AI tools sit over your database with 0 rows copied.">
