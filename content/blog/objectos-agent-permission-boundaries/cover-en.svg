<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The four enforcement points for AI agent permissions">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf9"/>
      <stop offset="1" stop-color="#edf5e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#263d35" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.title{font-size:38px;font-weight:780}.lead{font-size:18px;fill:#5d736b}.label{font-size:19px;font-weight:760}.small{font-size:14px;fill:#647872}.num{font-size:13px;font-weight:780;fill:#2a7468}.invert{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="78" y="86" class="title">Where the permission check actually runs</text>
  <text x="78" y="124" class="lead">Three points sit before the model reads anything. The fourth does not.</text>
  <g transform="translate(96 160)" filter="url(#shadow)">
    <rect width="1008" height="370" rx="32" fill="#fffefa" stroke="#d8dfd6"/>

    <g transform="translate(52 72)">
      <rect width="168" height="216" rx="26" fill="#173a36"/>
      <text x="84" y="56" text-anchor="middle" class="invert" font-size="19" font-weight="780">Signed-in</text>
      <text x="84" y="82" text-anchor="middle" class="invert" font-size="19" font-weight="780">user</text>
      <text x="84" y="126" text-anchor="middle" class="soft" font-size="14">Identity</text>
      <text x="84" y="158" text-anchor="middle" class="soft" font-size="14">Role</text>
      <text x="84" y="190" text-anchor="middle" class="soft" font-size="14">Tenant</text>
    </g>

    <g transform="translate(288 68)">
      <rect width="222" height="96" rx="20" fill="#fff3d6" stroke="#efc86c"/>
      <text x="16" y="30" class="num">1 — BEFORE THE MODEL</text>
      <text x="111" y="64" text-anchor="middle" class="label">The query</text>
      <text x="111" y="84" text-anchor="middle" class="small">Row scope pushed down</text>

      <rect y="124" width="222" height="96" rx="20" fill="#edf2ff" stroke="#bdc8ee"/>
      <text x="16" y="154" class="num">2 — BEFORE THE MODEL</text>
      <text x="111" y="188" text-anchor="middle" class="label">The field</text>
      <text x="111" y="208" text-anchor="middle" class="small">Masked at serialization</text>
    </g>

    <path d="M578 116 V296" stroke="#c8b5a0" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
    <text x="578" y="98" text-anchor="middle" class="small" font-weight="740">context window</text>

    <g transform="translate(636 68)">
      <rect width="222" height="96" rx="20" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="16" y="30" class="num">3 — AT THE BOUNDARY</text>
      <text x="111" y="64" text-anchor="middle" class="label">The tool gate</text>
      <text x="111" y="84" text-anchor="middle" class="small">Deny by default</text>

      <rect y="124" width="222" height="96" rx="20" fill="#fff0ec" stroke="#e8b3a4"/>
      <text x="16" y="154" class="num">4 — PAST THE BOUNDARY</text>
      <text x="111" y="188" text-anchor="middle" class="label">The action body</text>
      <text x="111" y="208" text-anchor="middle" class="small">Trusted, unbounded</text>
    </g>

    <path d="M224 180 H282 M514 116 H570 M514 240 H570 M586 116 H630 M586 240 H630" stroke="#2a7468" stroke-width="4" stroke-linecap="round" fill="none"/>

    <text x="504" y="336" text-anchor="middle" class="small">A rule enforced after this line is a paper permission — it reads as access control and enforces nothing.</text>
  </g>
</svg>
