<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="AI 自动化把业务需求变成可治理流程">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#18332e" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#153b35}.title{font-size:38px;font-weight:780}.lead{font-size:18px;fill:#5c716d}.label{font-size:19px;font-weight:740}.small{font-size:14px;fill:#647873}.dark{fill:#153b35}.white{fill:#f4fff9}.soft{fill:#a8d1c5}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="78" y="86" class="title">自动化不只是发通知</text>
  <text x="78" y="124" class="lead">一条业务流程要会判断、等待，并留下证据</text>
  <g transform="translate(88 172)" filter="url(#shadow)">
    <rect width="1024" height="360" rx="32" fill="#fffefa" stroke="#d9e2dd"/>
    <g transform="translate(50 70)">
      <rect width="190" height="96" rx="24" class="dark"/>
      <text x="95" y="42" text-anchor="middle" class="white" font-size="19" font-weight="760">业务语言</text>
      <text x="95" y="68" text-anchor="middle" class="soft" font-size="14">续约风险变高</text>
    </g>
    <g transform="translate(292 70)">
      <rect width="190" height="96" rx="24" fill="#ecf7f2" stroke="#b7d8cb"/>
      <text x="95" y="42" text-anchor="middle" class="label">判断条件</text>
      <text x="95" y="68" text-anchor="middle" class="small">金额 / 风险 / 角色</text>
    </g>
    <g transform="translate(534 70)">
      <rect width="190" height="96" rx="24" fill="#fff2cf" stroke="#ebc35d"/>
      <text x="95" y="42" text-anchor="middle" class="label">人工确认</text>
      <text x="95" y="68" text-anchor="middle" class="small">审批 / 补充信息</text>
    </g>
    <g transform="translate(776 70)">
      <rect width="178" height="96" rx="24" fill="#edf2ff" stroke="#b9c6ee"/>
      <text x="89" y="42" text-anchor="middle" class="label">执行记录</text>
      <text x="89" y="68" text-anchor="middle" class="small">可审计 / 可复盘</text>
    </g>
    <path d="M244 118 H288 M486 118 H530 M728 118 H772" stroke="#2f7a6b" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(225 230)">
      <rect width="570" height="70" rx="22" fill="#f6f8fb" stroke="#d8e0e8"/>
      <text x="285" y="30" text-anchor="middle" class="label">由 AI Builder 生成流程元数据</text>
      <text x="285" y="53" text-anchor="middle" class="small">平台负责校验、暂停、恢复、权限和日志</text>
    </g>
  </g>
</svg>
