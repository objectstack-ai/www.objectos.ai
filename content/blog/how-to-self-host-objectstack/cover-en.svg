<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Self-hosting ObjectStack: typed metadata compiles to one JSON artifact, which the open-source runtime serves against your own database inside your infrastructure">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .title{font-size:40px;font-weight:780}
      .lead{font-size:18px;fill:#5e716b}
      .cap{font-size:13px;font-weight:780;letter-spacing:.08em}
      .label{font-size:19px;font-weight:760}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:600}
      .small{font-size:13px;fill:#657872}
      .step{font-size:13px;font-weight:760;fill:#2a7468}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="88" class="title">How to self-host ObjectStack</text>
  <text x="78" y="126" class="lead">One artifact, one runtime, one database — all Apache-2.0, all on infrastructure you operate.</text>

  <g transform="translate(96 168)" filter="url(#shadow)">
    <rect width="1008" height="392" rx="32" fill="#fffefa" stroke="#d8dfd6"/>

    <!-- BUILD SIDE -->
    <text x="44" y="56" class="cap" fill="#8a6a3a">IN YOUR REPO — BUILD</text>

    <g transform="translate(44 78)">
      <rect width="240" height="94" rx="16" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="20" y="36" class="label">Typed metadata</text>
      <text x="20" y="62" class="mono" fill="#8a6a3a">objectstack.config.ts</text>
      <text x="20" y="82" class="small">objects · permissions · flows</text>
    </g>

    <text x="300" y="112" class="step">os build</text>
    <line x1="296" y1="125" x2="374" y2="125" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arw)"/>

    <g transform="translate(388 78)">
      <rect width="216" height="94" rx="16" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="20" y="36" class="label">One artifact</text>
      <text x="20" y="62" class="mono" fill="#8a6a3a">objectstack.json</text>
      <text x="20" y="82" class="small">the whole app definition</text>
    </g>

    <!-- RUN SIDE -->
    <text x="640" y="56" class="cap" fill="#2a7468">ON YOUR SERVERS — RUN</text>

    <text x="620" y="112" class="step">os start</text>
    <line x1="616" y1="125" x2="676" y2="125" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arw)"/>

    <g transform="translate(690 78)">
      <rect width="274" height="94" rx="16" fill="#eef7f2" stroke="#b9dcd0"/>
      <text x="20" y="36" class="label">ObjectStack runtime</text>
      <text x="20" y="62" class="small">Console · REST · MCP · audit</text>
      <text x="20" y="82" class="small">permissions enforced on every call</text>
    </g>

    <!-- YOUR BOUNDARY -->
    <g transform="translate(44 208)">
      <rect width="920" height="146" rx="20" fill="#f4faf7" stroke="#2a7468" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="24" y="34" class="cap" fill="#2a7468">YOUR INFRASTRUCTURE — YOUR RESPONSIBILITY</text>

      <g transform="translate(24 52)">
        <rect width="200" height="74" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
        <text x="18" y="32" class="label">Your database</text>
        <text x="18" y="55" class="small">Postgres · MySQL · Mongo</text>
      </g>
      <g transform="translate(240 52)">
        <rect width="200" height="74" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
        <text x="18" y="32" class="label">Your files</text>
        <text x="18" y="55" class="small">object storage or disk</text>
      </g>
      <g transform="translate(456 52)">
        <rect width="200" height="74" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
        <text x="18" y="32" class="label">Your identity</text>
        <text x="18" y="55" class="small">SSO · roles · org chart</text>
      </g>
      <g transform="translate(672 52)">
        <rect width="224" height="74" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
        <text x="18" y="32" class="label">Your keys</text>
        <text x="18" y="55" class="small">secrets · backups · on-call</text>
      </g>
    </g>
  </g>

  <text x="96" y="612" class="small">Apache-2.0 · no license callback · no vendor account required</text>
  <text x="1104" y="612" class="small" text-anchor="end">Verified on ObjectStack 17.2.0 · Node 22 · PostgreSQL 16</text>
</svg>
