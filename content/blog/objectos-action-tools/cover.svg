<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="AI 通过受控业务动作推进工作">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7faf6"/>
      <stop offset="1" stop-color="#fff4e3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.title{font-size:38px;font-weight:780}.lead{font-size:18px;fill:#5e716b}.label{font-size:19px;font-weight:760}.small{font-size:14px;fill:#657872}.invert{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="78" y="86" class="title">AI 不只给建议</text>
  <text x="78" y="124" class="lead">对话也可以触发受控的业务动作</text>
  <g transform="translate(96 160)" filter="url(#shadow)">
    <rect width="1008" height="370" rx="32" fill="#fffefa" stroke="#d8dfd6"/>
    <g transform="translate(58 70)">
      <rect width="220" height="220" rx="28" fill="#173a36"/>
      <text x="110" y="54" text-anchor="middle" class="invert" font-size="20" font-weight="780">对话意图</text>
      <text x="110" y="94" text-anchor="middle" class="soft" font-size="14">转换线索</text>
      <text x="110" y="126" text-anchor="middle" class="soft" font-size="14">创建任务</text>
      <text x="110" y="158" text-anchor="middle" class="soft" font-size="14">发起审批</text>
    </g>
    <g transform="translate(382 70)">
      <rect width="230" height="220" rx="28" fill="#eef7f2" stroke="#bdd7cf"/>
      <text x="115" y="52" text-anchor="middle" class="label">Action 目录</text>
      <text x="115" y="90" text-anchor="middle" class="small">哪些动作可被 AI 使用</text>
      <text x="115" y="122" text-anchor="middle" class="small">需要哪些输入</text>
      <text x="115" y="154" text-anchor="middle" class="small">是否需要确认</text>
    </g>
    <g transform="translate(716 70)">
      <rect width="220" height="220" rx="28" fill="#edf2ff" stroke="#bdc8ee"/>
      <text x="110" y="52" text-anchor="middle" class="label">同一业务运行时</text>
      <text x="110" y="90" text-anchor="middle" class="small">权限</text>
      <text x="110" y="122" text-anchor="middle" class="small">审批</text>
      <text x="110" y="154" text-anchor="middle" class="small">审计</text>
      <text x="110" y="186" text-anchor="middle" class="small">数据更新</text>
    </g>
    <path d="M282 180 H378 M616 180 H712" stroke="#2a7468" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
