<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Access is governed, logic is scattered JavaScript">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#eef1f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1a2740" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16233c}.title{font-size:44px;font-weight:780}.sub{font-size:20px;fill:#5a647a}.label{font-size:20px;font-weight:720}.tiny{font-size:14px;fill:#6b7280}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;fill:#b85c4d}.ok{fill:#1d7a5f}.invert{fill:#eaf1ff}.soft{fill:#9fb2d6}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="86" y="96" class="title">RBAC guards the door.</text>
  <text x="86" y="146" class="title">The logic is loose in the room.</text>
  <text x="86" y="184" class="sub">Retool governs who opens the app — not what its logic does</text>

  <g transform="translate(86 232)" filter="url(#shadow)">
    <rect width="360" height="370" rx="28" fill="#16233c"/>
    <text x="36" y="58" class="invert" font-size="20" font-weight="760">Access ✓ governed</text>
    <rect x="36" y="86" width="288" height="40" rx="12" fill="#21314f"/>
    <text x="54" y="112" class="soft" font-size="15">App / resource / query RBAC</text>
    <rect x="36" y="138" width="288" height="40" rx="12" fill="#21314f"/>
    <text x="54" y="164" class="soft" font-size="15">Row-level security</text>
    <rect x="36" y="190" width="288" height="40" rx="12" fill="#21314f"/>
    <text x="54" y="216" class="soft" font-size="15">Audit logs · SSO</text>
    <g transform="translate(132 258)">
      <rect width="96" height="80" rx="14" fill="#2f8f6e"/>
      <rect x="30" y="20" width="36" height="34" rx="8" fill="none" stroke="#eafff6" stroke-width="4"/>
      <circle cx="48" cy="46" r="6" fill="#eafff6"/>
      <text x="22" y="72" class="invert" font-size="13" font-weight="680">locked</text>
    </g>
  </g>

  <g transform="translate(490 232)" filter="url(#shadow)">
    <rect width="624" height="370" rx="28" fill="#fffefb" stroke="#dfe3ec"/>
    <text x="36" y="58" class="label">Logic ✗ scattered JavaScript</text>
    <rect x="36" y="84" width="270" height="62" rx="12" fill="#fbf0ee"/>
    <text x="52" y="114" class="mono">component.Hidden =</text>
    <text x="52" y="134" class="mono">{{ user.role !== 'admin' }}</text>
    <rect x="324" y="84" width="264" height="62" rx="12" fill="#fbf0ee"/>
    <text x="340" y="114" class="mono">query3.transformer:</text>
    <text x="340" y="134" class="mono">if (amount &gt; 1e5) ...</text>
    <rect x="36" y="160" width="264" height="62" rx="12" fill="#fbf0ee"/>
    <text x="52" y="190" class="mono">binding: status ===</text>
    <text x="52" y="210" class="mono">'high' ? show : hide</text>
    <rect x="318" y="160" width="270" height="62" rx="12" fill="#fbf0ee"/>
    <text x="334" y="190" class="mono">refundBtn.disabled =</text>
    <text x="334" y="210" class="mono">!perms.includes(...)</text>
    <text x="36" y="262" class="tiny" font-size="15" fill="#6b7280">No structured diff. No metadata.</text>
    <text x="36" y="292" class="tiny" font-size="15" fill="#6b7280">An AI can't audit it; a new owner can't read it.</text>
    <text x="36" y="330" class="tiny" font-size="15" fill="#b85c4d" font-weight="680">Field &amp; action rules live here — hand-assembled, screen by screen.</text>
  </g>
</svg>
