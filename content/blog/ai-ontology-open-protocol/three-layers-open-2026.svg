<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="三层结构决定可移植性：接口层已通过 MCP 开放，定义层以代码入库的形式开放，运行时原地未动">
  <defs>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#24342f" flood-opacity=".13"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h1{font-size:26px;font-weight:780}
      .sub{font-size:14px;fill:#5d736b}
      .layer{font-size:23px;font-weight:760}
      .gloss{font-size:15px;fill:#5d736b}
      .verdict{font-size:20px;font-weight:720}
      .v-open{fill:#1c7a55}
      .v-part{fill:#8a6412}
      .v-shut{fill:#a8452f}
      .detail{font-size:15px;fill:#5d736b}
      .foot{font-size:15px;font-weight:640;fill:#22433d}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#f8faf7"/>

  <text x="70" y="58" class="h1">三层结构决定可移植性</text>
  <text x="70" y="86" class="sub">2026 年这个赛道打开了哪几层——以及始终没打开的那一层</text>

  <g filter="url(#shadow3)">
    <!-- 接口层 -->
    <g transform="translate(70 132)">
      <rect width="1060" height="110" rx="16" fill="#ffffff"/>
      <text x="32" y="46" class="layer">接口层</text>
      <text x="32" y="78" class="gloss">agent 如何调用 ontology</text>
      <line x1="660" y1="22" x2="660" y2="88" stroke="#dfe9e2" stroke-width="2"/>
      <text x="700" y="46" class="verdict v-open">已开放</text>
      <text x="700" y="78" class="detail">MCP，由平台厂商自己采用</text>
    </g>

    <!-- 定义层 -->
    <g transform="translate(70 264)">
      <rect width="1060" height="110" rx="16" fill="#ffffff"/>
      <text x="32" y="46" class="layer">定义层</text>
      <text x="32" y="78" class="gloss">对象、动作与权限</text>
      <line x1="660" y1="22" x2="660" y2="88" stroke="#dfe9e2" stroke-width="2"/>
      <text x="700" y="46" class="verdict v-part">形式上在开放</text>
      <text x="700" y="78" class="detail">以代码入库，仍绑定单一平台</text>
    </g>

    <!-- 运行时 -->
    <g transform="translate(70 396)">
      <rect width="1060" height="110" rx="16" fill="#fff6e4"/>
      <text x="32" y="46" class="layer">运行时</text>
      <text x="32" y="78" class="gloss">执行动作、并在执行时强制规则的那一层</text>
      <line x1="660" y1="22" x2="660" y2="88" stroke="#ecd8ad" stroke-width="2"/>
      <text x="700" y="46" class="verdict v-shut">原地未动</text>
      <text x="700" y="78" class="detail">没有厂商交出可替换的运行时</text>
    </g>
  </g>

  <text x="70" y="542" class="foot">运行时是最后一层没有打开的地方——平台生意无法在不改变自己卖什么的前提下打开它。</text>
</svg>
