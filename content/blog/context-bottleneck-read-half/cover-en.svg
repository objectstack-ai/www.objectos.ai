<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Context fixes ground what an agent reads; the write half is governed by whatever the destination enforces">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.title{font-size:40px;font-weight:780}.lead{font-size:18px;fill:#5e716b}.cap{font-size:13px;font-weight:780;letter-spacing:.08em}.label{font-size:19px;font-weight:760}.small{font-size:13px;fill:#657872}.invert{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="88" class="title">Context is the bottleneck. So is half the fix.</text>
  <text x="78" y="126" class="lead">Semantic layers ground what an agent reads. The write runs on whatever the destination enforces.</text>

  <g transform="translate(96 168)" filter="url(#shadow)">
    <rect width="1008" height="392" rx="32" fill="#fffefa" stroke="#d8dfd6"/>

    <!-- READ PATH -->
    <text x="44" y="58" class="cap" fill="#2a7468">THE READ HALF — SOLVED</text>
    <g transform="translate(44 82)">
      <rect width="176" height="82" rx="20" fill="#173a36"/>
      <text x="88" y="40" text-anchor="middle" class="invert" font-size="17" font-weight="760">Question</text>
      <text x="88" y="63" text-anchor="middle" class="soft" font-size="12">"what is our churn?"</text>

      <rect x="228" y="0" width="316" height="82" rx="20" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="386" y="34" text-anchor="middle" class="label">Context layer</text>
      <text x="386" y="59" text-anchor="middle" class="small">definitions, metrics, row and field policy</text>

      <rect x="552" y="0" width="176" height="82" rx="20" fill="#fffefa" stroke="#d7dfdb"/>
      <text x="640" y="40" text-anchor="middle" class="label">Answer</text>
      <text x="640" y="63" text-anchor="middle" class="small">grounded, cited</text>

      <text x="768" y="36" class="cap" fill="#2a7468">1 LAYER</text>
      <text x="768" y="62" class="small">you own it, you can read it</text>

      <path d="M176 41 H222 M544 41 H546" stroke="#2a7468" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M176 41 H222" stroke="#2a7468" stroke-width="4" stroke-linecap="round"/>
      <path d="M544 41 H548" stroke="#2a7468" stroke-width="4" stroke-linecap="round"/>
    </g>

    <line x1="44" y1="200" x2="964" y2="200" stroke="#e2e8e2" stroke-width="2"/>

    <!-- WRITE PATH -->
    <text x="44" y="242" class="cap" fill="#b0563c">THE WRITE HALF — BORROWED</text>
    <g transform="translate(44 266)">
      <rect width="176" height="82" rx="20" fill="#173a36"/>
      <text x="88" y="40" text-anchor="middle" class="invert" font-size="17" font-weight="760">Intent</text>
      <text x="88" y="63" text-anchor="middle" class="soft" font-size="12">"convert the lead"</text>

      <rect x="228" y="0" width="150" height="82" rx="20" fill="#f2f2ee" stroke="#dcdcd2"/>
      <text x="303" y="34" text-anchor="middle" class="label" fill="#7d8a84">Context</text>
      <text x="303" y="58" text-anchor="middle" class="small">not binding</text>

      <rect x="394" y="0" width="150" height="82" rx="20" fill="#fff3d6" stroke="#efc86c"/>
      <text x="469" y="34" text-anchor="middle" class="label">Gateway</text>
      <text x="469" y="58" text-anchor="middle" class="small">governs the call</text>

      <rect x="560" y="0" width="168" height="82" rx="20" fill="#fff0ec" stroke="#e8b3a4"/>
      <text x="644" y="34" text-anchor="middle" class="label">Destination</text>
      <text x="644" y="58" text-anchor="middle" class="small">governs the operation</text>

      <text x="768" y="36" class="cap" fill="#b0563c">7 OF 7</text>
      <text x="768" y="62" class="small">enforced steps come from here</text>

      <path d="M176 41 H222 M378 41 H388 M544 41 H554" stroke="#b0563c" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>

    <text x="44" y="376" class="small">Borrowed enforcement: the write is governed by rules you did not write and did not choose when you chose the context layer.</text>
  </g>
</svg>
