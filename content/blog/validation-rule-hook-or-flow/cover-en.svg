<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Validation rule, hook, or flow? Where a business rule lives in an AI-written app: the bundled CRM on @objectstack/cli 17.7.0 declares seven rules in three homes, five validation rules, one hook and one flow, and a flow reviews as data while a hook reviews as code">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em;fill:#2a7468}
      .title{font-size:52px;font-weight:800}
      .lead{font-size:19px;fill:#3f554f}
      .num{font-size:44px;font-weight:800;fill:#2a7468}
      .label{font-size:19px;font-weight:760}
      .small{font-size:13px;fill:#5e716b}
      .tag{font-size:12px;font-weight:780;letter-spacing:.06em}
      .foot{font-size:13px;fill:#5e716b}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="118" class="eyebrow">WHERE A BUSINESS RULE LIVES</text>
  <text x="78" y="186" class="title">Validation rule,</text>
  <text x="78" y="246" class="title">hook, or flow?</text>
  <text x="78" y="300" class="lead">One CRM, seven rules, three homes.</text>
  <text x="78" y="326" class="lead">A predicate is a rule on the object. A rewrite of the</text>
  <text x="78" y="352" class="lead">pending record is a hook. Everything else is a flow.</text>

  <g transform="translate(78 396)"><rect width="206" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="103" y="23" class="tag" text-anchor="middle" style="fill:#2a7468">FLOW REVIEWS AS DATA</text></g>
  <g transform="translate(294 396)"><rect width="206" height="36" rx="18" fill="#ffffff" stroke="#e6d3b6"/><text x="103" y="23" class="tag" text-anchor="middle" style="fill:#8a6a3a">HOOK REVIEWS AS CODE</text></g>

  <g transform="translate(650 112)" filter="url(#shadow)">
    <rect width="472" height="456" rx="28" fill="#fffefa" stroke="#d8dfd6"/>

    <g transform="translate(28 30)">
      <rect width="416" height="112" rx="16" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="22" y="64" class="num">5</text>
      <text x="76" y="38" class="label">validation rules</text>
      <text x="76" y="64" class="small">a predicate over the one record being written</text>
      <text x="76" y="84" class="small">script · cross_field · state_machine</text>
    </g>

    <g transform="translate(28 158)">
      <rect width="416" height="112" rx="16" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="22" y="64" class="num" style="fill:#8a6a3a">1</text>
      <text x="76" y="38" class="label">hook</text>
      <text x="76" y="64" class="small">rewrites the pending record before it is saved</text>
      <text x="76" y="84" class="small">beforeInsert · beforeUpdate · runs inline</text>
    </g>

    <g transform="translate(28 286)">
      <rect width="416" height="112" rx="16" fill="#ffffff" stroke="#2a7468" stroke-width="1.5"/>
      <text x="22" y="64" class="num">1</text>
      <text x="76" y="38" class="label">flow — the default</text>
      <text x="76" y="64" class="small">pauses, creates records, writes another object</text>
      <text x="76" y="84" class="small">a literal fields map the gate checks as an error</text>
    </g>

    <text x="28" y="420" class="small" style="fill:#2a7468">Seven rules on examples/app-crm, counted at</text>
    <text x="28" y="438" class="small" style="fill:#2a7468">@objectstack/cli 17.7.0 — each in the home the table names.</text>
  </g>

  <text x="78" y="612" class="foot">Same typo in two homes: a flow node fails os validate with exit 1; a hook body gets a warning, or nothing.</text>
</svg>
