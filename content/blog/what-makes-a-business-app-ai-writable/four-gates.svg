<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Agent 与用户之间的四道门禁，画成一条流水线：Agent 写类型化的元数据，然后是类型（严格的 TypeScript 与 Zod，形状错误死在编辑器里）、验证（os validate 拒收悬空绑定、错误的 CEL 谓词和缺失的安全姿态）、审查（人批准一份小而可读的 diff）和治理（运行时在每次调用上强制执行权限与审计）；本次运行的类型错误停在类型门禁，三个元数据错误停在验证门禁；本次的审查是一份 11 个文件、127 行的 git diff，运行时没有启动">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5a70"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b3433a"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1b2a41}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#4a5a70}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em}
      .name{font-size:17px;font-weight:780}
      .where{font-size:13px;fill:#4a5a70}
      .small{font-size:13px;fill:#5b6a7c}
      .stop{font-size:13px;fill:#1b2a41}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600}
      .label{font-size:15px;font-weight:760}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fbfcfe"/>

  <text x="40" y="50" class="h">Agent 与用户之间的四道门禁</text>
  <text x="40" y="78" class="note">每道门禁拦住什么，是 README 的原话；每道门禁处停下了什么，来自 17.7.0 上的一次运行。</text>

  <!-- the agent -->
  <g transform="translate(40 132)">
    <rect width="138" height="226" rx="16" fill="#ffffff" stroke="#c9d0dd"/>
    <text x="16" y="30" class="cap" style="fill:#5b6a7c">AGENT</text>
    <text x="16" y="62" class="label">写类型化的</text>
    <text x="16" y="84" class="label">元数据</text>
    <text x="16" y="116" class="small">不是代码库：</text>
    <text x="16" y="134" class="small">对象、动作、</text>
    <text x="16" y="152" class="small">视图、权限</text>
    <text x="16" y="186" class="small">并且</text>
    <text x="16" y="204" class="small">会犯错</text>
  </g>

  <!-- arrows along the pipeline -->
  <line x1="180" y1="245" x2="196" y2="245" stroke="#4a5a70" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="398" y1="245" x2="428" y2="245" stroke="#4a5a70" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="630" y1="245" x2="660" y2="245" stroke="#4a5a70" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="862" y1="245" x2="892" y2="245" stroke="#4a5a70" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1094" y1="245" x2="1124" y2="245" stroke="#4a5a70" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1132" y="240" class="label">你的</text>
  <text x="1132" y="258" class="label">用户</text>

  <!-- gate 1 -->
  <g transform="translate(200 120)">
    <rect width="196" height="250" rx="18" fill="#e8edfb" stroke="#8ea3e6" stroke-width="2"/>
    <text x="18" y="30" class="cap" style="fill:#2f4bb8">第一道</text>
    <text x="18" y="60" class="name">类型 · Typed</text>
    <text x="18" y="82" class="where">在编辑器里，几秒之内</text>
    <text x="18" y="112" class="cap" style="fill:#2f4bb8">拦住</text>
    <text x="18" y="134" class="stop">形状错误——</text>
    <text x="18" y="152" class="stop">严格的 TypeScript</text>
    <text x="18" y="170" class="stop">加上 Zod schema</text>
    <text x="18" y="206" class="small">代价：Agent 的</text>
    <text x="18" y="224" class="small">一秒钟</text>
  </g>

  <!-- gate 2 -->
  <g transform="translate(432 120)">
    <rect width="196" height="250" rx="18" fill="#e6f4f1" stroke="#8fcdc0" stroke-width="2"/>
    <text x="18" y="30" class="cap" style="fill:#176a5c">第二道</text>
    <text x="18" y="60" class="name">验证 · Validated</text>
    <text x="18" y="82" class="where">os validate，49 条规则</text>
    <text x="18" y="112" class="cap" style="fill:#176a5c">拦住</text>
    <text x="18" y="134" class="stop">能过类型检查、却会</text>
    <text x="18" y="152" class="stop">静默失败的：悬空绑定、</text>
    <text x="18" y="170" class="stop">错误的 CEL 谓词、</text>
    <text x="18" y="188" class="stop">缺失的安全姿态</text>
    <text x="18" y="224" class="small">代价：Agent 的一轮</text>
  </g>

  <!-- gate 3 -->
  <g transform="translate(664 120)">
    <rect width="196" height="250" rx="18" fill="#fdf1e3" stroke="#e9c48f" stroke-width="2"/>
    <text x="18" y="30" class="cap" style="fill:#8a4f0c">第三道</text>
    <text x="18" y="60" class="name">审查 · Reviewed</text>
    <text x="18" y="82" class="where">由人来读一份 diff</text>
    <text x="18" y="112" class="cap" style="fill:#8a4f0c">拦住</text>
    <text x="18" y="134" class="stop">良构、但未必是</text>
    <text x="18" y="152" class="stop">你想要的——一份</text>
    <text x="18" y="170" class="stop">小 diff，不是生成</text>
    <text x="18" y="188" class="stop">出来的胶水代码</text>
    <text x="18" y="224" class="small">代价：人的几分钟</text>
  </g>

  <!-- gate 4 -->
  <g transform="translate(896 120)">
    <rect width="196" height="250" rx="18" fill="#eeeef5" stroke="#b9b9d3" stroke-width="2"/>
    <text x="18" y="30" class="cap" style="fill:#4b4a7a">第四道</text>
    <text x="18" y="60" class="name">治理 · Governed</text>
    <text x="18" y="82" class="where">运行时，每一次调用</text>
    <text x="18" y="112" class="cap" style="fill:#4b4a7a">兜住</text>
    <text x="18" y="134" class="stop">仍然上线了的错误应用：</text>
    <text x="18" y="152" class="stop">权限与审计被强制执行，</text>
    <text x="18" y="170" class="stop">所以它留在围栏之内</text>
    <text x="18" y="206" class="small">代价：一起被控制住</text>
    <text x="18" y="224" class="small">的事故</text>
  </g>

  <!-- what stopped where -->
  <text x="40" y="412" class="cap" style="fill:#5b6a7c">本次运行里，每道门禁处停下了什么</text>

  <line x1="298" y1="376" x2="298" y2="420" stroke="#b3433a" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#arrRed)"/>
  <g transform="translate(200 426)">
    <rect width="196" height="34" rx="10" fill="#fff5f4" stroke="#efc6c2"/>
    <text x="12" y="22" class="mono" style="fill:#b3433a">required: 'yes'  → TS2322</text>
  </g>

  <line x1="530" y1="376" x2="530" y2="420" stroke="#b3433a" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#arrRed)"/>
  <g transform="translate(432 426)">
    <rect width="196" height="34" rx="10" fill="#fff5f4" stroke="#efc6c2"/>
    <text x="12" y="22" class="mono" style="fill:#b3433a">status != "resolved"</text>
  </g>
  <g transform="translate(432 468)">
    <rect width="196" height="34" rx="10" fill="#fff5f4" stroke="#efc6c2"/>
    <text x="12" y="22" class="mono" style="fill:#b3433a">rowActions: ['resolve']</text>
  </g>
  <g transform="translate(432 510)">
    <rect width="196" height="34" rx="10" fill="#fff5f4" stroke="#efc6c2"/>
    <text x="12" y="22" class="mono" style="fill:#b3433a">(no sharingModel)</text>
  </g>

  <g transform="translate(664 426)">
    <rect width="196" height="52" rx="10" fill="#ffffff" stroke="#e9c48f"/>
    <text x="12" y="22" class="small">本次：一份 git diff，</text>
    <text x="12" y="40" class="small">11 个文件、127 行</text>
  </g>

  <g transform="translate(896 426)">
    <rect width="196" height="52" rx="10" fill="#ffffff" stroke="#b9b9d3"/>
    <text x="12" y="22" class="small">本次未启动：</text>
    <text x="12" y="40" class="small">os validate 不起服务</text>
  </g>

  <text x="40" y="596" class="note">四道门禁都抓不住的：应用是不是你想要的。文档说得很直白——良构不等于正确。</text>
  <text x="40" y="618" class="small">来源：ObjectStack README「Why the mistakes don't ship」一节；Validating Metadata 文档页；17.7.0 上一次 npm run validate 运行。</text>
</svg>
