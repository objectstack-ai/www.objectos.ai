<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="自然语言生成应用元数据链路">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#edf8f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1f3634" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.title{font-size:34px;font-weight:780}.node{font-size:18px;font-weight:720}.tiny{font-size:15px;fill:#5c746b}.invert{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="90" y="74" class="title">从一句话到可运行应用</text>
  <text x="90" y="108" class="tiny">AI Builder 应该生成应用规格，而不是只生成页面</text>

  <g transform="translate(88 160)" filter="url(#shadow)">
    <rect width="240" height="120" rx="24" fill="#173a36"/>
    <text x="34" y="48" class="invert" font-size="22" font-weight="760">自然语言需求</text>
    <text x="34" y="78" class="soft" font-size="15">“搭建供应商风险应用”</text>
  </g>

  <g transform="translate(418 108)" filter="url(#shadow)">
    <rect width="318" height="410" rx="28" fill="#fffefa" stroke="#d8e0d8"/>
    <text x="34" y="48" class="node">应用规格草案</text>
    <g transform="translate(34 82)">
      <g fill="#eef8f3" stroke="#cad9d1">
        <rect width="250" height="38" rx="12"/><rect y="52" width="250" height="38" rx="12"/>
        <rect y="104" width="250" height="38" rx="12"/><rect y="156" width="250" height="38" rx="12"/>
        <rect y="208" width="250" height="38" rx="12"/><rect y="260" width="250" height="38" rx="12"/>
      </g>
      <text x="18" y="25" class="tiny">对象：supplier / quotation</text>
      <text x="18" y="77" class="tiny">字段：资质、金额、风险</text>
      <text x="18" y="129" class="tiny">关系：订单、交付、质量</text>
      <text x="18" y="181" class="tiny">视图：高风险 / 待审批</text>
      <text x="18" y="233" class="tiny">权限：采购、质量、经理</text>
      <text x="18" y="285" class="tiny">Agent 工具：查询、解释、发起审批</text>
    </g>
  </g>

  <g transform="translate(838 160)" filter="url(#shadow)">
    <rect width="270" height="248" rx="28" fill="#173a36"/>
    <text x="34" y="48" class="invert" font-size="22" font-weight="760">运行时</text>
    <g transform="translate(44 82)" fill="none" stroke="#f2c66d" stroke-width="5" stroke-linecap="round">
      <path d="M90 0 A90 90 0 1 1 89 0"/>
      <path d="M90 0 L112 20"/>
    </g>
    <text x="60" y="144" class="invert" font-size="20" font-weight="720">UI · API · 流程</text>
    <text x="76" y="176" class="soft" font-size="16">Agent · 审计</text>
  </g>

  <g stroke="#2a7468" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M342 220 H392"/><path d="M376 204 L396 220 L376 236"/>
    <path d="M756 292 H818"/><path d="M802 276 L822 292 L802 308"/>
  </g>
</svg>
