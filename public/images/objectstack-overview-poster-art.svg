<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" aria-hidden="true">
  <!-- Artwork only. The poster's words are HTML laid over it by
       src/components/VideoEmbed.astro, so they are localized and stay
       legible at phone width; the frame's accessible name is its play label. -->
  <defs>
    <linearGradient id="poster-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="52%" stop-color="#10241f"/>
      <stop offset="100%" stop-color="#16213b"/>
    </linearGradient>
    <linearGradient id="poster-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#poster-bg)"/>
  <circle cx="1240" cy="250" r="440" fill="url(#poster-glow)"/>

  <!-- the same faint grid the article covers use -->
  <g opacity=".1" stroke="#94a3b8" stroke-width="1">
    <path d="M0 180H1600M0 360H1600M0 540H1600M0 720H1600"/>
    <path d="M200 0V900M500 0V900M800 0V900M1100 0V900M1400 0V900"/>
  </g>

  <!-- layered-object mark, echoing the site logo -->
  <g transform="translate(1290 118) scale(3.1)" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".85">
    <path d="M12 2 2 7l10 5 10-5-10-5Z"/>
    <path d="m2 17 10 5 10-5"/>
    <path d="m2 12 10 5 10-5"/>
  </g>
</svg>
