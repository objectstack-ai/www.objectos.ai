<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="同一份列表，不同的答案。Sam 的 Agent 带着提交人的 API 密钥，Ada 的 Agent 带着审批人的 API 密钥，连接同一个 /api/v1/mcp 端点，拿到同样的十二个工具。运行时在每一次调用上解析调用者的 ExecutionContext，施加 RBAC、行级安全、字段级安全和动作门禁，所以同样的工具调用得到不同的答案：create_record 为 Sam 创建；query_records 各一行，Sam 看自己的，Ada 看所有人的；list_actions 对 Sam 为空，对 Ada 是 approve_claim；run_action 对 Sam 拒绝，对 Ada 批准；delete_record 对 Sam 拒绝；get_record 两人都可读。">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3730a3"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1e293b}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5b6478}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#3730a3}
      .label{font-size:16px;font-weight:760}
      .small{font-size:13px;fill:#5b6478}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600}
      .cell{font-size:13px;font-weight:600}
      .no{fill:#b91c1c}
      .ok{fill:#166534}
      .dim{fill:#5b6478}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fbfbfe"/>

  <text x="60" y="52" class="h">同一份列表，不同的答案</text>
  <text x="60" y="80" class="note">两个 Agent 拿到同样的十二个工具。权限决定在每一次调用上做出，以出示密钥的那个用户的身份。</text>

  <g transform="translate(60 118)">
    <rect width="250" height="96" rx="16" fill="#fef2f2" stroke="#f3c2c2" stroke-width="1.5"/>
    <text x="20" y="32" class="cap" style="fill:#b91c1c">SAM 的 AGENT</text>
    <text x="20" y="58" class="label">提交人密钥</text>
    <text x="20" y="80" class="small">读取、创建、编辑自己的报销单</text>
  </g>
  <g transform="translate(60 232)">
    <rect width="250" height="96" rx="16" fill="#f0fdf4" stroke="#bfe3c8" stroke-width="1.5"/>
    <text x="20" y="32" class="cap" style="fill:#166534">ADA 的 AGENT</text>
    <text x="20" y="58" class="label">审批人密钥</text>
    <text x="20" y="80" class="small">所有报销单 · approve_claims</text>
  </g>

  <line x1="314" y1="166" x2="396" y2="196" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="314" y1="280" x2="396" y2="250" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>

  <g transform="translate(402 118)">
    <rect width="330" height="210" rx="20" fill="#eef0fa" stroke="#3730a3" stroke-width="2"/>
    <text x="22" y="34" class="cap">一个端点 · /api/v1/mcp</text>
    <text x="22" y="64" class="label">tools/list：12 个，人人相同</text>
    <text x="22" y="86" class="mono" style="fill:#3f4a63">list_objects · describe_object</text>
    <text x="22" y="104" class="mono" style="fill:#3f4a63">query_records · get_record · …</text>
    <text x="22" y="122" class="mono" style="fill:#3f4a63">list_actions · run_action · resume_run</text>
    <text x="22" y="154" class="label">每次调用，以调用者身份：</text>
    <text x="22" y="176" class="small">ExecutionContext → RBAC · RLS · FLS</text>
    <text x="22" y="194" class="small">→ ai.exposed → requiredPermissions</text>
  </g>

  <line x1="736" y1="223" x2="812" y2="223" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="774" y="212" class="small" text-anchor="middle">答案</text>

  <g transform="translate(818 118)">
    <rect width="322" height="210" rx="20" fill="#ffffff" stroke="#d9dcec" stroke-width="1.5"/>
    <text x="22" y="34" class="cap">这次运行的数字</text>
    <text x="22" y="72" class="label">12 个工具 · 两人完全相同</text>
    <text x="22" y="104" class="label">1 个动作 · 由作者选入</text>
    <text x="22" y="136" class="label">3 次拒绝 · 每次都在调用上</text>
    <text x="22" y="168" class="small">没有一个工具定义是手写的；</text>
    <text x="22" y="186" class="small">拒绝以工具结果返回，HTTP 200</text>
  </g>

  <g transform="translate(60 362)">
    <rect width="1080" height="300" rx="20" fill="#ffffff" stroke="#d9dcec" stroke-width="1.5"/>
    <rect x="0" y="22" width="1080" height="22" fill="#eef0fa"/>
    <rect x="0" y="0" width="1080" height="44" rx="20" fill="#eef0fa"/>
    <text x="22" y="29" class="cap">工具调用</text>
    <text x="330" y="29" class="cap" style="fill:#b91c1c">以 SAM 身份</text>
    <text x="600" y="29" class="cap" style="fill:#166534">以 ADA 身份</text>
    <text x="860" y="29" class="cap">由谁决定</text>

    <g transform="translate(0 44)">
      <text x="22" y="26" class="mono">create_record</text>
      <text x="330" y="26" class="cell ok">已创建 · owner_id = Sam</text>
      <text x="600" y="26" class="cell dim">未尝试</text>
      <text x="860" y="26" class="small">allowCreate</text>
    </g>
    <line x1="14" y1="80" x2="1066" y2="80" stroke="#eceef7"/>
    <g transform="translate(0 80)">
      <text x="22" y="26" class="mono">query_records</text>
      <text x="330" y="26" class="cell ok">1 行 · 他自己的</text>
      <text x="600" y="26" class="cell ok">1 行 · 所有人的</text>
      <text x="860" y="26" class="small">private OWD + viewAllRecords</text>
    </g>
    <line x1="14" y1="116" x2="1066" y2="116" stroke="#eceef7"/>
    <g transform="translate(0 116)">
      <text x="22" y="26" class="mono">list_actions</text>
      <text x="330" y="26" class="cell dim">无</text>
      <text x="600" y="26" class="cell ok">approve_claim</text>
      <text x="860" y="26" class="small">ai.exposed → requiredPermissions</text>
    </g>
    <line x1="14" y1="152" x2="1066" y2="152" stroke="#eceef7"/>
    <g transform="translate(0 152)">
      <text x="22" y="26" class="mono">run_action approve_claim</text>
      <text x="330" y="26" class="cell no">拒绝 · 缺少能力</text>
      <text x="600" y="26" class="cell ok">status: "approved"</text>
      <text x="860" y="26" class="small">approve_claims，在调用时</text>
    </g>
    <line x1="14" y1="188" x2="1066" y2="188" stroke="#eceef7"/>
    <g transform="translate(0 188)">
      <text x="22" y="26" class="mono">delete_record</text>
      <text x="330" y="26" class="cell no">拒绝 · 无权限</text>
      <text x="600" y="26" class="cell dim">未尝试</text>
      <text x="860" y="26" class="small">allowDelete: false</text>
    </g>
    <line x1="14" y1="224" x2="1066" y2="224" stroke="#eceef7"/>
    <g transform="translate(0 224)">
      <text x="22" y="26" class="mono">get_record</text>
      <text x="330" y="26" class="cell ok">他的记录 · 已批准</text>
      <text x="600" y="26" class="cell ok">该记录</text>
      <text x="860" y="26" class="small">RLS 之下的所有权</text>
    </g>
    <text x="22" y="284" class="small">ObjectStack 17.7.0 上一次运行的真实答案；「由谁决定」一列从不写 MCP，因为工具面不添加任何自己的授权。</text>
  </g>
</svg>
