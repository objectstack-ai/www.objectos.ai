<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="一道公开的门，只有五个字段宽：v17 起匿名访问数据一律拒绝；公开表单的授权从表单自身的声明推导。五个声明字段穿过门进入 crm_lead 行，status、owner_id、organization_id 被墙挡回，匿名读取一律 401。">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2a7468"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c2410c"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#173a36}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em;fill:#2a7468}
      .title{font-size:54px;font-weight:800}
      .lead{font-size:19px;fill:#3f554f}
      .chip{font-size:14px;font-weight:760;fill:#2a7468}
      .chipred{font-size:14px;font-weight:760;fill:#c2410c}
      .label{font-size:17px;font-weight:760}
      .small{font-size:13px;fill:#657872}
      .mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;fill:#173a36}
      .monosm{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#3f554f}
      .big{font-size:30px;font-weight:800;fill:#c2410c}
      .foot{font-size:13px;fill:#657872}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="118" class="eyebrow">OBJECTSTACK 17.7.0 公开表单</text>
  <text x="78" y="186" class="title">一道公开的门，</text>
  <text x="78" y="248" class="title">五个字段宽。</text>
  <text x="78" y="300" class="lead">v17 起，匿名访问对象数据一律拒绝。</text>
  <text x="78" y="326" class="lead">公开表单的授权从表单自身的声明推导：</text>
  <text x="78" y="352" class="lead">创建一行，读回这一行，仅此而已。</text>

  <g transform="translate(78 404)"><rect width="130" height="36" rx="18" fill="#ffffff" stroke="#cfe0d9"/><text x="65" y="23" text-anchor="middle" class="chip">201 已创建</text></g>
  <g transform="translate(220 404)"><rect width="170" height="36" rx="18" fill="#ffffff" stroke="#cfe0d9"/><text x="85" y="23" text-anchor="middle" class="chip">每次读取都 401</text></g>
  <g transform="translate(402 404)"><rect width="190" height="36" rx="18" fill="#ffffff" stroke="#cfe0d9"/><text x="95" y="23" text-anchor="middle" class="chip">撤回后 404</text></g>

  <text x="78" y="618" class="foot">实测于 examples/app-crm 的 web_to_lead 表单，@objectstack/cli 17.7.0</text>

  <g transform="translate(640 90)">
    <rect width="490" height="500" rx="24" fill="#ffffff" stroke="#d5e4de" filter="url(#shadow)"/>
    <text x="28" y="40" class="label">运行时眼中的这道门</text>
    <text x="28" y="78" class="small">匿名访客发送</text>

    <rect x="250" y="60" width="14" height="410" rx="4" fill="#173a36"/>
    <rect x="248" y="96" width="18" height="204" fill="#ffffff"/>
    <rect x="238" y="88" width="38" height="220" rx="8" fill="none" stroke="#2a7468" stroke-width="3"/>

    <g transform="translate(30 100)"><rect width="180" height="30" rx="15" fill="#e6f3ee" stroke="#2a7468"/><text x="14" y="20" class="mono">name</text></g>
    <g transform="translate(30 144)"><rect width="180" height="30" rx="15" fill="#e6f3ee" stroke="#2a7468"/><text x="14" y="20" class="mono">email</text></g>
    <g transform="translate(30 188)"><rect width="180" height="30" rx="15" fill="#e6f3ee" stroke="#2a7468"/><text x="14" y="20" class="mono">company</text></g>
    <g transform="translate(30 232)"><rect width="180" height="30" rx="15" fill="#e6f3ee" stroke="#2a7468"/><text x="14" y="20" class="mono">phone</text></g>
    <g transform="translate(30 276)"><rect width="180" height="30" rx="15" fill="#e6f3ee" stroke="#2a7468"/><text x="14" y="20" class="mono">title</text></g>
    <line x1="214" y1="115" x2="296" y2="115" stroke="#2a7468" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="214" y1="159" x2="296" y2="159" stroke="#2a7468" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="214" y1="203" x2="296" y2="203" stroke="#2a7468" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="214" y1="247" x2="296" y2="247" stroke="#2a7468" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="214" y1="291" x2="296" y2="291" stroke="#2a7468" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(30 320)"><rect width="180" height="30" rx="15" fill="#fff2e6" stroke="#c2410c"/><text x="14" y="20" class="mono">status: converted</text></g>
    <g transform="translate(30 364)"><rect width="180" height="30" rx="15" fill="#fff2e6" stroke="#c2410c"/><text x="14" y="20" class="mono">owner_id</text></g>
    <g transform="translate(30 408)"><rect width="180" height="30" rx="15" fill="#fff2e6" stroke="#c2410c"/><text x="14" y="20" class="mono">organization_id</text></g>
    <line x1="214" y1="335" x2="243" y2="335" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-red)"/>
    <line x1="214" y1="379" x2="243" y2="379" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-red)"/>
    <line x1="214" y1="423" x2="243" y2="423" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-red)"/>
    <g stroke="#c2410c" stroke-width="3" stroke-linecap="round">
      <line x1="251" y1="329" x2="263" y2="341"/><line x1="263" y1="329" x2="251" y2="341"/>
      <line x1="251" y1="373" x2="263" y2="385"/><line x1="263" y1="373" x2="251" y2="385"/>
      <line x1="251" y1="417" x2="263" y2="429"/><line x1="263" y1="417" x2="251" y2="429"/>
    </g>

    <rect x="290" y="96" width="176" height="204" rx="12" fill="#f3f8f6" stroke="#d5e4de"/>
    <text x="304" y="120" class="chip">crm_lead 数据行</text>
    <text x="304" y="146" class="monosm">name     Mallory</text>
    <text x="304" y="168" class="monosm">email    mallory@…</text>
    <text x="304" y="190" class="monosm">status   new</text>
    <text x="304" y="212" class="monosm">lead_score   0</text>
    <text x="304" y="234" class="monosm">owner_id   null</text>
    <text x="304" y="256" class="monosm">organization_id</text>
    <text x="304" y="278" class="small">  由服务端盖章</text>

    <rect x="290" y="330" width="180" height="120" rx="12" fill="#fff2e6" stroke="#c2410c"/>
    <text x="380" y="358" text-anchor="middle" class="monosm" style="font-size:11px">GET /api/v1/data/crm_lead</text>
    <text x="380" y="402" text-anchor="middle" class="big">401</text>
    <text x="380" y="430" text-anchor="middle" class="chipred">UNAUTHENTICATED</text>

    <text x="257" y="492" text-anchor="middle" class="small">POST /api/v1/forms/contact-us/submit</text>
  </g>
</svg>
