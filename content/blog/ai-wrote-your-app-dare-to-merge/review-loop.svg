<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="AI 写、人审、运行时治理、agent 在边界内执行的闭环">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#24342f" flood-opacity=".12"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .cap{font-size:14px;fill:#5d736b}.t{font-size:16px;font-weight:700}.s{font-size:13px;fill:#5d736b}
    </style>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="48" y="46" font-size="21" font-weight="760">写代码被自动化之后，留给人的是"选择"和"审查"</text>
  <text x="48" y="74" class="cap">机器写、人审小 diff、运行时托底——人始终是那个签字担责的人</text>

  <g transform="translate(60 110)" filter="url(#sh)"><rect width="200" height="120" rx="16" fill="#eef7f1"/>
    <text x="20" y="36" class="t">① AI 写</text>
    <text x="20" y="64" class="s">把需求生成为</text><text x="20" y="84" class="s">声明式元数据</text>
    <text x="20" y="104" class="s">（几十行，不是几千行）</text></g>
  <g transform="translate(300 110)" filter="url(#sh)"><rect width="200" height="120" rx="16" fill="#fff3df"/>
    <text x="20" y="36" class="t" fill="#9a6212">② 人审</text>
    <text x="20" y="64" class="s">逐行读懂这份 diff</text><text x="20" y="84" class="s">改了哪个对象、</text>
    <text x="20" y="104" class="s">动了哪条权限</text></g>
  <g transform="translate(540 110)" filter="url(#sh)"><rect width="200" height="120" rx="16" fill="#22433d"/>
    <text x="20" y="36" class="t" fill="#eafff6">③ 运行时治</text>
    <text x="20" y="64" class="s" fill="#a9c4ba">强制权限、命中审批、</text><text x="20" y="84" class="s" fill="#a9c4ba">落审计——"该不该做"</text>
    <text x="20" y="104" class="s" fill="#a9c4ba">由引擎结构性回答</text></g>
  <g transform="translate(780 110)" filter="url(#sh)"><rect width="200" height="120" rx="16" fill="#eef7f1"/>
    <text x="20" y="36" class="t">④ agent 执行</text>
    <text x="20" y="64" class="s">同一套受治理工具，</text><text x="20" y="84" class="s">agent 只能在边界内</text>
    <text x="20" y="104" class="s">读写与触发动作</text></g>

  <g stroke="#e8b04b" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M260 170 h40"/><path d="M500 170 h40"/><path d="M740 170 h40"/>
  </g>
  <path d="M880 230 v40 q0 20 -20 20 H 80 q-20 0 -20 -20 v-40" stroke="#7fae9f" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
  <text x="500" y="318" text-anchor="middle" class="cap" fill="#5d736b">下一次需求变更，回到 ①——而每一轮，diff 始终小到能审、动作始终被治理</text>
</svg>
