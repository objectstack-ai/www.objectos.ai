<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="三家巨头各自封闭的企业本体，与一份你能带走的开放定义">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:15px}.chip{font-size:16px;font-weight:650}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="78" font-size="34" font-weight="780">巨头都在抢做企业本体</text>
  <text x="96" y="113" class="tiny">同一个判断——AI 进企业要有业务语义层——三家给了三个封闭的答案</text>

  <!-- Left: three locked vendor ontologies -->
  <g transform="translate(86 168)">
    <text x="0" y="-6" class="soft">各自平台里的本体</text>
    <g filter="url(#shadow)">
      <rect width="420" height="118" rx="16" fill="#22433d"/>
      <text x="28" y="54" class="chip invert">Palantir Foundry · Ontology</text>
      <g transform="translate(352 40)"><rect y="14" width="40" height="32" rx="7" fill="#e8b04b"/><path d="M7 16 v-5 a13 13 0 0 1 26 0 v5" fill="none" stroke="#e8b04b" stroke-width="7"/></g>
      <text x="28" y="88" class="soft" style="fill:#a9c4ba">驻场工程师 · 百万级合同</text>
    </g>
    <g filter="url(#shadow)" transform="translate(0 140)">
      <rect width="420" height="118" rx="16" fill="#2c4a43"/>
      <text x="28" y="54" class="chip invert">Microsoft Fabric IQ</text>
      <g transform="translate(352 40)"><rect y="14" width="40" height="32" rx="7" fill="#e8b04b"/><path d="M7 16 v-5 a13 13 0 0 1 26 0 v5" fill="none" stroke="#e8b04b" stroke-width="7"/></g>
      <text x="28" y="88" class="soft" style="fill:#a9c4ba">绑定 OneLake 与 365 生态</text>
    </g>
    <g filter="url(#shadow)" transform="translate(0 280)">
      <rect width="420" height="118" rx="16" fill="#35564f"/>
      <text x="28" y="54" class="chip invert">Google 企业知识图谱</text>
      <g transform="translate(352 40)"><rect y="14" width="40" height="32" rx="7" fill="#e8b04b"/><path d="M7 16 v-5 a13 13 0 0 1 26 0 v5" fill="none" stroke="#e8b04b" stroke-width="7"/></g>
      <text x="28" y="88" class="soft" style="fill:#a9c4ba">绑定 Cloud 与 Vertex 生态</text>
    </g>
  </g>

  <!-- center -->
  <g transform="translate(540 360)">
    <text x="0" y="0" font-size="40" font-weight="800" fill="#e8b04b">?</text>
    <path d="M28 -12 h62" stroke="#e8b04b" stroke-width="6" stroke-linecap="round"/>
    <path d="M82 -24 l16 12 -16 12" fill="none" stroke="#e8b04b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: one open portable definition -->
  <g transform="translate(674 168)" filter="url(#shadow)">
    <rect width="440" height="398" rx="22" fill="#ffffff"/>
    <text x="36" y="52" class="label">你仓库里的一份开放定义</text>
    <text x="36" y="78" class="soft">对象 · 关系 · 权限 · 流程 · API · AI 工具</text>
    <g font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#2c4a43">
      <rect x="36" y="100" width="368" height="92" rx="12" fill="#f0f7f3"/>
      <text x="56" y="128">ObjectSchema.create({</text>
      <text x="76" y="152">name: 'crm_opportunity',</text>
      <text x="76" y="176">fields: { amount, probability }</text>
    </g>
    <g stroke="#7fae9f" stroke-width="2.5" fill="none">
      <path d="M120 192 v40"/><path d="M220 192 v40"/><path d="M320 192 v40"/>
    </g>
    <g font-size="15">
      <rect x="60" y="236" width="120" height="40" rx="20" fill="#22433d"/><text x="86" y="261" class="invert">Agent</text>
      <rect x="200" y="236" width="120" height="40" rx="20" fill="#22433d"/><text x="226" y="261" class="invert">应用</text>
      <rect x="288" y="236" width="116" height="40" rx="20" fill="#22433d"/><text x="312" y="261" class="invert">审计</text>
    </g>
    <text x="36" y="318" class="soft">可 diff · 可迁移 · 任何 agent 都能读懂</text>
    <text x="36" y="356" class="soft">一条命令起步，跑在你自己的服务器上</text>
  </g>
</svg>
