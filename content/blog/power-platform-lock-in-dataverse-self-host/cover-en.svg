<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Dataverse and Azure tradeoffs in Power Platform">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f3f6fb"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#16243f" flood-opacity=".18"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#142540}.title{font-size:46px;font-weight:780}.sub{font-size:20px;fill:#566480}.label{font-size:19px;font-weight:720}.tiny{font-size:14px;fill:#566480}.ok{fill:#1d7a5f}.warn{fill:#b8860b}.danger{fill:#c0392b}.invert{fill:#eaf1ff}.soft{fill:#9fb2d6}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="86" y="96" class="title">The Dataverse tradeoff</text>
  <text x="86" y="134" class="sub">Exports move app metadata — not the data or runtime</text>

  <g transform="translate(86 184)" filter="url(#shadow)">
    <rect width="640" height="412" rx="28" fill="#142540"/>
    <text x="36" y="56" class="invert" font-size="20" font-weight="760">Dataverse (Azure-only)</text>
    <g transform="translate(36 84)">
      <rect width="568" height="150" rx="18" fill="#1d3258"/>
      <text x="22" y="38" class="soft" font-size="15">your business data</text>
      <rect x="22" y="56" width="130" height="70" rx="10" fill="#26406e"/>
      <rect x="166" y="56" width="130" height="70" rx="10" fill="#26406e"/>
      <rect x="310" y="56" width="130" height="70" rx="10" fill="#26406e"/>
      <g transform="translate(470 44)">
        <rect width="76" height="64" rx="12" fill="#e7b14a"/>
        <rect x="24" y="16" width="28" height="26" rx="6" fill="none" stroke="#142540" stroke-width="4"/>
        <circle cx="38" cy="36" r="5" fill="#142540"/>
      </g>
    </g>
    <text x="36" y="280" class="warn" font-size="17" font-weight="720" fill="#e7b14a">~$40/GB/mo to keep it here</text>
    <rect x="36" y="300" width="568" height="44" rx="12" fill="#3a1f1f"/>
    <text x="52" y="328" class="danger" font-size="15" fill="#e8807a">No self-host. No on-prem. No air-gap.</text>
    <text x="36" y="384" class="tiny" fill="#9fb2d6">Leaving means a data migration project, not a download.</text>
  </g>

  <g transform="translate(760 184)" filter="url(#shadow)">
    <rect width="354" height="412" rx="28" fill="#ffffff" stroke="#dde3ec"/>
    <text x="32" y="54" class="label">Portability check</text>
    <rect x="32" y="80" width="290" height="60" rx="14" fill="#e9f6f0"/>
    <text x="48" y="108" class="ok" font-size="16">✓ metadata exports</text>
    <text x="48" y="130" class="tiny">tables, forms, flows</text>
    <rect x="32" y="156" width="290" height="60" rx="14" fill="#fbeeee"/>
    <text x="48" y="184" class="danger" font-size="16">✗ data migration remains</text>
    <text x="48" y="206" class="tiny">Dataverse data is not included</text>
    <rect x="32" y="232" width="290" height="60" rx="14" fill="#fbeeee"/>
    <text x="48" y="260" class="danger" font-size="16">✗ runtime stays on Azure</text>
    <text x="48" y="282" class="tiny">no self-hosted option</text>
    <rect x="32" y="312" width="290" height="64" rx="14" fill="#fbf5e6"/>
    <text x="48" y="340" class="warn" font-size="15" font-weight="700" fill="#9a6b0a">$5 per-app plan retired</text>
    <text x="48" y="362" class="tiny">for new customers, Jan 2 2026</text>
  </g>
</svg>
