<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The architecture of metadata-driven systems: structure, behavior and presentation declared as metadata, from Salesforce through ServiceNow to the ObjectStack protocol">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8faf7"/><stop offset=".55" stop-color="#eef7f2"/><stop offset="1" stop-color="#fff3df"/></linearGradient><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f8b81"/></marker><marker id="ar-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c7a55"/></marker><marker id="ar-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b07a1a"/></marker><marker id="ar-onInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8cdc2"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g transform="translate(0 0)">
    <text x="96" y="76" font-size="16" font-weight="700" fill="#5d736b" text-anchor="start">FROM SALESFORCE TO OBJECTSTACK · JANUARY 2024</text>
    <text x="96" y="158" font-size="52" font-weight="780" fill="#173a36" text-anchor="start">The architecture of</text>
    <text x="96" y="222" font-size="52" font-weight="780" fill="#1c7a55" text-anchor="start">metadata-driven systems</text>
    <rect x="96" y="290" width="700" height="90" rx="16" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <rect x="96" y="290" width="12" height="90" rx="6" fill="#1c7a55"/>
    <text x="132" y="328" font-size="22" font-weight="760" fill="#173a36" text-anchor="start">Presentation</text>
    <text x="132" y="356" font-size="15" font-weight="400" fill="#5d736b" text-anchor="start">forms, lists, dashboards — how data is displayed</text>
    <rect x="96" y="396" width="700" height="90" rx="16" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <rect x="96" y="396" width="12" height="90" rx="6" fill="#8a6412"/>
    <text x="132" y="434" font-size="22" font-weight="760" fill="#173a36" text-anchor="start">Behavior</text>
    <text x="132" y="462" font-size="15" font-weight="400" fill="#5d736b" text-anchor="start">workflows, validations, transformations — how data flows</text>
    <rect x="96" y="502" width="700" height="90" rx="16" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <rect x="96" y="502" width="12" height="90" rx="6" fill="#22433d"/>
    <text x="132" y="540" font-size="22" font-weight="760" fill="#173a36" text-anchor="start">Structure</text>
    <text x="132" y="568" font-size="15" font-weight="400" fill="#5d736b" text-anchor="start">schemas, tables, fields — how data is organized</text>
    <rect x="828" y="290" width="276" height="302" rx="16" fill="#22433d"/>
    <text x="856" y="330" font-size="13" font-weight="700" fill="#a8cdc2" text-anchor="start">The lineage</text>
    <text x="856" y="364" font-size="20" font-weight="760" fill="#eafff6" text-anchor="start">Salesforce</text>
    <text x="856" y="388" font-size="14" font-weight="400" fill="#a8cdc2" text-anchor="start">multi-tenant platform, 2009</text>
    <text x="856" y="414" font-size="16" font-weight="700" fill="#7fd1ad" text-anchor="start">↓</text>
    <text x="856" y="438" font-size="20" font-weight="760" fill="#eafff6" text-anchor="start">ServiceNow</text>
    <text x="856" y="462" font-size="14" font-weight="400" fill="#a8cdc2" text-anchor="start">enterprise automation</text>
    <text x="856" y="488" font-size="16" font-weight="700" fill="#7fd1ad" text-anchor="start">↓</text>
    <text x="856" y="512" font-size="20" font-weight="760" fill="#eafff6" text-anchor="start">ObjectStack</text>
    <text x="856" y="536" font-size="14" font-weight="400" fill="#a8cdc2" text-anchor="start">an open protocol</text>
  </g>
</svg>
