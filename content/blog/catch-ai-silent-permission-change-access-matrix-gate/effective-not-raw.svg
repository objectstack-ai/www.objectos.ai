<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="有效能力，不是原始标志位：权限集上的原始位 allowRead、allowCreate、allowEdit、allowDelete、viewAllRecords、modifyAllRecords 以及读写范围，经过规范里的折叠 objectPermissionGrants——read 等于 allowRead 或 View All 或 Modify All，edit 与 delete 等于各自的位或 Modify All，create 没有超级用户旁路，export 等于 allowExport 且 read——落成矩阵的一行：create、read、edit、delete 是有效位，viewAllRecords 与 modifyAllRecords 是作为上下文保留的原始位，并带着对象的 sharingModel；在 18.2.0 上实测，把这一行的 allowDelete false 换成 modifyAllRecords true，会产生两条漂移行：在 crm_opportunity 上 gains delete 与 gains Modify All Data">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#4b5d56}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em}
      .rule{font-size:13px;font-weight:650}
      .small{font-size:13px;fill:#4b5d56}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600}
      .teal{fill:#2a7468}
      .amber{fill:#8a6a3a}
      .red{fill:#a8432c}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">有效能力，不是原始标志位：矩阵的一行是怎么算出来的</text>
  <text x="60" y="80" class="note">CRUD 位来自规范里的那一次折叠——问它，而不是重写它；两个超级用户列保持原始，作为上下文。</text>

  <!-- 原始位 -->
  <g transform="translate(60 112)">
    <rect width="320" height="300" rx="18" fill="#fdf4e8" stroke="#d9b98c" stroke-width="2"/>
    <text x="20" y="30" class="cap amber">权限集上的原始标志位</text>
    <text x="20" y="62" class="mono">allowRead: true</text>
    <text x="20" y="92" class="mono">allowCreate: true</text>
    <text x="20" y="122" class="mono">allowEdit: true</text>
    <text x="20" y="152" class="mono">allowDelete: false</text>
    <text x="20" y="182" class="mono">viewAllRecords: false</text>
    <text x="20" y="212" class="mono">modifyAllRecords: false</text>
    <text x="20" y="242" class="mono">readScope / writeScope</text>
    <text x="20" y="276" class="small">作者在 sales-positions.ts 里写下的内容</text>
  </g>

  <line x1="384" y1="262" x2="416" y2="262" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 折叠 -->
  <g transform="translate(420 112)">
    <rect width="360" height="300" rx="18" fill="#eef7f2" stroke="#2a7468" stroke-width="2"/>
    <text x="20" y="30" class="cap teal">规范的折叠 · objectPermissionGrants</text>
    <text x="20" y="62" class="rule">read = allowRead ∨ View All ∨ Modify All</text>
    <text x="20" y="88" class="rule">edit = allowEdit ∨ Modify All</text>
    <text x="20" y="114" class="rule">delete = allowDelete ∨ Modify All</text>
    <text x="20" y="140" class="rule">create = allowCreate（没有超级用户旁路）</text>
    <text x="20" y="166" class="rule">export = allowExport ∧ read</text>
    <text x="20" y="204" class="small">这正是执行门在回答 403 之前</text>
    <text x="20" y="222" class="small">问的同一个函数——所以这一行说的是</text>
    <text x="20" y="240" class="small">运行时会怎么做，而不是文件里写了什么。</text>
    <text x="20" y="276" class="small teal">Modify All 从不凭空制造 create 授权。</text>
  </g>

  <line x1="784" y1="262" x2="816" y2="262" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 矩阵的一行 -->
  <g transform="translate(820 112)">
    <rect width="320" height="300" rx="18" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="20" y="30" class="cap teal">矩阵的一行</text>
    <text x="20" y="62" class="mono">"create": true</text>
    <text x="20" y="84" class="mono">"read": true</text>
    <text x="20" y="106" class="mono">"edit": true</text>
    <text x="20" y="128" class="mono">"delete": false</text>
    <text x="20" y="150" class="small teal">有效位——向折叠询问得到</text>
    <text x="20" y="180" class="mono">"viewAllRecords": false</text>
    <text x="20" y="202" class="mono">"modifyAllRecords": false</text>
    <text x="20" y="224" class="small">原始位，保留作上下文</text>
    <text x="20" y="254" class="mono">"sharingModel": "public_read_write"</text>
    <text x="20" y="276" class="small">对象的记录基线（OWD）</text>
  </g>

  <!-- 实测 -->
  <g transform="translate(60 440)">
    <rect width="1080" height="88" rx="18" fill="#fbeeea" stroke="#e5c4bb" stroke-width="1.5"/>
    <text x="20" y="28" class="cap red">在 18.2.0 上实测——改一行，出两行</text>
    <text x="20" y="52" class="small">把 crm_opportunity 这一行的 allowDelete: false 换成 modifyAllRecords: true，没有敲过 delete。os validate 通过；os compile：漂移（2 处变化）</text>
    <text x="20" y="74" class="mono red">• 'crm_sales_user' gains delete on 'crm_opportunity'</text>
    <text x="560" y="74" class="mono red">• 'crm_sales_user' gains Modify All Data on 'crm_opportunity'</text>
  </g>

  <text x="60" y="550" class="small">来源：@objectstack/spec 的 objectPermissionGrants；@objectstack/lint 的 buildAccessMatrix 与 diffAccessMatrix——均在 @objectstack/cli@18.2.0 标签。</text>
</svg>
