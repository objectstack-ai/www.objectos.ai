<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="跨系统自动化流程">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#203a35" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#163b35}.title{font-size:38px;font-weight:780}.lead{font-size:18px;fill:#5f736f}.label{font-size:18px;font-weight:750}.small{font-size:14px;fill:#667a75}.dark{fill:#163b35}.white{fill:#eafff6}.soft{fill:#acd2c8}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="78" y="86" class="title">别让跨系统流程变成脚本堆</text>
  <text x="78" y="124" class="lead">连接器、Webhook 和外部调用也要进入同一条流程</text>
  <g transform="translate(96 166)" filter="url(#shadow)">
    <rect width="1008" height="370" rx="32" fill="#fffefa" stroke="#d8dfd6"/>
    <g transform="translate(58 76)">
      <rect width="170" height="90" rx="22" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="85" y="39" text-anchor="middle" class="label">CRM</text>
      <text x="85" y="64" text-anchor="middle" class="small">客户和商机</text>
    </g>
    <g transform="translate(58 216)">
      <rect width="170" height="90" rx="22" fill="#fff3d6" stroke="#efc86c"/>
      <text x="85" y="39" text-anchor="middle" class="label">ERP</text>
      <text x="85" y="64" text-anchor="middle" class="small">订单和应收</text>
    </g>
    <g transform="translate(400 92)">
      <rect width="220" height="190" rx="28" class="dark"/>
      <text x="110" y="58" text-anchor="middle" class="white" font-size="20" font-weight="780">Automation</text>
      <text x="110" y="98" text-anchor="middle" class="soft" font-size="14">判断</text>
      <text x="110" y="130" text-anchor="middle" class="soft" font-size="14">调用</text>
      <text x="110" y="162" text-anchor="middle" class="soft" font-size="14">补救</text>
    </g>
    <g transform="translate(780 76)">
      <rect width="170" height="90" rx="22" fill="#edf2ff" stroke="#bdc8ee"/>
      <text x="85" y="39" text-anchor="middle" class="label">合同系统</text>
      <text x="85" y="64" text-anchor="middle" class="small">签署和续约</text>
    </g>
    <g transform="translate(780 216)">
      <rect width="170" height="90" rx="22" fill="#fff0ec" stroke="#e6b3a9"/>
      <text x="85" y="39" text-anchor="middle" class="label">外部服务</text>
      <text x="85" y="64" text-anchor="middle" class="small">风控和通知</text>
    </g>
    <path d="M232 121 H396 M232 261 H396 M624 121 H776 M624 261 H776" stroke="#2a7468" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
