<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A green automation run that read 30 records and changed nothing, next to the three answers an automation engine owes you">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}
      .soft{fill:#5d736b;font-size:14px}.mono{font-family:ui-monospace,Menlo,monospace}
      .warn{font-size:14px;font-weight:650;fill:#9a3b1f}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="80" font-size="33" font-weight="780">The run is green. It changed nothing.</text>
  <text x="96" y="115" class="tiny">Firing on schedule is not the same as doing the work — an engine has to say what it did.</text>

  <!-- the run row -->
  <g transform="translate(96 158)" filter="url(#shadow)">
    <rect width="1008" height="118" rx="18" fill="#fffefa" stroke="#dbe5df"/>
    <g transform="translate(30 34)">
      <rect width="112" height="34" rx="10" fill="#1f6b4a"/>
      <text x="56" y="23" text-anchor="middle" class="invert" font-size="14" font-weight="700">completed</text>
    </g>
    <text x="168" y="52" class="mono" font-size="16" font-weight="700">renewal_risk_escalation</text>
    <text x="168" y="76" class="soft mono">trigger: record-after-update &#183; duration: 412 ms &#183; runAs: user</text>
    <g transform="translate(640 30)">
      <rect width="150" height="58" rx="12" fill="#eef7f1"/>
      <text x="75" y="26" text-anchor="middle" class="soft mono">selected</text>
      <text x="75" y="49" text-anchor="middle" font-size="21" font-weight="780">30</text>
    </g>
    <g transform="translate(806 30)">
      <rect width="150" height="58" rx="12" fill="#fbece6"/>
      <text x="75" y="26" text-anchor="middle" class="soft mono" style="fill:#9a3b1f">acted</text>
      <text x="75" y="49" text-anchor="middle" font-size="21" font-weight="780" fill="#9a3b1f">0</text>
    </g>
  </g>

  <text x="96" y="316" class="warn mono">selected &gt; 0 AND acted = 0 AND unmeasured = 0 &#8594; the flow ran and nudged nobody</text>

  <!-- three answers -->
  <g transform="translate(96 352)" filter="url(#shadow)">
    <rect width="320" height="186" rx="18" fill="#22433d"/>
    <text x="28" y="46" class="label invert">1. Decide</text>
    <text x="28" y="78" class="soft" style="fill:#a9c4ba">Which branch opened,</text>
    <text x="28" y="100" class="soft" style="fill:#a9c4ba">and which gate closed.</text>
    <text x="28" y="146" class="mono invert" font-size="13">skippedBy: { nodeId, edgeId }</text>
  </g>
  <g transform="translate(440 352)" filter="url(#shadow)">
    <rect width="320" height="186" rx="18" fill="#fff6e4"/>
    <text x="28" y="46" class="label">2. Wait</text>
    <text x="28" y="78" class="soft">Parked for a person,</text>
    <text x="28" y="100" class="soft">through restarts and deploys.</text>
    <text x="28" y="146" class="mono" font-size="13">status: paused</text>
  </g>
  <g transform="translate(784 352)" filter="url(#shadow)">
    <rect width="320" height="186" rx="18" fill="#eef7f1"/>
    <text x="28" y="46" class="label">3. Prove</text>
    <text x="28" y="78" class="soft">Per-step input, output,</text>
    <text x="28" y="100" class="soft">duration, error, counters.</text>
    <text x="28" y="146" class="mono" font-size="13">ExecutionLog + summary</text>
  </g>

  <text x="96" y="590" class="tiny">ObjectOS automation: your agent writes the flow as metadata &#183; the runtime decides, waits, and leaves the receipt</text>
</svg>
