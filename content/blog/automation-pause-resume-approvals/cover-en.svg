<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Anything can pause; resuming safely is the hard part — a parked run and the resume door">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#263d35" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .title{font-size:36px;font-weight:780}.lead{font-size:18px;fill:#60746f}
      .label{font-size:19px;font-weight:750}.small{font-size:14px;fill:#647872}
      .white{fill:#eafff6}.soft{fill:#a8cdc2}
      .mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="78" y="84" class="title">Anything can pause. Resuming is the hard part.</text>
  <text x="78" y="124" class="lead">Every durable pause opens a door into the middle of a running process — the question is who may open it.</text>

  <g transform="translate(78 168)" filter="url(#shadow)">
    <rect width="1044" height="380" rx="32" fill="#fffefa" stroke="#d8dfd6"/>

    <g transform="translate(48 90)">
      <rect width="150" height="92" rx="22" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="75" y="40" text-anchor="middle" class="label">Start</text>
      <text x="75" y="65" text-anchor="middle" class="small">Supplier onboarded</text>
    </g>
    <g transform="translate(232 90)">
      <rect width="150" height="92" rx="22" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="75" y="40" text-anchor="middle" class="label">Check</text>
      <text x="75" y="65" text-anchor="middle" class="small">Docs complete?</text>
    </g>
    <g transform="translate(416 90)">
      <rect width="176" height="92" rx="22" fill="#173a36"/>
      <text x="88" y="40" text-anchor="middle" class="white" font-size="19" font-weight="760">Paused</text>
      <text x="88" y="65" text-anchor="middle" class="soft" font-size="14">day 6 of the wait</text>
    </g>
    <g transform="translate(628 90)">
      <rect width="176" height="92" rx="22" fill="#fff3d6" stroke="#efc86c"/>
      <text x="88" y="40" text-anchor="middle" class="label">Resume door</text>
      <text x="88" y="65" text-anchor="middle" class="small">who may end the wait</text>
    </g>
    <g transform="translate(840 90)">
      <rect width="156" height="92" rx="22" fill="#edf2ff" stroke="#bdc8ee"/>
      <text x="78" y="40" text-anchor="middle" class="label">Continue</text>
      <text x="78" y="65" text-anchor="middle" class="small">same run, same state</text>
    </g>

    <path d="M198 136 H228 M382 136 H412 M592 136 H624 M804 136 H836" stroke="#2a7468" stroke-width="5" stroke-linecap="round"/>

    <path d="M504 186 V222" stroke="#8fa39c" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 7"/>
    <path d="M716 186 C716 206 750 206 750 222" fill="none" stroke="#8fa39c" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 7"/>

    <g transform="translate(389 226)">
      <rect width="230" height="90" rx="20" fill="#f4f8f5" stroke="#cfdcd6"/>
      <text x="115" y="32" text-anchor="middle" class="label">What is parked</text>
      <text x="115" y="58" text-anchor="middle" class="mono" fill="#4d6660">flow · node · variables</text>
      <text x="115" y="76" text-anchor="middle" class="mono" fill="#4d6660">wake deadline</text>
    </g>
    <g transform="translate(635 226)">
      <rect width="230" height="90" rx="20" fill="#f4f8f5" stroke="#cfdcd6"/>
      <text x="115" y="32" text-anchor="middle" class="label">Who may resume</text>
      <text x="115" y="58" text-anchor="middle" class="mono" fill="#4d6660">declared per node type</text>
      <text x="115" y="76" text-anchor="middle" class="mono" fill="#4d6660">undeclared = refused</text>
    </g>

    <text x="522" y="352" text-anchor="middle" class="small">A run that is waiting has not stopped. It is parked, and it is reachable — by the right caller.</text>
  </g>
</svg>
