<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Context-sized software: a complete CRM stays under 150k tokens, with business logic under 100k and UI around 50k">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="ui" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#f4b65d"/>
      <stop offset="1" stop-color="#ffd28a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24342f" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}
      .label{font-size:18px;font-weight:720}
      .soft{fill:#5d736b;font-size:15px}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
      .barLight{fill:#ffffff;font-size:15px;font-weight:720}
      .barDark{fill:#173a36;font-size:15px;font-weight:720}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="76" font-size="34" font-weight="780">Context-sized software</text>
  <text x="96" y="111" class="tiny">A complete CRM stays under 150k tokens — business logic under 100k, with roughly 50k more for UI</text>

  <!-- context window -->
  <rect x="96" y="170" width="1008" height="220" rx="18" fill="#ffffff" stroke="#c7d6cf" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="206" class="label">One agent context window</text>
  <text x="984" y="206" class="soft mono" text-anchor="end">200k tokens</text>

  <!-- token ruler -->
  <rect x="120" y="252" width="960" height="76" rx="10" fill="#f1f6f3" stroke="#dbe7e0"/>
  <rect x="120" y="252" width="480" height="76" rx="10" fill="url(#fill)"/>
  <rect x="600" y="252" width="240" height="76" fill="url(#ui)"/>
  <text x="360" y="296" class="barLight" text-anchor="middle">business logic &lt;100k</text>
  <text x="720" y="296" class="barDark" text-anchor="middle">UI ≈50k</text>
  <text x="1064" y="298" class="soft mono" text-anchor="end">&gt;25% free</text>
  <text x="120" y="356" class="soft mono">reference app-crm ≈16k · complete HotCRM &lt;150k</text>

  <!-- what's inside -->
  <g class="soft">
    <rect x="96" y="430" width="232" height="64" rx="12" fill="#ffffff" stroke="#dbe7e0"/>
    <text x="212" y="458" text-anchor="middle" class="label">Objects &amp; fields</text>
    <text x="212" y="480" text-anchor="middle" class="soft">the data model</text>

    <rect x="354" y="430" width="232" height="64" rx="12" fill="#ffffff" stroke="#dbe7e0"/>
    <text x="470" y="458" text-anchor="middle" class="label">Views &amp; dashboards</text>
    <text x="470" y="480" text-anchor="middle" class="soft">the UI, declared</text>

    <rect x="612" y="430" width="232" height="64" rx="12" fill="#ffffff" stroke="#dbe7e0"/>
    <text x="728" y="458" text-anchor="middle" class="label">Flows &amp; actions</text>
    <text x="728" y="480" text-anchor="middle" class="soft">the automation</text>

    <rect x="870" y="430" width="234" height="64" rx="12" fill="#ffffff" stroke="#dbe7e0"/>
    <text x="987" y="458" text-anchor="middle" class="label">Permissions</text>
    <text x="987" y="480" text-anchor="middle" class="soft">who sees what</text>
  </g>

  <text x="96" y="560" class="tiny">Typed metadata holds business logic and UI; the runtime derives the database, REST API, rendered screens, and MCP server.</text>
  <text x="96" y="610" class="soft mono">reference app-crm: 31 files · 1,792 lines ≈16k tokens</text>
</svg>
