<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Views, dashboards and apps are projections of the ontology: one five-line diff adding a budget field to the bundled Todo example; the table, the REST API, the MCP describe call and the Console form followed it by themselves, while the pinned list view, the Chinese translation and the dashboard dataset stayed as authored">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em}
      .title{font-size:54px;font-weight:800}
      .lead{font-size:19px}
      .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:600}
      .kicker{font-size:12px;font-weight:780;letter-spacing:.12em}
      .row{font-size:15px}
      .rowNum{font-size:15px;font-weight:760}
      .foot{font-size:13px}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="118" class="eyebrow" fill="#2a7468">WHAT CHANGES FOR REVIEW</text>
  <text x="78" y="186" class="title" fill="#173a36">One field.</text>
  <text x="78" y="248" class="title" fill="#173a36">Every surface.</text>
  <text x="78" y="300" class="lead" fill="#3f554f">Add a field to the definition and the table, the API,</text>
  <text x="78" y="327" class="lead" fill="#3f554f">the MCP tools and the Console follow by themselves.</text>
  <text x="78" y="354" class="lead" fill="#3f554f">The views that name their columns do not.</text>

  <g transform="translate(78 392)">
    <rect width="470" height="38" rx="19" fill="#ffffff" stroke="#b9dcd0"/>
    <text x="235" y="24" class="mono" text-anchor="middle" fill="#2a7468">+ budget: Field.currency({ label: 'Budget' })</text>
  </g>

  <g transform="translate(78 452)">
    <rect width="470" height="38" rx="19" fill="#ffffff" stroke="#e6d3b6"/>
    <text x="235" y="24" class="row" text-anchor="middle" fill="#a35a1f">The naming test: names the field, or only the object?</text>
  </g>

  <g transform="translate(640 104)">
    <rect width="482" height="232" rx="18" fill="#f4faf7" stroke="#c9d8d1"/>
    <text x="28" y="34" class="kicker" fill="#2a7468">FOLLOWED, NO EDIT · DERIVED</text>
    <text x="28" y="72" class="row" fill="#173a36">SQLite table todo_task</text>
    <text x="454" y="72" class="rowNum" text-anchor="end" fill="#2a7468">27 → 28 columns</text>
    <text x="28" y="104" class="row" fill="#173a36">GET /api/v1/data/todo_task</text>
    <text x="454" y="104" class="rowNum" text-anchor="end" fill="#2a7468">27 → 28 keys</text>
    <text x="28" y="136" class="row" fill="#173a36">POST with budget: 1200</text>
    <text x="454" y="136" class="rowNum" text-anchor="end" fill="#2a7468">400 → 201</text>
    <text x="28" y="168" class="row" fill="#173a36">MCP describe_object</text>
    <text x="454" y="168" class="rowNum" text-anchor="end" fill="#2a7468">19 → 20 fields</text>
    <text x="28" y="200" class="row" fill="#173a36">Console create form</text>
    <text x="454" y="200" class="rowNum" text-anchor="end" fill="#2a7468">16 → 17 inputs</text>
  </g>

  <g transform="translate(640 356)">
    <rect width="482" height="168" rx="18" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="28" y="34" class="kicker" fill="#a35a1f">UNCHANGED · PINNED TO FIELD NAMES</text>
    <text x="28" y="72" class="row" fill="#173a36">All Tasks list view</text>
    <text x="454" y="72" class="rowNum" text-anchor="end" fill="#a35a1f">6 columns, as authored</text>
    <text x="28" y="104" class="row" fill="#173a36">zh-CN translation</text>
    <text x="454" y="104" class="rowNum" text-anchor="end" fill="#a35a1f">budget → "Budget"</text>
    <text x="28" y="136" class="row" fill="#173a36">Dashboard dataset task_metrics</text>
    <text x="454" y="136" class="rowNum" text-anchor="end" fill="#a35a1f">3 measures, by name</text>
  </g>

  <text x="78" y="618" class="foot" fill="#4f625c">Measured on ObjectStack 18.0.0-next.2, examples/app-todo at commit 43567a8f: one five-line diff, eleven readings before and after.</text>
</svg>
