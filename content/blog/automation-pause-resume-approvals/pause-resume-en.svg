<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="What wakes a parked run, and which node actually carries a deadline">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:28px;font-weight:780}
      .band{font-size:15px;font-weight:750;fill:#4d6660;letter-spacing:.5px}
      .t{font-size:17px;font-weight:740}.s{font-size:13px;fill:#647872}
      .box{fill:#fffefa;stroke:#d7dfdb}
      .white{fill:#eafff6}.soft{fill:#a8cdc2}
      .mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;fill:#4d6660}
      .chip{font-size:14px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f8faf8"/>
  <text x="70" y="56" class="h">What wakes a parked run — and which node actually has a deadline</text>

  <!-- Band 1: waking a parked run -->
  <g transform="translate(70 92)">
    <rect width="1060" height="300" rx="28" class="box"/>
    <text x="32" y="42" class="band">1 · WAKING A PARKED RUN</text>

    <g transform="translate(32 70)">
      <rect width="270" height="36" rx="12" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="16" y="23" class="chip">Timer elapses</text>
      <text x="258" y="23" text-anchor="end" class="mono">wait</text>
    </g>
    <g transform="translate(32 114)">
      <rect width="270" height="36" rx="12" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="16" y="23" class="chip">Named signal or webhook</text>
      <text x="258" y="23" text-anchor="end" class="mono">wait</text>
    </g>
    <g transform="translate(32 158)">
      <rect width="270" height="36" rx="12" fill="#fff3d6" stroke="#efc86c"/>
      <text x="16" y="23" class="chip">An approver decides</text>
      <text x="258" y="23" text-anchor="end" class="mono">approval</text>
    </g>
    <g transform="translate(32 202)">
      <rect width="270" height="36" rx="12" fill="#edf2ff" stroke="#bdc8ee"/>
      <text x="16" y="23" class="chip">A person submits a screen</text>
      <text x="258" y="23" text-anchor="end" class="mono">screen</text>
    </g>
    <g transform="translate(32 246)">
      <rect width="270" height="36" rx="12" fill="#f4f8f5" stroke="#cfdcd6"/>
      <text x="16" y="23" class="chip">An operator resumes by hand</text>
      <text x="258" y="23" text-anchor="end" class="mono">any</text>
    </g>

    <path d="M310 88 C340 88 336 150 356 160 M310 132 C340 132 340 154 356 160 M310 176 H356 M310 220 C340 220 340 168 356 165 M310 264 C340 264 336 172 356 166"
          fill="none" stroke="#8fa39c" stroke-width="2.5" stroke-linecap="round"/>

    <g transform="translate(360 100)">
      <rect width="196" height="132" rx="24" fill="#173a36"/>
      <text x="98" y="42" text-anchor="middle" class="white" font-size="18" font-weight="770">The resume door</text>
      <text x="98" y="72" text-anchor="middle" class="soft" font-size="13" font-family="ui-monospace,Menlo,monospace">resumeAuthority</text>
      <text x="98" y="100" text-anchor="middle" class="soft" font-size="13">declared per node type</text>
      <text x="98" y="118" text-anchor="middle" class="soft" font-size="13">undeclared = refused</text>
    </g>

    <path d="M560 140 H600 M560 228 H600" stroke="#8fa39c" stroke-width="2.5" stroke-linecap="round"/>

    <g transform="translate(604 104)">
      <rect width="252" height="72" rx="18" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="18" y="30" class="t">Run continues</text>
      <text x="18" y="54" class="s">at its node, with its variables</text>
    </g>
    <g transform="translate(604 192)">
      <rect width="252" height="72" rx="18" fill="#fff0ec" stroke="#e3b3a6"/>
      <text x="18" y="30" class="t">403 — not your pause</text>
      <text x="18" y="54" class="s">service-owned: go via the service</text>
    </g>

    <g transform="translate(890 100)">
      <rect width="138" height="132" rx="20" fill="#f4f8f5" stroke="#cfdcd6"/>
      <text x="69" y="30" text-anchor="middle" class="t">Parked row</text>
      <text x="69" y="56" text-anchor="middle" class="mono">flow</text>
      <text x="69" y="76" text-anchor="middle" class="mono">node</text>
      <text x="69" y="96" text-anchor="middle" class="mono">variables</text>
      <text x="69" y="116" text-anchor="middle" class="mono">waitUntil</text>
    </g>
  </g>

  <!-- Band 2: where the deadline lives -->
  <g transform="translate(70 412)">
    <rect width="1060" height="272" rx="28" class="box"/>
    <text x="32" y="42" class="band">2 · WHERE THE DEADLINE LIVES</text>

    <g transform="translate(32 66)">
      <rect width="490" height="180" rx="22" fill="#fff0ec" stroke="#e3b3a6"/>
      <text x="24" y="40" class="t">wait node — no deadline at all</text>
      <text x="24" y="72" class="mono">timeoutMs   · retired in spec 17</text>
      <text x="24" y="96" class="mono">onTimeout   · retired in spec 17</text>
      <text x="24" y="132" class="s">It resumes when its timer elapses or its signal arrives.</text>
      <text x="24" y="154" class="s">Nothing fails it, and nothing moves it on, at a deadline.</text>
    </g>

    <g transform="translate(546 66)">
      <rect width="482" height="180" rx="22" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="24" y="40" class="t">approval node — the one real SLA</text>
      <text x="24" y="72" class="mono">escalation.timeoutHours</text>
      <text x="24" y="100" class="s">On breach, one declared action fires once:</text>
      <g transform="translate(24 114)" class="mono">
        <rect width="104" height="30" rx="9" fill="#fffefa" stroke="#bdd7cf"/>
        <text x="52" y="20" text-anchor="middle" class="mono">reassign</text>
        <rect x="112" width="118" height="30" rx="9" fill="#fffefa" stroke="#bdd7cf"/>
        <text x="171" y="20" text-anchor="middle" class="mono">auto_approve</text>
        <rect x="238" width="112" height="30" rx="9" fill="#fffefa" stroke="#bdd7cf"/>
        <text x="294" y="20" text-anchor="middle" class="mono">auto_reject</text>
        <rect x="358" width="80" height="30" rx="9" fill="#fffefa" stroke="#bdd7cf"/>
        <text x="398" y="20" text-anchor="middle" class="mono">notify</text>
      </g>
      <text x="24" y="170" class="s">An audit row is written first, so it can never fire twice.</text>
    </g>
  </g>
</svg>
