<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="两条命令，一道门禁：同一处只改一个词的改动，先经过 os validate——解析栈、跑 49 条作者期规则、以 exit 0 通过，因为没有任何规则读取 allowDelete 的值；再经过 os compile——跑同一批规则，然后从元数据推导出访问矩阵，与已提交的 access-matrix.json 比对，以 exit 1 构建失败并打印 'crm_sales_user' gains delete on 'crm_opportunity'；人工闭环是 os compile --update-access-matrix、git diff -U8 access-matrix.json，下一次 compile 通过；快照共七条记录，每个权限集与对象一行，含有效的 create、read、edit、delete 位，作为上下文保留的原始 View All 与 Modify All 位，读写深度，以及对象的记录基线">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#4b5d56}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em}
      .chip{font-size:13px;font-weight:700}
      .label{font-size:16px;font-weight:760}
      .small{font-size:13px;fill:#4b5d56}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600}
      .num{font-size:44px;font-weight:800;fill:#2a7468}
      .teal{fill:#2a7468}
      .amber{fill:#8a6a3a}
      .red{fill:#a8432c}
      .white{fill:#ffffff}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">两条命令，一道门禁：同一处改动分别经过 os validate 与 os compile</text>
  <text x="60" y="80" class="note">os validate 跑的是作者期规则注册表；os compile 跑同一批规则，然后多走一步——注册表里没有的那一步。</text>

  <!-- 这处改动 -->
  <g transform="translate(60 112)">
    <rect width="300" height="120" rx="18" fill="#fdf4e8" stroke="#d9b98c" stroke-width="2"/>
    <text x="20" y="30" class="cap amber">这处改动——一个词</text>
    <text x="20" y="56" class="mono">src/security/sales-positions.ts:45</text>
    <text x="20" y="74" class="mono">crm_opportunity:</text>
    <text x="20" y="92" class="mono red">- allowDelete: false</text>
    <text x="20" y="110" class="mono teal">+ allowDelete: true</text>
  </g>

  <!-- 改动 → 两条通道 -->
  <line x1="362" y1="172" x2="396" y2="172" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M362 190 H380 V322 H396" fill="none" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 通道 A：os validate -->
  <g transform="translate(400 112)">
    <rect width="740" height="120" rx="18" fill="#f4faf7" stroke="#2a7468" stroke-width="1.5"/>
    <text x="24" y="30" class="cap teal">OS VALIDATE</text>
    <g transform="translate(24 46)"><rect width="100" height="34" rx="10" fill="#ffffff" stroke="#c9d8d1"/><text x="50" y="22" class="chip" text-anchor="middle">Zod 解析</text></g>
    <line x1="126" y1="63" x2="144" y2="63" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(148 46)"><rect width="176" height="34" rx="10" fill="#ffffff" stroke="#c9d8d1"/><text x="88" y="22" class="chip" text-anchor="middle">49 条作者期规则</text></g>
    <line x1="326" y1="63" x2="344" y2="63" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(348 46)"><rect width="300" height="34" rx="10" fill="#2a7468"/><text x="150" y="22" class="chip white" text-anchor="middle">✓ Validation passed · exit 0</text></g>
    <text x="24" y="104" class="small">没有任何规则读取 allowDelete 的值：两个值都合法、都可执行。输出里没有提到矩阵。</text>
  </g>

  <!-- 通道 B：os compile -->
  <g transform="translate(400 262)">
    <rect width="740" height="340" rx="18" fill="#f7faf9" stroke="#2a7468" stroke-width="1.5"/>
    <text x="24" y="30" class="cap teal">OS COMPILE · OS BUILD 是它的别名</text>
    <g transform="translate(24 46)"><rect width="100" height="34" rx="10" fill="#ffffff" stroke="#c9d8d1"/><text x="50" y="22" class="chip" text-anchor="middle">Zod 解析</text></g>
    <line x1="126" y1="63" x2="144" y2="63" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(148 46)"><rect width="176" height="34" rx="10" fill="#ffffff" stroke="#c9d8d1"/><text x="88" y="22" class="chip" text-anchor="middle">49 条作者期规则</text></g>
    <line x1="326" y1="63" x2="344" y2="63" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(348 46)"><rect width="300" height="34" rx="10" fill="#fdf4e8" stroke="#d9b98c"/><text x="150" y="22" class="chip amber" text-anchor="middle">从元数据推导出矩阵</text></g>
    <path d="M498 82 V90 H189 V96" fill="none" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(24 98)"><rect width="330" height="34" rx="10" fill="#fdf4e8" stroke="#d9b98c"/><text x="165" y="22" class="chip amber" text-anchor="middle">与已提交的 access-matrix.json 比对</text></g>
    <line x1="356" y1="115" x2="374" y2="115" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(378 98)"><rect width="338" height="34" rx="10" fill="#a8432c"/><text x="169" y="22" class="chip white" text-anchor="middle">✗ Access matrix drift (1 change) · exit 1</text></g>
    <text x="24" y="158" class="mono red">• 'crm_sales_user' gains delete on 'crm_opportunity'</text>
    <text x="24" y="178" class="small">如属有意，加 --update-access-matrix 重跑并提交快照——它的 diff 就是评审物。</text>

    <text x="24" y="214" class="cap teal">人工闭环——三条命令</text>
    <g transform="translate(24 228)"><rect width="260" height="34" rx="10" fill="#ffffff" stroke="#2a7468"/><text x="130" y="22" class="mono" text-anchor="middle">os compile --update-access-matrix</text></g>
    <line x1="286" y1="245" x2="304" y2="245" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(308 228)"><rect width="250" height="34" rx="10" fill="#ffffff" stroke="#2a7468"/><text x="125" y="22" class="mono" text-anchor="middle">git diff -U8 access-matrix.json</text></g>
    <line x1="560" y1="245" x2="578" y2="245" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(582 228)"><rect width="140" height="34" rx="10" fill="#2a7468"/><text x="70" y="22" class="chip white" text-anchor="middle">下一次 compile ✓</text></g>
    <text x="24" y="290" class="small">objectstack.config.ts 旁边没有 access-matrix.json → 门禁跳过（未选择加入）。</text>
    <text x="24" y="308" class="small">--update-access-matrix 会整文件重写：把快照里的 hunk 与语义行一一对照。</text>
  </g>

  <!-- 快照 -->
  <g transform="translate(60 262)">
    <rect width="300" height="340" rx="18" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="20" y="30" class="cap teal">快照——ACCESS-MATRIX.JSON</text>
    <text x="20" y="84" class="num">7</text>
    <text x="62" y="66" class="label">条记录（CRM 示例）</text>
    <text x="62" y="88" class="small">每个权限集 × 对象一行</text>
    <text x="20" y="128" class="small">create · read · edit · delete——有效位</text>
    <text x="20" y="150" class="small">View All · Modify All——原始位，作上下文</text>
    <text x="20" y="172" class="small">读 / 写 深度</text>
    <text x="20" y="194" class="small">sharingModel——对象的记录基线（OWD）</text>
    <text x="20" y="216" class="small">已排序，所以每次 diff 都稳定</text>
    <text x="20" y="238" class="small">与 objectstack.config.ts 一起提交</text>
    <text x="20" y="286" class="small teal">crm_sales_user 六行，</text>
    <text x="20" y="304" class="small teal">guest_portal 一行，只能新建。</text>
  </g>

  <text x="60" y="630" class="small">在 @objectstack/cli 17.7.0 的 examples/app-crm 上实测。漂移行引自真实运行；行的形态来自 @objectstack/lint 的 diffAccessMatrix。</text>
</svg>
