<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Code generation versus metadata generation">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24342f" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .small{font-size:22px;font-weight:650}.tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#9fc8bc}.soft2{fill:#b7d6ce}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="96" y="76" font-size="34" font-weight="780">The dividing line for AI app platforms</text>
  <text x="96" y="111" class="tiny">Code generation speeds up prototypes. Metadata generation keeps systems governed, evolvable, and usable by Agents.</text>

  <g transform="translate(86 162)" filter="url(#shadow)">
    <rect width="440" height="360" rx="26" fill="#fffefa" stroke="#d9e1d9"/>
    <text x="34" y="48" class="small">Code generation</text>
    <text x="34" y="76" class="tiny">Pages / APIs / tables</text>
    <g transform="translate(34 112)">
      <rect width="372" height="48" rx="14" fill="#f5f2ea" stroke="#ddd5c5"/>
      <text x="22" y="31" class="label">Form page</text>
      <rect y="72" width="372" height="48" rx="14" fill="#f5f2ea" stroke="#ddd5c5"/>
      <text x="22" y="103" class="label">API code</text>
      <rect y="144" width="372" height="48" rx="14" fill="#f5f2ea" stroke="#ddd5c5"/>
      <text x="22" y="175" class="label">Database table</text>
      <path d="M306 45 C342 72 342 96 306 122" fill="none" stroke="#c58842" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>
      <path d="M306 117 C342 144 342 168 306 194" fill="none" stroke="#c58842" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>
    </g>
    <text x="34" y="326" class="tiny">Fast, but business semantics drift into code</text>
  </g>

  <g transform="translate(674 132)" filter="url(#shadow)">
    <rect width="440" height="420" rx="28" fill="#173a36"/>
    <text x="34" y="52" class="small invert">Metadata generation</text>
    <text x="34" y="82" class="soft" font-size="16">Objects / permissions / workflows / Agent tools</text>
    <g transform="translate(40 118)">
      <rect width="156" height="54" rx="16" fill="#e8fff5"/>
      <text x="34" y="35" class="label">Objects</text>
      <rect x="222" width="156" height="54" rx="16" fill="#e8fff5"/>
      <text x="256" y="35" class="label">Fields</text>
      <rect y="84" width="156" height="54" rx="16" fill="#e8fff5"/>
      <text x="34" y="119" class="label">Views</text>
      <rect x="222" y="84" width="156" height="54" rx="16" fill="#e8fff5"/>
      <text x="256" y="119" class="label">Access</text>
      <rect y="168" width="156" height="54" rx="16" fill="#e8fff5"/>
      <text x="34" y="203" class="label">Flow</text>
      <rect x="222" y="168" width="156" height="54" rx="16" fill="#e8fff5"/>
      <text x="248" y="203" class="label">Agent</text>
      <g stroke="#f4c76e" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M156 27 H222"/>
        <path d="M78 54 V84"/>
        <path d="M300 54 V84"/>
        <path d="M78 138 V168"/>
        <path d="M300 138 V168"/>
        <path d="M156 195 H222"/>
      </g>
    </g>
    <text x="40" y="374" class="soft2" font-size="16">One business model drives</text>
    <text x="40" y="398" class="soft2" font-size="16">UI, API, automation, Agents, and audit</text>
  </g>

  <g stroke="#2a7468" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M545 326 H636"/>
    <path d="M620 308 L640 326 L620 344"/>
  </g>
</svg>
