<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="AI 从对话进入受控业务动作">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.h{font-size:30px;font-weight:780}.t{font-size:18px;font-weight:740}.s{font-size:14px;fill:#657872}.box{fill:#fffefa;stroke:#d7dfdb}.green{fill:#eef7f2}.yellow{fill:#fff3d6}.blue{fill:#edf2ff}.dark{fill:#173a36}.white{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f8faf7"/>
  <text x="70" y="64" class="h">同一个业务动作，同时服务人和 AI</text>
  <g transform="translate(70 108)">
    <rect width="1060" height="418" rx="30" class="box"/>
    <g transform="translate(55 72)">
      <rect width="220" height="110" rx="24" class="dark"/>
      <text x="110" y="42" text-anchor="middle" class="white" font-size="19" font-weight="760">用户对话</text>
      <text x="110" y="70" text-anchor="middle" class="soft" font-size="14">帮我转成商机</text>
    </g>
    <g transform="translate(360 46)">
      <rect width="250" height="76" rx="20" class="green"/>
      <text x="125" y="47" text-anchor="middle" class="t">可调用动作</text>
      <rect y="112" width="250" height="76" rx="20" class="yellow"/>
      <text x="125" y="159" text-anchor="middle" class="t">风险与确认</text>
      <rect y="224" width="250" height="76" rx="20" class="blue"/>
      <text x="125" y="271" text-anchor="middle" class="t">参数和结果</text>
    </g>
    <g transform="translate(720 72)">
      <rect width="245" height="220" rx="26" class="box"/>
      <text x="122" y="48" text-anchor="middle" class="t">业务系统动作</text>
      <text x="122" y="88" text-anchor="middle" class="s">更新记录</text>
      <text x="122" y="122" text-anchor="middle" class="s">创建任务</text>
      <text x="122" y="156" text-anchor="middle" class="s">发起流程</text>
      <text x="122" y="190" text-anchor="middle" class="s">留下审计</text>
    </g>
    <path d="M280 128 H356 M614 84 H716 M614 158 H716 M614 270 H716" stroke="#2a7468" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
