<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The ontology is the software: one executable business ontology with a six-kind core, four projections outside it and three things it is not, and the four promises Executable, AI-writable, Agent-operable, You own it">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em;fill:#2a7468}
      .title{font-size:54px;font-weight:800}
      .lead{font-size:19px;fill:#3f554f}
      .chip{font-size:14px;font-weight:760;fill:#2a7468}
      .num{font-size:44px;font-weight:800;fill:#2a7468}
      .label{font-size:19px;font-weight:760}
      .small{font-size:13px;fill:#657872}
      .foot{font-size:13px;fill:#657872}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="118" class="eyebrow">WHAT THE SENTENCE MEANS</text>
  <text x="78" y="186" class="title">The ontology</text>
  <text x="78" y="248" class="title">is the software.</text>
  <text x="78" y="300" class="lead">One executable business ontology.</text>
  <text x="78" y="326" class="lead">AI writes it, the runtime runs it,</text>
  <text x="78" y="352" class="lead">agents operate it, you own it.</text>

  <g transform="translate(78 404)"><rect width="112" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="56" y="23" class="chip" text-anchor="middle">Executable</text></g>
  <g transform="translate(200 404)"><rect width="118" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="59" y="23" class="chip" text-anchor="middle">AI-writable</text></g>
  <g transform="translate(328 404)"><rect width="148" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="74" y="23" class="chip" text-anchor="middle">Agent-operable</text></g>
  <g transform="translate(486 404)"><rect width="110" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="55" y="23" class="chip" text-anchor="middle">You own it</text></g>

  <g transform="translate(650 112)" filter="url(#shadow)">
    <rect width="472" height="456" rx="28" fill="#fffefa" stroke="#d8dfd6"/>

    <g transform="translate(28 30)">
      <rect width="416" height="112" rx="16" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="22" y="64" class="num">6</text>
      <text x="76" y="38" class="label">kinds in the core</text>
      <text x="76" y="64" class="small">objects and fields · relations · actions</text>
      <text x="76" y="84" class="small">permissions · flows · agent and tool definitions</text>
    </g>

    <g transform="translate(28 158)">
      <rect width="416" height="112" rx="16" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="22" y="64" class="num">4</text>
      <text x="76" y="38" class="label">projections, outside it</text>
      <text x="76" y="64" class="small">views · dashboards · apps · translations</text>
      <text x="76" y="84" class="small">same metadata, same gate, not part of the ontology</text>
    </g>

    <g transform="translate(28 286)">
      <rect width="416" height="112" rx="16" fill="#ffffff" stroke="#c9d8d1"/>
      <text x="22" y="64" class="num">3</text>
      <text x="76" y="38" class="label">things it is not</text>
      <text x="76" y="64" class="small">a knowledge-representation ontology · a semantic layer</text>
      <text x="76" y="84" class="small">a formal ontology in the philosophical sense</text>
    </g>

    <text x="28" y="420" class="small" style="fill:#2a7468">Code does not disappear: hooks, action bodies,</text>
    <text x="28" y="438" class="small" style="fill:#2a7468">CEL and constrained JSX run inside the runtime.</text>
  </g>

  <text x="78" y="612" class="foot">An executable business ontology, defined — from the ObjectStack README, quoted rather than paraphrased.</text>
</svg>
