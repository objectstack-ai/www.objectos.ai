<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="自然语言改流程的治理">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset="1" stop-color="#fff4e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#263832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.title{font-size:38px;font-weight:780}.lead{font-size:18px;fill:#60746f}.label{font-size:19px;font-weight:750}.small{font-size:14px;fill:#647872}.dark{fill:#173a36}.white{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="78" y="86" class="title">一句话改流程之后</text>
  <text x="78" y="124" class="lead">自动化引擎要负责审查、校验、发布和回滚</text>
  <g transform="translate(96 168)" filter="url(#shadow)">
    <rect width="1008" height="366" rx="32" fill="#fffefa" stroke="#d8dfd6"/>
    <g transform="translate(60 92)">
      <rect width="200" height="150" rx="26" class="dark"/>
      <text x="100" y="50" text-anchor="middle" class="white" font-size="20" font-weight="780">业务变更</text>
      <text x="100" y="88" text-anchor="middle" class="soft" font-size="14">VIP 1 小时升级</text>
      <text x="100" y="118" text-anchor="middle" class="soft" font-size="14">新增财务确认</text>
    </g>
    <g transform="translate(365 68)">
      <rect width="230" height="72" rx="20" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="115" y="45" text-anchor="middle" class="label">变更草案</text>
      <rect y="104" width="230" height="72" rx="20" fill="#fff3d6" stroke="#efc86c"/>
      <text x="115" y="149" text-anchor="middle" class="label">校验和审查</text>
      <rect y="208" width="230" height="72" rx="20" fill="#edf2ff" stroke="#bdc8ee"/>
      <text x="115" y="253" text-anchor="middle" class="label">发布和版本</text>
    </g>
    <g transform="translate(735 92)">
      <rect width="200" height="150" rx="26" fill="#f6f8fb" stroke="#d8e0e8"/>
      <text x="100" y="50" text-anchor="middle" class="label">流程资产</text>
      <text x="100" y="88" text-anchor="middle" class="small">可执行</text>
      <text x="100" y="118" text-anchor="middle" class="small">可回滚</text>
    </g>
    <path d="M264 167 H360 M600 104 H730 M600 208 H730 M600 312 C680 312 680 220 730 220" stroke="#2a7468" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
