<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Three closed agent suites versus an open self-hosted runtime, and where each fits">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:14px}.h{font-size:16px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="78" font-size="32" font-weight="780">Beyond Agentforce and Copilot Studio</text>
  <text x="96" y="113" class="tiny">These suites are strong in their own walls—if your world really lives inside one</text>

  <!-- three ecosystem cards -->
  <g transform="translate(96 162)">
    <g filter="url(#shadow)">
      <rect width="330" height="190" rx="18" fill="#ffffff"/>
      <text x="26" y="46" class="h">Salesforce Agentforce</text>
      <text x="26" y="74" class="soft">CRM-native · 8,000+ customers</text>
      <text x="26" y="118" class="soft" fill="#1f6b4a">✓ you already live in Salesforce</text>
      <text x="26" y="150" class="soft" fill="#9a3b1f">⊘ hard once you leave it / switch models</text>
    </g>
    <g filter="url(#shadow)" transform="translate(354 0)">
      <rect width="330" height="190" rx="18" fill="#ffffff"/>
      <text x="26" y="46" class="h">Microsoft Copilot Studio</text>
      <text x="26" y="74" class="soft">Agent 365 · GPT-5 + M365</text>
      <text x="26" y="118" class="soft" fill="#1f6b4a">✓ all-in on Teams / 365</text>
      <text x="26" y="150" class="soft" fill="#9a3b1f">⊘ awkward if data must stay yours</text>
    </g>
    <g filter="url(#shadow)" transform="translate(708 0)">
      <rect width="330" height="190" rx="18" fill="#ffffff"/>
      <text x="26" y="46" class="h">ServiceNow AI Agents</text>
      <text x="26" y="74" class="soft">ITSM king · many prebuilt agents</text>
      <text x="26" y="118" class="soft" fill="#1f6b4a">✓ flows live on ServiceNow</text>
      <text x="26" y="150" class="soft" fill="#9a3b1f">⊘ definition bound to the platform</text>
    </g>
  </g>

  <!-- open runtime band -->
  <g transform="translate(96 392)" filter="url(#shadow)">
    <rect width="1008" height="176" rx="22" fill="#22433d"/>
    <text x="36" y="58" class="label invert">Open · self-hosted runtime (ObjectStack)</text>
    <text x="36" y="90" class="soft" fill="#a9c4ba">Definition in your repo · runs on your infra · swap models freely · not per-action billed</text>
    <g transform="translate(36 112)" font-size="14">
      <rect width="300" height="44" rx="10" fill="#35564f"/><text x="18" y="29" class="invert">✓ data across many systems, self-held</text>
      <rect x="320" y="0" width="300" height="44" rx="10" fill="#35564f"/><text x="338" y="29" class="invert">✓ free model choice, no lock-in</text>
      <rect x="640" y="0" width="332" height="44" rx="10" fill="#35564f"/><text x="658" y="29" class="invert">✓ compliance needs data to stay put</text>
    </g>
  </g>
</svg>
