<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="What you can take with you, Power Platform versus an open runtime">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#142540}.h{font-size:24px;font-weight:760}.col{font-size:18px;font-weight:740}.row{font-size:16px;fill:#3a4a64}.ok{fill:#1d7a5f;font-weight:700}.no{fill:#c0392b;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#f3f6fb"/>
  <text x="60" y="54" class="h">What can you actually take with you?</text>

  <line x1="500" y1="86" x2="500" y2="476" stroke="#d7deea"/>
  <line x1="820" y1="86" x2="820" y2="476" stroke="#d7deea"/>

  <text x="60" y="116" class="col">&#160;</text>
  <text x="540" y="116" class="col" fill="#16243f">Power Platform</text>
  <text x="860" y="116" class="col" fill="#1d7a5f">Open runtime (ObjectStack)</text>

  <g>
    <rect x="40" y="140" width="1120" height="2" fill="#e3e8f0"/>
    <text x="60" y="186" class="row">App metadata (tables, forms, flows)</text>
    <text x="540" y="186" class="ok">✓ exports</text>
    <text x="860" y="186" class="ok">✓ open, readable</text>
    <rect x="40" y="212" width="1120" height="1" fill="#e3e8f0"/>

    <text x="60" y="256" class="row">Your business data</text>
    <text x="540" y="256" class="no">✗ stays in Dataverse (~$40/GB)</text>
    <text x="860" y="256" class="ok">✓ stays in your DB</text>
    <rect x="40" y="282" width="1120" height="1" fill="#e3e8f0"/>

    <text x="60" y="326" class="row">The runtime itself</text>
    <text x="540" y="326" class="no">✗ Azure-only, no self-host</text>
    <text x="860" y="326" class="ok">✓ self-hostable</text>
    <rect x="40" y="352" width="1120" height="1" fill="#e3e8f0"/>

    <text x="60" y="396" class="row">What the AI changed</text>
    <text x="540" y="396" class="no">✗ opaque managed config</text>
    <text x="860" y="396" class="ok">✓ a reviewable diff + audit</text>
    <rect x="40" y="422" width="1120" height="1" fill="#e3e8f0"/>

    <text x="60" y="466" class="row">Getting started with existing systems</text>
    <text x="540" y="466" class="no">✗ migrate into Dataverse</text>
    <text x="860" y="466" class="ok">✓ connect, don't migrate</text>
  </g>
</svg>
