<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" role="img" aria-label="One executable business ontology, compiled from objectstack.config.ts into objectstack.json, supplies three things. World: objects and fields and relations are declared, and the runtime derives the database, the REST and realtime API, the Console UI and the describe_object tool from them. Hands: actions with ai exposed true, flows and records are declared, and the runtime serves an MCP server at /api/v1/mcp with twelve tools, run_action gated at invoke time. Fence: permission sets, row-level and field-level security and sharing are declared, and the runtime enforces them as security middleware on every engine call and writes audit rows on every insert, update and delete.">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .topKicker{font-size:12px;font-weight:780;letter-spacing:.12em;fill:#b9dcd0}
      .topMono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;font-weight:600;fill:#ffffff}
      .topSmall{font-size:13px;fill:#d6e7e1}
      .colKicker{font-size:12px;font-weight:780;letter-spacing:.12em;fill:#ffffff}
      .colTitle{font-size:20px;font-weight:760;fill:#ffffff}
      .label{font-size:11px;font-weight:780;letter-spacing:.08em;fill:#2a7468}
      .body{font-size:13px;fill:#3f554f}
      .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:#4f625c}
      .foot{font-size:13px;fill:#4f625c}
    </style>
  </defs>
  <rect width="1200" height="584" fill="#ffffff"/>

  <g transform="translate(80 40)">
    <rect width="1040" height="96" rx="18" fill="#173a36"/>
    <text x="28" y="30" class="topKicker">ONE ARTIFACT</text>
    <text x="28" y="62" class="topMono">objectstack.config.ts → objectstack.json</text>
    <text x="28" y="84" class="topSmall">the executable business ontology: validated by os validate, then run</text>
  </g>

  <g transform="translate(80 176)">
    <rect width="334" height="358" rx="20" fill="#fffefa" stroke="#d8dfd6"/>
    <path d="M20 0h294a20 20 0 0 1 20 20v46H0V20A20 20 0 0 1 20 0z" fill="#2a7468"/>
    <text x="24" y="26" class="colKicker">WORLD</text>
    <text x="24" y="52" class="colTitle">The nouns</text>
      <text x="24" y="96" class="label" style="fill:#2a7468">DECLARED IN THE ONTOLOGY</text>
      <text x="24" y="118" class="body">objects &amp; fields · relations</text>
      <text x="24" y="159" class="label" style="fill:#2a7468">WHAT THE RUNTIME DERIVES</text>
      <text x="24" y="181" class="body">database · REST + realtime API · Console</text>
      <text x="24" y="200" class="body">describe_object reads the same definition</text>
      <text x="24" y="241" class="label" style="fill:#2a7468">SOURCE</text>
      <text x="24" y="263" class="mono">concepts/ontology.mdx:64-70</text>
      <text x="24" y="282" class="mono">ai/connect-mcp.mdx:225-227</text>
  </g>
  <line x1="247" y1="136" x2="247" y2="174" stroke="#2a7468" stroke-width="2"/>
  <path d="M240 164l7 10 7-10z" fill="#2a7468"/>
  <g transform="translate(433 176)">
    <rect width="334" height="358" rx="20" fill="#fffefa" stroke="#d8dfd6"/>
    <path d="M20 0h294a20 20 0 0 1 20 20v46H0V20A20 20 0 0 1 20 0z" fill="#a35a1f"/>
    <text x="24" y="26" class="colKicker">HANDS</text>
    <text x="24" y="52" class="colTitle">The verbs</text>
      <text x="24" y="96" class="label" style="fill:#a35a1f">DECLARED IN THE ONTOLOGY</text>
      <text x="24" y="118" class="body">actions with ai: { exposed: true }</text>
      <text x="24" y="137" class="body">flows · records</text>
      <text x="24" y="178" class="label" style="fill:#a35a1f">WHAT THE RUNTIME SERVES</text>
      <text x="24" y="200" class="body">MCP server at /api/v1/mcp, on by default</text>
      <text x="24" y="219" class="body">twelve tools · run_action gated at invoke</text>
      <text x="24" y="260" class="label" style="fill:#a35a1f">SOURCE</text>
      <text x="24" y="282" class="mono">README.md:161-177</text>
      <text x="24" y="301" class="mono">action.zod.ts:764-771</text>
  </g>
  <line x1="600" y1="136" x2="600" y2="174" stroke="#a35a1f" stroke-width="2"/>
  <path d="M593 164l7 10 7-10z" fill="#a35a1f"/>
  <g transform="translate(786 176)">
    <rect width="334" height="358" rx="20" fill="#fffefa" stroke="#d8dfd6"/>
    <path d="M20 0h294a20 20 0 0 1 20 20v46H0V20A20 20 0 0 1 20 0z" fill="#3d4f7c"/>
    <text x="24" y="26" class="colKicker">FENCE</text>
    <text x="24" y="52" class="colTitle">Who may do what</text>
      <text x="24" y="96" class="label" style="fill:#3d4f7c">DECLARED IN THE ONTOLOGY</text>
      <text x="24" y="118" class="body">permission sets · sharing</text>
      <text x="24" y="137" class="body">row-level · field-level security</text>
      <text x="24" y="178" class="label" style="fill:#3d4f7c">WHAT THE RUNTIME ENFORCES</text>
      <text x="24" y="200" class="body">security middleware on every engine call</text>
      <text x="24" y="219" class="body">audit rows: every insert · update · delete</text>
      <text x="24" y="260" class="label" style="fill:#3d4f7c">SOURCE</text>
      <text x="24" y="282" class="mono">security-plugin.ts:2293-2294</text>
      <text x="24" y="301" class="mono">audit-writers.ts:2180-2185</text>
      <text x="24" y="320" class="mono">mcp-http-tools.ts:7-11</text>
  </g>
  <line x1="953" y1="136" x2="953" y2="174" stroke="#3d4f7c" stroke-width="2"/>
  <path d="M946 164l7 10 7-10z" fill="#3d4f7c"/>

  <text x="80" y="568" class="foot">Every source: objectstack-ai/objectstack at commit 1ecb08a1 (origin/main, 2026-10-16); doc pages are built from the same repository.</text>
</svg>
