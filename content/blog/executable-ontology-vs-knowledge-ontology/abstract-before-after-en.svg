<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d" aria-label="One key, three releases: how the abstract key on the object schema went from parsed and unread in @objectstack/spec 15.1.1 to refused with a prescription in 17.7.0, and ADR-0049&#39;s three states">
  <title id="t">One key, three releases: abstract on the object schema</title>
  <desc id="d">One key, three releases: abstract on the object schema, measured by parsing the same object through each published @objectstack/spec. 15.1.1, 2026-07-17, before: abstract: z.boolean().optional().default(false).describe('Is abstract base object (cannot be instantiated)'); the ledger says dead, no runtime reader, an abstract object still gets a table and is instantiable; verdict parsed, unread — create() and parse() both accept. 16.0.0, 2026-07-21: ADR-0049, enforce or remove, with no committed inheritance feature, so the key is removed; create() throws naming the removal while parse() still strips the key silently; verdict half closed, one entry point of two. 17.7.0, 2026-10-06, after: Unrecognized key(s) on this object: abstract — abstract was removed from the spec (ADR-0049), object inheritance/abstraction is not implemented, remove the key; verdict a reader for every key — create() throws and parse() rejects. Below, ADR-0049's three states: enforced, a runtime reader changes a decision; experimental, marked and documented as not enforced; absent, removed from the spec. The fourth state, parsed, unmarked, unenforced, is prohibited.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#52655f}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#52655f}
      .capA{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#7a5a2c}
      .capB{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#256a5e}
      .code{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#173a36}
      .codeB{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;fill:#173a36}
      .row{font-size:13px;fill:#173a36}
      .sub{font-size:13px;fill:#52655f}
      .strong{font-size:14px;font-weight:780;fill:#173a36}
      .verdictA{font-size:13px;font-weight:780;fill:#7a5a2c}
      .verdictB{font-size:13px;font-weight:780;fill:#256a5e}
      .chipT{font-size:14px;font-weight:780;fill:#173a36}
      .chipS{font-size:13px;fill:#52655f}
      .small{font-size:13px;fill:#52655f}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">One key, three releases: abstract on the object schema</text>
  <text x="60" y="80" class="note">The same object, parsed through each published @objectstack/spec. Dates are npm publish dates.</text>

  <!-- timeline -->
  <line x1="60" y1="112" x2="1140" y2="112" stroke="#c9d8d1" stroke-width="2"/>
  <circle cx="230" cy="112" r="7" fill="#e6d3b6"/>
  <circle cx="600" cy="112" r="7" fill="#e6d3b6"/>
  <circle cx="970" cy="112" r="7" fill="#256a5e"/>

  <!-- 15.1.1 -->
  <g transform="translate(60 132)">
    <rect width="340" height="318" rx="20" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="32" class="capA">15.1.1 · 2026-07-17 · BEFORE</text>
    <g transform="translate(22 48)">
      <rect width="296" height="86" rx="10" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="12" y="22" class="code">abstract: z.boolean()</text>
      <text x="12" y="40" class="code">&#160;&#160;.optional().default(false)</text>
      <text x="12" y="58" class="code">&#160;&#160;.describe('Is abstract base</text>
      <text x="12" y="76" class="code">&#160;&#160;object (cannot be instantiated)')</text>
    </g>
    <text x="22" y="164" class="strong">Ledger: dead · no runtime reader</text>
    <text x="22" y="188" class="row">An abstract object still gets a table</text>
    <text x="22" y="208" class="row">and is instantiable.</text>
    <g transform="translate(22 236)">
      <rect width="296" height="60" rx="12" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="16" y="25" class="verdictA">Parsed, unread.</text>
      <text x="16" y="45" class="sub">create() accepts · parse() accepts</text>
    </g>
  </g>

  <!-- 16.0.0 -->
  <g transform="translate(430 132)">
    <rect width="340" height="318" rx="20" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="32" class="capA">16.0.0 · 2026-07-21</text>
    <g transform="translate(22 48)">
      <rect width="296" height="86" rx="10" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="12" y="24" class="strong">ADR-0049: enforce it, or remove it</text>
      <text x="12" y="46" class="row">No committed inheritance feature,</text>
      <text x="12" y="66" class="row">so the key is removed.</text>
    </g>
    <text x="22" y="164" class="strong">create(): throws, naming the removal</text>
    <text x="22" y="188" class="row">parse(): still strips the key silently —</text>
    <text x="22" y="208" class="row">the authoring path closed, the parse path not.</text>
    <g transform="translate(22 236)">
      <rect width="296" height="60" rx="12" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="16" y="25" class="verdictA">Half closed.</text>
      <text x="16" y="45" class="sub">one entry point of two</text>
    </g>
  </g>

  <!-- 17.7.0 -->
  <g transform="translate(800 132)">
    <rect width="340" height="318" rx="20" fill="#eef7f2" stroke="#256a5e" stroke-width="2"/>
    <text x="22" y="32" class="capB">17.7.0 · 2026-10-06 · AFTER</text>
    <g transform="translate(22 48)">
      <rect width="296" height="86" rx="10" fill="#ffffff" stroke="#b9dcd0"/>
      <text x="12" y="22" class="code">Unrecognized key(s) on this</text>
      <text x="12" y="40" class="code">object: `abstract`.</text>
      <text x="12" y="58" class="code">&#160;&#160;• abstract was removed from the</text>
      <text x="12" y="76" class="code">&#160;&#160;spec (ADR-0049) … Remove the key.</text>
    </g>
    <text x="22" y="164" class="strong">Tombstone, with the prescription</text>
    <text x="22" y="188" class="row">Object inheritance/abstraction is not</text>
    <text x="22" y="208" class="row">implemented. Remove the key.</text>
    <g transform="translate(22 236)">
      <rect width="296" height="60" rx="12" fill="#ffffff" stroke="#256a5e" stroke-width="1.5"/>
      <text x="16" y="25" class="verdictB">A reader for every key.</text>
      <text x="16" y="45" class="sub">create() throws · parse() rejects</text>
    </g>
  </g>

  <!-- ADR-0049 states -->
  <text x="60" y="490" class="cap">ADR-0049 — A KEY IS IN EXACTLY ONE OF THREE STATES</text>
  <g transform="translate(60 502)">
    <rect width="350" height="56" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="24" class="chipT">Enforced</text>
    <text x="18" y="44" class="chipS">a runtime reader changes a decision</text>
  </g>
  <g transform="translate(425 502)">
    <rect width="350" height="56" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="24" class="chipT">Experimental</text>
    <text x="18" y="44" class="chipS">marked and documented as not enforced</text>
  </g>
  <g transform="translate(790 502)">
    <rect width="350" height="56" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="24" class="chipT">Absent</text>
    <text x="18" y="44" class="chipS">removed from the spec</text>
  </g>
  <text x="60" y="582" class="small">The fourth state — parsed, unmarked, unenforced — is prohibited. abstract had no reader and no committed feature, so it is absent.</text>
  <text x="60" y="602" class="small">Sources: @objectstack/spec 15.1.1, 16.0.0 and 17.7.0 on npm; packages/spec/src/data/object.zod.ts; docs/adr/0049; packages/spec/liveness/README.md.</text>
</svg>
