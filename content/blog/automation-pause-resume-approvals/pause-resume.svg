<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="暂停和恢复让审批进入同一条流程">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.h{font-size:30px;font-weight:780}.t{font-size:18px;font-weight:740}.s{font-size:14px;fill:#647872}.box{fill:#fffefa;stroke:#d7dfdb}.green{fill:#eef7f3}.yellow{fill:#fff3d6}.blue{fill:#edf2ff}.red{fill:#fff0ec}.dark{fill:#173a36}.white{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f8faf8"/>
  <text x="70" y="64" class="h">长流程需要保存上下文，再从正确节点继续</text>
  <g transform="translate(70 108)">
    <rect width="1060" height="418" rx="30" class="box"/>
    <g transform="translate(48 76)">
      <rect width="160" height="86" rx="22" class="green"/>
      <text x="80" y="35" text-anchor="middle" class="t">开始</text>
      <text x="80" y="60" text-anchor="middle" class="s">业务触发</text>
    </g>
    <g transform="translate(272 76)">
      <rect width="160" height="86" rx="22" class="yellow"/>
      <text x="80" y="35" text-anchor="middle" class="t">判断</text>
      <text x="80" y="60" text-anchor="middle" class="s">是否需审批</text>
    </g>
    <g transform="translate(496 76)">
      <rect width="160" height="86" rx="22" class="dark"/>
      <text x="80" y="35" text-anchor="middle" class="white" font-size="18" font-weight="760">暂停</text>
      <text x="80" y="60" text-anchor="middle" class="soft" font-size="14">等待信号</text>
    </g>
    <g transform="translate(720 76)">
      <rect width="170" height="86" rx="22" class="blue"/>
      <text x="85" y="35" text-anchor="middle" class="t">恢复分支</text>
      <text x="85" y="60" text-anchor="middle" class="s">批准 / 拒绝</text>
    </g>
    <path d="M212 119 H268 M436 119 H492 M660 119 H716" stroke="#2a7468" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(290 248)">
      <rect width="200" height="82" rx="22" class="box"/>
      <text x="100" y="35" text-anchor="middle" class="t">保存上下文</text>
      <text x="100" y="58" text-anchor="middle" class="s">变量 / 节点 / 日志</text>
    </g>
    <g transform="translate(570 248)">
      <rect width="200" height="82" rx="22" class="red"/>
      <text x="100" y="35" text-anchor="middle" class="t">超时升级</text>
      <text x="100" y="58" text-anchor="middle" class="s">流程仍可继续</text>
    </g>
    <path d="M576 164 V244 M805 164 C805 214 670 214 670 244" fill="none" stroke="#d46b5f" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
