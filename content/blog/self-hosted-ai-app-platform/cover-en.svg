      <text x="32" y="54" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">AI</text>
      <text x="32" y="90" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="18">Agents</text>
    </g>
    <g transform="translate(478 390)">
      <rect width="224" height="54" rx="14" fill="#142033" stroke="#60a5fa" stroke-dasharray="8 8"/>
      <text x="112" y="34" text-anchor="middle" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">ObjectOS · optional ops</text>
    </g>
    <path d="M400 336H438V417H478" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
    <g transform="translate(120 470)">
      <rect width="170" height="94" rx="16" fill="#152033" stroke="#475569"/>
      <text x="34" y="58" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">DB</text>
    </g>
    <g transform="translate(342 470)">
      <rect width="170" height="94" rx="16" fill="#152033" stroke="#475569"/>
      <text x="34" y="58" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">SSO</text>
    </g>
    <g transform="translate(564 470)">
      <rect width="170" height="94" rx="16" fill="#152033" stroke="#475569"/>
      <text x="34" y="58" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Files</text>
    </g>
    <g stroke="#10b981" stroke-width="4" stroke-linecap="round" opacity=".82">
      <path d="M400 303H478"/>
      <path d="M205 470V366"/>
      <path d="M427 470V366"/>
      <path d="M649 470V366"/>
    </g>
    <g transform="translate(890 190)">
