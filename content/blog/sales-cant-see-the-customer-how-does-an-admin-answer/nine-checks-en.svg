<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 694" role="img" aria-label="The explain report for one read of Customers, before and after the fix: nine checks in enforcement order. Before, object permissions refused, because the rep held only the two bundles every member gets. After the admin assigned the Sales Representative position, object permissions granted the read through CRM Sales User. Every other check was neutral or did not apply. Asked about one record, the report adds a tenth check first, the organization wall.">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5e716b}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#2a7468}
      .name{font-size:17px;font-weight:700}
      .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;fill:#5e716b}
      .pill{font-size:14px;font-weight:700}
      .pw{fill:#ffffff}
      .pn{fill:#3f514b}
      .px{fill:#7a8a84}
      .foot{font-size:14px;fill:#3f514b}
    </style>
  </defs>
  <rect width="1200" height="694" fill="#fbfdfc"/>
  <text x="60" y="52" class="h">One question, nine checks: why the new rep could not open Customers</text>
  <text x="60" y="80" class="note">The explain report for "may this rep read customers?", before and after the admin assigned a position. ObjectStack 18.6.0, CRM example.</text>
  <text x="84" y="124" class="cap">CHECK, IN ENFORCEMENT ORDER</text>
  <text x="620" y="124" class="cap">BEFORE: NO POSITION</text>
  <text x="900" y="124" class="cap">AFTER: SALES REPRESENTATIVE</text>
  <rect x="60" y="144" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="172" class="name">1. Who is asking</text>
  <text x="372" y="171" class="code">principal</text>
  <rect x="606" y="151" width="268" height="30" rx="15" fill="#e3ece8"/>
  <text x="740" y="171" class="pill pn" text-anchor="middle">2 member bundles</text>
  <rect x="886" y="151" width="240" height="30" rx="15" fill="#e3ece8"/>
  <text x="1006" y="171" class="pill pn" text-anchor="middle">+ Sales Representative</text>
  <rect x="60" y="196" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="224" class="name">2. Required capabilities</text>
  <text x="372" y="223" class="code">required_permissions</text>
  <rect x="606" y="203" width="268" height="30" rx="15" fill="#f2f5f4"/>
  <text x="740" y="223" class="pill px" text-anchor="middle">does not apply</text>
  <rect x="886" y="203" width="240" height="30" rx="15" fill="#f2f5f4"/>
  <text x="1006" y="223" class="pill px" text-anchor="middle">does not apply</text>
  <rect x="60" y="248" width="1080" height="44" rx="12" fill="#eef6f1" stroke="#2a7468" stroke-width="2"/>
  <text x="84" y="276" class="name">3. Object permissions</text>
  <text x="372" y="275" class="code">object_crud</text>
  <rect x="606" y="255" width="268" height="30" rx="15" fill="#bd4b4b"/>
  <text x="740" y="275" class="pill pw" text-anchor="middle">REFUSED: no bundle grants read</text>
  <rect x="886" y="255" width="240" height="30" rx="15" fill="#087f5b"/>
  <text x="1006" y="275" class="pill pw" text-anchor="middle">GRANTED by CRM Sales User</text>
  <rect x="60" y="300" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="328" class="name">4. Field masking</text>
  <text x="372" y="327" class="code">fls</text>
  <rect x="606" y="307" width="268" height="30" rx="15" fill="#f2f5f4"/>
  <text x="740" y="327" class="pill px" text-anchor="middle">does not apply</text>
  <rect x="886" y="307" width="240" height="30" rx="15" fill="#f2f5f4"/>
  <text x="1006" y="327" class="pill px" text-anchor="middle">does not apply</text>
  <rect x="60" y="352" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="380" class="name">5. Record baseline</text>
  <text x="372" y="379" class="code">owd_baseline</text>
  <rect x="606" y="359" width="268" height="30" rx="15" fill="#e3ece8"/>
  <text x="740" y="379" class="pill pn" text-anchor="middle">shared org-wide</text>
  <rect x="886" y="359" width="240" height="30" rx="15" fill="#e3ece8"/>
  <text x="1006" y="379" class="pill pn" text-anchor="middle">shared org-wide</text>
  <rect x="60" y="404" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="432" class="name">6. Depth</text>
  <text x="372" y="431" class="code">depth</text>
  <rect x="606" y="411" width="268" height="30" rx="15" fill="#f2f5f4"/>
  <text x="740" y="431" class="pill px" text-anchor="middle">does not apply</text>
  <rect x="886" y="411" width="240" height="30" rx="15" fill="#f2f5f4"/>
  <text x="1006" y="431" class="pill px" text-anchor="middle">does not apply</text>
  <rect x="60" y="456" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="484" class="name">7. Sharing</text>
  <text x="372" y="483" class="code">sharing</text>
  <rect x="606" y="463" width="268" height="30" rx="15" fill="#f2f5f4"/>
  <text x="740" y="483" class="pill px" text-anchor="middle">does not apply</text>
  <rect x="886" y="463" width="240" height="30" rx="15" fill="#f2f5f4"/>
  <text x="1006" y="483" class="pill px" text-anchor="middle">does not apply</text>
  <rect x="60" y="508" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="536" class="name">8. View/modify-all bypass</text>
  <text x="372" y="535" class="code">vama_bypass</text>
  <rect x="606" y="515" width="268" height="30" rx="15" fill="#f2f5f4"/>
  <text x="740" y="535" class="pill px" text-anchor="middle">does not apply</text>
  <rect x="886" y="515" width="240" height="30" rx="15" fill="#f2f5f4"/>
  <text x="1006" y="535" class="pill px" text-anchor="middle">does not apply</text>
  <rect x="60" y="560" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="588" class="name">9. Row-level security</text>
  <text x="372" y="587" class="code">rls</text>
  <rect x="606" y="567" width="268" height="30" rx="15" fill="#f2f5f4"/>
  <text x="740" y="587" class="pill px" text-anchor="middle">does not apply</text>
  <rect x="886" y="567" width="240" height="30" rx="15" fill="#f2f5f4"/>
  <text x="1006" y="587" class="pill px" text-anchor="middle">row filter: none</text>
  <text x="84" y="642" class="foot">After: the grant is held through the Sales Representative position. Row filter: none, so the rep sees every customer (3 of 3).</text>
  <text x="84" y="668" class="foot">Asked about one record instead of the whole object, the report adds a tenth check first: the organization wall.</text>
</svg>
