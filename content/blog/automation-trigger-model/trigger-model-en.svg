<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Five entry points resolve to four trigger types, pass one shared start condition gate, and produce one run record stamped with its trigger">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}.t{font-size:16px;font-weight:730}
      .s{font-size:12px;fill:#647872}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;fill:#647872}
      .col{font-size:13px;font-weight:700;fill:#5d736b;letter-spacing:.08em}
      .box{fill:#fffefa;stroke:#d7dfdb}.dark{fill:#173a36}.white{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f8faf8"/>
  <text x="70" y="56" class="h">Different doors. One gate, one identity rule, one run record.</text>

  <text x="70" y="96" class="col">ENTRY POINT</text>
  <text x="392" y="96" class="col">RESOLVES TO</text>
  <text x="646" y="96" class="col">SHARED RUNTIME</text>
  <text x="968" y="96" class="col">EVIDENCE</text>

  <!-- entry points -->
  <g transform="translate(70 112)">
    <rect width="248" height="62" rx="16" fill="#eef7f3" stroke="#bdd7cf"/>
    <text x="18" y="27" class="t">A record changes</text>
    <text x="18" y="48" class="s">status, amount, risk level</text>

    <rect y="80" width="248" height="62" rx="16" fill="#fff3d6" stroke="#efc86c"/>
    <text x="18" y="107" class="t">A date approaches</text>
    <text x="18" y="128" class="s">60 days before expiry</text>

    <rect y="160" width="248" height="62" rx="16" fill="#f2f0fb" stroke="#c9c2e6"/>
    <text x="18" y="187" class="t">The clock ticks</text>
    <text x="18" y="208" class="s">every day at 08:00</text>

    <rect y="240" width="248" height="62" rx="16" fill="#edf2ff" stroke="#bdc8ee"/>
    <text x="18" y="267" class="t">An external system posts</text>
    <text x="18" y="288" class="s">e-signature, payment, portal</text>

    <rect y="320" width="248" height="62" rx="16" fill="#f4f6f5" stroke="#cfd8d3" stroke-dasharray="6 5"/>
    <text x="18" y="347" class="t">A person clicks</text>
    <text x="18" y="368" class="s">invoked, not triggered</text>
  </g>

  <!-- resolved trigger types -->
  <g transform="translate(392 112)">
    <rect width="200" height="62" rx="16" class="box"/>
    <text x="16" y="28" class="mono" font-size="13" fill="#173a36">record_change</text>
    <text x="16" y="48" class="s">closed token grammar</text>

    <rect y="80" width="200" height="62" rx="16" class="box"/>
    <text x="16" y="108" class="mono" font-size="13" fill="#173a36">time_relative</text>
    <text x="16" y="128" class="s">once per matching record</text>

    <rect y="160" width="200" height="62" rx="16" class="box"/>
    <text x="16" y="188" class="mono" font-size="13" fill="#173a36">schedule</text>
    <text x="16" y="208" class="s">cron · interval · once</text>

    <rect y="240" width="200" height="62" rx="16" class="box"/>
    <text x="16" y="268" class="mono" font-size="13" fill="#173a36">api</text>
    <text x="16" y="288" class="s">202, then queued</text>

    <rect y="320" width="200" height="62" rx="16" fill="#f4f6f5" stroke="#cfd8d3" stroke-dasharray="6 5"/>
    <text x="16" y="348" class="mono" font-size="13" fill="#647872">no binding</text>
    <text x="16" y="368" class="s">bound: false, by design</text>
  </g>

  <!-- shared runtime -->
  <g transform="translate(646 140)">
    <rect width="252" height="326" rx="26" class="dark"/>
    <text x="126" y="48" text-anchor="middle" class="white" font-size="17" font-weight="770">One flow runtime</text>
    <g transform="translate(24 74)">
      <rect width="204" height="56" rx="14" fill="#215c50"/>
      <text x="102" y="26" text-anchor="middle" class="white" font-size="13" font-weight="700">Start condition gate</text>
      <text x="102" y="45" text-anchor="middle" class="soft" font-size="11">evaluated by the engine</text>

      <rect y="72" width="204" height="56" rx="14" fill="#215c50"/>
      <text x="102" y="98" text-anchor="middle" class="white" font-size="13" font-weight="700">runAs identity</text>
      <text x="102" y="117" text-anchor="middle" class="soft" font-size="11">no user, no silent elevation</text>

      <rect y="144" width="204" height="56" rx="14" fill="#215c50"/>
      <text x="102" y="170" text-anchor="middle" class="white" font-size="13" font-weight="700">Conditions · actions</text>
      <text x="102" y="189" text-anchor="middle" class="soft" font-size="11">approval · wait · notify</text>
    </g>
  </g>

  <!-- evidence -->
  <g transform="translate(942 140)">
    <rect width="188" height="326" rx="26" class="box"/>
    <text x="94" y="42" text-anchor="middle" class="t">One run row</text>
    <g transform="translate(20 66)">
      <rect width="148" height="52" rx="12" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="14" y="22" class="mono">triggerType</text>
      <text x="14" y="40" class="s">why it ran</text>

      <rect y="66" width="148" height="52" rx="12" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="14" y="88" class="mono">triggerObject</text>
      <text x="14" y="106" class="s">what it ran on</text>

      <rect y="132" width="148" height="52" rx="12" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="14" y="154" class="mono">triggerRecordId</text>
      <text x="14" y="172" class="s">which row caused it</text>

      <rect y="198" width="148" height="46" rx="12" fill="#fff3d6" stroke="#efc86c"/>
      <text x="74" y="220" text-anchor="middle" class="s" font-size="11">absent means</text>
      <text x="74" y="236" text-anchor="middle" class="s" font-size="11">not recorded</text>
    </g>
  </g>

  <!-- connectors -->
  <path d="M322 143 H388 M322 223 H388 M322 303 H388 M322 383 H388 M322 463 H388"
        stroke="#2a7468" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M596 143 C624 143 622 303 642 303 M596 223 C624 223 626 303 642 303 M596 303 H642 M596 383 C624 383 626 303 642 303 M596 463 C624 463 626 303 642 303"
        stroke="#2a7468" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M902 303 H938" stroke="#2a7468" stroke-width="3" stroke-linecap="round" fill="none"/>

  <text x="70" y="556" class="s">The dashed row is the deliberate exception: a button has no event source, so it declares no binding — and still runs through the same gate.</text>
  <text x="70" y="582" class="s">Anything that resolves to none of the four, and did not mean to, fails os validate and the runtime publish gate rather than going quiet.</text>
</svg>
