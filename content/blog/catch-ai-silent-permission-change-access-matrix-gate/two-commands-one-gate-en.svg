<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Two commands, one gate: the same one-word edit goes through os validate, which parses the stack, runs the 53 author-time rules and passes with exit 0 because no rule reads the value of allowDelete, and through os compile, which runs the same rules, then derives the access matrix from the metadata, diffs it against the committed access-matrix.json and fails the build with exit 1 and the line 'crm_sales_user' gains delete on 'crm_opportunity'; the human loop is os compile --update-access-matrix, git diff -U8 access-matrix.json, and the next compile passes; the snapshot has seven entries, one per permission set and object, with effective create, read, edit and delete bits, the raw View All and Modify All bits as context, read and write depth and the object's record baseline">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#4b5d56}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em}
      .chip{font-size:13px;font-weight:700}
      .label{font-size:16px;font-weight:760}
      .small{font-size:13px;fill:#4b5d56}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600}
      .num{font-size:44px;font-weight:800;fill:#2a7468}
      .teal{fill:#2a7468}
      .amber{fill:#8a6a3a}
      .red{fill:#a8432c}
      .white{fill:#ffffff}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">Two commands, one gate: the same edit through os validate and os compile</text>
  <text x="60" y="80" class="note">os validate runs the registry of author-time rules. os compile runs the same rules, then one more step the registry does not contain.</text>

  <!-- THE EDIT -->
  <g transform="translate(60 112)">
    <rect width="300" height="120" rx="18" fill="#fdf4e8" stroke="#d9b98c" stroke-width="2"/>
    <text x="20" y="30" class="cap amber">THE EDIT — ONE WORD</text>
    <text x="20" y="56" class="mono">src/security/sales-positions.ts:50</text>
    <text x="20" y="74" class="mono">crm_opportunity:</text>
    <text x="20" y="92" class="mono red">- allowDelete: false</text>
    <text x="20" y="110" class="mono teal">+ allowDelete: true</text>
  </g>

  <!-- edit → lanes -->
  <line x1="362" y1="172" x2="396" y2="172" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M362 190 H380 V322 H396" fill="none" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- LANE A: os validate -->
  <g transform="translate(400 112)">
    <rect width="740" height="120" rx="18" fill="#f4faf7" stroke="#2a7468" stroke-width="1.5"/>
    <text x="24" y="30" class="cap teal">OS VALIDATE</text>
    <g transform="translate(24 46)"><rect width="100" height="34" rx="10" fill="#ffffff" stroke="#c9d8d1"/><text x="50" y="22" class="chip" text-anchor="middle">Zod parse</text></g>
    <line x1="126" y1="63" x2="144" y2="63" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(148 46)"><rect width="176" height="34" rx="10" fill="#ffffff" stroke="#c9d8d1"/><text x="88" y="22" class="chip" text-anchor="middle">53 author-time rules</text></g>
    <line x1="326" y1="63" x2="344" y2="63" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(348 46)"><rect width="300" height="34" rx="10" fill="#2a7468"/><text x="150" y="22" class="chip white" text-anchor="middle">✓ Validation passed · exit 0</text></g>
    <text x="24" y="104" class="small">No rule reads the value of allowDelete: both values are valid and enforceable. Nothing names a matrix.</text>
  </g>

  <!-- LANE B: os compile -->
  <g transform="translate(400 262)">
    <rect width="740" height="340" rx="18" fill="#f7faf9" stroke="#2a7468" stroke-width="1.5"/>
    <text x="24" y="30" class="cap teal">OS COMPILE · OS BUILD IS AN ALIAS</text>
    <g transform="translate(24 46)"><rect width="100" height="34" rx="10" fill="#ffffff" stroke="#c9d8d1"/><text x="50" y="22" class="chip" text-anchor="middle">Zod parse</text></g>
    <line x1="126" y1="63" x2="144" y2="63" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(148 46)"><rect width="176" height="34" rx="10" fill="#ffffff" stroke="#c9d8d1"/><text x="88" y="22" class="chip" text-anchor="middle">53 author-time rules</text></g>
    <line x1="326" y1="63" x2="344" y2="63" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(348 46)"><rect width="300" height="34" rx="10" fill="#fdf4e8" stroke="#d9b98c"/><text x="150" y="22" class="chip amber" text-anchor="middle">derive the matrix from the metadata</text></g>
    <path d="M498 82 V90 H189 V96" fill="none" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(24 98)"><rect width="330" height="34" rx="10" fill="#fdf4e8" stroke="#d9b98c"/><text x="165" y="22" class="chip amber" text-anchor="middle">diff against committed access-matrix.json</text></g>
    <line x1="356" y1="115" x2="374" y2="115" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(378 98)"><rect width="338" height="34" rx="10" fill="#a8432c"/><text x="169" y="22" class="chip white" text-anchor="middle">✗ Access matrix drift (1 change) · exit 1</text></g>
    <text x="24" y="158" class="mono red">• 'crm_sales_user' gains delete on 'crm_opportunity'</text>
    <text x="24" y="178" class="small">If intended, re-run with --update-access-matrix and commit the snapshot — its diff IS the review artifact.</text>

    <text x="24" y="214" class="cap teal">THE HUMAN LOOP — THREE COMMANDS</text>
    <g transform="translate(24 228)"><rect width="260" height="34" rx="10" fill="#ffffff" stroke="#2a7468"/><text x="130" y="22" class="mono" text-anchor="middle">os compile --update-access-matrix</text></g>
    <line x1="286" y1="245" x2="304" y2="245" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(308 228)"><rect width="250" height="34" rx="10" fill="#ffffff" stroke="#2a7468"/><text x="125" y="22" class="mono" text-anchor="middle">git diff -U8 access-matrix.json</text></g>
    <line x1="560" y1="245" x2="578" y2="245" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(582 228)"><rect width="140" height="34" rx="10" fill="#2a7468"/><text x="70" y="22" class="chip white" text-anchor="middle">next compile ✓</text></g>
    <text x="24" y="290" class="small">No access-matrix.json next to objectstack.config.ts → the gate is skipped (not opted in).</text>
    <text x="24" y="308" class="small">--update-access-matrix rewrites the whole file: compare its hunks with the semantic lines, one for one.</text>
  </g>

  <!-- THE SNAPSHOT -->
  <g transform="translate(60 262)">
    <rect width="300" height="340" rx="18" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="20" y="30" class="cap teal">SNAPSHOT: ACCESS-MATRIX.JSON</text>
    <text x="20" y="84" class="num">7</text>
    <text x="62" y="66" class="label">entries in the CRM</text>
    <text x="62" y="88" class="small">one per permission set × object</text>
    <text x="20" y="128" class="small">create · read · edit · delete — effective</text>
    <text x="20" y="150" class="small">View All · Modify All — raw, as context</text>
    <text x="20" y="172" class="small">read / write depth</text>
    <text x="20" y="194" class="small">sharingModel — the object's OWD</text>
    <text x="20" y="216" class="small">sorted, so every diff is stable</text>
    <text x="20" y="238" class="small">committed next to objectstack.config.ts</text>
    <text x="20" y="286" class="small teal">Six rows for crm_sales_user,</text>
    <text x="20" y="304" class="small teal">one insert-only row for guest_portal.</text>
  </g>

  <text x="60" y="630" class="small">Measured on examples/app-crm at @objectstack/cli 18.2.0. The drift line is quoted from the run; the line shapes come from diffAccessMatrix in @objectstack/lint.</text>
</svg>
