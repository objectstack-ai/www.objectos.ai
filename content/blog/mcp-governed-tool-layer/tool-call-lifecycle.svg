<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="一次受治理的工具调用的生命周期：以用户身份发起、运行时核验权限、执行受控动作、写入审计">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#24342f" flood-opacity=".12"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .cap{font-size:14px;fill:#5d736b}.t{font-size:16px;font-weight:700}.s{font-size:13px;fill:#5d736b}
    </style>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="48" y="46" font-size="21" font-weight="760">同一个动作，agent 走的是和人一模一样的关卡</text>
  <text x="48" y="74" class="cap">"裸接口"省掉了中间三步——这正是 agent 变成超级用户的地方</text>

  <!-- step 1 -->
  <g transform="translate(48 120)" filter="url(#sh)">
    <rect width="190" height="120" rx="16" fill="#eef7f1"/>
    <text x="20" y="36" class="t">1 · 发起调用</text>
    <text x="20" y="64" class="s">agent 以"张三"的</text>
    <text x="20" y="84" class="s">身份请求改折扣</text>
    <text x="20" y="104" class="s">——不是匿名超级用户</text>
  </g>
  <!-- step 2 -->
  <g transform="translate(268 120)" filter="url(#sh)">
    <rect width="190" height="120" rx="16" fill="#22433d"/>
    <text x="20" y="36" class="t" fill="#eafff6">2 · 核验权限</text>
    <text x="20" y="64" class="s" fill="#a9c4ba">运行时查张三的</text>
    <text x="20" y="84" class="s" fill="#a9c4ba">权限集：能改吗？</text>
    <text x="20" y="104" class="s" fill="#a9c4ba">越权 → 当场拒绝</text>
  </g>
  <!-- step 3 -->
  <g transform="translate(488 120)" filter="url(#sh)">
    <rect width="190" height="120" rx="16" fill="#eef7f1"/>
    <text x="20" y="36" class="t">3 · 受控执行</text>
    <text x="20" y="64" class="s">折扣 &gt; 30%？</text>
    <text x="20" y="84" class="s">命中流程 → 等审批</text>
    <text x="20" y="104" class="s">通过后才落库</text>
  </g>
  <!-- step 4 -->
  <g transform="translate(708 120)" filter="url(#sh)">
    <rect width="244" height="120" rx="16" fill="#fff3df"/>
    <text x="20" y="36" class="t" fill="#9a6212">4 · 写入审计</text>
    <text x="20" y="64" class="s">谁 · 做了什么 · 何时</text>
    <text x="20" y="84" class="s">依据哪条权限 · 谁批的</text>
    <text x="20" y="104" class="s">与人的操作同一本账</text>
  </g>

  <!-- arrows -->
  <g stroke="#e8b04b" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M238 180 h30"/><path d="M458 180 h30"/><path d="M678 180 h30"/>
  </g>

  <text x="48" y="300" class="cap">MCP / A2A 负责"怎么连"——这四步负责"连上之后，准不准做、记不记账"。</text>
  <text x="48" y="324" class="cap">企业缺的从来不是连接协议，而是协议背后这个会强制权限、会留痕的工具层。</text>
</svg>
