<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" role="img" aria-label="存放企业知识的三条路。第一条路，训练进模型：知识进了模型的权重，无从查看，无从审计。第二条路，放在外面当说明书：模型读的是知识图谱或语义层；要行动还得另接一套系统。第三条路，放在外面，而且能运行：本体和运行时是同一台机器，模型读写它，系统运行它，Agent 通过它行动。">
  <defs><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f8b81"/></marker><marker id="ar-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c7a55"/></marker><marker id="ar-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b07a1a"/></marker><marker id="ar-onInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8cdc2"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style></defs>
  <rect width="900" height="392" fill="#f8faf7"/>
  <g transform="translate(30 30)">
    <text x="0" y="12" font-size="12" font-weight="700" fill="#1c7a55" text-anchor="start">第一条路</text>
    <text x="0" y="32" font-size="16" font-weight="700" fill="#173a36" text-anchor="start">训练进模型</text>
    <rect x="0" y="44" width="264" height="200" rx="14" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <circle cx="132" cy="144" r="74" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="132" y="134" font-size="17" font-weight="700" fill="#173a36" text-anchor="middle">模型</text>
    <text x="132" y="152" font-size="12" font-weight="400" fill="#5d736b" text-anchor="middle">知识在</text>
    <text x="132" y="167" font-size="12" font-weight="400" fill="#5d736b" text-anchor="middle">权重里</text>
    <text x="0" y="260" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">改一条规则，就得重训。</text>
    <text x="0" y="278" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">无从查看，无从审计。</text>
    <text x="0" y="296" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">换一个模型，全部归零。</text>
    <text x="288" y="12" font-size="12" font-weight="700" fill="#1c7a55" text-anchor="start">第二条路</text>
    <text x="288" y="32" font-size="16" font-weight="700" fill="#173a36" text-anchor="start">放在外面，当说明书</text>
    <rect x="288" y="44" width="264" height="200" rx="14" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <circle cx="336" cy="128" r="40" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="336" y="133" font-size="15" font-weight="700" fill="#173a36" text-anchor="middle">模型</text>
    <rect x="416" y="90" width="128" height="76" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="426" y="114" font-size="14" font-weight="700" fill="#173a36" text-anchor="start">说明书</text>
    <text x="426" y="135.5" font-size="12" font-weight="400" fill="#5d736b" text-anchor="start">知识图谱</text>
    <text x="426" y="152.9" font-size="12" font-weight="400" fill="#5d736b" text-anchor="start">语义层</text>
    <path d="M414 128 L378 128" fill="none" stroke="#1c7a55" stroke-width="1.6" marker-end="url(#ar-accent)"/>
    <text x="396" y="115" font-size="12" font-weight="600" fill="#1c7a55" text-anchor="middle">读</text>
    <rect x="416" y="184" width="128" height="44" rx="10" fill="none" stroke="#6f8b81" stroke-dasharray="5 4" stroke-width="1"/>
    <text x="480" y="210.312" font-size="11.5" font-weight="700" fill="#5d736b" text-anchor="middle">业务系统</text>
    <path d="M336 170 L336 206 L414 206" fill="none" stroke="#6f8b81" stroke-width="1.6" marker-end="url(#ar-grey)" stroke-dasharray="5 4"/>
    <text x="296" y="230" font-size="12" font-weight="400" fill="#5d736b" text-anchor="start">要行动，再接一套</text>
    <text x="288" y="260" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">模型读得懂它，但读到的</text>
    <text x="288" y="278" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">只是描述。行动要靠另一套</text>
    <text x="288" y="296" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">系统，权限又是另一套。</text>
    <text x="576" y="12" font-size="12" font-weight="700" fill="#1c7a55" text-anchor="start">第三条路</text>
    <text x="576" y="32" font-size="16" font-weight="700" fill="#173a36" text-anchor="start">放在外面，而且能运行</text>
    <rect x="576" y="44" width="264" height="200" rx="14" fill="#22433d" stroke="#22433d" stroke-width="1"/>
    <circle cx="626" cy="136" r="40" fill="#f8faf7" stroke="#f8faf7" stroke-width="1"/>
    <text x="626" y="141" font-size="15" font-weight="700" fill="#173a36" text-anchor="middle">模型</text>
    <rect x="708" y="84" width="120" height="104" rx="12" fill="#1c7a55" stroke="#1c7a55" stroke-width="1"/>
    <text x="768" y="122.875" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">本体</text>
    <text x="768" y="141.625" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>
    <text x="768" y="160.375" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">运行时</text>
    <path d="M668 136 L706 136" fill="none" stroke="#a8cdc2" stroke-width="1.6" marker-end="url(#ar-onInk)" marker-start="url(#ar-onInk)"/>
    <text x="673" y="66" font-size="12" font-weight="600" fill="#a8cdc2" text-anchor="middle">读 · 写</text>
    <path d="M768 210 L768 190" fill="none" stroke="#a8cdc2" stroke-width="1.6" marker-end="url(#ar-onInk)"/>
    <rect x="708" y="210" width="120" height="26" rx="8" fill="#f8faf7" stroke="#f8faf7" stroke-width="1"/>
    <text x="768" y="227.688" font-size="12.5" font-weight="700" fill="#173a36" text-anchor="middle">Agent 调用它</text>
    <text x="576" y="260" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">写得足够精确，本体就不是说明书。</text>
    <text x="576" y="278" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">模型读写它，系统运行它，</text>
    <text x="576" y="296" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">Agent 通过它行动。</text>
  </g>
</svg>
