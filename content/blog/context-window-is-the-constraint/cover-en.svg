<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The constraint is not typing speed but the context window: a conventional codebase no longer fits in the agent’s head after a few weeks, while a whole ontology does">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8faf7"/><stop offset=".55" stop-color="#eef7f2"/><stop offset="1" stop-color="#fff3df"/></linearGradient><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f8b81"/></marker><marker id="ar-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c7a55"/></marker><marker id="ar-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b07a1a"/></marker><marker id="ar-onInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8cdc2"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g transform="translate(0 0)">
    <text x="96" y="76" font-size="16" font-weight="700" fill="#5d736b" text-anchor="start">WHY AI CAN WRITE AN APP AND STILL NOT MAINTAIN IT</text>
    <text x="96" y="158" font-size="52" font-weight="780" fill="#173a36" text-anchor="start">The constraint isn’t typing speed.</text>
    <text x="96" y="222" font-size="52" font-weight="780" fill="#1c7a55" text-anchor="start">It’s the context window.</text>
    <rect x="96" y="290" width="492" height="326" rx="18" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="126" y="334" font-size="21" font-weight="760" fill="#173a36" text-anchor="start">A conventional codebase</text>
    <text x="126" y="362" font-size="15" font-weight="400" fill="#5d736b" text-anchor="start">One change: twelve files, maybe thirty.</text>
    <rect x="126" y="386" width="300" height="196" rx="12" fill="none" stroke="#1c7a55" stroke-width="2" stroke-dasharray="7 6"/>
