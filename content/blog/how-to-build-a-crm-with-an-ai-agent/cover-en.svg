<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Build receipt for a CRM written by an AI agent: 7 files, 308 lines, 2,406 tokens, 54 generated API operations, 4 defects caught before human review">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .kicker{font-size:19px;font-weight:700;fill:#0f766e;letter-spacing:.14em}
      .h1{font-size:52px;font-weight:800}
      .h1b{font-size:52px;font-weight:800;fill:#0f766e}
      .sub{font-size:21px;fill:#5d736b}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
      .rowk{font-size:19px;fill:#5d736b}
      .rowv{font-size:26px;font-weight:800}
      .big{font-size:64px;font-weight:800;fill:#0f766e}
      .bigu{font-size:20px;fill:#5d736b;font-weight:600}
      .caught{font-size:19px;font-weight:700;fill:#b45309}
      .cnum{font-size:44px;font-weight:800;fill:#b45309}
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <text class="kicker" x="86" y="96">ONE COMPLETE BUILD</text>
  <text class="h1" x="86" y="164">A CRM written by an agent,</text>
  <text class="h1b" x="86" y="226">reviewed as a small diff.</text>
  <text class="sub" x="86" y="276">Accounts · Contacts · Deals · one approval flow · one permission set</text>

  <!-- receipt card -->
  <g filter="url(#shadow)">
    <rect x="86" y="326" width="580" height="272" rx="20" fill="#ffffff"/>
  </g>
  <rect x="86" y="326" width="580" height="52" rx="20" fill="url(#teal)"/>
  <rect x="86" y="358" width="580" height="20" fill="url(#teal)"/>
  <text class="mono" x="112" y="360" font-size="18" font-weight="700" fill="#ffffff">npx create-objectstack@latest crm</text>

  <g>
    <text class="rowk" x="112" y="424">Files</text>
    <text class="rowv" x="112" y="456">7</text>
    <text class="rowk" x="242" y="424">Lines</text>
    <text class="rowv" x="242" y="456">308</text>
    <text class="rowk" x="392" y="424">Objects</text>
    <text class="rowv" x="392" y="456">3</text>
    <text class="rowk" x="520" y="424">Flows</text>
    <text class="rowv" x="520" y="456">1</text>
  </g>

  <line x1="112" y1="486" x2="640" y2="486" stroke="#d7e5df" stroke-width="2"/>

  <text class="rowk" x="112" y="522">REST operations generated, none written</text>
  <text class="rowv" x="112" y="562" fill="#0f766e">54</text>
  <text class="rowk" x="164" y="562">across 42 paths</text>

  <!-- token block -->
  <g filter="url(#shadow)">
    <rect x="706" y="326" width="408" height="272" rx="20" fill="#ffffff"/>
  </g>
  <text class="rowk" x="738" y="374">Measured size of the definition</text>
  <text class="big" x="738" y="446">2,406</text>
  <text class="bigu" x="738" y="478">tokens · gpt-tokenizer o200k_base</text>
  <line x1="738" y1="506" x2="1082" y2="506" stroke="#d7e5df" stroke-width="2"/>
  <text class="rowk" x="738" y="542">of a 200k context window</text>
  <text class="rowv" x="738" y="578" fill="#0f766e">1.2%</text>

  <!-- caught strip -->
  <g>
    <rect x="86" y="616" width="1028" height="2" fill="#e6d5b8"/>
    <text class="cnum" x="86" y="655">4</text>
    <text class="caught" x="130" y="655">defects caught — 3 by the gates and the boot, 1 by reading the diff</text>
  </g>
</svg>
