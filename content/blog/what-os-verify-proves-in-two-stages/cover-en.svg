<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="os verify on ObjectStack 17.7.0: two stages, one count. The author-time rules run first and a refusal exits 1 before anything boots; the app boots second and every object round-trips a record; the exit code is read from hardFailures">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4432f"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em;fill:#2a7468}
      .title{font-size:58px;font-weight:800}
      .lead{font-size:19px;fill:#3f554f}
      .chip{font-size:14px;font-weight:760;fill:#2a7468}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#2a7468}
      .label{font-size:18px;font-weight:760}
      .small{font-size:13px;fill:#55685f}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;fill:#2a7468}
      .red{fill:#b4432f}
      .foot{font-size:13px;fill:#55685f}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="112" class="eyebrow">OS VERIFY ON OBJECTSTACK 17.7.0</text>
  <text x="78" y="186" class="title">Two stages.</text>
  <text x="78" y="252" class="title">One count.</text>
  <text x="78" y="306" class="lead">The author-time rules run first. The app boots second —</text>
  <text x="78" y="334" class="lead">and never boots if the rules refuse.</text>

  <g transform="translate(78 392)"><rect width="196" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="98" y="24" class="chip" text-anchor="middle">exit 0 · scaffold verified</text></g>
  <g transform="translate(290 392)"><rect width="252" height="36" rx="18" fill="#ffffff" stroke="#e3c3bb"/><text x="126" y="24" class="chip red" text-anchor="middle">exit 1 · runtime stage did not run</text></g>
  <g transform="translate(78 440)"><rect width="300" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="150" y="24" class="chip" text-anchor="middle">--rls · 3 declared positions, 3 probed</text></g>

  <text x="78" y="532" class="small">Three real runs on the version npm create objectstack@latest installs.</text>
  <text x="78" y="552" class="small">The exit code reads one count, hardFailures. The report says what it did not prove.</text>

  <!-- right: the two stages -->
  <g transform="translate(680 118)">
    <rect width="440" height="112" rx="18" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="34" class="cap">STAGE 1 · AUTHOR-TIME RULES</text>
    <text x="24" y="64" class="label">The registry os validate runs — 49 rules</text>
    <text x="24" y="90" class="small">Normalized, parsed against the protocol schema, judged whole</text>
  </g>
  <!-- refusal branch -->
  <line x1="1120" y1="174" x2="1168" y2="174" stroke="#b4432f" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="1138" y="160" class="mono red" text-anchor="middle">exit 1</text>
  <text x="1138" y="206" class="small red" text-anchor="middle" style="font-size:11px">refused:</text>
  <text x="1138" y="220" class="small red" text-anchor="middle" style="font-size:11px">nothing boots</text>

  <line x1="900" y1="234" x2="900" y2="282" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="916" y="264" class="small">passed → the only way into stage 2</text>

  <g transform="translate(680 288)">
    <rect width="440" height="150" rx="18" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="34" class="cap">STAGE 2 · RUNTIME</text>
    <text x="24" y="64" class="label">Boot in-process, real HTTP stack</text>
    <text x="24" y="90" class="small">Per object: derive a record → create → read back → compare</text>
    <text x="24" y="110" class="small">On request, --rls: a member must not write what it cannot read,</text>
    <text x="24" y="128" class="small">for a probe persona and one persona per declared position</text>
  </g>

  <line x1="900" y1="442" x2="900" y2="490" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(680 496)">
    <rect width="440" height="104" rx="18" fill="#eef7f2" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="32" class="cap">THE COUNT THE EXIT CODE READS</text>
    <text x="24" y="56" class="mono">hardFailures = createFailed + readFailed</text>
    <text x="24" y="74" class="mono">  + fidelityGaps + holes + degraded probe</text>
    <text x="24" y="92" class="mono">  + positions not run   →   0 ? exit 0 : exit 1</text>
  </g>

  <text x="78" y="632" class="foot">www.objectos.ai · verified against @objectstack/cli 17.7.0 · every block of output was run, not reconstructed</text>
</svg>
