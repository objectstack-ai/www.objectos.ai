    <g transform="translate(890 482)">
      <rect width="360" height="132" rx="22" fill="#201a11" stroke="#f59e0b" stroke-opacity=".76" stroke-width="2"/>
      <text x="42" y="60" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Audit</text>
      <text x="42" y="96" fill="#fef3c7" font-family="Inter, Arial, sans-serif" font-size="18">approval · policy</text>
    </g>
  </g>
</svg>
