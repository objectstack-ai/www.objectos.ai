<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="可审的 diff，而不是撤销按钮">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7faf6"/>
      <stop offset="1" stop-color="#fff2dd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#173a36}.title{font-size:46px;font-weight:780}.sub{font-size:20px;fill:#5d736b}.label{font-size:20px;font-weight:720}.tiny{font-size:15px;fill:#5d736b}.invert{fill:#eafff6}.soft{fill:#abd1c5}.add{fill:#7fae9f}.del{fill:#d96b5f}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="86" y="96" class="title">要一个可审的 diff，不是撤销按钮</text>
  <text x="86" y="132" class="sub">在上线前治理 AI 改了什么，而不是事后撤销</text>

  <g transform="translate(86 184)" filter="url(#shadow)">
    <rect width="470" height="404" rx="28" fill="#fffefa" stroke="#d9dfd6"/>
    <text x="36" y="58" class="label">撤销（事后）</text>
    <rect x="36" y="84" width="398" height="40" rx="12" fill="#f5efe6"/>
    <text x="52" y="110" class="tiny">应用已经上线</text>
    <rect x="36" y="136" width="398" height="40" rx="12" fill="#f5efe6"/>
    <text x="52" y="162" class="tiny">只给一份"已执行步骤"清单</text>
    <g transform="translate(36 210)">
      <rect width="170" height="56" rx="28" fill="#173a36"/>
      <text x="48" y="36" class="invert" font-size="18" font-weight="720">↶ 撤销</text>
    </g>
    <text x="36" y="318" class="tiny">没有审过的改动。</text>
    <text x="36" y="344" class="tiny">没有审批记录。</text>
    <text x="36" y="370" class="tiny">得有人正好发现。</text>
  </g>

  <g transform="translate(644 184)" filter="url(#shadow)">
    <rect width="470" height="404" rx="28" fill="#173a36"/>
    <text x="36" y="58" class="invert" font-size="20" font-weight="760">审 diff → 批准</text>
    <rect x="36" y="86" width="398" height="38" rx="10" fill="#0f2c28"/>
    <text x="52" y="111" class="add" font-size="15">+ 字段：续约风险（敏感）</text>
    <rect x="36" y="132" width="398" height="38" rx="10" fill="#0f2c28"/>
    <text x="52" y="157" class="add" font-size="15">+ 权限：客户成功经理可编辑</text>
    <rect x="36" y="178" width="398" height="38" rx="10" fill="#0f2c28"/>
    <text x="52" y="203" class="del" font-size="15">~ 自动化：每周提醒</text>
    <g transform="translate(36 244)">
      <rect width="210" height="56" rx="28" fill="#f3c66d"/>
      <text x="40" y="36" font-size="18" font-weight="740">✓ 批准改动</text>
    </g>
    <text x="36" y="344" class="soft" font-size="15">运行时强制 对象/字段/动作。</text>
    <text x="36" y="370" class="soft" font-size="15">可审计。可私有化。可回滚。</text>
  </g>
</svg>
