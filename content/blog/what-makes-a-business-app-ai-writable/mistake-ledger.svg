<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="本次运行的错误台账，四行表格：裸引用的谓词 status != resolved 会静默求值为 null、把 Resolve 按钮藏在每一张工单上，被验证门禁以 expression-invalid 拦住；名为 resolve 的行动作会渲染出一个点了什么也不做的按钮，以 action-name-undefined 拦住；没有 sharingModel 的对象会 fail closed 到 private、基线成为一次意外，以 security-owd-unset 拦住；字段上的 required: 'yes' 在任何别的东西运行之前就被类型门禁以 TS2322 拒收">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1b2a41}
      .h{font-size:24px;font-weight:780}
      .note{font-size:14px;fill:#4a5a70}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#5b6a7c}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600}
      .cell{font-size:13px;fill:#1b2a41}
      .small{font-size:13px;fill:#5b6a7c}
      .chip{font-size:13px;font-weight:760}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#fbfcfe"/>

  <text x="40" y="48" class="h">错误台账：三个故意犯的错，一次门禁运行</text>
  <text x="40" y="74" class="note">对一个目标格式，列出 Agent 可能犯的每一类错、抓住它的门禁，以及否则会以什么形态上线。</text>

  <!-- header -->
  <text x="52" y="110" class="cap">错误</text>
  <text x="364" y="110" class="cap">否则会以什么形态上线（门禁的原话）</text>
  <text x="756" y="110" class="cap">被谁拦住</text>
  <text x="928" y="110" class="cap">规则</text>
  <line x1="40" y1="120" x2="1160" y2="120" stroke="#c9d0dd" stroke-width="1.5"/>

  <!-- row 1 -->
  <g transform="translate(40 130)">
    <rect width="1120" height="84" rx="14" fill="#ffffff" stroke="#dde2ec"/>
    <text x="12" y="34" class="mono">visible: P`status != "resolved"`</text>
    <text x="12" y="58" class="small">CEL 谓词里的裸标识符</text>
    <text x="324" y="34" class="cell">表达式「静默求值为 null」：</text>
    <text x="324" y="56" class="cell">Resolve 按钮在每一张工单上都被藏起来</text>
    <g transform="translate(716 26)"><rect width="76" height="32" rx="16" fill="#e6f4f1" stroke="#8fcdc0"/><text x="38" y="21" class="chip" text-anchor="middle" style="fill:#176a5c">验证</text></g>
    <text x="888" y="48" class="mono" style="fill:#b3433a">expression-invalid</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(40 224)">
    <rect width="1120" height="84" rx="14" fill="#ffffff" stroke="#dde2ec"/>
    <text x="12" y="34" class="mono">rowActions: ['resolve']</text>
    <text x="12" y="58" class="small">指向不存在动作的行动作</text>
    <text x="324" y="34" class="cell">「按钮渲染出来，点击后什么也不做——</text>
    <text x="324" y="56" class="cell">一个运行时无法分发的死 affordance」</text>
    <g transform="translate(716 26)"><rect width="76" height="32" rx="16" fill="#e6f4f1" stroke="#8fcdc0"/><text x="38" y="21" class="chip" text-anchor="middle" style="fill:#176a5c">验证</text></g>
    <text x="888" y="48" class="mono" style="fill:#b3433a">action-name-undefined</text>
  </g>

  <!-- row 3 -->
  <g transform="translate(40 318)">
    <rect width="1120" height="84" rx="14" fill="#ffffff" stroke="#dde2ec"/>
    <text x="12" y="34" class="mono">(no sharingModel on the object)</text>
    <text x="12" y="58" class="small">没说出口的组织级默认</text>
    <text x="324" y="34" class="cell">运行时「fail closed 到 'private'」，但</text>
    <text x="324" y="56" class="cell">这个基线是一次意外，不是一个决定</text>
    <g transform="translate(716 26)"><rect width="76" height="32" rx="16" fill="#e6f4f1" stroke="#8fcdc0"/><text x="38" y="21" class="chip" text-anchor="middle" style="fill:#176a5c">验证</text></g>
    <text x="888" y="48" class="mono" style="fill:#b3433a">security-owd-unset</text>
  </g>

  <!-- row 4 -->
  <g transform="translate(40 412)">
    <rect width="1120" height="84" rx="14" fill="#ffffff" stroke="#dde2ec"/>
    <text x="12" y="34" class="mono">required: 'yes'</text>
    <text x="12" y="58" class="small">本该是布尔值的地方写了字符串</text>
    <text x="324" y="34" class="cell">什么也上不了线——tsc 先拒收：「Type 'string' is</text>
    <text x="324" y="56" class="cell">not assignable to type 'boolean | undefined'」</text>
    <g transform="translate(716 26)"><rect width="76" height="32" rx="16" fill="#e8edfb" stroke="#8ea3e6"/><text x="38" y="21" class="chip" text-anchor="middle" style="fill:#2f4bb8">类型</text></g>
    <text x="888" y="48" class="mono" style="fill:#b3433a">TS2322</text>
  </g>

  <text x="40" y="530" class="small">ObjectStack 17.7.0 上的 49 条作者期规则。每条消息都定位到位、带修正方案；修好后的应用在 240 ms 内通过了同样的 49 条规则。</text>
</svg>
