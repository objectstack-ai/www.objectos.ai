<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="88% of agent pilots never reach production; what fails is not the model but the four layers beneath it">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:14px}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="78" font-size="32" font-weight="780">88% of agent pilots never reach production</text>
  <text x="96" y="113" class="tiny">What fails is almost never the model—it's the four layers missing beneath it</text>

  <!-- Left: the stat -->
  <g transform="translate(96 168)" filter="url(#shadow)">
    <rect width="430" height="400" rx="22" fill="#22433d"/>
    <text x="36" y="120" font-size="120" font-weight="820" fill="#e8b04b">88%</text>
    <text x="36" y="160" class="label invert">stuck at PoC, never ship</text>
    <g transform="translate(36 210)" font-size="14">
      <rect width="358" height="44" rx="10" fill="#35564f"/><text x="18" y="29" class="invert">95% see no measurable ROI</text>
      <rect y="56" width="358" height="44" rx="10" fill="#35564f"/><text x="18" y="85" class="invert">80% of the work is data &amp; governance</text>
      <rect y="112" width="358" height="44" rx="10" fill="#35564f"/><text x="18" y="141" class="invert">44% stall on governance rework</text>
    </g>
  </g>

  <!-- Right: model on top of four layers -->
  <g transform="translate(674 168)">
    <g filter="url(#shadow)">
      <rect width="440" height="64" rx="14" fill="#fff3df"/>
      <text x="28" y="40" class="label" fill="#9a6212">Model　strong, but only the top layer</text>
    </g>
    <g transform="translate(0 84)" font-size="15">
      <rect width="440" height="68" rx="14" fill="#ffffff" filter="url(#shadow)"/>
      <text x="28" y="32" class="label">① Semantic layer</text><text x="28" y="56" class="soft">Objects, relations, definitions—where AI gets the business</text>
      <rect y="80" width="440" height="68" rx="14" fill="#ffffff" filter="url(#shadow)"/>
      <text x="28" y="112" class="label">② Permission layer</text><text x="28" y="136" class="soft">Who sees and does what, enforced by the runtime</text>
      <rect y="160" width="440" height="68" rx="14" fill="#ffffff" filter="url(#shadow)"/>
      <text x="28" y="192" class="label">③ Flow &amp; approval layer</text><text x="28" y="216" class="soft">Stops when it should, waits for a human</text>
      <rect y="240" width="440" height="68" rx="14" fill="#ffffff" filter="url(#shadow)"/>
      <text x="28" y="272" class="label">④ Audit layer</text><text x="28" y="296" class="soft">Every step recorded—defensible, sign-off ready</text>
    </g>
  </g>
</svg>
