<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="One metadata definition becomes tables and API, admin UI, AI tools, and enforced permissions and audit">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#24342f" flood-opacity=".14"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;fill:#dff0e9}
      .label{font-size:19px;font-weight:720}.tiny{font-size:14px;fill:#5d736b}.invert{fill:#eafff6}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#f8faf7"/>

  <text x="70" y="58" font-size="26" font-weight="780">Define once, effective everywhere</text>
  <text x="70" y="86" class="tiny">The metadata is the system: the runtime reads the definition, then generates and governs every surface</text>

  <!-- metadata card -->
  <g transform="translate(70 130)" filter="url(#shadow)">
    <rect width="400" height="330" rx="18" fill="#22433d"/>
    <text x="28" y="44" class="label invert">crm_opportunity.object.ts</text>
    <text x="28" y="72" style="fill:#9fc8bc" font-size="14">Business object · Declarative metadata · In your repo</text>
    <g class="mono">
      <text x="28" y="112" style="fill:#dff0e9">ObjectSchema.create({</text>
      <text x="44" y="140" style="fill:#dff0e9">name: 'crm_opportunity',</text>
      <text x="44" y="168" style="fill:#dff0e9">fields: {</text>
      <text x="60" y="196" style="fill:#dff0e9">amount: Field.currency(...),</text>
      <text x="60" y="224" style="fill:#dff0e9">discount: Field.percent(...),</text>
      <text x="44" y="252" style="fill:#dff0e9">},</text>
      <text x="44" y="280" style="fill:#dff0e9">permissions, flows, tools ...</text>
      <text x="28" y="308" style="fill:#dff0e9">})</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#7fae9f" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M482 200 q70 -60 138 -42"/>
    <path d="M482 260 q60 -10 138 14"/>
    <path d="M482 320 q60 10 138 -6"/>
    <path d="M482 380 q70 60 138 44"/>
  </g>
  <g fill="#7fae9f">
    <path d="M616 152 l16 6 -12 12 z"/>
    <path d="M616 268 l16 6 -13 11 z"/>
    <path d="M616 320 l17 -6 -10 14 z"/>
    <path d="M616 430 l17 -5 -11 13 z"/>
  </g>

  <!-- four surfaces -->
  <g filter="url(#shadow)">
    <g transform="translate(648 112)">
      <rect width="480" height="86" rx="14" fill="#ffffff"/>
      <text x="26" y="36" class="label">Tables + REST API</text>
      <text x="26" y="62" class="tiny">Schema, migrations, validation, and query endpoints — all derived</text>
    </g>
    <g transform="translate(648 216)">
      <rect width="480" height="86" rx="14" fill="#ffffff"/>
      <text x="26" y="36" class="label">Admin UI</text>
      <text x="26" y="62" class="tiny">Lists, forms, views, boards — no hand-written pages</text>
    </g>
    <g transform="translate(648 320)">
      <rect width="480" height="86" rx="14" fill="#ffffff"/>
      <text x="26" y="36" class="label">AI tools (MCP)</text>
      <text x="26" y="62" class="tiny">Every object and action becomes a governed tool agents can call</text>
    </g>
    <g transform="translate(648 424)">
      <rect width="480" height="86" rx="14" fill="#fff6e4"/>
      <text x="26" y="36" class="label">Permissions + audit (enforced at runtime)</text>
      <text x="26" y="62" class="tiny">Humans and AI share one RBAC / row / field rule set and one audit ledger</text>
    </g>
  </g>
</svg>
