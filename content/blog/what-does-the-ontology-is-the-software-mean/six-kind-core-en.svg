<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="The six-kind core of an executable business ontology — objects and fields, relations, actions, permissions, flows, agent and tool definitions — is validated and then run by the ObjectStack runtime, which derives the database schema, the REST and realtime API, the Console UI and MCP tools and enforces permissions on every call; hooks, action bodies, CEL and constrained JSX run inside the runtime's fence; views, dashboards, apps and translations sit outside the ontology box as projections">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a6a3a"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5e716b}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em}
      .label{font-size:16px;font-weight:760}
      .small{font-size:13px;fill:#657872}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600}
      .step{font-size:12px;font-weight:760;fill:#2a7468}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">Six kinds in, four surfaces out — and what stays outside the box</text>
  <text x="60" y="80" class="note">The core is validated, then run. Projections use the same metadata and the same gate, and are not part of the ontology.</text>

  <!-- THE ONTOLOGY -->
  <g transform="translate(60 112)">
    <rect width="320" height="400" rx="22" fill="#fdf4e8" stroke="#d9b98c" stroke-width="2"/>
    <text x="24" y="34" class="cap" style="fill:#8a6a3a">THE ONTOLOGY — SIX-KIND CORE</text>
    <g transform="translate(24 52)"><rect width="272" height="42" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="27" class="label">Objects and fields</text></g>
    <g transform="translate(24 102)"><rect width="272" height="42" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="27" class="label">Relations</text></g>
    <g transform="translate(24 152)"><rect width="272" height="42" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="27" class="label">Actions</text></g>
    <g transform="translate(24 202)"><rect width="272" height="42" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="27" class="label">Permissions</text></g>
    <g transform="translate(24 252)"><rect width="272" height="42" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="27" class="label">Flows</text></g>
    <g transform="translate(24 302)"><rect width="272" height="42" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="27" class="label">Agent &amp; tool definitions</text></g>
    <text x="24" y="370" class="mono" style="fill:#8a6a3a">objectstack.config.ts</text>
    <text x="24" y="390" class="mono" style="fill:#8a6a3a">→ objectstack.json</text>
  </g>

  <!-- core → runtime -->
  <text x="450" y="292" class="step" text-anchor="middle">validated</text>
  <text x="450" y="308" class="small" text-anchor="middle">Zod · os validate</text>
  <line x1="384" y1="320" x2="514" y2="320" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="450" y="342" class="step" text-anchor="middle">then run</text>

  <!-- THE RUNTIME -->
  <g transform="translate(520 112)">
    <rect width="300" height="400" rx="22" fill="#eef7f2" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="34" class="cap" style="fill:#2a7468">OBJECTSTACK RUNTIME</text>
    <text x="24" y="64" class="label">Derives, then enforces</text>
    <text x="24" y="86" class="small">on every call — REST request,</text>
    <text x="24" y="104" class="small">Console click, agent tool call alike</text>
    <text x="24" y="130" class="small" style="fill:#2a7468;font-weight:700">RBAC · RLS · FLS · sharing · audit</text>
    <g transform="translate(20 152)">
      <rect width="260" height="140" rx="14" fill="#ffffff" stroke="#2a7468" stroke-width="1.5" stroke-dasharray="7 5"/>
      <text x="16" y="28" class="cap" style="fill:#2a7468">CODE, INSIDE THE FENCE</text>
      <text x="16" y="56" class="label">hooks · action bodies</text>
      <text x="16" y="80" class="label">CEL · constrained JSX</text>
      <text x="16" y="106" class="small">Runs under the same permissions</text>
      <text x="16" y="124" class="small">and audit as a click or a tool call</text>
    </g>
    <text x="24" y="330" class="small">Nothing is reasoned over at runtime:</text>
    <text x="24" y="348" class="small">what runs is what was validated.</text>
    <text x="24" y="378" class="mono" style="fill:#2a7468">objectstack.json → running app</text>
  </g>

  <!-- runtime → surfaces -->
  <line x1="824" y1="152" x2="876" y2="152" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="824" y1="260" x2="876" y2="260" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="824" y1="368" x2="876" y2="368" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="824" y1="476" x2="876" y2="476" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(880 112)">
    <rect width="260" height="80" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="30" class="label">Database schema</text>
    <text x="18" y="52" class="small">on an interchangeable driver</text>
    <text x="18" y="68" class="small">Postgres · MySQL · SQLite · Mongo</text>
  </g>
  <g transform="translate(880 220)">
    <rect width="260" height="80" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="30" class="label">REST / realtime API</text>
    <text x="18" y="52" class="small">generated — no controllers to write</text>
    <text x="18" y="68" class="mono">/api/v1/data/&lt;object&gt;</text>
  </g>
  <g transform="translate(880 328)">
    <rect width="260" height="80" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="30" class="label">Console UI</text>
    <text x="18" y="52" class="small">server-driven: records, boards,</text>
    <text x="18" y="68" class="small">dashboards — rendered, not coded</text>
  </g>
  <g transform="translate(880 436)">
    <rect width="260" height="80" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="30" class="label">MCP tools</text>
    <text x="18" y="52" class="small">every object is a tool, on by default;</text>
    <text x="18" y="68" class="small">actions opt in — same permissions</text>
  </g>

  <!-- ontology → projections (outside the box) -->
  <line x1="220" y1="516" x2="220" y2="546" stroke="#8a6a3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr2)"/>
  <text x="236" y="536" class="small" style="fill:#8a6a3a">projected onto screens, charts, menus and locales</text>

  <!-- PROJECTIONS -->
  <g transform="translate(60 552)">
    <rect width="760" height="128" rx="20" fill="#f4faf7" stroke="#8a6a3a" stroke-width="1.8" stroke-dasharray="8 6"/>
    <text x="24" y="32" class="cap" style="fill:#8a6a3a">PROJECTIONS — AUTHORED AS METADATA, NOT PART OF THE ONTOLOGY</text>
    <g transform="translate(24 48)"><rect width="164" height="38" rx="11" fill="#ffffff" stroke="#c9d8d1"/><text x="14" y="25" class="label">Views</text></g>
    <g transform="translate(204 48)"><rect width="164" height="38" rx="11" fill="#ffffff" stroke="#c9d8d1"/><text x="14" y="25" class="label">Dashboards</text></g>
    <g transform="translate(384 48)"><rect width="164" height="38" rx="11" fill="#ffffff" stroke="#c9d8d1"/><text x="14" y="25" class="label">Apps</text></g>
    <g transform="translate(564 48)"><rect width="164" height="38" rx="11" fill="#ffffff" stroke="#c9d8d1"/><text x="14" y="25" class="label">Translations</text></g>
    <text x="24" y="110" class="small">Validated by the same gate. Remove one and the business it showed is unchanged; change the core and they follow.</text>
  </g>

  <!-- right-hand note -->
  <text x="880" y="572" class="cap" style="fill:#5e716b">WHY THE BOX MATTERS</text>
  <text x="880" y="596" class="small">What an agent must hold to reason</text>
  <text x="880" y="614" class="small">about the business is the core —</text>
  <text x="880" y="632" class="small">six kinds — not every screen.</text>
  <text x="880" y="660" class="small" style="fill:#2a7468">Source: the ObjectStack README and</text>
  <text x="880" y="678" class="small" style="fill:#2a7468">the Business Ontology concepts page.</text>
</svg>
