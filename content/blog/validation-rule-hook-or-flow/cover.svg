<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="校验规则、钩子还是流程？AI 写的应用里一条业务规则住在哪：@objectstack/cli 18.2.0 上自带的 CRM 在三个家里声明了七条规则——五条校验规则、一个钩子、一个流程；流程以数据审阅，钩子以代码审阅">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;fill:#173a36}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em;fill:#2a7468}
      .title{font-size:52px;font-weight:800}
      .lead{font-size:19px;fill:#3f554f}
      .num{font-size:44px;font-weight:800;fill:#2a7468}
      .label{font-size:19px;font-weight:760}
      .small{font-size:13px;fill:#5e716b}
      .tag{font-size:12px;font-weight:780;letter-spacing:.06em}
      .foot{font-size:13px;fill:#5e716b}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="118" class="eyebrow">一条业务规则住在哪</text>
  <text x="78" y="186" class="title">校验规则、钩子，</text>
  <text x="78" y="246" class="title">还是流程？</text>
  <text x="78" y="300" class="lead">一个 CRM，七条规则，三个家。</text>
  <text x="78" y="326" class="lead">谓词是对象上的规则；改写待保存记录的是钩子；</text>
  <text x="78" y="352" class="lead">其余都是流程。</text>

  <g transform="translate(78 396)"><rect width="206" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="103" y="23" class="tag" text-anchor="middle" style="fill:#2a7468">流程以数据审阅</text></g>
  <g transform="translate(294 396)"><rect width="206" height="36" rx="18" fill="#ffffff" stroke="#e6d3b6"/><text x="103" y="23" class="tag" text-anchor="middle" style="fill:#8a6a3a">钩子以代码审阅</text></g>

  <g transform="translate(650 112)" filter="url(#shadow)">
    <rect width="472" height="456" rx="28" fill="#fffefa" stroke="#d8dfd6"/>

    <g transform="translate(28 30)">
      <rect width="416" height="112" rx="16" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="22" y="64" class="num">5</text>
      <text x="76" y="38" class="label">条校验规则</text>
      <text x="76" y="64" class="small">对正在写入的那一条记录的谓词</text>
      <text x="76" y="84" class="small">script · cross_field · state_machine</text>
    </g>

    <g transform="translate(28 158)">
      <rect width="416" height="112" rx="16" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="22" y="64" class="num" style="fill:#8a6a3a">1</text>
      <text x="76" y="38" class="label">个钩子</text>
      <text x="76" y="64" class="small">在保存之前改写待保存的记录</text>
      <text x="76" y="84" class="small">beforeInsert · beforeUpdate · 内联运行</text>
    </g>

    <g transform="translate(28 286)">
      <rect width="416" height="112" rx="16" fill="#ffffff" stroke="#2a7468" stroke-width="1.5"/>
      <text x="22" y="64" class="num">1</text>
      <text x="76" y="38" class="label">个流程——默认落点</text>
      <text x="76" y="64" class="small">暂停、创建记录、写另一个对象</text>
      <text x="76" y="84" class="small">字面量的字段映射，门禁按错误检查</text>
    </g>

    <text x="28" y="420" class="small" style="fill:#2a7468">examples/app-crm 上的七条规则，</text>
    <text x="28" y="438" class="small" style="fill:#2a7468">在 @objectstack/cli 18.2.0 处计数——每一条都在表所指的家里。</text>
  </g>

  <text x="78" y="612" class="foot">同一个拼写错误放进两个家：流程节点让 os validate 以退出码 1 失败；钩子体得到一个警告，或者什么都没有。</text>
</svg>
