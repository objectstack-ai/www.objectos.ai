<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A natural-language request to change a discount approval threshold, shown as the eleven-line metadata diff a reviewer actually signs off on">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}
      .soft{fill:#5d736b;font-size:14px}.mono{font-family:ui-monospace,Menlo,monospace}
      .add{fill:#1f6b4a}.del{fill:#9a3b1f}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="82" font-size="33" font-weight="780">&#8220;Drop the approval threshold to 15%.&#8221;</text>
  <text x="96" y="118" class="tiny">Twelve seconds to say. What the reviewer signs off on is not the sentence &#8212; it is the diff.</text>

  <!-- the definition diff -->
  <g transform="translate(96 154)" filter="url(#shadow)">
    <rect width="1008" height="256" rx="18" fill="#fffefa" stroke="#dbe5df"/>
    <text x="28" y="38" class="soft mono">flows/discount_approval.ts</text>
    <line x1="0" y1="56" x2="1008" y2="56" stroke="#e6ece8"/>

    <rect x="16" y="72" width="976" height="30" rx="7" fill="#fbece6"/>
    <text x="30" y="93" class="mono del" font-size="16">- condition: 'record.discount_pct &gt; 20'</text>

    <rect x="16" y="108" width="976" height="30" rx="7" fill="#eaf6ee"/>
    <text x="30" y="129" class="mono add" font-size="16">+ condition: 'record.discount_pct &gt; 15'</text>

    <rect x="16" y="150" width="976" height="86" rx="7" fill="#eaf6ee"/>
    <text x="30" y="173" class="mono add" font-size="16">+ { id: 'finance_signoff', type: 'approval',</text>
    <text x="30" y="197" class="mono add" font-size="16">+     approvers: [{ type: 'position', value: 'finance_controller' }] }</text>
    <text x="30" y="221" class="mono add" font-size="16">+ { source: 'manager_signoff', condition: 'record.discount_pct &gt; 30' }</text>
  </g>

  <!-- what the platform does with it -->
  <g transform="translate(96 446)" filter="url(#shadow)">
    <rect width="320" height="140" rx="18" fill="#fff6e4"/>
    <text x="28" y="46" class="label">Refuse</text>
    <text x="28" y="78" class="soft">What it can prove cannot run.</text>
    <text x="28" y="112" class="mono" font-size="13">422 &#183; rule / path / hint</text>
  </g>
  <g transform="translate(440 446)" filter="url(#shadow)">
    <rect width="320" height="140" rx="18" fill="#22433d"/>
    <text x="28" y="46" class="label invert">Publish</text>
    <text x="28" y="78" class="soft" fill="#a9c4ba">Who changed what, when.</text>
    <text x="28" y="112" class="mono invert" font-size="13">sys_metadata_history</text>
  </g>
  <g transform="translate(784 446)" filter="url(#shadow)">
    <rect width="320" height="140" rx="18" fill="#eef7f1"/>
    <text x="28" y="46" class="label">Roll back</text>
    <text x="28" y="78" class="soft">To the version you were on.</text>
    <text x="28" y="112" class="mono" font-size="13">operation: revert</text>
  </g>

  <text x="96" y="632" class="tiny">ObjectOS automation: natural language lowers the cost of changing a process &#183; review is what keeps it safe to</text>
  <text x="96" y="656" class="tiny">run against production</text>
</svg>
