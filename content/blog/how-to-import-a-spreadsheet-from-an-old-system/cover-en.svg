<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The dry run is the review: a three-row legacy CSV imported through a named mapping on ObjectStack 17.7.0 answered created 3 on the dry run with 0 rows stored, 3 rows stored after the real run, and updated 3 when the same file was sent again">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em;fill:#2a7468}
      .title{font-size:54px;font-weight:800}
      .lead{font-size:19px;fill:#3f554f}
      .chip{font-size:14px;font-weight:760;fill:#2a7468}
      .num{font-size:40px;font-weight:800;fill:#2a7468}
      .label{font-size:18px;font-weight:760}
      .small{font-size:13px;fill:#55675f}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;fill:#2a7468}
      .foot{font-size:13px;fill:#55675f}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="118" class="eyebrow">IMPORT MAPPINGS · DRY RUNS · UPSERT</text>
  <text x="78" y="186" class="title">The dry run</text>
  <text x="78" y="248" class="title">is the review.</text>
  <text x="78" y="300" class="lead">Their headers are not your fields.</text>
  <text x="78" y="326" class="lead">Their codes are not your codes.</text>
  <text x="78" y="352" class="lead">Sign the count before anything lands.</text>

  <g transform="translate(78 404)"><rect width="92" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="46" y="23" class="chip" text-anchor="middle">created</text></g>
  <g transform="translate(180 404)"><rect width="92" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="46" y="23" class="chip" text-anchor="middle">skipped</text></g>
  <g transform="translate(282 404)"><rect width="80" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="40" y="23" class="chip" text-anchor="middle">failed</text></g>
  <text x="380" y="428" class="small">the three answers a row can get</text>

  <g transform="translate(650 112)">
    <rect width="472" height="456" rx="28" fill="#fffefa" stroke="#d8dfd6"/>

    <g transform="translate(28 30)">
      <rect width="416" height="112" rx="16" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="22" y="66" class="num">0</text>
      <text x="76" y="40" class="label">rows stored after the dry run</text>
      <text x="76" y="64" class="mono">total 3 · created 3 · updated 0</text>
      <text x="76" y="86" class="small">the whole per-row report, nothing persisted</text>
    </g>

    <g transform="translate(28 158)">
      <rect width="416" height="112" rx="16" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="22" y="66" class="num">3</text>
      <text x="76" y="40" class="label">rows stored after the real run</text>
      <text x="76" y="64" class="mono">created 3</text>
      <text x="76" y="86" class="small">Webform → web · Partner Referral → partner</text>
    </g>

    <g transform="translate(28 286)">
      <rect width="416" height="112" rx="16" fill="#ffffff" stroke="#c9d8d1"/>
      <text x="22" y="66" class="num">3</text>
      <text x="76" y="40" class="label">rows after the same file again</text>
      <text x="76" y="64" class="mono">created 0 · updated 3</text>
      <text x="76" y="86" class="small">upsertKey: ['email'] decides what "the same row" means</text>
    </g>

    <text x="28" y="420" class="small" style="fill:#2a7468">A column the mapping does not name is dropped;</text>
    <text x="28" y="438" class="small" style="fill:#2a7468">through an inline rename, a junk column failed all 3 rows.</text>
  </g>

  <text x="78" y="612" class="foot">Measured on the published @objectstack/cli 17.7.0 — a fresh scaffold carrying the CRM example's Lead object.</text>
</svg>
