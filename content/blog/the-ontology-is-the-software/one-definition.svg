<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 328" role="img" aria-label="左侧四个框是企业的定义今天所在的地方：老员工的脑子里、制度文件里、电子表格里，以及几十万行代码里。一条总线把它们汇进右侧的深色框，只写一次：一份有五个成分的定义——我们有什么、它们怎么关联、能做什么、谁可以做、什么时候发生什么。">
  <defs><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f8b81"/></marker><marker id="ar-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c7a55"/></marker><marker id="ar-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b07a1a"/></marker><marker id="ar-onInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8cdc2"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style></defs>
  <rect width="900" height="328" fill="#f8faf7"/>
  <g transform="translate(30 30)">
    <rect x="0" y="0" width="360" height="58" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="11" y="25" font-size="14" font-weight="700" fill="#173a36" text-anchor="start">在老员工的脑子里</text>
    <text x="11" y="47.25" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">「这事得先问老王」</text>
    <path d="M360 29 L420 29" fill="none" stroke="#6f8b81" stroke-width="1.6"/>
    <rect x="0" y="70" width="360" height="58" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="11" y="95" font-size="14" font-weight="700" fill="#173a36" text-anchor="start">在制度文件里</text>
    <text x="11" y="117.25" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">写了，没人照做</text>
    <path d="M360 99 L420 99" fill="none" stroke="#6f8b81" stroke-width="1.6"/>
    <rect x="0" y="140" width="360" height="58" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="11" y="165" font-size="14" font-weight="700" fill="#173a36" text-anchor="start">在电子表格里</text>
    <text x="11" y="187.25" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">每个部门一个版本</text>
    <path d="M360 169 L420 169" fill="none" stroke="#6f8b81" stroke-width="1.6"/>
    <rect x="0" y="210" width="360" height="58" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="11" y="235" font-size="14" font-weight="700" fill="#173a36" text-anchor="start">在几十万行代码里</text>
    <text x="11" y="257.25" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">改一处，要动四处</text>
    <path d="M360 239 L420 239" fill="none" stroke="#6f8b81" stroke-width="1.6"/>
    <path d="M420 29 L420 239" fill="none" stroke="#6f8b81" stroke-width="1.6"/>
    <path d="M420 134 L598 134" fill="none" stroke="#1c7a55" stroke-width="2.5" marker-end="url(#ar-accent)"/>
    <text x="510" y="120" font-size="12" font-weight="600" fill="#1c7a55" text-anchor="middle">只写一次</text>
    <rect x="600" y="0" width="240" height="268" rx="14" fill="#22433d" stroke="#22433d" stroke-width="1"/>
    <text x="624" y="43" font-size="19" font-weight="700" fill="#eafff6" text-anchor="start">一份定义</text>
    <text x="624" y="69.5" font-size="14.5" font-weight="400" fill="#a8cdc2" text-anchor="start"></text>
    <text x="624" y="90.525" font-size="14.5" font-weight="400" fill="#a8cdc2" text-anchor="start">我们有什么</text>
    <text x="624" y="111.55" font-size="14.5" font-weight="400" fill="#a8cdc2" text-anchor="start">它们怎么关联</text>
    <text x="624" y="132.575" font-size="14.5" font-weight="400" fill="#a8cdc2" text-anchor="start">能做什么</text>
    <text x="624" y="153.6" font-size="14.5" font-weight="400" fill="#a8cdc2" text-anchor="start">谁可以做</text>
    <text x="624" y="174.625" font-size="14.5" font-weight="400" fill="#a8cdc2" text-anchor="start">什么时候发生什么</text>
  </g>
</svg>
