<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Effective capability, not raw flags: the raw bits on a permission set, allowRead, allowCreate, allowEdit, allowDelete, viewAllRecords, modifyAllRecords and the read and write scopes, pass through the spec's fold objectPermissionGrants, where read is allowRead or View All or Modify All, edit and delete are their own bit or Modify All, create has no super-user bypass and export is allowExport and read, and land as one matrix row whose create, read, edit and delete are effective, whose viewAllRecords and modifyAllRecords are the raw bits kept as context, and which carries the object's sharingModel; measured on 18.2.0, replacing allowDelete false with modifyAllRecords true on the row produces two drift lines, gains delete and gains Modify All Data on crm_opportunity">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#4b5d56}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em}
      .rule{font-size:13px;font-weight:650}
      .small{font-size:13px;fill:#4b5d56}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600}
      .teal{fill:#2a7468}
      .amber{fill:#8a6a3a}
      .red{fill:#a8432c}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">Effective capability, not raw flags: how one matrix row is computed</text>
  <text x="60" y="80" class="note">The CRUD bits are the spec's fold, asked rather than restated; the two super-user columns stay raw, as context.</text>

  <!-- RAW BITS -->
  <g transform="translate(60 112)">
    <rect width="320" height="300" rx="18" fill="#fdf4e8" stroke="#d9b98c" stroke-width="2"/>
    <text x="20" y="30" class="cap amber">RAW BITS ON THE PERMISSION SET</text>
    <text x="20" y="62" class="mono">allowRead: true</text>
    <text x="20" y="92" class="mono">allowCreate: true</text>
    <text x="20" y="122" class="mono">allowEdit: true</text>
    <text x="20" y="152" class="mono">allowDelete: false</text>
    <text x="20" y="182" class="mono">viewAllRecords: false</text>
    <text x="20" y="212" class="mono">modifyAllRecords: false</text>
    <text x="20" y="242" class="mono">readScope / writeScope</text>
    <text x="20" y="276" class="small">what the author typed in sales-positions.ts</text>
  </g>

  <line x1="384" y1="262" x2="416" y2="262" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- THE FOLD -->
  <g transform="translate(420 112)">
    <rect width="360" height="300" rx="18" fill="#eef7f2" stroke="#2a7468" stroke-width="2"/>
    <text x="20" y="30" class="cap teal">THE SPEC'S FOLD · objectPermissionGrants</text>
    <text x="20" y="62" class="rule">read = allowRead ∨ View All ∨ Modify All</text>
    <text x="20" y="88" class="rule">edit = allowEdit ∨ Modify All</text>
    <text x="20" y="114" class="rule">delete = allowDelete ∨ Modify All</text>
    <text x="20" y="140" class="rule">create = allowCreate (no super-user bypass)</text>
    <text x="20" y="166" class="rule">export = allowExport ∧ read</text>
    <text x="20" y="204" class="small">The same function the enforcement door asks</text>
    <text x="20" y="222" class="small">before it answers 403 — so the row says what</text>
    <text x="20" y="240" class="small">the runtime would do, not what the file says.</text>
    <text x="20" y="276" class="small teal">Modify All never manufactures a create grant.</text>
  </g>

  <line x1="784" y1="262" x2="816" y2="262" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ONE ROW -->
  <g transform="translate(820 112)">
    <rect width="320" height="300" rx="18" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="20" y="30" class="cap teal">ONE MATRIX ROW</text>
    <text x="20" y="62" class="mono">"create": true</text>
    <text x="20" y="84" class="mono">"read": true</text>
    <text x="20" y="106" class="mono">"edit": true</text>
    <text x="20" y="128" class="mono">"delete": false</text>
    <text x="20" y="150" class="small teal">effective — asked from the fold</text>
    <text x="20" y="180" class="mono">"viewAllRecords": false</text>
    <text x="20" y="202" class="mono">"modifyAllRecords": false</text>
    <text x="20" y="224" class="small">raw bits, kept as context</text>
    <text x="20" y="254" class="mono">"sharingModel": "public_read_write"</text>
    <text x="20" y="276" class="small">the object's record baseline (OWD)</text>
  </g>

  <!-- MEASURED -->
  <g transform="translate(60 440)">
    <rect width="1080" height="88" rx="18" fill="#fbeeea" stroke="#e5c4bb" stroke-width="1.5"/>
    <text x="20" y="28" class="cap red">MEASURED ON 18.2.0 — ONE LINE, TWO LINES</text>
    <text x="20" y="52" class="small">allowDelete: false replaced by modifyAllRecords: true on the crm_opportunity row; no delete typed. os validate passed; os compile: drift (2 changes)</text>
    <text x="20" y="74" class="mono red">• 'crm_sales_user' gains delete on 'crm_opportunity'</text>
    <text x="560" y="74" class="mono red">• 'crm_sales_user' gains Modify All Data on 'crm_opportunity'</text>
  </g>

  <text x="60" y="550" class="small">Sources: objectPermissionGrants in @objectstack/spec; buildAccessMatrix and diffAccessMatrix in @objectstack/lint — at the tag @objectstack/cli@18.2.0.</text>
</svg>
