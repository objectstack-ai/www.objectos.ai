<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="保存业务应用规则的两种方式。左边是定义：仓库里的文件是权威副本，每次改动都是一份带名字和书面理由的 diff；构建先检查文件，再把它们变成运行中的系统，每次部署都从文件重建。右边是配置：管理员在管理界面里修改设置，运行中的系统及其数据库是权威副本；如果另存了文件，它描述的是正在运行的东西。">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5e716b}
      .cap{font-size:13px;font-weight:780;letter-spacing:.06em;fill:#2a7468}
      .badge{font-size:13px;font-weight:780;letter-spacing:.1em;fill:#ffffff}
      .label{font-size:17px;font-weight:760}
      .small{font-size:13.5px;fill:#55685f}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">保存业务应用规则的两种方式：哪份副本说了算？</text>
  <text x="60" y="80" class="note">权威副本，就是运行中的系统与其他副本不一致时，以它为准的那一份。</text>

  <g transform="translate(60 112)">
    <rect width="520" height="488" rx="20" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="34" class="cap">定义 · 以仓库为准</text>

    <rect x="24" y="56" width="472" height="104" rx="14" fill="#e6f4ec" stroke="#2a7468" stroke-width="2.5"/>
    <rect x="318" y="70" width="162" height="28" rx="14" fill="#2a7468"/>
    <text x="399" y="89" class="badge" text-anchor="middle">权威副本</text>
    <text x="44" y="92" class="label">你仓库里的文件</text>
    <text x="44" y="120" class="small">每次改动都是一份 diff，</text>
    <text x="44" y="140" class="small">带着名字和书面理由。</text>

    <line x1="260" y1="166" x2="260" y2="202" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

    <rect x="24" y="210" width="472" height="92" rx="14" fill="#f4f7f6" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="44" y="244" class="label">构建</text>
    <text x="44" y="270" class="small">先检查文件，再把它们</text>
    <text x="44" y="290" class="small">变成运行中的系统。</text>

    <line x1="260" y1="308" x2="260" y2="344" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

    <rect x="24" y="352" width="472" height="78" rx="14" fill="#f4f7f6" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="44" y="386" class="label">运行中的系统</text>
    <text x="44" y="412" class="small">每次部署都从文件重建。</text>

    <text x="24" y="466" class="small">要改它：改文件、读 diff、构建。</text>
  </g>

  <g transform="translate(620 112)">
    <rect width="520" height="488" rx="20" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="34" class="cap">配置 · 以运行中的系统为准</text>

    <rect x="24" y="56" width="472" height="104" rx="14" fill="#f4f7f6" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="44" y="92" class="label">管理界面</text>
    <text x="44" y="120" class="small">管理员直接修改</text>
    <text x="44" y="140" class="small">运行中系统的设置。</text>

    <line x1="260" y1="166" x2="260" y2="202" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

    <rect x="24" y="210" width="472" height="92" rx="14" fill="#e6f4ec" stroke="#2a7468" stroke-width="2.5"/>
    <rect x="318" y="224" width="162" height="28" rx="14" fill="#2a7468"/>
    <text x="399" y="243" class="badge" text-anchor="middle">权威副本</text>
    <text x="44" y="244" class="label">运行中的系统</text>
    <text x="44" y="270" class="small">它的数据库保存着当前的规则。</text>

    <line x1="260" y1="308" x2="260" y2="344" stroke="#2a7468" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arr)"/>

    <rect x="24" y="352" width="472" height="78" rx="14" fill="#ffffff" stroke="#9fb3ab" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="44" y="386" class="label">文件（如果另存了一份）</text>
    <text x="44" y="412" class="small">描述的是正在运行的东西。</text>

    <text x="24" y="466" class="small">要改它：在界面里改设置。</text>
  </g>
</svg>
