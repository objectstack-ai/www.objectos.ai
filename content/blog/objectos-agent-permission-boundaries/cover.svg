<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="企业 Agent 的权限边界">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf9"/>
      <stop offset="1" stop-color="#edf5e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#263d35" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.title{font-size:38px;font-weight:780}.lead{font-size:18px;fill:#5d736b}.label{font-size:19px;font-weight:760}.small{font-size:14px;fill:#647872}.invert{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="78" y="86" class="title">AI Agent 不能当超级用户</text>
  <text x="78" y="124" class="lead">数据、字段、动作和审批都要有边界</text>
  <g transform="translate(96 160)" filter="url(#shadow)">
    <rect width="1008" height="370" rx="32" fill="#fffefa" stroke="#d8dfd6"/>
    <g transform="translate(58 78)">
      <rect width="190" height="205" rx="26" fill="#173a36"/>
      <text x="95" y="58" text-anchor="middle" class="invert" font-size="20" font-weight="780">当前用户</text>
      <text x="95" y="100" text-anchor="middle" class="soft" font-size="14">角色</text>
      <text x="95" y="132" text-anchor="middle" class="soft" font-size="14">组织</text>
      <text x="95" y="164" text-anchor="middle" class="soft" font-size="14">权限</text>
    </g>
    <g transform="translate(350 56)">
      <rect width="240" height="72" rx="20" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="120" y="45" text-anchor="middle" class="label">对象权限</text>
      <rect y="104" width="240" height="72" rx="20" fill="#fff3d6" stroke="#efc86c"/>
      <text x="120" y="149" text-anchor="middle" class="label">记录范围</text>
      <rect y="208" width="240" height="72" rx="20" fill="#edf2ff" stroke="#bdc8ee"/>
      <text x="120" y="253" text-anchor="middle" class="label">字段保护</text>
    </g>
    <g transform="translate(720 78)">
      <rect width="210" height="205" rx="26" fill="#f6f8f6" stroke="#d8dfd6"/>
      <text x="105" y="50" text-anchor="middle" class="label">AI 可见能力</text>
      <text x="105" y="88" text-anchor="middle" class="small">可查询数据</text>
      <text x="105" y="120" text-anchor="middle" class="small">可发起动作</text>
      <text x="105" y="152" text-anchor="middle" class="small">需确认事项</text>
      <text x="105" y="184" text-anchor="middle" class="small">完整审计</text>
    </g>
    <path d="M252 180 H346 M594 92 H716 M594 164 H716 M594 268 H716" stroke="#2a7468" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
