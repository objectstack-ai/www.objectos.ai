<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="The read-write line: Unity Catalog and Snowflake describe the business with read-only governed metrics; Fabric IQ declares actions in the ontology and delegates execution to Activator and Power Automate; Palantir Foundry executes actions as transactions that write back to the ontology">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8494b0"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#142540}
      .h{font-size:26px;font-weight:770}
      .big{font-size:15px;fill:#3a4a64}
      .axis{font-size:15px;fill:#8494b0;font-weight:640;letter-spacing:.06em}
      .line{font-size:14px;fill:#c0392b;font-weight:700}
      .name{font-size:18px;font-weight:740;fill:#eaf1ff}
      .body{font-size:15px;fill:#aebfdd}
      .bodyg{font-size:15px;fill:#a9d8c6}
      .hi{font-size:15px;fill:#ffd98a;font-weight:640}
      .hig{font-size:15px;fill:#7fe3bd;font-weight:640}
      .zone{font-size:19px;font-weight:750;fill:#3a4a64}
      .zoneg{font-size:19px;font-weight:750;fill:#1d7a5f}
      .note{font-size:14px;fill:#566480}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#f3f6fb"/>

  <text x="60" y="56" class="h">The read&#8211;write line</text>
  <text x="60" y="86" class="big">Where each platform stops describing the business and starts changing it.</text>

  <line x1="60" y1="140" x2="1140" y2="140" stroke="#c9d4e6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="60" y="126" class="axis">DESCRIBE</text>
  <text x="1020" y="126" class="axis">ACT</text>

  <line x1="700" y1="150" x2="700" y2="500" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="712" y="176" class="line">the read&#8211;write line</text>

  <g transform="translate(60 210)">
    <rect width="300" height="180" rx="20" fill="#142540"/>
    <text x="26" y="44" class="name">Unity Catalog</text>
    <text x="26" y="72" class="name">Snowflake</text>
    <rect x="26" y="92" width="248" height="1" fill="#2b4373"/>
    <text x="26" y="124" class="body">Governed metrics and</text>
    <text x="26" y="146" class="body">dimensions.</text>
    <text x="26" y="168" class="body">Read-only query objects.</text>
  </g>
  <text x="60" y="416" class="zone">Answers the question</text>
  <text x="60" y="442" class="note">The agent can tell you the freezer is failing.</text>

  <g transform="translate(400 210)">
    <rect width="272" height="180" rx="20" fill="#1d3258"/>
    <text x="26" y="44" class="name">Fabric IQ</text>
    <rect x="26" y="64" width="220" height="1" fill="#3d5c92"/>
    <text x="26" y="96" class="body">Actions declared in the</text>
    <text x="26" y="118" class="body">ontology; executed by</text>
    <text x="26" y="140" class="body">Activator / Power Automate.</text>
    <text x="26" y="164" class="hi">Agent recommends.</text>
  </g>
  <text x="400" y="416" class="zone">Declares, delegates</text>
  <text x="400" y="442" class="note">The action is modeled here; the transaction is not.</text>

  <g transform="translate(740 210)">
    <rect width="400" height="180" rx="20" fill="#123f33"/>
    <text x="26" y="44" class="name">Palantir Foundry</text>
    <rect x="26" y="64" width="348" height="1" fill="#1d7a5f"/>
    <text x="26" y="96" class="bodyg">Action types: one transaction</text>
    <text x="26" y="118" class="bodyg">changing objects, properties</text>
    <text x="26" y="140" class="bodyg">and links, with side effects.</text>
    <text x="26" y="164" class="hig">Writes back to the ontology.</text>
  </g>
  <text x="740" y="416" class="zoneg">Changes the business</text>
  <text x="740" y="442" class="note">The agent can dispatch the technician.</text>

  <rect x="60" y="478" width="1080" height="1" fill="#dbe2ee"/>
  <text x="60" y="512" class="note">Two of four describe &#183; one declares and delegates &#183; one executes. Positions from vendor documentation, September 2026.</text>
</svg>
