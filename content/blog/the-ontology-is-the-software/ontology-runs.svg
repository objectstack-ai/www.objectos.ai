<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" role="img" aria-label="大模型从一句业务语言写出本体；人定义它、批准它、验证它。运行时直接运行这份定义，每一次调用都经过权限检查和审计；任何厂商的任何 Agent 都调用这个运行时；数据库、API、UI 和 Agent 调用的工具都从它推导出来。">
  <defs><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f8b81"/></marker><marker id="ar-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c7a55"/></marker><marker id="ar-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b07a1a"/></marker><marker id="ar-onInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8cdc2"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style></defs>
  <rect width="900" height="396" fill="#f8faf7"/>
  <g transform="translate(30 30)">
    <rect x="0" y="0" width="190" height="120" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="14" y="29" font-size="15" font-weight="700" fill="#173a36" text-anchor="start">大模型</text>
    <text x="14" y="51.5" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">从一句业务语言</text>
    <text x="14" y="69.625" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">写出它。</text>
    <text x="14" y="87.75" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">写错了，就上不了线。</text>
    <rect x="276" y="0" width="288" height="120" rx="12" fill="#22433d" stroke="#22433d" stroke-width="1"/>
    <text x="290" y="29" font-size="15" font-weight="700" fill="#eafff6" text-anchor="start">本体</text>
    <text x="290" y="51.5" font-size="12.5" font-weight="400" fill="#a8cdc2" text-anchor="start">企业是什么：</text>
    <text x="290" y="69.625" font-size="12.5" font-weight="400" fill="#a8cdc2" text-anchor="start">有什么 · 怎么关联</text>
    <text x="290" y="87.75" font-size="12.5" font-weight="400" fill="#a8cdc2" text-anchor="start">能做什么 · 谁可以做</text>
    <text x="290" y="105.875" font-size="12.5" font-weight="400" fill="#a8cdc2" text-anchor="start">什么时候发生什么</text>
    <rect x="650" y="0" width="190" height="120" rx="12" fill="#fff3df" stroke="#e8b04b" stroke-width="1"/>
    <text x="664" y="29" font-size="15" font-weight="700" fill="#8a6412" text-anchor="start">人</text>
    <text x="664" y="51.5" font-size="12.5" font-weight="400" fill="#4e4a3a" text-anchor="start">定义它，批准它，</text>
    <text x="664" y="69.625" font-size="12.5" font-weight="400" fill="#4e4a3a" text-anchor="start">在界面里验证它。</text>
    <path d="M192 60 L274 60" fill="none" stroke="#1c7a55" stroke-width="1.6" marker-end="url(#ar-accent)"/>
    <text x="233" y="47" font-size="12" font-weight="600" fill="#1c7a55" text-anchor="middle">编写</text>
    <path d="M648 60 L566 60" fill="none" stroke="#b07a1a" stroke-width="1.6" marker-end="url(#ar-warm)"/>
    <text x="607" y="47" font-size="12" font-weight="600" fill="#b07a1a" text-anchor="middle">定义</text>
    <path d="M420 122 L420 162" fill="none" stroke="#1c7a55" stroke-width="2.5" marker-end="url(#ar-accent)"/>
    <text x="430" y="146" font-size="12" font-weight="600" fill="#1c7a55" text-anchor="start">直接运行</text>
    <rect x="276" y="164" width="288" height="76" rx="12" fill="#1c7a55" stroke="#1c7a55" stroke-width="1"/>
    <text x="288" y="191" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">运行时</text>
    <text x="288" y="213.5" font-size="12.5" font-weight="400" fill="#d7f2e4" text-anchor="start">直接运行这份定义；</text>
    <text x="288" y="231.625" font-size="12.5" font-weight="400" fill="#d7f2e4" text-anchor="start">每次调用都经权限检查与审计</text>
    <rect x="650" y="164" width="190" height="76" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="662" y="191" font-size="15" font-weight="700" fill="#173a36" text-anchor="start">Agent</text>
    <text x="662" y="213.5" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">任何 Agent，任何厂商</text>
    <path d="M648 202 L566 202" fill="none" stroke="#6f8b81" stroke-width="1.6" marker-end="url(#ar-grey)"/>
    <text x="607" y="189" font-size="12" font-weight="600" fill="#5d736b" text-anchor="middle">调用</text>
    <path d="M420 241 L420 268" fill="none" stroke="#6f8b81" stroke-width="1.6"/>
    <text x="430" y="258" font-size="12" font-weight="400" fill="#5d736b" text-anchor="start">由它推导</text>
    <path d="M120 268 L720 268" fill="none" stroke="#6f8b81" stroke-width="1.6"/>
    <path d="M120 268 L120 287" fill="none" stroke="#6f8b81" stroke-width="1.6" marker-end="url(#ar-grey)"/>
    <rect x="30" y="288" width="180" height="48" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="120" y="317.25" font-size="14" font-weight="700" fill="#173a36" text-anchor="middle">数据库</text>
    <path d="M320 268 L320 287" fill="none" stroke="#6f8b81" stroke-width="1.6" marker-end="url(#ar-grey)"/>
    <rect x="230" y="288" width="180" height="48" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="320" y="317.25" font-size="14" font-weight="700" fill="#173a36" text-anchor="middle">API</text>
    <path d="M520 268 L520 287" fill="none" stroke="#6f8b81" stroke-width="1.6" marker-end="url(#ar-grey)"/>
    <rect x="430" y="288" width="180" height="48" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="520" y="317.25" font-size="14" font-weight="700" fill="#173a36" text-anchor="middle">UI</text>
    <path d="M720 268 L720 287" fill="none" stroke="#6f8b81" stroke-width="1.6" marker-end="url(#ar-grey)"/>
    <rect x="630" y="288" width="180" height="48" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="720" y="317.25" font-size="14" font-weight="700" fill="#173a36" text-anchor="middle">Agent 调用的工具</text>
  </g>
</svg>
