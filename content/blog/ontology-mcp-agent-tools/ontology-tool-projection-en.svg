<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" role="img" aria-label="The tool-surface asymmetry: twelve object types collapse into one wide read tool, while thirty action types and six query functions expand into thirty-six narrow tools">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:29px;font-weight:780}.t{font-size:17px;font-weight:740}.s{font-size:13px;fill:#657872}
      .n{font-size:34px;font-weight:800}.box{fill:#fffefa;stroke:#d7dfdb}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#3d554e}
    </style>
  </defs>
  <rect width="1200" height="594" fill="#f8faf7"/>
  <text x="70" y="62" class="h">The tool-surface asymmetry</text>
  <text x="70" y="92" class="s">The same projection rule, applied to one application: reads collapse, writes expand</text>

  <!-- read half -->
  <g transform="translate(70 124)">
    <rect width="520" height="200" rx="26" class="box"/>
    <rect width="520" height="200" rx="26" fill="#edf2ff" opacity=".55"/>
    <text x="34" y="46" class="t">Read side</text>
    <text x="34" y="112" class="n">12 → 1</text>
    <text x="34" y="146" class="s">12 object types are reachable through one SQL tool</text>
    <text x="34" y="172" class="mono">sql(query)  — wide reach, bounded by permissions</text>
  </g>

  <!-- write half -->
  <g transform="translate(610 124)">
    <rect width="520" height="200" rx="26" class="box"/>
    <rect width="520" height="200" rx="26" fill="#fff3d6" opacity=".55"/>
    <text x="34" y="46" class="t">Write and compute side</text>
    <text x="34" y="112" class="n">36 → 36</text>
    <text x="34" y="146" class="s">30 action types + 6 query functions, each its own tool</text>
    <text x="34" y="172" class="mono">escalate_support_case(...)  — narrow, one job each</text>
  </g>

  <!-- total band -->
  <g transform="translate(70 356)">
    <rect width="1060" height="86" rx="22" fill="#173a36"/>
    <text x="40" y="52" fill="#eafff6" font-size="18" font-weight="740">37 MCP tools — and not one tool definition written by hand</text>
    <text x="700" y="52" fill="#a8cdc2" font-size="14">Counts illustrative; the projection rule is documented</text>
  </g>

  <!-- consequence -->
  <g transform="translate(70 470)">
    <text x="0" y="22" class="t">What each half needs</text>
    <text x="0" y="54" class="s">Read: get the identity right, and row-level permissions bound the blast radius.</text>
    <text x="0" y="80" class="s">Write: every exposed action is a standing decision about what an agent may set in motion — and a public name you cannot rename quietly.</text>
  </g>
</svg>
