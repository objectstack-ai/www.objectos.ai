<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" role="img" aria-label="The correction loop: the agent writes typed metadata, the validation gate runs 41 author-time rules and either passes the change to human review or returns a corrective error that locates, quotes, explains and fixes the mistake, sending the agent round again">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fbfcfa"/>
      <stop offset="1" stop-color="#f0f6f2"/>
    </linearGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f8b81"/>
    </marker>
    <marker id="a2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4553f"/>
    </marker>
    <marker id="a2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3f7d5c"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:30px;font-weight:780}
      .tiny{font-size:15.5px;fill:#5d736b}
      .label{font-size:18px;font-weight:720}
      .soft{fill:#5d736b;font-size:13.5px}
      .mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;fill:#3d5a52}
      .monoR{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;fill:#b4553f}
      .box{fill:#fffefa;stroke:#d7dfdb}
      .red{fill:#b4553f}
      .redlabel{fill:#b4553f;font-size:18px;font-weight:720}
      .green{fill:#3f7d5c}
      .greenlabel{fill:#3f7d5c;font-size:18px;font-weight:720}
      .step{font-size:12.5px;font-weight:760;fill:#7b9289}
      .invert{fill:#eafff6}
      .invertsoft{fill:#a8cdc2;font-size:13.5px}
    </style>
  </defs>
  <rect width="1200" height="594" fill="url(#bg2)"/>

  <text x="80" y="70" class="h">The correction loop</text>
  <text x="80" y="102" class="tiny">Structure is checked by the machine and costs a turn. Authority is checked by a person and costs a review.</text>

  <!-- agent -->
  <g transform="translate(80 156)">
    <rect width="238" height="150" rx="24" fill="#173a36"/>
    <text x="119" y="52" text-anchor="middle" class="label invert">Agent writes</text>
    <text x="119" y="80" text-anchor="middle" class="invertsoft">typed metadata, not glue code</text>
    <text x="119" y="116" text-anchor="middle" class="mono" style="fill:#a8cdc2">requiredWhen: P`done`</text>
  </g>

  <path d="M326 231 L 406 231" fill="none" stroke="#6f8b81" stroke-width="2" marker-end="url(#a2)"/>

  <!-- gate -->
  <g transform="translate(414 156)">
    <rect width="222" height="150" rx="24" class="box"/>
    <text x="111" y="46" text-anchor="middle" class="label">The gate</text>
    <text x="111" y="74" text-anchor="middle" class="mono">npm run validate</text>
    <text x="111" y="106" text-anchor="middle" class="soft">41 author-time rules</text>
    <text x="111" y="128" text-anchor="middle" class="soft">Zod · CEL · bindings</text>
  </g>

  <!-- fail branch -->
  <path d="M525 314 L 525 358" fill="none" stroke="#b4553f" stroke-width="2" marker-end="url(#a2r)"/>
  <text x="540" y="342" class="monoR">exit 1</text>

  <g transform="translate(300 366)">
    <rect width="452" height="164" rx="24" fill="#fdf1ec" stroke="#e8c4b8"/>
    <text x="24" y="38" class="redlabel">A corrective error</text>
    <text x="24" y="68" class="step">1 LOCATE</text>
    <text x="118" y="68" class="soft">object `demo_task` · field `closed_reason` · requiredWhen</text>
    <text x="24" y="94" class="step">2 QUOTE</text>
    <text x="118" y="94" class="monoR">source: `done`</text>
    <text x="24" y="120" class="step">3 EXPLAIN</text>
    <text x="118" y="120" class="soft">the record binds as a namespace — a bare id is null</text>
    <text x="24" y="146" class="step">4 FIX</text>
    <text x="118" y="146" class="monoR">Write `record.done`</text>
  </g>

  <!-- loop back to agent -->
  <path d="M300 448 C 220 448 199 448 199 372 L 199 318" fill="none" stroke="#b4553f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a2r)"/>
  <text x="96" y="484" class="soft">costs one agent turn,</text>
  <text x="96" y="506" class="soft">never a human</text>

  <!-- pass branch -->
  <path d="M644 231 L 724 231" fill="none" stroke="#3f7d5c" stroke-width="2" marker-end="url(#a2g)"/>
  <text x="652" y="216" class="mono" style="fill:#3f7d5c">exit 0</text>

  <g transform="translate(732 156)">
    <rect width="388" height="150" rx="24" class="box"/>
    <text x="24" y="46" class="greenlabel">Human reviews the diff</text>
    <text x="24" y="78" class="soft">Structure is already guaranteed. What is left:</text>
    <text x="24" y="104" class="soft">· which permission or sharing model changed</text>
    <text x="24" y="126" class="soft">· which action just became reachable by AI</text>
  </g>

  <text x="732" y="366" class="label">The gate makes output valid.</text>
  <text x="732" y="392" class="tiny">It cannot make it right — it will confirm that</text>
  <text x="732" y="414" class="tiny">`record.done` resolves, and has no opinion on</text>
  <text x="732" y="436" class="tiny">whether that was the correct field to read.</text>
</svg>
