<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="Enforcement pipeline for an AI agent request, showing which checks run before data reaches the model">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.h{font-size:28px;font-weight:780}.t{font-size:17px;font-weight:740}.s{font-size:13px;fill:#647872}.cap{font-size:12px;font-weight:780;fill:#2a7468}.warn{font-size:12px;font-weight:780;fill:#b0563c}.box{fill:#fffefa;stroke:#d7dfdb}.green{fill:#eef7f3;stroke:#bdd7cf}.yellow{fill:#fff3d6;stroke:#efc86c}.blue{fill:#edf2ff;stroke:#bdc8ee}.red{fill:#fff0ec;stroke:#e8b3a4}.dark{fill:#173a36}.white{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="660" fill="#f8faf8"/>
  <text x="70" y="58" class="h">Four enforcement points, one context window</text>
  <text x="70" y="88" class="s">Points 1 and 2 remove data before the model can read it. Point 3 decides what may be called. Point 4 runs unbounded.</text>

  <g transform="translate(70 118)">
    <rect width="1060" height="452" rx="30" class="box"/>

    <!-- context window band -->
    <rect x="516" y="26" width="518" height="400" rx="22" fill="#f4f1ea" stroke="#ddd2c0" stroke-dasharray="8 7"/>
    <text x="775" y="52" text-anchor="middle" class="s" font-weight="740">inside the model's context window</text>

    <!-- user -->
    <g transform="translate(36 150)">
      <rect width="150" height="104" rx="24" class="dark"/>
      <text x="75" y="44" text-anchor="middle" class="white" font-size="18" font-weight="760">User asks</text>
      <text x="75" y="72" text-anchor="middle" class="soft" font-size="13">identity travels</text>
    </g>

    <!-- point 1 -->
    <g transform="translate(232 74)">
      <rect width="238" height="112" rx="20" class="yellow"/>
      <text x="16" y="28" class="cap">1 — THE QUERY</text>
      <text x="119" y="60" text-anchor="middle" class="t">Row scope pushed down</text>
      <text x="119" y="84" text-anchor="middle" class="s">Out-of-scope rows are</text>
      <text x="119" y="102" text-anchor="middle" class="s">never produced</text>
    </g>

    <!-- point 2 -->
    <g transform="translate(232 222)">
      <rect width="238" height="112" rx="20" class="blue"/>
      <text x="16" y="28" class="cap">2 — THE FIELD</text>
      <text x="119" y="60" text-anchor="middle" class="t">Masked at serialization</text>
      <text x="119" y="84" text-anchor="middle" class="s">Aggregates gated on</text>
      <text x="119" y="102" text-anchor="middle" class="s">their inputs too</text>
    </g>

    <!-- model -->
    <g transform="translate(556 150)">
      <rect width="150" height="104" rx="24" fill="#fffefa" stroke="#d7dfdb"/>
      <text x="75" y="46" text-anchor="middle" class="t">Model</text>
      <text x="75" y="72" text-anchor="middle" class="s">reads what is left</text>
    </g>

    <!-- point 3 -->
    <g transform="translate(756 74)">
      <rect width="238" height="112" rx="20" class="green"/>
      <text x="16" y="28" class="cap">3 — THE TOOL GATE</text>
      <text x="119" y="60" text-anchor="middle" class="t">exposed: false</text>
      <text x="119" y="84" text-anchor="middle" class="s">Deny by default; arming it</text>
      <text x="119" y="102" text-anchor="middle" class="s">requires a written contract</text>
    </g>

    <!-- point 4 -->
    <g transform="translate(756 222)">
      <rect width="238" height="112" rx="20" class="red"/>
      <text x="16" y="28" class="warn">4 — THE ACTION BODY</text>
      <text x="119" y="60" text-anchor="middle" class="t">Trusted app code</text>
      <text x="119" y="84" text-anchor="middle" class="s">No data-layer backstop —</text>
      <text x="119" y="102" text-anchor="middle" class="s">exposure implies review</text>
    </g>

    <path d="M190 202 C214 202 214 130 228 130 M190 202 C214 202 214 278 228 278 M474 130 C506 130 524 190 552 190 M474 278 C506 278 524 218 552 218 M710 190 C734 190 734 130 752 130 M710 214 C734 214 734 278 752 278"
          stroke="#2a7468" stroke-width="4" stroke-linecap="round" fill="none"/>

    <text x="530" y="404" text-anchor="middle" class="s">The build rejects a row-level rule that would compile to nothing — the failure that reads as an authorization and behaves as a blanket refusal.</text>
  </g>
</svg>
