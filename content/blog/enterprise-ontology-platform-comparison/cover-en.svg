<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The 2026 ontology comparison: Fabric IQ, Unity Catalog, Snowflake and Palantir Foundry compared on objects, relationships, actions, permissions and agent interface">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f3f6fb"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#16243f" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#142540}.title{font-size:52px;font-weight:780}.sub{font-size:21px;fill:#566480}.vendor{font-size:19px;font-weight:740;fill:#eaf1ff}.cap{font-size:15px;fill:#9fb2d6}.mark{font-size:22px;font-weight:760}.ok{fill:#1d7a5f}.warn{fill:#b8860b}.no{fill:#8494b0}.foot{font-size:16px;fill:#566480}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="86" y="98" class="title">The 2026 ontology comparison</text>
  <text x="86" y="136" class="sub">Four platforms, one question: where does each stop describing and start acting?</text>

  <g transform="translate(86 186)" filter="url(#shadow)">
    <rect width="1028" height="366" rx="26" fill="#142540"/>

    <text x="40" y="52" class="cap">CAPABILITY</text>
    <text x="300" y="52" class="vendor">Fabric IQ</text>
    <text x="490" y="52" class="vendor">Unity Catalog</text>
    <text x="710" y="52" class="vendor">Snowflake</text>
    <text x="880" y="52" class="vendor">Palantir</text>
    <line x1="40" y1="70" x2="988" y2="70" stroke="#2b4373"/>

    <text x="40" y="122" class="cap" fill="#c8d6f0">Objects</text>
    <text x="300" y="124" class="mark ok">&#8226;</text>
    <text x="490" y="124" class="mark ok">&#8226;</text>
    <text x="710" y="124" class="mark ok">&#8226;</text>
    <text x="880" y="124" class="mark ok">&#8226;</text>
    <line x1="40" y1="142" x2="988" y2="142" stroke="#1d3258"/>

    <text x="40" y="186" class="cap" fill="#c8d6f0">Relationships</text>
    <text x="300" y="188" class="mark ok">&#8226;</text>
    <text x="490" y="188" class="mark ok">&#8226;</text>
    <text x="710" y="188" class="mark ok">&#8226;</text>
    <text x="880" y="188" class="mark ok">&#8226;</text>
    <line x1="40" y1="206" x2="988" y2="206" stroke="#1d3258"/>

    <rect x="24" y="220" width="964" height="60" rx="12" fill="#1d3258"/>
    <text x="40" y="258" class="cap" fill="#ffd98a" font-weight="740">Actions</text>
    <text x="300" y="260" class="mark warn">declared</text>
    <text x="490" y="260" class="mark no">read-only</text>
    <text x="710" y="260" class="mark no">read-only</text>
    <text x="880" y="260" class="mark ok">executes</text>

    <text x="40" y="324" class="cap" fill="#c8d6f0">Agent interface</text>
    <text x="300" y="326" class="mark ok">MCP</text>
    <text x="490" y="326" class="mark ok">Genie</text>
    <text x="710" y="326" class="mark ok">MCP</text>
    <text x="880" y="326" class="mark ok">MCP</text>
  </g>

  <text x="86" y="596" class="foot">The read&#8211;write line is the row that eliminates two of the four.</text>
  <text x="86" y="626" class="foot" fill="#8494b0">Every cell sourced to the vendor&#8217;s own documentation.</text>
</svg>
