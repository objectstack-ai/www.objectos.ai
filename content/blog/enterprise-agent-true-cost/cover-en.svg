<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="An unpredictable per-action bill versus the predictable cost of a self-hosted runtime">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:19px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:14px}
      .warn{fill:#9a3b1f}.ok{fill:#1f6b4a}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="78" font-size="32" font-weight="780">Do the real math on enterprise agents</text>
  <text x="96" y="113" class="tiny">"$0.10 an action" sounds cheap—until the agent runs hundreds of thousands a day</text>

  <!-- Left: per-action billing spike -->
  <g transform="translate(96 168)" filter="url(#shadow)">
    <rect width="500" height="400" rx="22" fill="#ffffff"/>
    <text x="36" y="56" class="label warn">Per-action billing</text>
    <text x="36" y="82" class="soft">$0.10 each · the more autonomous, the more unbounded</text>
    <g transform="translate(36 110)">
      <rect x="0" y="180" width="60" height="40" rx="6" fill="#f3d9cd"/>
      <rect x="80" y="140" width="60" height="80" rx="6" fill="#eec3b0"/>
      <rect x="160" y="84" width="60" height="136" rx="6" fill="#e0a288"/>
      <rect x="240" y="20" width="60" height="200" rx="6" fill="#9a3b1f"/>
      <path d="M30 196 C 120 150, 220 70, 270 22" fill="none" stroke="#9a3b1f" stroke-width="3" stroke-dasharray="6 5"/>
    </g>
    <text x="36" y="346" class="soft warn" font-weight="700">The better it works → the more it costs</text>
    <text x="36" y="372" class="soft">Reported: equivalent SaaS can hit $2M+ / year</text>
  </g>

  <!-- Right: self-hosted flat -->
  <g transform="translate(636 168)" filter="url(#shadow)">
    <rect width="468" height="400" rx="22" fill="#22433d"/>
    <text x="36" y="56" class="label invert">Self-hosted runtime</text>
    <text x="36" y="82" class="soft" style="fill:#a9c4ba">License + infrastructure, predictable</text>
    <g transform="translate(36 110)">
      <line x1="0" y1="120" x2="396" y2="116" stroke="#7fae9f" stroke-width="4"/>
      <circle cx="0" cy="120" r="5" fill="#7fae9f"/><circle cx="396" cy="116" r="5" fill="#7fae9f"/>
      <text x="0" y="170" class="soft" style="fill:#a9c4ba">Double the usage, the curve barely moves</text>
    </g>
    <g transform="translate(36 300)">
      <text x="0" y="0" font-size="38" font-weight="820" fill="#e8b04b">40–60% less</text>
      <text x="0" y="34" class="soft" style="fill:#a9c4ba">By industry estimates, vs equivalent SaaS</text>
    </g>
  </g>
</svg>
