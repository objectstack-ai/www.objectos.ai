<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Executable ontology vs knowledge ontology: no inheritance, no axioms, no reasoner. One key, abstract: true, across two releases of @objectstack/spec: in 15.1.1 it parses, is kept and has no runtime reader, so an abstract object still gets a table; in 17.7.0 it is refused with the prescription Remove the key. A key you can write has a reader in the runtime, or it is removed.">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em;fill:#256a5e}
      .title{font-size:52px;font-weight:800}
      .lead{font-size:19px;fill:#3f554f}
      .chip{font-size:14px;font-weight:760;fill:#256a5e}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#52655f}
      .code{font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:700;fill:#173a36}
      .ver{font-size:16px;font-weight:780}
      .small{font-size:13px;fill:#52655f}
      .verdictA{font-size:12px;font-weight:780;letter-spacing:.06em;fill:#7a5a2c}
      .verdictB{font-size:12px;font-weight:780;letter-spacing:.06em;fill:#256a5e}
      .arrow{font-size:13px;font-weight:760;fill:#256a5e}
      .foot{font-size:13px;fill:#52655f}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="112" class="eyebrow">EXECUTABLE VS KNOWLEDGE ONTOLOGY</text>
  <text x="78" y="178" class="title">No inheritance,</text>
  <text x="78" y="238" class="title">no axioms,</text>
  <text x="78" y="298" class="title">no reasoner.</text>
  <text x="78" y="350" class="lead">Why the three refusals are the point:</text>
  <text x="78" y="376" class="lead">a key you can write has a reader</text>
  <text x="78" y="402" class="lead">in the runtime, or it is removed.</text>

  <g transform="translate(78 440)"><rect width="112" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="56" y="23" class="chip" text-anchor="middle">Executable</text></g>
  <g transform="translate(200 440)"><rect width="238" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="119" y="23" class="chip" text-anchor="middle">validated, not reasoned over</text></g>

  <g transform="translate(650 104)" filter="url(#shadow)">
    <rect width="472" height="472" rx="28" fill="#fffefa" stroke="#d8dfd6"/>
    <text x="28" y="40" class="cap">ONE KEY, TWO RELEASES</text>
    <g transform="translate(28 56)">
      <rect width="416" height="52" rx="12" fill="#eef7f2" stroke="#b9dcd0"/>
      <text x="208" y="34" class="code" text-anchor="middle">abstract: true</text>
    </g>

    <g transform="translate(28 128)">
      <rect width="416" height="124" rx="16" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="20" y="32" class="ver">@objectstack/spec 15.1.1</text>
      <text x="20" y="58" class="small">Parses. Key kept. No runtime reader:</text>
      <text x="20" y="78" class="small">an abstract object still gets a table.</text>
      <text x="20" y="106" class="verdictA">PARSED, UNREAD</text>
    </g>

    <text x="236" y="284" class="arrow" text-anchor="middle">ADR-0049: enforce it, or remove it</text>

    <g transform="translate(28 300)">
      <rect width="416" height="124" rx="16" fill="#eef7f2" stroke="#b9dcd0"/>
      <text x="20" y="32" class="ver">@objectstack/spec 17.7.0</text>
      <text x="20" y="58" class="small">Refused: Unrecognized key(s) on this object.</text>
      <text x="20" y="78" class="small">The message ends: "Remove the key."</text>
      <text x="20" y="106" class="verdictB">A READER FOR EVERY KEY</text>
    </g>

    <text x="28" y="452" class="small">No inheritance was built in between. The promise was removed instead.</text>
  </g>

  <text x="78" y="618" class="foot">Measured on the published packages; every quoted line is in the ObjectStack repository.</text>
</svg>
