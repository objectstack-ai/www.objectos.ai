<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="What makes a business app AI-writable? Typed, Validated, Reviewed, Governed: the four gates between an agent and your users, next to one real run of the validation gate at ObjectStack 17.7.0 in which three deliberate mistakes were refused with located rule ids and the fixed app passed 49 rules">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7f8fb"/>
      <stop offset=".6" stop-color="#eef1f7"/>
      <stop offset="1" stop-color="#fdf3e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1b2a41" flood-opacity=".14"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1b2a41}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em;fill:#2f4bb8}
      .title{font-size:52px;font-weight:800}
      .lead{font-size:18px;fill:#4a5a70}
      .chip{font-size:14px;font-weight:760}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#5b6a7c}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600}
      .small{font-size:13px;fill:#5b6a7c}
      .foot{font-size:13px;fill:#5b6a7c}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="112" class="eyebrow">THE AI-WRITABLE TEST</text>
  <text x="78" y="170" class="title">What makes a</text>
  <text x="78" y="228" class="title">business app</text>
  <text x="78" y="286" class="title">AI-writable?</text>
  <text x="78" y="334" class="lead">Four gates stand between an agent</text>
  <text x="78" y="358" class="lead">and your users. Each one is a place</text>
  <text x="78" y="382" class="lead">where a mistake dies before it ships.</text>

  <g transform="translate(78 416)"><rect width="84" height="36" rx="18" fill="#e8edfb" stroke="#8ea3e6"/><text x="42" y="23" class="chip" text-anchor="middle" style="fill:#2f4bb8">Typed</text></g>
  <g transform="translate(172 416)"><rect width="106" height="36" rx="18" fill="#e6f4f1" stroke="#8fcdc0"/><text x="53" y="23" class="chip" text-anchor="middle" style="fill:#176a5c">Validated</text></g>
  <g transform="translate(288 416)"><rect width="104" height="36" rx="18" fill="#fdf1e3" stroke="#e9c48f"/><text x="52" y="23" class="chip" text-anchor="middle" style="fill:#8a4f0c">Reviewed</text></g>
  <g transform="translate(402 416)"><rect width="104" height="36" rx="18" fill="#eeeef5" stroke="#b9b9d3"/><text x="52" y="23" class="chip" text-anchor="middle" style="fill:#4b4a7a">Governed</text></g>

  <g transform="translate(650 112)" filter="url(#shadow)">
    <rect width="472" height="456" rx="24" fill="#ffffff" stroke="#d6dbe6"/>
    <rect x="0" y="22" width="472" height="26" fill="#f1f3f8"/>
    <rect x="0" y="0" width="472" height="48" rx="24" fill="#f1f3f8"/>
    <text x="24" y="30" class="mono" style="fill:#4a5a70">$ npm run validate</text>
    <text x="448" y="30" class="cap" text-anchor="end">17.7.0 · 49 RULES</text>

    <g transform="translate(24 66)">
      <rect width="424" height="84" rx="14" fill="#fff5f4" stroke="#efc6c2"/>
      <text x="18" y="30" class="mono" style="fill:#b3433a">✗ expression-invalid</text>
      <text x="18" y="52" class="small">bare `status` in a predicate</text>
      <text x="18" y="70" class="small">would hide Resolve on every ticket</text>
    </g>
    <g transform="translate(24 162)">
      <rect width="424" height="84" rx="14" fill="#fff5f4" stroke="#efc6c2"/>
      <text x="18" y="30" class="mono" style="fill:#b3433a">✗ action-name-undefined</text>
      <text x="18" y="52" class="small">rowActions names no action</text>
      <text x="18" y="70" class="small">a button that renders and does nothing</text>
    </g>
    <g transform="translate(24 258)">
      <rect width="424" height="84" rx="14" fill="#fff5f4" stroke="#efc6c2"/>
      <text x="18" y="30" class="mono" style="fill:#b3433a">✗ security-owd-unset</text>
      <text x="18" y="52" class="small">no sharingModel on the object</text>
      <text x="18" y="70" class="small">a security baseline by accident</text>
    </g>
    <g transform="translate(24 354)">
      <rect width="424" height="78" rx="14" fill="#e6f4f1" stroke="#8fcdc0"/>
      <text x="18" y="30" class="mono" style="fill:#176a5c">✓ Validation passed (240ms)</text>
      <text x="18" y="52" class="small">after the three fixes: same 49 rules,</text>
      <text x="18" y="70" class="small">2 objects · 1 action · 1 view · 1 permission set</text>
    </g>
  </g>

  <text x="78" y="612" class="foot">One real run at ObjectStack 17.7.0: three deliberate mistakes, three located errors, then a clean pass.</text>
</svg>
