<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="What os verify runs on 17.7.0, in order, and what the exit code reads. Stage 1, author-time rules: the registry os validate runs, 49 rules; a refusal exits 1 with error and errors[] on stdout, zero lines on stderr, and the runtime stage does not run. Stage 2, runtime: boot in-process and, per object, derive a record, create it through the real HTTP stack, read it back and compare; statuses verified, needs-fixture and skipped, of which only create, read and fidelity failures count. On request, --rls: a fresh boot proves a member must not write what it cannot read, for a probe persona and one persona per declared position; statuses rls-consistent and rls-hole are proven, member-visible, probe-blocked and skipped are not proven. hardFailures is six terms and the exit code is 0 when it is 0; needs-fixture, skipped and member-visible are reported but not counted">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4432f"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5e716b}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#2a7468}
      .label{font-size:16px;font-weight:760}
      .small{font-size:13px;fill:#55685f}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600;fill:#173a36}
      .ok{fill:#2a7468}
      .red{fill:#b4432f}
      .amber{fill:#8a6a3a}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">What os verify runs, in order — and what the exit code reads</text>
  <text x="60" y="80" class="note">ObjectStack 17.7.0. The second stage starts only when the first passes; the opt-in probe boots a fresh stack of its own.</text>

  <!-- STAGE 1 -->
  <g transform="translate(60 112)">
    <rect width="340" height="372" rx="20" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="22" y="32" class="cap">STAGE 1 · AUTHOR-TIME RULES</text>
    <text x="22" y="62" class="label">The registry os validate runs</text>
    <text x="22" y="84" class="small">49 rules on 17.7.0, over the stack prepared</text>
    <text x="22" y="102" class="small">the way os validate prepares it: normalized,</text>
    <text x="22" y="120" class="small">parsed against the protocol schema, judged</text>
    <text x="22" y="138" class="small">whole and once per package</text>

    <g transform="translate(22 160)">
      <rect width="296" height="112" rx="12" fill="#fdf1ee" stroke="#e3c3bb"/>
      <text x="14" y="24" class="cap red">REFUSED → EXIT 1</text>
      <text x="14" y="46" class="mono">{ "error": "…", "errors": [ … ] }</text>
      <text x="14" y="68" class="small" style="fill:#4a5d57">the runtime stage did not run</text>
      <text x="14" y="86" class="small" style="fill:#4a5d57">stderr: 0 lines — nothing booted</text>
      <text x="14" y="104" class="small" style="fill:#4a5d57">same rule, path and hint as os validate</text>
    </g>

    <g transform="translate(22 286)">
      <rect width="296" height="40" rx="12" fill="#eef7f2" stroke="#b9dcd0"/>
      <text x="14" y="25" class="label ok">PASSED → stage 2 may start</text>
    </g>
    <text x="22" y="344" class="small">Advisories (warning, info) never fail it;</text>
    <text x="22" y="362" class="small">os validate prints them — run it too.</text>
  </g>

  <!-- arrow 1 → 2 -->
  <line x1="404" y1="298" x2="446" y2="298" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- STAGE 2 -->
  <g transform="translate(450 112)">
    <rect width="340" height="372" rx="20" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="22" y="32" class="cap">STAGE 2 · RUNTIME</text>
    <text x="22" y="62" class="label">Boot in-process, real HTTP stack</text>
    <text x="22" y="84" class="small">For every object, a record derived from</text>
    <text x="22" y="102" class="small">its fields is created, read back and</text>
    <text x="22" y="120" class="small">compared — CRUD round-trip fidelity.</text>
    <text x="22" y="138" class="small">Log lines go to stderr; stdout is one JSON.</text>

    <g transform="translate(22 160)">
      <rect width="296" height="112" rx="12" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="14" y="24" class="cap">PER-OBJECT STATUS</text>
      <text x="14" y="48" class="mono ok">verified</text>
      <text x="110" y="48" class="small">created, read back, equal</text>
      <text x="14" y="70" class="mono amber">needs-fixture</text>
      <text x="130" y="70" class="small">the app's own rule refused it</text>
      <text x="14" y="92" class="mono amber">skipped</text>
      <text x="100" y="92" class="small">required relation had no record</text>
    </g>

    <g transform="translate(22 286)">
      <rect width="296" height="62" rx="12" fill="#fdf1ee" stroke="#e3c3bb"/>
      <text x="14" y="24" class="cap red">COUNTS AS A FAILURE</text>
      <text x="14" y="48" class="mono red" style="font-size:11px">createFailed · readFailed · fidelityGaps</text>
    </g>
    <text x="22" y="364" class="small">needs-fixture and skipped are reported, not counted.</text>
  </g>

  <!-- arrow 2 → rls (dashed: opt-in) -->
  <line x1="794" y1="298" x2="836" y2="298" stroke="#2a7468" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr)"/>

  <!-- RLS -->
  <g transform="translate(840 112)">
    <rect width="300" height="372" rx="20" fill="#ffffff" stroke="#2a7468" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="22" y="32" class="cap">ON REQUEST · --rls</text>
    <text x="22" y="62" class="label">A second, fresh boot</text>
    <text x="22" y="84" class="small">Proves one invariant: a member must not</text>
    <text x="22" y="102" class="small">write what it cannot read. For a probe</text>
    <text x="22" y="120" class="small">persona, and one persona per declared</text>
    <text x="22" y="138" class="small">position (CRM: 3 declared, 3 probed).</text>

    <g transform="translate(22 160)">
      <rect width="256" height="134" rx="12" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="14" y="24" class="cap">PER-PROBE STATUS</text>
      <text x="14" y="46" class="mono ok">rls-consistent</text>
      <text x="150" y="46" class="small">proven</text>
      <text x="14" y="66" class="mono red">rls-hole</text>
      <text x="150" y="66" class="small">proven hole</text>
      <text x="14" y="86" class="mono amber">member-visible</text>
      <text x="150" y="86" class="small">not proven</text>
      <text x="14" y="106" class="mono amber">probe-blocked</text>
      <text x="150" y="106" class="small">not proven</text>
      <text x="14" y="126" class="mono amber">skipped</text>
      <text x="150" y="126" class="small">not proven</text>
    </g>

    <g transform="translate(22 308)">
      <rect width="256" height="62" rx="12" fill="#fdf1ee" stroke="#e3c3bb"/>
      <text x="14" y="24" class="cap red">COUNTS AS A FAILURE</text>
      <text x="14" y="46" class="mono red">holes · degraded probe · notRun</text>
    </g>
  </g>

  <!-- the count -->
  <line x1="600" y1="488" x2="600" y2="524" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <g transform="translate(60 530)">
    <rect width="1080" height="120" rx="20" fill="#eef7f2" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="34" class="cap">THE ONE COUNT THE EXIT CODE READS</text>
    <text x="24" y="64" class="mono">hardFailures = createFailed + readFailed + fidelityGaps + holes + (degraded probe ? 1 : 0) + positions notRun</text>
    <text x="24" y="90" class="label ok">hardFailures = 0 → exit 0</text>
    <text x="260" y="90" class="label red">otherwise → exit 1</text>
    <text x="500" y="90" class="small">Not in the count, but in the report: needs-fixture, skipped, member-visible —</text>
    <text x="500" y="108" class="small">coverage is reported, never dropped. Read crud.summary and rls.totals.unproven first.</text>
  </g>

  <text x="60" y="682" class="small">Source: cli.mdx and verify.ts at the @objectstack/cli@17.7.0 tag; statuses from packages/verify/src/rls.ts. Counts measured on the blank scaffold and examples/app-crm.</text>
</svg>
