<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 312" role="img" aria-label="企业软件换了三次界面——终端与表单、Web 与移动端、对话框——而三次之下有一件事从来没变：用户是人。高亮的第四栏是新用户：Agent，四十年来第一个新用户，而它不是人。">
  <defs><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f8b81"/></marker><marker id="ar-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c7a55"/></marker><marker id="ar-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b07a1a"/></marker><marker id="ar-onInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8cdc2"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style></defs>
  <rect width="900" height="312" fill="#f8faf7"/>
  <g transform="translate(30 30)">
    <text x="0" y="12" font-size="12" font-weight="700" fill="#1c7a55" text-anchor="start">三次界面</text>
    <path d="M0 26 L628 26" fill="none" stroke="#1c7a55" stroke-width="1.6" marker-end="url(#ar-accent)"/>
    <circle cx="100" cy="26" r="5" fill="#1c7a55"/>
    <rect x="0" y="40" width="200" height="90" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="14" y="68.5" font-size="14.5" font-weight="700" fill="#173a36" text-anchor="start">终端与表单</text>
    <text x="14" y="91.625" font-size="13" font-weight="400" fill="#5d736b" text-anchor="start">人去适应软件</text>
    <circle cx="314" cy="26" r="5" fill="#1c7a55"/>
    <rect x="214" y="40" width="200" height="90" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="228" y="68.5" font-size="14.5" font-weight="700" fill="#173a36" text-anchor="start">Web 与移动端</text>
    <text x="228" y="91.625" font-size="13" font-weight="400" fill="#5d736b" text-anchor="start">软件来适应人</text>
    <circle cx="528" cy="26" r="5" fill="#1c7a55"/>
    <rect x="428" y="40" width="200" height="90" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="442" y="68.5" font-size="14.5" font-weight="700" fill="#173a36" text-anchor="start">对话框</text>
    <text x="442" y="91.625" font-size="13" font-weight="400" fill="#5d736b" text-anchor="start">软件仿佛消失在语言里</text>
    <rect x="0" y="144" width="628" height="108" rx="12" fill="#22433d" stroke="#22433d" stroke-width="1"/>
    <text x="18" y="173" font-size="12" font-weight="700" fill="#a8cdc2" text-anchor="start">从来没变的一件事</text>
    <text x="18" y="196.3" font-size="16" font-weight="700" fill="#eafff6" text-anchor="start">用户是人。</text>
    <text x="18" y="219.8" font-size="13" font-weight="400" fill="#a8cdc2" text-anchor="start">API 写给程序员，文档写给读者，</text>
    <text x="18" y="238.65" font-size="13" font-weight="400" fill="#a8cdc2" text-anchor="start">审计日志写给审计员。</text>
    <path d="M630 198 L650 198" fill="none" stroke="#1c7a55" stroke-width="1.6" marker-end="url(#ar-accent)"/>
    <rect x="652" y="40" width="188" height="212" rx="12" fill="#1c7a55" stroke="#1c7a55" stroke-width="1"/>
    <text x="670" y="69" font-size="12" font-weight="700" fill="#d7f2e4" text-anchor="start">新用户</text>
    <text x="670" y="93.3" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Agent</text>
    <text x="670" y="117.05" font-size="13" font-weight="400" fill="#d7f2e4" text-anchor="start">四十年来</text>
    <text x="670" y="135.9" font-size="13" font-weight="400" fill="#d7f2e4" text-anchor="start">第一个新用户。</text>
    <text x="670" y="173.6" font-size="13" font-weight="400" fill="#d7f2e4" text-anchor="start">它不是人。</text>
  </g>
</svg>
