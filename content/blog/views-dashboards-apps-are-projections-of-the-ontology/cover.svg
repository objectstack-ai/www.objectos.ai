<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="视图、仪表盘和应用是本体的投影：一份给自带 Todo 示例加 budget 字段的五行 diff；数据表、REST API、MCP 的 describe 调用和控制台表单自己跟上了，而钉死了列名的列表视图、中文翻译和仪表盘数据集保持原样">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em}
      .title{font-size:54px;font-weight:800}
      .lead{font-size:19px}
      .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:600}
      .kicker{font-size:12px;font-weight:780;letter-spacing:.12em}
      .row{font-size:15px}
      .rowNum{font-size:15px;font-weight:760}
      .foot{font-size:13px}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="118" class="eyebrow" fill="#2a7468">这对审阅意味着什么</text>
  <text x="78" y="186" class="title" fill="#173a36">改一个字段，</text>
  <text x="78" y="248" class="title" fill="#173a36">动到每个面。</text>
  <text x="78" y="300" class="lead" fill="#3f554f">给定义加一个字段，数据表、API、MCP 工具</text>
  <text x="78" y="327" class="lead" fill="#3f554f">和控制台自己跟上。</text>
  <text x="78" y="354" class="lead" fill="#3f554f">写明了列名的视图不会。</text>

  <g transform="translate(78 392)">
    <rect width="470" height="38" rx="19" fill="#ffffff" stroke="#b9dcd0"/>
    <text x="235" y="24" class="mono" text-anchor="middle" fill="#2a7468">+ budget: Field.currency({ label: 'Budget' })</text>
  </g>

  <g transform="translate(78 452)">
    <rect width="470" height="38" rx="19" fill="#ffffff" stroke="#e6d3b6"/>
    <text x="235" y="24" class="row" text-anchor="middle" fill="#a35a1f">命名测试：写明的是字段，还是只有对象？</text>
  </g>

  <g transform="translate(640 104)">
    <rect width="482" height="232" rx="18" fill="#f4faf7" stroke="#c9d8d1"/>
    <text x="28" y="34" class="kicker" fill="#2a7468">未经编辑就跟上 · 推导</text>
    <text x="28" y="72" class="row" fill="#173a36">SQLite 表 todo_task</text>
    <text x="454" y="72" class="rowNum" text-anchor="end" fill="#2a7468">27 → 28 列</text>
    <text x="28" y="104" class="row" fill="#173a36">GET /api/v1/data/todo_task</text>
    <text x="454" y="104" class="rowNum" text-anchor="end" fill="#2a7468">27 → 28 个键</text>
    <text x="28" y="136" class="row" fill="#173a36">POST 带 budget: 1200</text>
    <text x="454" y="136" class="rowNum" text-anchor="end" fill="#2a7468">400 → 201</text>
    <text x="28" y="168" class="row" fill="#173a36">MCP describe_object</text>
    <text x="454" y="168" class="rowNum" text-anchor="end" fill="#2a7468">19 → 20 个字段</text>
    <text x="28" y="200" class="row" fill="#173a36">控制台新建表单</text>
    <text x="454" y="200" class="rowNum" text-anchor="end" fill="#2a7468">16 → 17 个输入项</text>
  </g>

  <g transform="translate(640 356)">
    <rect width="482" height="168" rx="18" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="28" y="34" class="kicker" fill="#a35a1f">没有变化 · 钉在字段名上</text>
    <text x="28" y="72" class="row" fill="#173a36">All Tasks 列表视图</text>
    <text x="454" y="72" class="rowNum" text-anchor="end" fill="#a35a1f">6 列，原样</text>
    <text x="28" y="104" class="row" fill="#173a36">zh-CN 翻译</text>
    <text x="454" y="104" class="rowNum" text-anchor="end" fill="#a35a1f">budget → "Budget"</text>
    <text x="28" y="136" class="row" fill="#173a36">仪表盘数据集 task_metrics</text>
    <text x="454" y="136" class="rowNum" text-anchor="end" fill="#a35a1f">3 个度量，按名字</text>
  </g>

  <text x="78" y="618" class="foot" fill="#4f625c">在 ObjectStack 18.0.0-next.2 上测量，examples/app-todo 取自提交 43567a8f：一份五行 diff，前后各十一个读数。</text>
</svg>
