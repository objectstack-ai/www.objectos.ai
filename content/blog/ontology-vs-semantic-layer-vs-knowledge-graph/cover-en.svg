<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Three layers compared: a semantic layer defines metrics, a knowledge graph stores edges, and only an ontology carries actions and permissions">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7faf8"/>
      <stop offset=".6" stop-color="#eef6f1"/>
      <stop offset="1" stop-color="#fdf1e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}
      .cap{font-size:12px;font-weight:700;letter-spacing:.09em;fill:#8aa096}
      .name{font-size:21px;font-weight:760}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .q{font-size:16px;fill:#3c574f}
      .prim{font-size:15px;font-weight:600}
      .muted{font-size:14px;fill:#a2b3ab}
      .invert{fill:#eafff6}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="80" y="86" font-size="38" font-weight="780">Ontology vs Semantic Layer vs Knowledge Graph</text>
  <text x="80" y="124" class="tiny">Three of the five primitives are shared. Actions and permissions belong to exactly one column.</text>

  <!-- card 1: semantic layer -->
  <g transform="translate(80 170)" filter="url(#shadow)">
    <rect width="336" height="300" rx="18" fill="#ffffff" stroke="#dbe5df"/>
    <text x="28" y="46" class="name">Semantic layer</text>
    <line x1="28" y1="66" x2="308" y2="66" stroke="#e3ece7" stroke-width="2"/>
    <text x="28" y="94" class="cap">UNIT</text>
    <text x="28" y="122" class="mono" font-size="19" font-weight="700">metric</text>
    <text x="28" y="160" class="cap">ANSWERS</text>
    <text x="28" y="186" class="q">What does this number mean?</text>
    <text x="28" y="224" class="cap">PRIMITIVES</text>
    <text x="28" y="250" class="prim">metric · dimension · join</text>
    <text x="28" y="276" class="muted">no actions · no permissions</text>
  </g>

  <!-- card 2: knowledge graph -->
  <g transform="translate(440 170)" filter="url(#shadow)">
    <rect width="336" height="300" rx="18" fill="#ffffff" stroke="#dbe5df"/>
    <text x="28" y="46" class="name">Knowledge graph</text>
    <line x1="28" y1="66" x2="308" y2="66" stroke="#e3ece7" stroke-width="2"/>
    <text x="28" y="94" class="cap">UNIT</text>
    <text x="28" y="122" class="mono" font-size="19" font-weight="700">edge</text>
    <text x="28" y="160" class="cap">ANSWERS</text>
    <text x="28" y="186" class="q">What connects to what?</text>
    <text x="28" y="224" class="cap">PRIMITIVES</text>
    <text x="28" y="250" class="prim">node · property · edge</text>
    <text x="28" y="276" class="muted">no actions · no permissions</text>
  </g>

  <!-- card 3: ontology -->
  <g transform="translate(800 170)" filter="url(#shadow)">
    <rect width="336" height="300" rx="18" fill="#22433d"/>
    <text x="28" y="46" class="name invert">Ontology</text>
    <line x1="28" y1="66" x2="308" y2="66" stroke="#3d6159" stroke-width="2"/>
    <text x="28" y="94" class="cap" style="fill:#9dc4b6">UNIT</text>
    <text x="28" y="122" class="mono invert" font-size="19" font-weight="700">object</text>
    <text x="28" y="160" class="cap" style="fill:#9dc4b6">ANSWERS</text>
    <text x="28" y="186" class="q" style="fill:#cfe8dd">What may be done, and by whom?</text>
    <text x="28" y="224" class="cap" style="fill:#9dc4b6">PRIMITIVES</text>
    <text x="28" y="250" class="prim" style="fill:#cfe8dd">class · property · relation</text>
    <rect x="24" y="260" width="230" height="30" rx="9" fill="#1f6b4a"/>
    <text x="38" y="281" class="prim invert">action · permission</text>
  </g>

  <!-- the acting question -->
  <g transform="translate(80 498)" filter="url(#shadow)">
    <rect width="1056" height="132" rx="18" fill="#fffefa" stroke="#dbe5df"/>
    <text x="28" y="36" class="cap">THE QUESTION AN ACTING AGENT REACHES</text>
    <text x="28" y="66" class="mono" font-size="17" font-weight="700">apply_discount(OPP-8842, 20%) as j.chen</text>
    <g transform="translate(0 84)">
      <rect x="24" y="0" width="316" height="34" rx="10" fill="#f2f5f2" stroke="#e0e8e3"/>
      <text x="182" y="23" text-anchor="middle" font-size="15" font-weight="640" style="fill:#8a6a52">✗  not a measure</text>
      <rect x="368" y="0" width="316" height="34" rx="10" fill="#f2f5f2" stroke="#e0e8e3"/>
      <text x="526" y="23" text-anchor="middle" font-size="15" font-weight="640" style="fill:#8a6a52">✗  not a traversal</text>
      <rect x="712" y="0" width="320" height="34" rx="10" fill="#e4f2ea" stroke="#bcdccb"/>
      <text x="872" y="23" text-anchor="middle" font-size="15" font-weight="640" style="fill:#1f6b4a">✓  allowed · refused · recorded</text>
    </g>
  </g>
</svg>
