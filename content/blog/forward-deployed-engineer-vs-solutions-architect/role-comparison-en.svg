<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="One engagement timeline from evaluation to running in production, with four bars showing where the solutions engineer, solutions architect, consultant and forward deployed engineer are present and where each one's accountability ends">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".6" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fdf3e6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:15px;fill:#5d736b}
      .stage{font-size:13px;font-weight:700;fill:#7d8f88;letter-spacing:.04em}
      .rolename{font-size:17px;font-weight:740}
      .rolesub{font-size:12.5px;fill:#7d8f88}
      .end{font-size:12.5px;fill:#5d736b}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>

  <text x="88" y="70" font-size="29" font-weight="780">Where each role is present &#8212; and where its accountability ends</text>
  <text x="88" y="104" class="tiny">One engagement, four spans. Every role can sit in the room the whole time; only one bar reaches &#8220;still running&#8221;.</text>

  <!-- stage guides -->
  <g>
    <line x1="330" y1="150" x2="330" y2="546" stroke="#d5e2db" stroke-width="1.5"/>
    <line x1="470" y1="150" x2="470" y2="546" stroke="#c2d4cc" stroke-width="2"/>
    <line x1="620" y1="150" x2="620" y2="546" stroke="#d5e2db" stroke-width="1.5"/>
    <line x1="770" y1="150" x2="770" y2="546" stroke="#d5e2db" stroke-width="1.5"/>
    <line x1="920" y1="150" x2="920" y2="546" stroke="#c2d4cc" stroke-width="2"/>
    <line x1="1080" y1="150" x2="1080" y2="546" stroke="#d5e2db" stroke-width="1.5"/>
  </g>
  <text x="330" y="142" class="stage" text-anchor="middle">EVALUATE</text>
  <text x="470" y="142" class="stage" text-anchor="middle">SIGN</text>
  <text x="620" y="142" class="stage" text-anchor="middle">DESIGN</text>
  <text x="770" y="142" class="stage" text-anchor="middle">BUILD</text>
  <text x="920" y="142" class="stage" text-anchor="middle">GO-LIVE</text>
  <text x="1080" y="142" class="stage" text-anchor="middle">RUN</text>

  <!-- row 1 · solutions engineer -->
  <text x="88" y="196" class="rolename">Solutions engineer</text>
  <text x="88" y="215" class="rolesub">reports into sales</text>
  <rect x="276" y="183" width="212" height="30" rx="9" fill="#8fb8a8"/>
  <circle cx="488" cy="198" r="7" fill="#ffffff" stroke="#5d736b" stroke-width="2.5"/>
  <text x="506" y="203" class="end">ends at signature &#8212; the demo is deleted</text>

  <!-- row 2 · solutions architect -->
  <text x="88" y="281" class="rolename">Solutions architect</text>
  <text x="88" y="300" class="rolesub">sales, or the customer&#8217;s own org</text>
  <rect x="404" y="268" width="256" height="30" rx="9" fill="#7fa8bf"/>
  <rect x="660" y="276" width="110" height="14" rx="7" fill="#cddfe8"/>
  <circle cx="660" cy="283" r="7" fill="#ffffff" stroke="#5d736b" stroke-width="2.5"/>
  <text x="790" y="288" class="end">design approved, then handed to whoever runs it</text>

  <!-- row 3 · consultant -->
  <text x="88" y="366" class="rolename">Consultant</text>
  <text x="88" y="385" class="rolesub">reports into the services P&#38;L</text>
  <rect x="478" y="353" width="452" height="30" rx="9" fill="#d3b284"/>
  <circle cx="930" cy="368" r="7" fill="#ffffff" stroke="#5d736b" stroke-width="2.5"/>
  <text x="948" y="373" class="end">ends when the SOW is accepted</text>

  <!-- row 4 · forward deployed engineer -->
  <text x="88" y="451" class="rolename">Forward deployed engineer</text>
  <text x="88" y="470" class="rolesub">reports into engineering or product</text>
  <rect x="478" y="438" width="608" height="30" rx="9" fill="#0f766e"/>
  <text x="500" y="459" class="mono" font-size="13" fill="#eafff6">production code, real data, customer permissions</text>
  <line x1="1086" y1="453" x2="1124" y2="453" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- the pager callout -->
  <g transform="translate(900 496)">
    <rect width="212" height="40" rx="12" fill="#fdece4" stroke="#e6b3a9"/>
    <text x="106" y="26" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a3b1f">3am, 18 months later</text>
  </g>
  <line x1="1006" y1="470" x2="1006" y2="496" stroke="#e6b3a9" stroke-width="2" stroke-dasharray="4 4"/>

  <text x="88" y="588" class="tiny">The bar tells you who is in the room. The white dot tells you where the accountability stops &#8212; and that is the difference the org chart pays for.</text>
  <text x="88" y="624" class="mono" font-size="14" fill="#5d736b">at twenty people one person does all four rows; the distinctions start mattering at the second job description</text>
</svg>
