<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Airtable 式 AI Builder 工作台">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7faf6"/>
      <stop offset="1" stop-color="#fff2dd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.title{font-size:34px;font-weight:780}.label{font-size:18px;font-weight:720}.tiny{font-size:14px;fill:#5d736b}.invert{fill:#eafff6}.soft{fill:#abd1c5}.accent{fill:#f3c66d}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="86" y="76" class="title">像 Airtable 一样可见，像聊天一样可改</text>
  <text x="86" y="110" class="tiny">表格心智 + 低代码能力 + 自然语言 Builder</text>

  <g transform="translate(86 148)" filter="url(#shadow)">
    <rect width="650" height="390" rx="28" fill="#fffefa" stroke="#d9dfd6"/>
    <rect x="28" y="28" width="160" height="334" rx="18" fill="#173a36"/>
    <text x="50" y="68" class="invert" font-size="18" font-weight="740">对象 / 视图</text>
    <text x="50" y="106" class="soft" font-size="14">客户</text>
    <text x="50" y="138" class="soft" font-size="14">商机</text>
    <text x="50" y="170" class="soft" font-size="14">工单</text>
    <text x="50" y="202" class="accent" font-size="14">高风险看板</text>
    <g transform="translate(220 54)">
      <rect width="386" height="252" rx="16" fill="#f8fbf8" stroke="#d6dfd8"/>
      <path d="M0 48 H386 M0 96 H386 M0 144 H386 M0 192 H386" stroke="#d6dfd8"/>
      <path d="M120 0 V252 M240 0 V252 M316 0 V252" stroke="#d6dfd8"/>
      <text x="20" y="30" class="tiny">客户名称</text>
      <text x="140" y="30" class="tiny">负责人</text>
      <text x="260" y="30" class="tiny">续约风险</text>
      <circle cx="286" cy="72" r="9" fill="#d96b5f"/>
      <circle cx="286" cy="120" r="9" fill="#f0b94b"/>
      <circle cx="286" cy="168" r="9" fill="#2a7468"/>
    </g>
    <rect x="220" y="326" width="386" height="36" rx="18" fill="#eef7f2"/>
    <text x="244" y="350" class="tiny">结构可见：字段、视图、权限、自动化</text>
  </g>

  <g transform="translate(782 190)" filter="url(#shadow)">
    <rect width="330" height="300" rx="30" fill="#173a36"/>
    <text x="34" y="48" class="invert" font-size="20" font-weight="760">AI Builder</text>
    <rect x="34" y="78" width="230" height="44" rx="22" fill="#e8fff5"/>
    <text x="56" y="106" class="tiny">加一个续约风险字段</text>
    <rect x="66" y="148" width="226" height="54" rx="22" fill="#f2c66d"/>
    <text x="88" y="181" font-size="15" font-weight="720">生成变更计划</text>
    <rect x="34" y="230" width="262" height="36" rx="18" fill="#edf6f1"/>
    <text x="56" y="254" class="tiny">确认后更新元数据</text>
  </g>
</svg>
