<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="An 8,000-line AI-generated PR no one dares merge, versus a few-dozen-line reviewable metadata diff">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/><stop offset=".55" stop-color="#eef7f2"/><stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:19px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:14px}
      .warn{font-size:15px;font-weight:650;fill:#9a3b1f}.ok{font-size:15px;font-weight:650;fill:#1f6b4a}.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="96" y="78" font-size="31" font-weight="780">Your AI built an app in 30 minutes — dare you click Merge?</text>
  <text x="96" y="113" class="tiny">Writing code isn't the bottleneck anymore — the Merge button is. The format you can review decides what you ship.</text>

  <!-- Left -->
  <g transform="translate(86 168)" filter="url(#shadow)">
    <rect width="440" height="400" rx="22" fill="#ffffff"/>
    <text x="36" y="52" class="label warn">AI-generated code PR</text>
    <text x="36" y="78" class="soft">CI is green, but no one read these 8,000 lines</text>
    <g transform="translate(36 98)">
      <rect width="368" height="200" rx="12" fill="#fbece6"/>
      <g stroke="#d98b6a" stroke-width="2.4" opacity=".6">
        <path d="M22 30 h300"/><path d="M22 52 h250"/><path d="M22 74 h320"/><path d="M22 96 h210"/><path d="M22 118 h300"/><path d="M22 140 h180"/><path d="M22 162 h280"/>
      </g>
      <text x="288" y="190" class="mono" fill="#9a3b1f">+8,142 −0</text>
    </g>
    <g transform="translate(36 318)">
      <rect width="220" height="48" rx="10" fill="#f0d2c6"/>
      <text x="30" y="31" class="warn">Merge?　🤔</text>
    </g>
    <text x="270" y="349" class="soft warn">can't read it = can't sign off</text>
  </g>

  <!-- Right -->
  <g transform="translate(674 168)" filter="url(#shadow)">
    <rect width="440" height="400" rx="22" fill="#ffffff"/>
    <text x="36" y="52" class="label ok">The same change as a metadata diff</text>
    <text x="36" y="78" class="soft">A few dozen lines you can read and revert</text>
    <g transform="translate(36 98)" class="mono">
      <rect width="368" height="200" rx="12" fill="#eef7f1"/>
      <text x="22" y="34" fill="#1f6b4a">+ object: support_refund</text>
      <text x="22" y="62" fill="#1f6b4a">+   amount: currency</text>
      <text x="22" y="90" fill="#1f6b4a">+ permission: agent</text>
      <text x="22" y="118" fill="#9a3b1f">-   allowDelete: true</text>
      <text x="22" y="146" fill="#1f6b4a">+   allowDelete: false</text>
      <text x="22" y="174" fill="#1f6b4a">+ flow: refund &gt; 500 → approval</text>
    </g>
    <g transform="translate(36 318)">
      <rect width="220" height="48" rx="10" fill="#d7ecdf"/>
      <text x="30" y="31" class="ok">Merge ✓</text>
    </g>
    <text x="270" y="349" class="soft ok">runtime enforces perms &amp; audit</text>
  </g>
</svg>
