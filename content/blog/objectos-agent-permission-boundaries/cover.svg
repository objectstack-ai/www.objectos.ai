<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="权限检查跑在哪一层：查询、字段、工具闸门在红线之前，动作体在红线之后">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf9"/>
      <stop offset="1" stop-color="#edf5e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#263d35" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.title{font-size:38px;font-weight:780}.lead{font-size:18px;fill:#5d736b}.label{font-size:19px;font-weight:760}.small{font-size:14px;fill:#647872}.warn{font-size:14px;font-weight:780;fill:#b0563c}.invert{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="78" y="86" class="title">权限检查跑在哪一层</text>
  <text x="78" y="124" class="lead">在模型读到之前，还是之后</text>
  <g transform="translate(96 160)" filter="url(#shadow)">
    <rect width="1008" height="370" rx="32" fill="#fffefa" stroke="#d8dfd6"/>

    <g transform="translate(54 46)">
      <rect width="252" height="76" rx="20" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="126" y="46" text-anchor="middle" class="label">查询：谓词下推</text>
      <rect y="102" width="252" height="76" rx="20" fill="#fff3d6" stroke="#efc86c"/>
      <text x="126" y="148" text-anchor="middle" class="label">字段：出数据层前脱敏</text>
      <rect y="204" width="252" height="76" rx="20" fill="#edf2ff" stroke="#bdc8ee"/>
      <text x="126" y="250" text-anchor="middle" class="label">工具：默认不开放</text>
    </g>

    <path d="M306 84 H386 M306 186 H386 M306 288 H386" stroke="#2a7468" stroke-width="5" stroke-linecap="round"/>

    <line x1="404" y1="40" x2="404" y2="300" stroke="#b0563c" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="404" y="330" text-anchor="middle" class="warn">红线</text>

    <g transform="translate(452 82)">
      <rect width="230" height="196" rx="26" fill="#173a36"/>
      <text x="115" y="66" text-anchor="middle" class="invert" font-size="20" font-weight="780">模型上下文</text>
      <text x="115" y="108" text-anchor="middle" class="soft" font-size="14">只看到剩下的</text>
      <text x="115" y="140" text-anchor="middle" class="soft" font-size="14">越界数据从未产生</text>
    </g>

    <path d="M682 180 H736" stroke="#2a7468" stroke-width="5" stroke-linecap="round"/>

    <g transform="translate(754 82)">
      <rect width="200" height="196" rx="26" fill="#fff0ec" stroke="#e8b3a4"/>
      <text x="100" y="66" text-anchor="middle" class="label">动作体</text>
      <text x="100" y="108" text-anchor="middle" class="small">可信代码</text>
      <text x="100" y="140" text-anchor="middle" class="warn">无数据层兜底</text>
    </g>
  </g>
</svg>
