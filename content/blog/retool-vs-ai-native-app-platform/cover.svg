<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="访问受治理，逻辑是散落的 JavaScript">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#eef1f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1a2740" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#16233c}.title{font-size:44px;font-weight:780}.sub{font-size:20px;fill:#5a647a}.label{font-size:20px;font-weight:720}.tiny{font-size:15px;fill:#6b7280}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;fill:#b85c4d}.invert{fill:#eaf1ff}.soft{fill:#9fb2d6}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="86" y="96" class="title">RBAC 守住了门，</text>
  <text x="86" y="146" class="title">逻辑却散落在屋里。</text>
  <text x="86" y="184" class="sub">Retool 治理谁能打开应用——不治理应用的逻辑做什么</text>

  <g transform="translate(86 232)" filter="url(#shadow)">
    <rect width="360" height="370" rx="28" fill="#16233c"/>
    <text x="36" y="58" class="invert" font-size="20" font-weight="760">访问 ✓ 受治理</text>
    <rect x="36" y="86" width="288" height="40" rx="12" fill="#21314f"/>
    <text x="54" y="112" class="soft" font-size="15">应用 / 资源 / 查询级 RBAC</text>
    <rect x="36" y="138" width="288" height="40" rx="12" fill="#21314f"/>
    <text x="54" y="164" class="soft" font-size="15">行级安全</text>
    <rect x="36" y="190" width="288" height="40" rx="12" fill="#21314f"/>
    <text x="54" y="216" class="soft" font-size="15">审计日志 · SSO</text>
    <g transform="translate(132 258)">
      <rect width="96" height="80" rx="14" fill="#2f8f6e"/>
      <rect x="30" y="20" width="36" height="34" rx="8" fill="none" stroke="#eafff6" stroke-width="4"/>
      <circle cx="48" cy="46" r="6" fill="#eafff6"/>
      <text x="26" y="72" class="invert" font-size="13" font-weight="680">已锁</text>
    </g>
  </g>

  <g transform="translate(490 232)" filter="url(#shadow)">
    <rect width="624" height="370" rx="28" fill="#fffefb" stroke="#dfe3ec"/>
    <text x="36" y="58" class="label">逻辑 ✗ 散落的 JavaScript</text>
    <rect x="36" y="84" width="270" height="62" rx="12" fill="#fbf0ee"/>
    <text x="52" y="114" class="mono">component.Hidden =</text>
    <text x="52" y="134" class="mono">{{ user.role !== 'admin' }}</text>
    <rect x="324" y="84" width="264" height="62" rx="12" fill="#fbf0ee"/>
    <text x="340" y="114" class="mono">query3.transformer:</text>
    <text x="340" y="134" class="mono">if (amount &gt; 1e5) ...</text>
    <rect x="36" y="160" width="264" height="62" rx="12" fill="#fbf0ee"/>
    <text x="52" y="190" class="mono">binding: status ===</text>
    <text x="52" y="210" class="mono">'high' ? show : hide</text>
    <rect x="318" y="160" width="270" height="62" rx="12" fill="#fbf0ee"/>
    <text x="334" y="190" class="mono">refundBtn.disabled =</text>
    <text x="334" y="210" class="mono">!perms.includes(...)</text>
    <text x="36" y="262" class="tiny" fill="#6b7280">没有结构化 diff。没有元数据。</text>
    <text x="36" y="292" class="tiny" fill="#6b7280">AI 审计不了，新接手的人也读不懂。</text>
    <text x="36" y="330" class="tiny" style="fill:#b85c4d" font-weight="680">字段和动作规则就藏在这里——逐屏手工拼出来。</text>
  </g>
</svg>
