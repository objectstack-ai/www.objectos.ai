<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The pager test: solutions engineer, solutions architect, consultant and forward deployed engineer compared by phase, definition of done and pay, with only the forward deployed engineer on call">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}
      .role{font-size:20px;font-weight:760}
      .eyebrow{font-size:12px;font-weight:700;fill:#6a7a73;letter-spacing:.06em}
      .line{font-size:14px;fill:#5d736b}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
      .invert{fill:#eafff6}
      .linei{font-size:14px;fill:#c8ece2}
      .eyebrowi{font-size:12px;font-weight:700;fill:#8fd4bf;letter-spacing:.06em}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="88" y="78" font-size="34" font-weight="780">Whose phone rings at 3am?</text>
  <text x="88" y="113" class="tiny">Four roles that look identical in the customer&#8217;s conference room. Only one of them is on call.</text>

  <!-- 1 · Solutions engineer -->
  <g transform="translate(88 168)">
    <rect width="240" height="344" rx="18" fill="#ffffff" stroke="#dbe5df" stroke-width="2" filter="url(#shadow)"/>
    <text x="22" y="40" class="eyebrow">BEFORE THE CONTRACT</text>
    <text x="22" y="76" class="role">Solutions</text>
    <text x="22" y="102" class="role">engineer</text>
    <line x1="22" y1="126" x2="218" y2="126" stroke="#e4ece7" stroke-width="2"/>
    <text x="22" y="158" class="line">Owns the technical win</text>
    <text x="22" y="192" class="line">Done: the deal closes</text>
    <text x="22" y="226" class="line">Code: a demo, deleted</text>
    <text x="22" y="260" class="line">Pay: 70/30 base to variable</text>
    <g transform="translate(22 288)">
      <rect width="196" height="36" rx="11" fill="#f2f5f3" stroke="#dbe5df"/>
      <text x="98" y="24" text-anchor="middle" class="mono" font-size="13" fill="#8a9a93">not on call</text>
    </g>
  </g>

  <!-- 2 · Solutions architect -->
  <g transform="translate(354 168)">
    <rect width="240" height="344" rx="18" fill="#ffffff" stroke="#dbe5df" stroke-width="2" filter="url(#shadow)"/>
    <text x="22" y="40" class="eyebrow">AROUND THE DESIGN</text>
    <text x="22" y="76" class="role">Solutions</text>
    <text x="22" y="102" class="role">architect</text>
    <line x1="22" y1="126" x2="218" y2="126" stroke="#e4ece7" stroke-width="2"/>
    <text x="22" y="158" class="line">Owns the design</text>
    <text x="22" y="192" class="line">Done: design approved</text>
    <text x="22" y="226" class="line">Code: patterns, not prod</text>
    <text x="22" y="260" class="line">Pay: base, bonus, equity</text>
    <g transform="translate(22 288)">
      <rect width="196" height="36" rx="11" fill="#f2f5f3" stroke="#dbe5df"/>
      <text x="98" y="24" text-anchor="middle" class="mono" font-size="13" fill="#8a9a93">ops team is paged</text>
    </g>
  </g>

  <!-- 3 · Consultant -->
  <g transform="translate(620 168)">
    <rect width="240" height="344" rx="18" fill="#ffffff" stroke="#e2d6c3" stroke-width="2" filter="url(#shadow)"/>
    <text x="22" y="40" class="eyebrow">AFTER THE SOW</text>
    <text x="22" y="76" class="role">Consultant</text>
    <text x="22" y="102" class="line" font-size="15">delivery / implementation</text>
    <line x1="22" y1="126" x2="218" y2="126" stroke="#efe4d4" stroke-width="2"/>
    <text x="22" y="158" class="line">Owns the deliverable</text>
    <text x="22" y="192" class="line">Done: it is accepted</text>
    <text x="22" y="226" class="line">Code: the client&#8217;s repo</text>
    <text x="22" y="260" class="line">Pay: a utilization target</text>
    <g transform="translate(22 288)">
      <rect width="196" height="36" rx="11" fill="#fdf4ea" stroke="#e6d3ba"/>
      <text x="98" y="24" text-anchor="middle" class="mono" font-size="13" fill="#9a7440">whoever the SOW names</text>
    </g>
  </g>

  <!-- 4 · Forward deployed engineer -->
  <g transform="translate(886 168)">
    <rect width="240" height="344" rx="18" fill="#0f766e" filter="url(#shadow)"/>
    <text x="22" y="40" class="eyebrowi">UNTIL IT RUNS</text>
    <text x="22" y="76" class="role invert">Forward deployed</text>
    <text x="22" y="102" class="role invert">engineer</text>
    <line x1="22" y1="126" x2="218" y2="126" stroke="#2f8d84" stroke-width="2"/>
    <text x="22" y="158" class="linei">Owns the outcome</text>
    <text x="22" y="192" class="linei">Done: their workflow runs</text>
    <text x="22" y="226" class="linei">Code: production, real data</text>
    <text x="22" y="260" class="linei">Pay: base and equity, no quota</text>
    <g transform="translate(22 288)">
      <rect width="196" height="36" rx="11" fill="#eafff6"/>
      <text x="98" y="24" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0f766e">on call</text>
    </g>
  </g>

  <text x="88" y="566" class="tiny">Titles are marketing. The reporting line and the compensation plan are not.</text>
  <text x="88" y="612" class="mono" font-size="15" fill="#5d736b">of the four, exactly one paycheck moves when a deal signs &#8212; and it is not the engineer&#8217;s</text>
</svg>
