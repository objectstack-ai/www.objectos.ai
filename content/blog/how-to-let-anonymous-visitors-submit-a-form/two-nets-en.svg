<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="The public form door on ObjectStack 17.7.0. An anonymous visitor posts six keys. Net one, the route, keeps only the five fields declared in sections[].fields and drops the twelve server-managed names, so name and email pass while status, lead_score, owner_id and organization_id are dropped. Net two, the data layer, admits insert and read-back on crm_lead only through publicFormGrant and strips the same twelve names again; no permission set is consulted. The stored row has status new and lead_score 0 from object defaults, owner_id null and organization_id stamped by the server. Below: an anonymous GET of the object or of the row just created answers 401 UNAUTHENTICATED; sharing.enabled false answers 404 FORM_NOT_FOUND on both endpoints.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2a7468"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:22px;font-weight:800}
      .sub{font-size:14px;fill:#657872}
      .card{font-size:15px;font-weight:760}
      .tag{font-size:12px;font-weight:780;letter-spacing:.08em;fill:#2a7468}
      .t{font-size:13px;fill:#3f554f}
      .m{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#173a36}
      .ok{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#2a7468}
      .no{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#c2410c}
      .code{font-size:20px;font-weight:800;fill:#c2410c}
      .codelabel{font-size:13px;font-weight:760;fill:#c2410c}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f6faf8"/>

  <text x="40" y="44" class="h">One grant, shaped like the form: two nets between the visitor and the row</text>
  <text x="40" y="68" class="sub">examples/app-crm, web_to_lead, @objectstack/cli 17.7.0 — every value below is from the transcript</text>

  <!-- column 1: the visitor -->
  <g transform="translate(40 100)">
    <rect width="230" height="330" rx="16" fill="#ffffff" stroke="#d5e4de"/>
    <text x="18" y="30" class="tag">ANONYMOUS VISITOR</text>
    <text x="18" y="56" class="card">POST …/contact-us/submit</text>
    <text x="18" y="80" class="t">No session, no key. Body:</text>
    <text x="18" y="110" class="m">name: "Mallory"</text>
    <text x="18" y="134" class="m">email: "mallory@…"</text>
    <text x="18" y="158" class="m">status: "converted"</text>
    <text x="18" y="182" class="m">lead_score: 100</text>
    <text x="18" y="206" class="m">owner_id: "attacker"</text>
    <text x="18" y="230" class="m">organization_id: "org_other"</text>
    <text x="18" y="270" class="t">Six keys. Two are on the form.</text>
    <text x="18" y="292" class="t">Two are business fields</text>
    <text x="18" y="310" class="t">the form never declared.</text>
  </g>

  <line x1="276" y1="265" x2="324" y2="265" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- column 2: net 1 -->
  <g transform="translate(330 100)">
    <rect width="250" height="330" rx="16" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="18" y="30" class="tag">NET 1 — THE ROUTE</text>
    <text x="18" y="56" class="card">Allow-list = the form</text>
    <text x="18" y="80" class="t">sections[].fields of the matched</text>
    <text x="18" y="98" class="t">form: five names. A form with no</text>
    <text x="18" y="116" class="t">fields is refused with 400.</text>
    <text x="18" y="142" class="t">Twelve server-managed names are</text>
    <text x="18" y="160" class="t">dropped first, whatever is declared.</text>
    <text x="18" y="194" class="ok">name            passes</text>
    <text x="18" y="216" class="ok">email           passes</text>
    <text x="18" y="238" class="no">status          dropped</text>
    <text x="18" y="260" class="no">lead_score      dropped</text>
    <text x="18" y="282" class="no">owner_id        denied by name</text>
    <text x="18" y="304" class="no">organization_id denied by name</text>
  </g>

  <line x1="586" y1="265" x2="634" y2="265" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- column 3: net 2 -->
  <g transform="translate(640 100)">
    <rect width="250" height="330" rx="16" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="18" y="30" class="tag">NET 2 — THE DATA LAYER</text>
    <text x="18" y="56" class="card">publicFormGrant</text>
    <text x="18" y="80" class="m">{ object: 'crm_lead' }</text>
    <text x="18" y="108" class="t">Request-scoped. Admits insert,</text>
    <text x="18" y="126" class="t">plus find / findOne / count for</text>
    <text x="18" y="144" class="t">the read-back, on this object only.</text>
    <text x="18" y="170" class="t">Strips the same twelve names</text>
    <text x="18" y="188" class="t">again before the write is admitted.</text>
    <text x="18" y="222" class="t">No permission set is consulted.</text>
    <text x="18" y="240" class="t">Removing guest_portal changed</text>
    <text x="18" y="258" class="t">nothing: measured, not assumed.</text>
    <text x="18" y="292" class="t">The grant is read off the form at</text>
    <text x="18" y="310" class="t">request time. It cannot be wider.</text>
  </g>

  <line x1="896" y1="265" x2="944" y2="265" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- column 4: the row -->
  <g transform="translate(950 100)">
    <rect width="210" height="330" rx="16" fill="#e6f3ee" stroke="#2a7468"/>
    <text x="18" y="30" class="tag">STORED crm_lead ROW</text>
    <text x="18" y="56" class="card">201 Created</text>
    <text x="18" y="90" class="m">name       Mallory</text>
    <text x="18" y="114" class="m">email      mallory@…</text>
    <text x="18" y="138" class="m">status     new</text>
    <text x="18" y="162" class="m">lead_score 0</text>
    <text x="18" y="186" class="m">owner_id   null</text>
    <text x="18" y="210" class="m">organization_id</text>
    <text x="18" y="230" class="m">  stamped by server</text>
    <text x="18" y="268" class="t">status and lead_score are</text>
    <text x="18" y="286" class="t">the object's own defaults.</text>
    <text x="18" y="310" class="t">The echo is the only read.</text>
  </g>

  <!-- bottom band: the two closed doors -->
  <g transform="translate(40 470)">
    <rect width="545" height="200" rx="16" fill="#fff2e6" stroke="#c2410c"/>
    <text x="18" y="30" class="tag">THE DOOR DOES NOT OPEN THE OTHER WAY</text>
    <text x="18" y="62" class="m">GET /api/v1/data/crm_lead</text>
    <text x="18" y="84" class="m">GET /api/v1/data/crm_lead/OJINuRoRVtZC-l95</text>
    <text x="18" y="124" class="code">401</text>
    <text x="70" y="124" class="codelabel">UNAUTHENTICATED</text>
    <text x="18" y="154" class="t">The list, and the row the visitor created a second</text>
    <text x="18" y="172" class="t">earlier. The public path only ever inserts; it never lists.</text>
  </g>

  <g transform="translate(615 470)">
    <rect width="545" height="200" rx="16" fill="#fff2e6" stroke="#c2410c"/>
    <text x="18" y="30" class="tag">WITHDRAWING THE FORM</text>
    <text x="18" y="62" class="m">sharing: { enabled: false, publicLink: '/forms/contact-us' }</text>
    <text x="18" y="84" class="m">GET  …/forms/contact-us   POST …/forms/contact-us/submit</text>
    <text x="18" y="124" class="code">404</text>
    <text x="70" y="124" class="codelabel">FORM_NOT_FOUND</text>
    <text x="18" y="154" class="t">Both endpoints close; the lead count stays at 15.</text>
    <text x="18" y="172" class="t">Takes a rebuild — os dev warns when it serves a stale artifact.</text>
  </g>
</svg>
