<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Five vendors' platform-owned ontologies, each reachable but not portable, versus one open definition you can take with you">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:14px}.chip{font-size:16px;font-weight:650}
      .onDark{fill:#a9c4ba;font-size:13px}.accent{fill:#e8b04b}.code{fill:#2c4a43;font-family:ui-monospace,Menlo,monospace;font-size:14px}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="72" font-size="32" font-weight="780">The race is over: five platforms shipped an ontology</text>
  <text x="96" y="106" class="tiny">Same call, five answers — MCP opened the door; the definition stayed inside</text>

  <!-- Left: five platform-owned ontologies -->
  <g transform="translate(86 168)">
    <text x="0" y="-8" class="soft">Ontology, inside each vendor's platform</text>

    <g filter="url(#shadow)">
      <rect width="420" height="72" rx="14" fill="#22433d"/>
      <text x="24" y="30" class="chip invert">Microsoft Fabric IQ</text>
      <text x="24" y="55" class="onDark">Ignite 2025 · preview · Ontology MCP</text>
      <g transform="translate(360 13)"><rect y="14" width="40" height="32" rx="7" class="accent"/><path d="M7 16 v-5 a13 13 0 0 1 26 0 v5" fill="none" stroke="#e8b04b" stroke-width="7"/></g>
    </g>

    <g filter="url(#shadow)" transform="translate(0 87)">
      <rect width="420" height="72" rx="14" fill="#294942"/>
      <text x="24" y="30" class="chip invert">Snowflake Semantic Views</text>
      <text x="24" y="55" class="onDark">Feb 2026 · GA · Autopilot drafts the model</text>
      <g transform="translate(360 13)"><rect y="14" width="40" height="32" rx="7" class="accent"/><path d="M7 16 v-5 a13 13 0 0 1 26 0 v5" fill="none" stroke="#e8b04b" stroke-width="7"/></g>
    </g>

    <g filter="url(#shadow)" transform="translate(0 174)">
      <rect width="420" height="72" rx="14" fill="#2f5048"/>
      <text x="24" y="30" class="chip invert">Google Looker · Knowledge Catalog</text>
      <text x="24" y="55" class="onDark">Next '26 · BI Agents on a semantic graph</text>
      <g transform="translate(360 13)"><rect y="14" width="40" height="32" rx="7" class="accent"/><path d="M7 16 v-5 a13 13 0 0 1 26 0 v5" fill="none" stroke="#e8b04b" stroke-width="7"/></g>
    </g>

    <g filter="url(#shadow)" transform="translate(0 261)">
      <rect width="420" height="72" rx="14" fill="#35564f"/>
      <text x="24" y="30" class="chip invert">Databricks Unity Catalog</text>
      <text x="24" y="55" class="onDark">GA in 2026 · Business Semantics</text>
      <g transform="translate(360 13)"><rect y="14" width="40" height="32" rx="7" class="accent"/><path d="M7 16 v-5 a13 13 0 0 1 26 0 v5" fill="none" stroke="#e8b04b" stroke-width="7"/></g>
    </g>

    <g filter="url(#shadow)" transform="translate(0 348)">
      <rect width="420" height="72" rx="14" fill="#3b5d55"/>
      <text x="24" y="30" class="chip invert">Palantir Foundry Ontology</text>
      <text x="24" y="55" class="onDark">Ontology MCP GA · week of Jun 16, 2026</text>
      <g transform="translate(360 13)"><rect y="14" width="40" height="32" rx="7" class="accent"/><path d="M7 16 v-5 a13 13 0 0 1 26 0 v5" fill="none" stroke="#e8b04b" stroke-width="7"/></g>
    </g>
  </g>

  <!-- center -->
  <g transform="translate(540 368)">
    <text x="0" y="0" font-size="40" font-weight="800" class="accent">?</text>
    <path d="M28 -12 h62" stroke="#e8b04b" stroke-width="6" stroke-linecap="round"/>
    <path d="M82 -24 l16 12 -16 12" fill="none" stroke="#e8b04b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: one open portable definition -->
  <g transform="translate(674 168)" filter="url(#shadow)">
    <rect width="440" height="420" rx="22" fill="#ffffff"/>
    <text x="36" y="52" class="label">One open definition, in your repo</text>
    <text x="36" y="78" class="soft">Objects · Relations · Permissions · Flows · API · AI tools</text>
    <g>
      <rect x="36" y="100" width="368" height="92" rx="12" fill="#f0f7f3"/>
      <text x="56" y="128" class="code">ObjectSchema.create({</text>
      <text x="76" y="152" class="code">name: 'crm_customer',</text>
      <text x="76" y="176" class="code">fields: { name, tax_id }</text>
    </g>
    <g stroke="#7fae9f" stroke-width="2.5" fill="none">
      <path d="M94 192 v40"/><path d="M222 192 v40"/><path d="M350 192 v40"/>
    </g>
    <g font-size="15">
      <rect x="36" y="236" width="116" height="40" rx="20" fill="#22433d"/><text x="94" y="261" class="invert" text-anchor="middle">Agent</text>
      <rect x="164" y="236" width="116" height="40" rx="20" fill="#22433d"/><text x="222" y="261" class="invert" text-anchor="middle">App</text>
      <rect x="292" y="236" width="116" height="40" rx="20" fill="#22433d"/><text x="350" y="261" class="invert" text-anchor="middle">Audit</text>
    </g>
    <text x="36" y="318" class="soft">Diffable · Portable · readable by any agent</text>
    <text x="36" y="352" class="soft">One command to start, on your own servers</text>
    <text x="36" y="386" class="soft">The read path is open — and the definition is yours</text>
  </g>
</svg>
