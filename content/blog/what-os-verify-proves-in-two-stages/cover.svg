<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="ObjectStack 17.7.0 上的 os verify：两个阶段，一个计数。先跑编写期规则，拒绝即以退出码 1 结束、什么都不启动；再把应用启动起来，每个对象往返一条记录；退出码只读 hardFailures 这一个计数">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4432f"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .eyebrow{font-size:14px;font-weight:780;letter-spacing:.08em;fill:#2a7468}
      .title{font-size:60px;font-weight:800}
      .lead{font-size:19px;fill:#3f554f}
      .chip{font-size:14px;font-weight:760;fill:#2a7468}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#2a7468}
      .label{font-size:18px;font-weight:760}
      .small{font-size:13px;fill:#55685f}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;fill:#2a7468}
      .red{fill:#b4432f}
      .foot{font-size:13px;fill:#55685f}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="112" class="eyebrow">ObjectStack 17.7.0 上的 os verify</text>
  <text x="78" y="190" class="title">两个阶段。</text>
  <text x="78" y="258" class="title">一个计数。</text>
  <text x="78" y="310" class="lead">先跑编写期规则，再启动应用——</text>
  <text x="78" y="338" class="lead">规则拒绝，应用就根本不会启动。</text>

  <g transform="translate(78 392)"><rect width="196" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="98" y="24" class="chip" text-anchor="middle">exit 0 · 脚手架通过</text></g>
  <g transform="translate(290 392)"><rect width="236" height="36" rx="18" fill="#ffffff" stroke="#e3c3bb"/><text x="118" y="24" class="chip red" text-anchor="middle">exit 1 · 运行时阶段未执行</text></g>
  <g transform="translate(78 440)"><rect width="300" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="150" y="24" class="chip" text-anchor="middle">--rls · 声明 3 个岗位，探测 3 个</text></g>

  <text x="78" y="532" class="small">三次真实运行，版本就是 npm create objectstack@latest 装的那个。</text>
  <text x="78" y="552" class="small">退出码只读 hardFailures 一个计数；报告会说出它没有证明的部分。</text>

  <!-- right: the two stages -->
  <g transform="translate(680 118)">
    <rect width="440" height="112" rx="18" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="34" class="cap">阶段 1 · 编写期规则</text>
    <text x="24" y="64" class="label">os validate 跑的那套规则表——49 条</text>
    <text x="24" y="90" class="small">规范化、按协议 schema 解析、整体判定</text>
  </g>
  <line x1="1120" y1="174" x2="1168" y2="174" stroke="#b4432f" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="1138" y="160" class="mono red" text-anchor="middle">exit 1</text>
  <text x="1138" y="206" class="small red" text-anchor="middle" style="font-size:11px">被拒绝：</text>
  <text x="1138" y="220" class="small red" text-anchor="middle" style="font-size:11px">什么都不启动</text>

  <line x1="900" y1="234" x2="900" y2="282" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="916" y="264" class="small">通过 → 进入阶段 2 的唯一入口</text>

  <g transform="translate(680 288)">
    <rect width="440" height="150" rx="18" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="34" class="cap">阶段 2 · 运行时</text>
    <text x="24" y="64" class="label">进程内启动，走真实 HTTP 栈</text>
    <text x="24" y="90" class="small">每个对象：派生一条记录 → 创建 → 读回 → 比对</text>
    <text x="24" y="110" class="small">按需 --rls：成员不能写它读不到的记录，</text>
    <text x="24" y="128" class="small">用一个探测身份，再加每个声明岗位各一个身份</text>
  </g>

  <line x1="900" y1="442" x2="900" y2="490" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(680 496)">
    <rect width="440" height="104" rx="18" fill="#eef7f2" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="32" class="cap">退出码读的那个计数</text>
    <text x="24" y="56" class="mono">hardFailures = createFailed + readFailed</text>
    <text x="24" y="74" class="mono">  + fidelityGaps + holes + degraded probe</text>
    <text x="24" y="92" class="mono">  + positions not run   →   0 ? exit 0 : exit 1</text>
  </g>

  <text x="78" y="632" class="foot">www.objectos.ai · 在 @objectstack/cli 17.7.0 上验证 · 每一段输出都是真实运行，不是复述</text>
</svg>
