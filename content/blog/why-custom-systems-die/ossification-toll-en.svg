<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="Five years of spending on one custom system: annual cost rises while the number of changes actually delivered falls from six to one">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .ax{stroke:#c4d3cc;stroke-width:1.5}.gl{stroke:#e6efe9;stroke-width:1}
      .lbl{font-size:15px;fill:#5d736b}.cap{font-size:14px;fill:#5d736b}
      .yr{font-size:15px;font-weight:700}
      .rowh{font-size:13px;font-weight:700;fill:#5d736b}
      .val{font-size:15px;font-weight:700}
      .tick{font-size:13px;fill:#8aa197}
    </style>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="24" y="44" font-size="22" font-weight="760">The ossification toll: five years of one custom system</text>
  <text x="24" y="72" class="cap">Bars: what the business paid that year · Line: how many changes it actually got for the money</text>

  <!-- gridlines and axes -->
  <g>
    <line class="gl" x1="110" y1="173" x2="920" y2="173"/>
    <line class="gl" x1="110" y1="259" x2="920" y2="259"/>
    <line class="gl" x1="110" y1="344" x2="920" y2="344"/>
    <line class="ax" x1="110" y1="130" x2="110" y2="430"/>
    <line class="ax" x1="110" y1="430" x2="920" y2="430"/>
  </g>
  <g class="tick" text-anchor="end">
    <text x="100" y="178">$12k</text>
    <text x="100" y="264">$8k</text>
    <text x="100" y="349">$4k</text>
  </g>

  <!-- annual spend: lower segment = fixed retainer + hosting, upper = change requests -->
  <g>
    <rect x="144" y="301" width="92" height="129" fill="#d7e8de"/>
    <rect x="144" y="224" width="92" height="77" fill="#f6d9c8"/>
    <rect x="294" y="301" width="92" height="129" fill="#d7e8de"/>
    <rect x="294" y="205" width="92" height="96" fill="#f6d9c8"/>
    <rect x="444" y="301" width="92" height="129" fill="#d7e8de"/>
    <rect x="444" y="181" width="92" height="120" fill="#f6d9c8"/>
    <rect x="594" y="301" width="92" height="129" fill="#d7e8de"/>
    <rect x="594" y="160" width="92" height="141" fill="#f6d9c8"/>
    <rect x="744" y="301" width="92" height="129" fill="#d7e8de"/>
    <rect x="744" y="220" width="92" height="81" fill="#f6d9c8"/>
  </g>

  <!-- changes actually delivered -->
  <path d="M190 181 L340 223 L490 264 L640 306 L790 389" fill="none" stroke="#9a6212" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#9a6212">
    <circle cx="190" cy="181" r="6"/><circle cx="340" cy="223" r="6"/><circle cx="490" cy="264" r="6"/>
    <circle cx="640" cy="306" r="6"/><circle cx="790" cy="389" r="6"/>
  </g>

  <!-- year 5 callout: the quote to move one step forward -->
  <line x1="836" y1="150" x2="880" y2="150" stroke="#9a3b1f" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="884" y="140" font-size="14" font-weight="700" fill="#9a3b1f">Year 5 ask:</text>
  <text x="884" y="160" font-size="13" fill="#9a3b1f">quoted $27,000,</text>
  <text x="884" y="178" font-size="13" fill="#9a3b1f">two months,</text>
  <text x="884" y="196" font-size="13" fill="#9a3b1f">"or rebuild"</text>

  <!-- year axis and the two extractable rows -->
  <g class="yr" text-anchor="middle">
    <text x="190" y="454">Year 1</text><text x="340" y="454">Year 2</text><text x="490" y="454">Year 3</text>
    <text x="640" y="454">Year 4</text><text x="790" y="454">Year 5</text>
  </g>
  <line class="gl" x1="24" y1="466" x2="920" y2="466"/>
  <text x="24" y="490" class="rowh">Changes shipped</text>
  <g class="val" text-anchor="middle" fill="#9a6212">
    <text x="190" y="490">6</text><text x="340" y="490">5</text><text x="490" y="490">4</text>
    <text x="640" y="490">3</text><text x="790" y="490">1</text>
  </g>
  <text x="24" y="514" class="rowh">Price per change</text>
  <g class="val" text-anchor="middle" fill="#9a3b1f">
    <text x="190" y="514">$600</text><text x="340" y="514">$900</text><text x="490" y="514">$1,400</text>
    <text x="640" y="514">$2,200</text><text x="790" y="514">$3,800</text>
  </g>

  <!-- legend -->
  <g transform="translate(24 546)">
    <rect width="22" height="12" y="-9" rx="3" fill="#d7e8de"/>
    <text x="32" y="1" class="lbl">Hosting + support retainer — $6,000 a year, unchanged</text>
    <g transform="translate(470 0)">
      <rect width="22" height="12" y="-9" rx="3" fill="#f6d9c8"/>
      <text x="32" y="1" class="lbl">Change requests actually paid for</text>
    </g>
  </g>
  <g transform="translate(24 570)">
    <rect width="22" height="5" y="-4" rx="2.5" fill="#9a6212"/>
    <text x="32" y="1" class="lbl">Changes delivered that year — six down to one, while each one cost more</text>
  </g>

  <text x="24" y="602" class="cap">Build: $45,000, booked once in 2019 · Toll: $54,100 paid + $27,000 quoted = $81,100 — 1.8× the build price, on no line item at all</text>
</svg>
