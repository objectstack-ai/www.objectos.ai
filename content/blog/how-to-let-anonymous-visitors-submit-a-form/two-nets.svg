<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="ObjectStack 17.7.0 上的公开表单之门。匿名访客提交六个键。第一道网是路由：只保留 sections[].fields 声明的五个字段，并丢弃十二个服务端管理的名字，于是 name 与 email 通过，status、lead_score、owner_id、organization_id 被丢弃。第二道网是数据层：publicFormGrant 只允许在 crm_lead 上插入并读回，再次剥除同样的十二个名字；不查询任何权限集。存储的行里 status 为 new、lead_score 为 0（对象默认值），owner_id 为 null，organization_id 由服务端盖章。下方：匿名 GET 对象或刚创建的行均答 401 UNAUTHENTICATED；sharing.enabled 为 false 时两个端点均答 404 FORM_NOT_FOUND。">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2a7468"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#173a36}
      .h{font-size:22px;font-weight:800}
      .sub{font-size:14px;fill:#657872}
      .card{font-size:15px;font-weight:760}
      .tag{font-size:12px;font-weight:780;letter-spacing:.08em;fill:#2a7468}
      .t{font-size:13px;fill:#3f554f}
      .m{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#173a36}
      .ok{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#2a7468}
      .no{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#c2410c}
      .code{font-size:20px;font-weight:800;fill:#c2410c}
      .codelabel{font-size:13px;font-weight:760;fill:#c2410c}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f6faf8"/>

  <text x="40" y="44" class="h">一份授权，形状即表单：访客与数据行之间的两道网</text>
  <text x="40" y="68" class="sub">examples/app-crm，web_to_lead，@objectstack/cli 17.7.0 —— 下方每个值都来自实测记录</text>

  <g transform="translate(40 100)">
    <rect width="230" height="330" rx="16" fill="#ffffff" stroke="#d5e4de"/>
    <text x="18" y="30" class="tag">匿名访客</text>
    <text x="18" y="56" class="card">POST …/contact-us/submit</text>
    <text x="18" y="80" class="t">无会话，无密钥。请求体：</text>
    <text x="18" y="110" class="m">name: "Mallory"</text>
    <text x="18" y="134" class="m">email: "mallory@…"</text>
    <text x="18" y="158" class="m">status: "converted"</text>
    <text x="18" y="182" class="m">lead_score: 100</text>
    <text x="18" y="206" class="m">owner_id: "attacker"</text>
    <text x="18" y="230" class="m">organization_id: "org_other"</text>
    <text x="18" y="270" class="t">六个键，两个在表单上。</text>
    <text x="18" y="292" class="t">两个是表单从未声明的</text>
    <text x="18" y="310" class="t">业务字段。</text>
  </g>

  <line x1="276" y1="265" x2="324" y2="265" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(330 100)">
    <rect width="250" height="330" rx="16" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="18" y="30" class="tag">第一道网 —— 路由</text>
    <text x="18" y="56" class="card">白名单 = 表单本身</text>
    <text x="18" y="80" class="t">取匹配表单的 sections[].fields：</text>
    <text x="18" y="98" class="t">五个名字。没有字段的表单</text>
    <text x="18" y="116" class="t">直接以 400 拒绝。</text>
    <text x="18" y="142" class="t">十二个服务端管理的名字先被</text>
    <text x="18" y="160" class="t">丢弃，不论表单怎么声明。</text>
    <text x="18" y="194" class="ok">name            通过</text>
    <text x="18" y="216" class="ok">email           通过</text>
    <text x="18" y="238" class="no">status          丢弃</text>
    <text x="18" y="260" class="no">lead_score      丢弃</text>
    <text x="18" y="282" class="no">owner_id        按名字拒绝</text>
    <text x="18" y="304" class="no">organization_id 按名字拒绝</text>
  </g>

  <line x1="586" y1="265" x2="634" y2="265" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(640 100)">
    <rect width="250" height="330" rx="16" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="18" y="30" class="tag">第二道网 —— 数据层</text>
    <text x="18" y="56" class="card">publicFormGrant</text>
    <text x="18" y="80" class="m">{ object: 'crm_lead' }</text>
    <text x="18" y="108" class="t">随请求而生。只允许 insert，</text>
    <text x="18" y="126" class="t">以及读回所需的 find / findOne</text>
    <text x="18" y="144" class="t">/ count，且仅限这个对象。</text>
    <text x="18" y="170" class="t">写入放行之前，再把同样的</text>
    <text x="18" y="188" class="t">十二个名字剥除一次。</text>
    <text x="18" y="222" class="t">不查询任何权限集。</text>
    <text x="18" y="240" class="t">移除 guest_portal 后一切不变：</text>
    <text x="18" y="258" class="t">是实测，不是推断。</text>
    <text x="18" y="292" class="t">授权在请求时从表单读出，</text>
    <text x="18" y="310" class="t">所以不可能比表单更宽。</text>
  </g>

  <line x1="896" y1="265" x2="944" y2="265" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(950 100)">
    <rect width="210" height="330" rx="16" fill="#e6f3ee" stroke="#2a7468"/>
    <text x="18" y="30" class="tag">存入的 crm_lead 行</text>
    <text x="18" y="56" class="card">201 Created</text>
    <text x="18" y="90" class="m">name       Mallory</text>
    <text x="18" y="114" class="m">email      mallory@…</text>
    <text x="18" y="138" class="m">status     new</text>
    <text x="18" y="162" class="m">lead_score 0</text>
    <text x="18" y="186" class="m">owner_id   null</text>
    <text x="18" y="210" class="m">organization_id</text>
    <text x="18" y="230" class="t">  由服务端盖章</text>
    <text x="18" y="268" class="t">status 与 lead_score 来自</text>
    <text x="18" y="286" class="t">对象自身的默认值。</text>
    <text x="18" y="310" class="t">这次回显是唯一一次读取。</text>
  </g>

  <g transform="translate(40 470)">
    <rect width="545" height="200" rx="16" fill="#fff2e6" stroke="#c2410c"/>
    <text x="18" y="30" class="tag">这道门不向另一边打开</text>
    <text x="18" y="62" class="m">GET /api/v1/data/crm_lead</text>
    <text x="18" y="84" class="m">GET /api/v1/data/crm_lead/OJINuRoRVtZC-l95</text>
    <text x="18" y="124" class="code">401</text>
    <text x="70" y="124" class="codelabel">UNAUTHENTICATED</text>
    <text x="18" y="154" class="t">列表，以及访客一秒钟前刚创建的那一行，都被拒绝。</text>
    <text x="18" y="172" class="t">公开路径只会插入，从不列出。</text>
  </g>

  <g transform="translate(615 470)">
    <rect width="545" height="200" rx="16" fill="#fff2e6" stroke="#c2410c"/>
    <text x="18" y="30" class="tag">撤回表单</text>
    <text x="18" y="62" class="m">sharing: { enabled: false, publicLink: '/forms/contact-us' }</text>
    <text x="18" y="84" class="m">GET  …/forms/contact-us   POST …/forms/contact-us/submit</text>
    <text x="18" y="124" class="code">404</text>
    <text x="70" y="124" class="codelabel">FORM_NOT_FOUND</text>
    <text x="18" y="154" class="t">两个端点一起关闭；线索总数仍是 15。</text>
    <text x="18" y="172" class="t">需要重新构建 —— os dev 在提供过期产物时会明确警告。</text>
  </g>
</svg>
