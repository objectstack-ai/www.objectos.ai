<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="What runs where in a self-hosted deployment: the artifact, runtime, database, files, identity and audit log all sit inside your infrastructure, while an external model API receives only minimal approved context through the runtime">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8703a"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .cap{font-size:13px;font-weight:780;letter-spacing:.07em}
      .label{font-size:18px;font-weight:760}
      .small{font-size:13px;fill:#657872}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600}
      .note{font-size:14px;fill:#5e716b}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fbfdfc"/>

  <text x="60" y="58" class="h">What runs where when you self-host</text>
  <text x="60" y="86" class="note">Everything inside the dashed boundary is the open-source runtime on hardware you control.</text>

  <!-- YOUR INFRASTRUCTURE BOUNDARY -->
  <rect x="60" y="112" width="740" height="520" rx="24" fill="#f4faf7" stroke="#2a7468" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="84" y="146" class="cap" style="fill:#2a7468">YOUR INFRASTRUCTURE</text>

  <!-- artifact -->
  <g transform="translate(88 166)">
    <rect width="320" height="86" rx="16" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="20" y="34" class="label">The compiled artifact</text>
    <text x="20" y="58" class="mono" style="fill:#8a6a3a">dist/objectstack.json</text>
    <text x="20" y="76" class="small">built in CI · 2.2 KB for a one-object app</text>
  </g>

  <line x1="248" y1="256" x2="248" y2="292" stroke="#2a7468" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="262" y="280" class="small" style="fill:#2a7468">os start</text>

  <!-- runtime -->
  <g transform="translate(88 296)">
    <rect width="684" height="118" rx="18" fill="#eef7f2" stroke="#2a7468" stroke-width="1.8"/>
    <text x="20" y="34" class="label">ObjectStack runtime — the governed layer</text>
    <text x="20" y="60" class="small">Console · REST API · MCP server · permissions, RLS and field security · approvals · audit</text>
    <text x="20" y="84" class="small">Generic until it reads the artifact. Enforces on every call, whoever the caller is.</text>
    <text x="20" y="104" class="mono" style="fill:#2a7468">/api/v1/health · /api/v1/ready · /api/v1/mcp</text>
  </g>

  <!-- state row -->
  <line x1="180" y1="418" x2="180" y2="452" stroke="#2a7468" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="430" y1="418" x2="430" y2="452" stroke="#2a7468" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="660" y1="418" x2="660" y2="452" stroke="#2a7468" stroke-width="2.5" marker-end="url(#a2)"/>

  <g transform="translate(88 456)">
    <rect width="200" height="88" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="32" class="label">Your database</text>
    <text x="18" y="54" class="small">business records</text>
    <text x="18" y="74" class="small">68 tables on first boot</text>
  </g>
  <g transform="translate(330 456)">
    <rect width="200" height="88" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="32" class="label">Your files</text>
    <text x="18" y="54" class="small">uploads and attachments</text>
    <text x="18" y="74" class="small">object storage or disk</text>
  </g>
  <g transform="translate(572 456)">
    <rect width="200" height="88" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="32" class="label">Your identity</text>
    <text x="18" y="54" class="small">SSO, roles, org structure</text>
    <text x="18" y="74" class="small">audit into your log stack</text>
  </g>

  <text x="88" y="576" class="cap" style="fill:#8a6a3a">YOU ARE ON CALL FOR</text>
  <text x="88" y="598" class="small">upgrades (one-major conversion window) · backups (database + OS_SECRET_KEY as one unit)</text>
  <text x="88" y="618" class="small">TLS and capacity · CVE response · no Prometheus endpoint · OTLP export opt-in · audit durability</text>

  <!-- OUTSIDE -->
  <rect x="836" y="112" width="304" height="230" rx="24" fill="#fdf4e8" stroke="#d9b98c" stroke-width="2"/>
  <text x="860" y="146" class="cap" style="fill:#8a6a3a">OUTSIDE YOUR BOUNDARY</text>
  <text x="860" y="180" class="label">External model API</text>
  <text x="860" y="206" class="small">Anthropic, OpenAI, a private</text>
  <text x="860" y="226" class="small">endpoint, or a local model.</text>
  <text x="860" y="258" class="small">Never holds database credentials.</text>
  <text x="860" y="278" class="small">Never queries your data directly.</text>
  <text x="860" y="312" class="small" style="fill:#a8703a">Receives only minimal, approved</text>
  <text x="860" y="330" class="small" style="fill:#a8703a">context — through the runtime.</text>

  <line x1="772" y1="340" x2="836" y2="290" stroke="#a8703a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a3)"/>

  <!-- OBJECTOS -->
  <rect x="836" y="368" width="304" height="264" rx="24" fill="#ffffff" stroke="#c9d8d1" stroke-width="2"/>
  <text x="860" y="402" class="cap" style="fill:#5e716b">OPTIONAL, COMMERCIAL</text>
  <text x="860" y="436" class="label">ObjectOS</text>
  <text x="860" y="464" class="small">The same ObjectStack definitions,</text>
  <text x="860" y="484" class="small">operated as a platform: in-app AI</text>
  <text x="860" y="504" class="small">building, SSO, managed deploy,</text>
  <text x="860" y="524" class="small">support and operations.</text>
  <text x="860" y="558" class="small">Changes who operates the runtime,</text>
  <text x="860" y="578" class="small">not what the runtime may do.</text>
  <text x="860" y="612" class="small" style="fill:#2a7468">Nothing on the left requires it.</text>
</svg>
