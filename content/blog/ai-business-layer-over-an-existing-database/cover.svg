<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="不搬数据，给在跑的数据库加一层业务层：实时读取、默认只读、权限照常生效。对象、权限和 AI 工具叠在你的数据库之上，复制 0 行。">
  <style>
    text{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",-apple-system,"Segoe UI",Arial,sans-serif;fill:#151a17}
    .title{font-size:60px;font-weight:800}
    .sub{font-size:28px;font-weight:700;fill:#1f7a4d}
    .row{font-size:28px;font-weight:700;fill:#3d58f0}
    .db{font-size:28px;font-weight:700}
    .chip{font-size:28px;font-weight:800;fill:#1f7a4d}
  </style>
  <rect width="1200" height="675" fill="#f3f7f2"/>
  <text x="64" y="124" class="title">不搬数据，</text>
  <text x="64" y="198" class="title">给在跑的数据库加一层业务层</text>
  <text x="64" y="258" class="sub">实时读取 · 默认只读 · 权限照常生效</text>

  <rect x="64" y="318" width="420" height="290" rx="22" fill="#ffffff" stroke="#3d58f0" stroke-width="3"/>
  <rect x="96" y="348" width="356" height="64" rx="14" fill="#eef2ff"/>
  <text x="124" y="390" class="row">对象</text>
  <rect x="96" y="430" width="356" height="64" rx="14" fill="#eef2ff"/>
  <text x="124" y="472" class="row">权限</text>
  <rect x="96" y="512" width="356" height="64" rx="14" fill="#eef2ff"/>
  <text x="124" y="554" class="row">AI 工具</text>

  <path d="M500 410H756" stroke="#1f7a4d" stroke-width="4" fill="none"/>
  <path d="M740 396L758 410L740 424" stroke="#1f7a4d" stroke-width="4" fill="none" stroke-linejoin="round"/>
  <path d="M760 470H504" stroke="#1f7a4d" stroke-width="4" fill="none"/>
  <path d="M520 456L502 470L520 484" stroke="#1f7a4d" stroke-width="4" fill="none" stroke-linejoin="round"/>
  <rect x="510" y="520" width="240" height="60" rx="30" fill="#eef2ff"/>
  <text x="630" y="560" class="chip" text-anchor="middle">复制 0 行</text>

  <path d="M780 360V570A170 34 0 0 0 1120 570V360" fill="#ffffff" stroke="#151a17" stroke-width="3"/>
  <ellipse cx="950" cy="360" rx="170" ry="34" fill="#ffffff" stroke="#151a17" stroke-width="3"/>
  <path d="M780 430A170 34 0 0 0 1120 430" fill="none" stroke="#151a17" stroke-width="2"/>
  <text x="950" y="520" class="db" text-anchor="middle">你的数据库</text>
</svg>
