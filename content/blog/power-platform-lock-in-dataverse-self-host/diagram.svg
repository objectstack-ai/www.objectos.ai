<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="你真正能带走什么：Power Platform 对比开放运行时">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#142540}.h{font-size:24px;font-weight:760}.col{font-size:18px;font-weight:740}.row{font-size:16px;fill:#3a4a64}.ok{fill:#1d7a5f;font-weight:700}.no{fill:#c0392b;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#f3f6fb"/>
  <text x="60" y="54" class="h">你真正能带走什么？</text>

  <line x1="500" y1="86" x2="500" y2="476" stroke="#d7deea"/>
  <line x1="820" y1="86" x2="820" y2="476" stroke="#d7deea"/>

  <text x="540" y="116" class="col" fill="#16243f">Power Platform</text>
  <text x="860" y="116" class="col" fill="#1d7a5f">开放运行时（ObjectStack）</text>

  <g>
    <rect x="40" y="140" width="1120" height="2" fill="#e3e8f0"/>
    <text x="60" y="186" class="row">应用元数据（表、表单、流程）</text>
    <text x="540" y="186" class="ok">✓ 可导出</text>
    <text x="860" y="186" class="ok">✓ 开放、可读</text>
    <rect x="40" y="212" width="1120" height="1" fill="#e3e8f0"/>

    <text x="60" y="256" class="row">你的业务数据</text>
    <text x="540" y="256" class="no">✗ 留在 Dataverse（约 $40/GB）</text>
    <text x="860" y="256" class="ok">✓ 留在你自己的库</text>
    <rect x="40" y="282" width="1120" height="1" fill="#e3e8f0"/>

    <text x="60" y="326" class="row">运行时本身</text>
    <text x="540" y="326" class="no">✗ 仅限 Azure，不能私有化</text>
    <text x="860" y="326" class="ok">✓ 可私有化</text>
    <rect x="40" y="352" width="1120" height="1" fill="#e3e8f0"/>

    <text x="60" y="396" class="row">AI 改了什么</text>
    <text x="540" y="396" class="no">✗ 不透明的托管配置</text>
    <text x="860" y="396" class="ok">✓ 可审 diff + 审计</text>
    <rect x="40" y="422" width="1120" height="1" fill="#e3e8f0"/>

    <text x="60" y="466" class="row">接入现有系统的方式</text>
    <text x="540" y="466" class="no">✗ 迁入 Dataverse</text>
    <text x="860" y="466" class="ok">✓ 连接，而非迁移</text>
  </g>
</svg>
