<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="审批闸门在变更管线中的位置">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#173a36}.h{font-size:24px;font-weight:760}.lab{font-size:17px;font-weight:680}.tiny{font-size:14px;fill:#5d736b}.invert{fill:#eafff6}.soft{fill:#abd1c5}.gate{font-size:15px;font-weight:720;fill:#7a4b00}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9bb0a7"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#f7faf6"/>
  <text x="60" y="56" class="h">同一句话，两条管线</text>

  <g transform="translate(60 96)">
    <rect width="230" height="70" rx="16" fill="#fffefa" stroke="#d9dfd6"/>
    <text x="24" y="44" class="lab">"加一个续约风险字段"</text>
  </g>
  <g transform="translate(316 96)">
    <rect width="190" height="70" rx="16" fill="#eef7f2" stroke="#cfe0d6"/>
    <text x="24" y="34" class="lab">AI 提出方案</text>
    <text x="24" y="56" class="tiny">对象 · 字段 · 规则</text>
  </g>
  <line x1="292" y1="131" x2="314" y2="131" stroke="#9bb0a7" stroke-width="2" marker-end="url(#ar)"/>

  <g transform="translate(560 60)">
    <text x="0" y="22" class="lab" fill="#2a7468">生成即治理</text>
    <g transform="translate(0 36)">
      <rect width="230" height="92" rx="16" fill="#fff7e6" stroke="#f3c66d" stroke-width="2"/>
      <text x="24" y="36" class="gate">⛔ 审批闸门</text>
      <text x="24" y="62" class="tiny">人在上线前</text>
      <text x="24" y="82" class="tiny">审一个 diff</text>
    </g>
  </g>
  <line x1="508" y1="131" x2="558" y2="142" stroke="#9bb0a7" stroke-width="2" marker-end="url(#ar)"/>

  <g transform="translate(870 60)">
    <rect width="270" height="280" rx="20" fill="#173a36"/>
    <text x="24" y="44" class="invert" font-size="18" font-weight="760">运行时强制</text>
    <text x="24" y="92" class="soft" font-size="15">• 对象权限</text>
    <text x="24" y="126" class="soft" font-size="15">• 字段权限（敏感）</text>
    <text x="24" y="160" class="soft" font-size="15">• 记录级访问</text>
    <text x="24" y="194" class="soft" font-size="15">• 动作 / 审批</text>
    <text x="24" y="228" class="soft" font-size="15">• 审计日志 + 原因</text>
    <text x="24" y="262" class="invert" font-size="15" font-weight="680">全部来自开放元数据</text>
  </g>
  <line x1="812" y1="142" x2="868" y2="160" stroke="#9bb0a7" stroke-width="2" marker-end="url(#ar)"/>

  <g transform="translate(560 392)">
    <text x="0" y="0" class="lab" fill="#d96b5f">先生成后治理</text>
    <g transform="translate(0 16)">
      <rect width="230" height="80" rx="16" fill="#fffefa" stroke="#e6c9c3"/>
      <text x="24" y="34" class="lab">直接改到在线应用</text>
      <text x="24" y="60" class="tiny">事后给一份步骤清单</text>
    </g>
  </g>
  <line x1="508" y1="131" x2="558" y2="408" stroke="#cdbab4" stroke-width="2" marker-end="url(#ar)"/>
  <g transform="translate(870 408)">
    <rect width="270" height="80" rx="16" fill="#f3ece8" stroke="#e6c9c3"/>
    <text x="24" y="34" class="lab" fill="#a33a2c">↶ 撤销？</text>
    <text x="24" y="60" class="tiny">没有 diff · 没有审批记录</text>
  </g>
  <line x1="792" y1="448" x2="868" y2="448" stroke="#cdbab4" stroke-width="2" marker-end="url(#ar)"/>
</svg>
