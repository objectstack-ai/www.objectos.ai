<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="A loop: AI writes, human reviews, runtime governs, agent operates within bounds">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#24342f" flood-opacity=".12"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .cap{font-size:13px;fill:#5d736b}.t{font-size:16px;font-weight:700}.s{font-size:12.5px;fill:#5d736b}
    </style>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="48" y="46" font-size="21" font-weight="760">Once writing is automated, what's left for humans is choosing and reviewing</text>
  <text x="48" y="74" class="cap">Machine writes, human reviews a small diff, runtime backs it — the human stays the one who signs off</text>

  <g transform="translate(60 110)" filter="url(#sh)"><rect width="200" height="120" rx="16" fill="#eef7f1"/>
    <text x="20" y="36" class="t">1 · AI writes</text>
    <text x="20" y="62" class="s">turns the requirement</text><text x="20" y="82" class="s">into declarative metadata</text>
    <text x="20" y="102" class="s">(dozens of lines, not thousands)</text></g>
  <g transform="translate(300 110)" filter="url(#sh)"><rect width="200" height="120" rx="16" fill="#fff3df"/>
    <text x="20" y="36" class="t" fill="#9a6212">2 · Human reviews</text>
    <text x="20" y="62" class="s">reads the diff line by line:</text><text x="20" y="82" class="s">which object changed,</text>
    <text x="20" y="102" class="s">which permission moved</text></g>
  <g transform="translate(540 110)" filter="url(#sh)"><rect width="200" height="120" rx="16" fill="#22433d"/>
    <text x="20" y="36" class="t" style="fill:#eafff6">3 · Runtime governs</text>
    <text x="20" y="62" class="s" style="fill:#a9c4ba">enforce permissions, hit</text><text x="20" y="82" class="s" style="fill:#a9c4ba">approval, write audit —</text>
    <text x="20" y="102" class="s" style="fill:#a9c4ba">"should it?" answered structurally</text></g>
  <g transform="translate(780 110)" filter="url(#sh)"><rect width="200" height="120" rx="16" fill="#eef7f1"/>
    <text x="20" y="36" class="t">4 · Agent operates</text>
    <text x="20" y="62" class="s">same governed tools;</text><text x="20" y="82" class="s">the agent can only act</text>
    <text x="20" y="102" class="s">within the bounds</text></g>

  <g stroke="#e8b04b" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M260 170 h40"/><path d="M500 170 h40"/><path d="M740 170 h40"/>
  </g>
  <path d="M880 230 v40 q0 20 -20 20 H 80 q-20 0 -20 -20 v-40" stroke="#7fae9f" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
  <text x="500" y="318" text-anchor="middle" class="cap" fill="#5d736b">Next change, back to 1 — and every round, the diff stays small enough to review and the actions stay governed.</text>
</svg>
