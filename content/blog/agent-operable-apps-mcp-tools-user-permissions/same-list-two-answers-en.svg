<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Same list, different answers. Sam's agent, with the submitter's API key, and Ada's agent, with the approver's API key, connect to the same /api/v1/mcp endpoint and receive the same twelve tools. The runtime resolves the caller's ExecutionContext on every call and applies RBAC, row-level security, field-level security and the action gate, so the same tool calls get different answers: create_record created for Sam; query_records one row for each, Sam's own and everyone's for Ada; list_actions empty for Sam, approve_claim for Ada; run_action refused for Sam, approved for Ada; delete_record refused for Sam; get_record readable by both.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3730a3"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1e293b}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5b6478}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#3730a3}
      .label{font-size:16px;font-weight:760}
      .small{font-size:13px;fill:#5b6478}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600}
      .cell{font-size:13px;font-weight:600}
      .no{fill:#b91c1c}
      .ok{fill:#166534}
      .dim{fill:#5b6478}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fbfbfe"/>

  <text x="60" y="52" class="h">Same list, different answers</text>
  <text x="60" y="80" class="note">Both agents get the same twelve tools. The permission decision is made on every call, as the user who presented the key.</text>

  <!-- callers -->
  <g transform="translate(60 118)">
    <rect width="250" height="96" rx="16" fill="#fef2f2" stroke="#f3c2c2" stroke-width="1.5"/>
    <text x="20" y="32" class="cap" style="fill:#b91c1c">SAM'S AGENT</text>
    <text x="20" y="58" class="label">submitter key</text>
    <text x="20" y="80" class="small">read · create · edit own claims</text>
  </g>
  <g transform="translate(60 232)">
    <rect width="250" height="96" rx="16" fill="#f0fdf4" stroke="#bfe3c8" stroke-width="1.5"/>
    <text x="20" y="32" class="cap" style="fill:#166534">ADA'S AGENT</text>
    <text x="20" y="58" class="label">approver key</text>
    <text x="20" y="80" class="small">all claims · approve_claims</text>
  </g>

  <line x1="314" y1="166" x2="396" y2="196" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="314" y1="280" x2="396" y2="250" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- the endpoint -->
  <g transform="translate(402 118)">
    <rect width="330" height="210" rx="20" fill="#eef0fa" stroke="#3730a3" stroke-width="2"/>
    <text x="22" y="34" class="cap">ONE ENDPOINT · /api/v1/mcp</text>
    <text x="22" y="64" class="label">tools/list: 12, for everyone</text>
    <text x="22" y="86" class="mono" style="fill:#3f4a63">list_objects · describe_object</text>
    <text x="22" y="104" class="mono" style="fill:#3f4a63">query_records · get_record · …</text>
    <text x="22" y="122" class="mono" style="fill:#3f4a63">list_actions · run_action · resume_run</text>
    <text x="22" y="154" class="label">per call, as the caller:</text>
    <text x="22" y="176" class="small">ExecutionContext → RBAC · RLS · FLS</text>
    <text x="22" y="194" class="small">→ ai.exposed → requiredPermissions</text>
  </g>

  <line x1="736" y1="223" x2="812" y2="223" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="774" y="212" class="small" text-anchor="middle">answer</text>

  <g transform="translate(818 118)">
    <rect width="322" height="210" rx="20" fill="#ffffff" stroke="#d9dcec" stroke-width="1.5"/>
    <text x="22" y="34" class="cap">THE RUN, IN NUMBERS</text>
    <text x="22" y="72" class="label">12 tools · identical for both</text>
    <text x="22" y="104" class="label">1 action · exposed by its author</text>
    <text x="22" y="136" class="label">3 refusals · each at the call</text>
    <text x="22" y="168" class="small">not one tool definition written by hand;</text>
    <text x="22" y="186" class="small">refusals arrive as tool results, HTTP 200</text>
  </g>

  <!-- the table -->
  <g transform="translate(60 362)">
    <rect width="1080" height="300" rx="20" fill="#ffffff" stroke="#d9dcec" stroke-width="1.5"/>
    <rect x="0" y="22" width="1080" height="22" fill="#eef0fa"/>
    <rect x="0" y="0" width="1080" height="44" rx="20" fill="#eef0fa"/>
    <text x="22" y="29" class="cap">TOOL CALL</text>
    <text x="330" y="29" class="cap" style="fill:#b91c1c">AS SAM</text>
    <text x="600" y="29" class="cap" style="fill:#166534">AS ADA</text>
    <text x="860" y="29" class="cap">DECIDED BY</text>

    <g transform="translate(0 44)">
      <text x="22" y="26" class="mono">create_record</text>
      <text x="330" y="26" class="cell ok">created · owner_id = Sam</text>
      <text x="600" y="26" class="cell dim">not attempted</text>
      <text x="860" y="26" class="small">allowCreate</text>
    </g>
    <line x1="14" y1="80" x2="1066" y2="80" stroke="#eceef7"/>
    <g transform="translate(0 80)">
      <text x="22" y="26" class="mono">query_records</text>
      <text x="330" y="26" class="cell ok">1 row · his own</text>
      <text x="600" y="26" class="cell ok">1 row · everyone's</text>
      <text x="860" y="26" class="small">private OWD + viewAllRecords</text>
    </g>
    <line x1="14" y1="116" x2="1066" y2="116" stroke="#eceef7"/>
    <g transform="translate(0 116)">
      <text x="22" y="26" class="mono">list_actions</text>
      <text x="330" y="26" class="cell dim">none</text>
      <text x="600" y="26" class="cell ok">approve_claim</text>
      <text x="860" y="26" class="small">ai.exposed, then requiredPermissions</text>
    </g>
    <line x1="14" y1="152" x2="1066" y2="152" stroke="#eceef7"/>
    <g transform="translate(0 152)">
      <text x="22" y="26" class="mono">run_action approve_claim</text>
      <text x="330" y="26" class="cell no">refused · missing capability</text>
      <text x="600" y="26" class="cell ok">status: "approved"</text>
      <text x="860" y="26" class="small">approve_claims, at invoke time</text>
    </g>
    <line x1="14" y1="188" x2="1066" y2="188" stroke="#eceef7"/>
    <g transform="translate(0 188)">
      <text x="22" y="26" class="mono">delete_record</text>
      <text x="330" y="26" class="cell no">refused · no permission</text>
      <text x="600" y="26" class="cell dim">not attempted</text>
      <text x="860" y="26" class="small">allowDelete: false</text>
    </g>
    <line x1="14" y1="224" x2="1066" y2="224" stroke="#eceef7"/>
    <g transform="translate(0 224)">
      <text x="22" y="26" class="mono">get_record</text>
      <text x="330" y="26" class="cell ok">his record · now approved</text>
      <text x="600" y="26" class="cell ok">the record</text>
      <text x="860" y="26" class="small">ownership under RLS</text>
    </g>
    <text x="22" y="284" class="small">Real answers from one run on ObjectStack 17.7.0; the "decided by" column never says MCP, because the tool surface adds no authorization of its own.</text>
  </g>
</svg>
