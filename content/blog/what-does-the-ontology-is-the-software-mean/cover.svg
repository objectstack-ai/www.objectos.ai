<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="本体即软件：一份可执行的业务本体，六类核心、四种框外的投影、三个「不是」，以及四个承诺——可执行、AI 可编写、Agent 可操作、归你所有">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .eyebrow{font-size:14px;font-weight:780;letter-spacing:.08em;fill:#2a7468}
      .title{font-size:64px;font-weight:800}
      .lead{font-size:19px;fill:#3f554f}
      .chip{font-size:14px;font-weight:760;fill:#2a7468}
      .num{font-size:44px;font-weight:800;fill:#2a7468}
      .label{font-size:19px;font-weight:760}
      .small{font-size:13px;fill:#657872}
      .foot{font-size:13px;fill:#657872}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="118" class="eyebrow">这句话到底是什么意思</text>
  <text x="78" y="212" class="title">本体即软件。</text>
  <text x="78" y="276" class="lead">一份可执行的业务本体。</text>
  <text x="78" y="304" class="lead">AI 编写它，运行时运行它，</text>
  <text x="78" y="332" class="lead">Agent 操作它，你拥有它。</text>

  <g transform="translate(78 404)"><rect width="92" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="46" y="24" class="chip" text-anchor="middle">可执行</text></g>
  <g transform="translate(180 404)"><rect width="112" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="56" y="24" class="chip" text-anchor="middle">AI 可编写</text></g>
  <g transform="translate(302 404)"><rect width="128" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="64" y="24" class="chip" text-anchor="middle">Agent 可操作</text></g>
  <g transform="translate(440 404)"><rect width="104" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="52" y="24" class="chip" text-anchor="middle">归你所有</text></g>

  <g transform="translate(650 112)" filter="url(#shadow)">
    <rect width="472" height="456" rx="28" fill="#fffefa" stroke="#d8dfd6"/>

    <g transform="translate(28 30)">
      <rect width="416" height="112" rx="16" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="22" y="64" class="num">6</text>
      <text x="76" y="38" class="label">类核心</text>
      <text x="76" y="64" class="small">对象与字段 · 关系 · 动作</text>
      <text x="76" y="84" class="small">权限 · 流程 · Agent 与工具定义</text>
    </g>

    <g transform="translate(28 158)">
      <rect width="416" height="112" rx="16" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="22" y="64" class="num">4</text>
      <text x="76" y="38" class="label">种投影，在本体之外</text>
      <text x="76" y="64" class="small">视图 · 仪表盘 · 应用 · 翻译</text>
      <text x="76" y="84" class="small">同样的元数据、同一道门禁，但不是本体的一部分</text>
    </g>

    <g transform="translate(28 286)">
      <rect width="416" height="112" rx="16" fill="#ffffff" stroke="#c9d8d1"/>
      <text x="22" y="64" class="num">3</text>
      <text x="76" y="38" class="label">个「不是」</text>
      <text x="76" y="64" class="small">不是知识表示本体 · 不是语义层</text>
      <text x="76" y="84" class="small">不是哲学意义上的形式本体</text>
    </g>

    <text x="28" y="420" class="small" style="fill:#2a7468">代码不会消失：钩子、动作体、CEL 和受限 JSX</text>
    <text x="28" y="438" class="small" style="fill:#2a7468">都在运行时的围栏内运行。</text>
  </g>

  <text x="78" y="612" class="foot">可执行业务本体的完整定义——引自 ObjectStack README，引用而非转述。</text>
</svg>
