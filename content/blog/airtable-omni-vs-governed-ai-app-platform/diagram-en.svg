<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Where the approval gate sits in the change pipeline">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.h{font-size:24px;font-weight:760}.lab{font-size:17px;font-weight:680}.tiny{font-size:14px;fill:#5d736b}.invert{fill:#eafff6}.soft{fill:#abd1c5}.gate{font-size:15px;font-weight:720;fill:#7a4b00}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9bb0a7"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#f7faf6"/>
  <text x="60" y="56" class="h">One sentence, two pipelines</text>

  <g transform="translate(60 96)">
    <rect width="230" height="70" rx="16" fill="#fffefa" stroke="#d9dfd6"/>
    <text x="24" y="34" class="lab">"Add a renewal-</text>
    <text x="24" y="56" class="lab">risk field"</text>
  </g>
  <g transform="translate(316 96)">
    <rect width="190" height="70" rx="16" fill="#eef7f2" stroke="#cfe0d6"/>
    <text x="24" y="34" class="lab">AI proposes</text>
    <text x="24" y="56" class="tiny">objects · fields · rules</text>
  </g>
  <line x1="292" y1="131" x2="314" y2="131" stroke="#9bb0a7" stroke-width="2" marker-end="url(#ar)"/>

  <g transform="translate(560 60)">
    <text x="0" y="22" class="lab" fill="#2a7468">Generate-and-govern</text>
    <g transform="translate(0 36)">
      <rect width="230" height="92" rx="16" fill="#fff7e6" stroke="#f3c66d" stroke-width="2"/>
      <text x="24" y="36" class="gate">⛔ Approval gate</text>
      <text x="24" y="62" class="tiny">Human reviews the diff</text>
      <text x="24" y="82" class="tiny">before it ships</text>
    </g>
  </g>
  <line x1="508" y1="131" x2="558" y2="142" stroke="#9bb0a7" stroke-width="2" marker-end="url(#ar)"/>

  <g transform="translate(870 60)">
    <rect width="270" height="280" rx="20" fill="#173a36"/>
    <text x="24" y="44" class="invert" font-size="18" font-weight="760">Runtime enforces</text>
    <text x="24" y="92" class="soft" font-size="15">• object permission</text>
    <text x="24" y="126" class="soft" font-size="15">• field permission (sensitive)</text>
    <text x="24" y="160" class="soft" font-size="15">• record-level access</text>
    <text x="24" y="194" class="soft" font-size="15">• action / approval</text>
    <text x="24" y="228" class="soft" font-size="15">• audit log + reason</text>
    <text x="24" y="262" class="invert" font-size="15" font-weight="680">all from open metadata</text>
  </g>
  <line x1="812" y1="142" x2="868" y2="160" stroke="#9bb0a7" stroke-width="2" marker-end="url(#ar)"/>

  <g transform="translate(560 392)">
    <text x="0" y="0" class="lab" fill="#d96b5f">Generate-then-govern</text>
    <g transform="translate(0 16)">
      <rect width="230" height="80" rx="16" fill="#fffefa" stroke="#e6c9c3"/>
      <text x="24" y="34" class="lab">Applied to live app</text>
      <text x="24" y="60" class="tiny">step checklist, after the fact</text>
    </g>
  </g>
  <line x1="508" y1="131" x2="558" y2="408" stroke="#cdbab4" stroke-width="2" marker-end="url(#ar)"/>
  <g transform="translate(870 408)">
    <rect width="270" height="80" rx="16" fill="#f3ece8" stroke="#e6c9c3"/>
    <text x="24" y="34" class="lab" fill="#a33a2c">↶ Undo?</text>
    <text x="24" y="60" class="tiny">no diff · no approval record</text>
  </g>
  <line x1="792" y1="448" x2="868" y2="448" stroke="#cdbab4" stroke-width="2" marker-end="url(#ar)"/>
</svg>
