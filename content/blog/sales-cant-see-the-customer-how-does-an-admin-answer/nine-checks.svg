<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 694" role="img" aria-label="对客户的一次读取请求的解释报告，修复前后对比：按执行顺序排列的九项检查。修复前，对象权限拒绝了请求，因为这位销售代表只持有每个成员都有的两个权限集。管理员分配 Sales Representative 岗位之后，对象权限通过 CRM Sales User 授予了读取权。其余各项检查要么中立，要么不适用。针对某一条记录提问时，报告会在最前面多出第十项检查：组织隔离墙。">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5e716b}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#2a7468}
      .name{font-size:17px;font-weight:700}
      .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;fill:#5e716b}
      .pill{font-size:14px;font-weight:700}
      .pw{fill:#ffffff}
      .pn{fill:#3f514b}
      .px{fill:#7a8a84}
      .foot{font-size:14px;fill:#3f514b}
    </style>
  </defs>
  <rect width="1200" height="694" fill="#fbfdfc"/>
  <text x="60" y="52" class="h">一个问题，九项检查：新来的销售代表为什么打不开客户</text>
  <text x="60" y="80" class="note">对「这位销售代表能读客户吗？」的解释报告，管理员分配岗位前后对比。ObjectStack 18.6.0，CRM 示例。</text>
  <text x="84" y="124" class="cap">检查项，按执行顺序</text>
  <text x="620" y="124" class="cap">修复前：没有岗位</text>
  <text x="900" y="124" class="cap">修复后：SALES REPRESENTATIVE</text>
  <rect x="60" y="144" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="172" class="name">1. 谁在提问</text>
  <text x="372" y="171" class="code">principal</text>
  <rect x="606" y="151" width="268" height="30" rx="15" fill="#e3ece8"/>
  <text x="740" y="171" class="pill pn" text-anchor="middle">2 个成员权限集</text>
  <rect x="886" y="151" width="240" height="30" rx="15" fill="#e3ece8"/>
  <text x="1006" y="171" class="pill pn" text-anchor="middle">+ Sales Representative</text>
  <rect x="60" y="196" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="224" class="name">2. 所需能力</text>
  <text x="372" y="223" class="code">required_permissions</text>
  <rect x="606" y="203" width="268" height="30" rx="15" fill="#f2f5f4"/>
  <text x="740" y="223" class="pill px" text-anchor="middle">不适用</text>
  <rect x="886" y="203" width="240" height="30" rx="15" fill="#f2f5f4"/>
  <text x="1006" y="223" class="pill px" text-anchor="middle">不适用</text>
  <rect x="60" y="248" width="1080" height="44" rx="12" fill="#eef6f1" stroke="#2a7468" stroke-width="2"/>
  <text x="84" y="276" class="name">3. 对象权限</text>
  <text x="372" y="275" class="code">object_crud</text>
  <rect x="606" y="255" width="268" height="30" rx="15" fill="#bd4b4b"/>
  <text x="740" y="275" class="pill pw" text-anchor="middle">拒绝：没有权限集授予读取</text>
  <rect x="886" y="255" width="240" height="30" rx="15" fill="#087f5b"/>
  <text x="1006" y="275" class="pill pw" text-anchor="middle">授予：CRM Sales User</text>
  <rect x="60" y="300" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="328" class="name">4. 字段屏蔽</text>
  <text x="372" y="327" class="code">fls</text>
  <rect x="606" y="307" width="268" height="30" rx="15" fill="#f2f5f4"/>
  <text x="740" y="327" class="pill px" text-anchor="middle">不适用</text>
  <rect x="886" y="307" width="240" height="30" rx="15" fill="#f2f5f4"/>
  <text x="1006" y="327" class="pill px" text-anchor="middle">不适用</text>
  <rect x="60" y="352" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="380" class="name">5. 记录基线</text>
  <text x="372" y="379" class="code">owd_baseline</text>
  <rect x="606" y="359" width="268" height="30" rx="15" fill="#e3ece8"/>
  <text x="740" y="379" class="pill pn" text-anchor="middle">全组织共享</text>
  <rect x="886" y="359" width="240" height="30" rx="15" fill="#e3ece8"/>
  <text x="1006" y="379" class="pill pn" text-anchor="middle">全组织共享</text>
  <rect x="60" y="404" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="432" class="name">6. 深度</text>
  <text x="372" y="431" class="code">depth</text>
  <rect x="606" y="411" width="268" height="30" rx="15" fill="#f2f5f4"/>
  <text x="740" y="431" class="pill px" text-anchor="middle">不适用</text>
  <rect x="886" y="411" width="240" height="30" rx="15" fill="#f2f5f4"/>
  <text x="1006" y="431" class="pill px" text-anchor="middle">不适用</text>
  <rect x="60" y="456" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="484" class="name">7. 共享</text>
  <text x="372" y="483" class="code">sharing</text>
  <rect x="606" y="463" width="268" height="30" rx="15" fill="#f2f5f4"/>
  <text x="740" y="483" class="pill px" text-anchor="middle">不适用</text>
  <rect x="886" y="463" width="240" height="30" rx="15" fill="#f2f5f4"/>
  <text x="1006" y="483" class="pill px" text-anchor="middle">不适用</text>
  <rect x="60" y="508" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="536" class="name">8. 查看/修改全部的绕过</text>
  <text x="372" y="535" class="code">vama_bypass</text>
  <rect x="606" y="515" width="268" height="30" rx="15" fill="#f2f5f4"/>
  <text x="740" y="535" class="pill px" text-anchor="middle">不适用</text>
  <rect x="886" y="515" width="240" height="30" rx="15" fill="#f2f5f4"/>
  <text x="1006" y="535" class="pill px" text-anchor="middle">不适用</text>
  <rect x="60" y="560" width="1080" height="44" rx="12" fill="#ffffff" stroke="#dbe6e1" stroke-width="1.5"/>
  <text x="84" y="588" class="name">9. 行级安全</text>
  <text x="372" y="587" class="code">rls</text>
  <rect x="606" y="567" width="268" height="30" rx="15" fill="#f2f5f4"/>
  <text x="740" y="587" class="pill px" text-anchor="middle">不适用</text>
  <rect x="886" y="567" width="240" height="30" rx="15" fill="#f2f5f4"/>
  <text x="1006" y="587" class="pill px" text-anchor="middle">行过滤条件：无</text>
  <text x="84" y="642" class="foot">修复后：授权通过 Sales Representative 岗位持有。行过滤条件为无，所以这位销售代表能看到全部客户（3 个中的 3 个）。</text>
  <text x="84" y="668" class="foot">如果针对某一条记录而不是整个对象提问，报告会在最前面多出第十项检查：组织隔离墙。</text>
</svg>
