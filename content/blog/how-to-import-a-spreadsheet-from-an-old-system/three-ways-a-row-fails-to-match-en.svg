<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="A grid of write mode against how many stored records the match fields found. With zero matches, insert and upsert create and update skips with NO_MATCH; with one match, update and upsert update it while insert creates a second record; with two or more matches, update and upsert fail with AMBIGUOUS_MATCH while insert creates another; a blank match key is created by upsert, skipped by update, and skipped in either mode under skipBlankMatchKey. Cells measured on 17.7.0 are marked">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#51645d}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#2a7468}
      .rowl{font-size:16px;font-weight:760}
      .rows{font-size:12px;fill:#55675f}
      .verb{font-size:17px;font-weight:780}
      .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;fill:#51645d}
      .small{font-size:13px;fill:#55675f}
      .dot{font-size:12px;font-weight:760;fill:#2a7468}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">Three ways a row can fail to match: writeMode against the records matched</text>
  <text x="60" y="80" class="note">upsertKey: ['email'] says what "the same row" means. The grid is what happens when that lookup finds 0, 1 or more than 1 stored record.</text>

  <!-- column headers -->
  <text x="330" y="126" class="cap">writeMode: 'insert'</text>
  <text x="330" y="144" class="small">never looks for a match</text>
  <text x="610" y="126" class="cap">writeMode: 'update'</text>
  <text x="610" y="144" class="small">never invents a record</text>
  <text x="890" y="126" class="cap">writeMode: 'upsert'</text>
  <text x="890" y="144" class="small">the mapping's mode here</text>

  <!-- row 0 matches -->
  <g transform="translate(60 160)">
    <rect width="250" height="96" rx="14" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="20" y="40" class="rowl">0 records match</text>
    <text x="20" y="62" class="rows">new to you</text>
  </g>
  <g transform="translate(320 160)"><rect width="260" height="96" rx="14" fill="#f4faf7" stroke="#c9d8d1"/><text x="20" y="42" class="verb" style="fill:#2a7468">created</text><text x="20" y="66" class="code">a record is inserted</text></g>
  <g transform="translate(600 160)"><rect width="260" height="96" rx="14" fill="#ffffff" stroke="#c9d8d1"/><text x="20" y="42" class="verb" style="fill:#8a6a3a">skipped</text><text x="20" y="66" class="code">code: NO_MATCH</text><text x="240" y="26" class="dot" text-anchor="end">● measured</text></g>
  <g transform="translate(880 160)"><rect width="260" height="96" rx="14" fill="#f4faf7" stroke="#c9d8d1"/><text x="20" y="42" class="verb" style="fill:#2a7468">created</text><text x="20" y="66" class="code">created 3 · then 3 stored</text><text x="240" y="26" class="dot" text-anchor="end">● measured</text></g>

  <!-- row 1 match -->
  <g transform="translate(60 268)">
    <rect width="250" height="96" rx="14" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="20" y="40" class="rowl">1 record matches</text>
    <text x="20" y="62" class="rows">the same row, refreshed</text>
  </g>
  <g transform="translate(320 268)"><rect width="260" height="96" rx="14" fill="#fff5f3" stroke="#e3b8b2"/><text x="20" y="42" class="verb" style="fill:#b4443a">created</text><text x="20" y="66" class="code">a second record — a duplicate</text><text x="240" y="26" class="dot" text-anchor="end">● measured</text></g>
  <g transform="translate(600 268)"><rect width="260" height="96" rx="14" fill="#f4faf7" stroke="#c9d8d1"/><text x="20" y="42" class="verb" style="fill:#2a7468">updated</text><text x="20" y="66" class="code">updated 1 of 2 rows sent</text><text x="240" y="26" class="dot" text-anchor="end">● measured</text></g>
  <g transform="translate(880 268)"><rect width="260" height="96" rx="14" fill="#f4faf7" stroke="#c9d8d1"/><text x="20" y="42" class="verb" style="fill:#2a7468">updated</text><text x="20" y="66" class="code">same file again: updated 3</text><text x="240" y="26" class="dot" text-anchor="end">● measured</text></g>

  <!-- row 2+ matches -->
  <g transform="translate(60 376)">
    <rect width="250" height="96" rx="14" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="20" y="40" class="rowl">2 or more match</text>
    <text x="20" y="62" class="rows">your table disagrees with itself</text>
  </g>
  <g transform="translate(320 376)"><rect width="260" height="96" rx="14" fill="#fff5f3" stroke="#e3b8b2"/><text x="20" y="42" class="verb" style="fill:#b4443a">created</text><text x="20" y="66" class="code">a third record</text></g>
  <g transform="translate(600 376)"><rect width="260" height="96" rx="14" fill="#fff5f3" stroke="#e3b8b2"/><text x="20" y="42" class="verb" style="fill:#b4443a">failed</text><text x="20" y="66" class="code">code: AMBIGUOUS_MATCH</text></g>
  <g transform="translate(880 376)"><rect width="260" height="96" rx="14" fill="#fff5f3" stroke="#e3b8b2"/><text x="20" y="42" class="verb" style="fill:#b4443a">failed</text><text x="20" y="66" class="code">AMBIGUOUS_MATCH, nothing written</text><text x="240" y="26" class="dot" text-anchor="end">● measured</text></g>

  <!-- row blank key -->
  <g transform="translate(60 484)">
    <rect width="250" height="96" rx="14" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="20" y="40" class="rowl">match key is blank</text>
    <text x="20" y="62" class="rows">an empty E-mail cell</text>
  </g>
  <g transform="translate(320 484)"><rect width="260" height="96" rx="14" fill="#f4faf7" stroke="#c9d8d1"/><text x="20" y="42" class="verb" style="fill:#2a7468">created</text><text x="20" y="66" class="code">no key is read</text></g>
  <g transform="translate(600 484)"><rect width="260" height="96" rx="14" fill="#ffffff" stroke="#c9d8d1"/><text x="20" y="42" class="verb" style="fill:#8a6a3a">skipped</text><text x="20" y="66" class="code">code: BLANK_MATCH_KEY</text></g>
  <g transform="translate(880 484)"><rect width="260" height="96" rx="14" fill="#f4faf7" stroke="#c9d8d1"/><text x="20" y="42" class="verb" style="fill:#2a7468">created</text><text x="20" y="66" class="code">skipBlankMatchKey: true → skipped</text><text x="240" y="26" class="dot" text-anchor="end">● measured</text></g>

  <text x="60" y="616" class="small">● marks a cell produced on @objectstack/cli 17.7.0 against one crm_lead table; the other cells are the documented per-row outcomes. A row that fails does not stop the import.</text>
</svg>
