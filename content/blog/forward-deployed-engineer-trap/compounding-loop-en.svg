<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Open-loop deployment versus the closed loop. On the left, each engagement's output terminates at the customer boundary and every deployment costs the same. On the right, each engagement writes into a shared open business ontology that the next deployment reads, so each deployment costs less than the last.">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset="1" stop-color="#eef7f2"/>
    </linearGradient>
    <marker id="arrOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a04b2e"/>
    </marker>
    <marker id="arrClosed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:23px;font-weight:780}
      .tiny{font-size:15px;fill:#5d736b}
      .node{font-size:15px;font-weight:700}
      .cap{font-size:14px;fill:#5d736b}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>

  <text x="60" y="52" font-size="26" font-weight="800">Where does the engagement&#8217;s output go?</text>
  <text x="60" y="80" class="tiny">The role is identical on both sides. Only the destination of the work differs &#8212; and that decides the cost of the next deployment.</text>

  <!-- ============ LEFT: OPEN LOOP ============ -->
  <rect x="60" y="110" width="520" height="500" rx="18" fill="#fff" stroke="#e6d3c9" stroke-width="2"/>
  <text x="92" y="152" class="h" fill="#a04b2e">Open loop</text>
  <text x="92" y="177" class="tiny">Role copied. No substrate underneath.</text>

  <!-- lanes -->
  <g>
    <!-- lane 1 -->
    <circle cx="128" cy="230" r="22" fill="#f4e3da" stroke="#c2603f" stroke-width="2"/>
    <text x="128" y="235" text-anchor="middle" class="mono" fill="#a04b2e">FDE</text>
    <line x1="154" y1="230" x2="252" y2="230" stroke="#c2603f" stroke-width="2.5" marker-end="url(#arrOpen)"/>
    <rect x="262" y="208" width="176" height="44" rx="9" fill="#fbf3ee" stroke="#c2603f" stroke-width="1.5"/>
    <text x="350" y="235" text-anchor="middle" class="node">Customer 1</text>
    <rect x="452" y="200" width="9" height="60" rx="3" fill="#a04b2e"/>
    <text x="478" y="228" class="cap">work</text>
    <text x="478" y="245" class="cap">stops here</text>

    <!-- lane 2 -->
    <circle cx="128" cy="318" r="22" fill="#f4e3da" stroke="#c2603f" stroke-width="2"/>
    <text x="128" y="323" text-anchor="middle" class="mono" fill="#a04b2e">FDE</text>
    <line x1="154" y1="318" x2="252" y2="318" stroke="#c2603f" stroke-width="2.5" marker-end="url(#arrOpen)"/>
    <rect x="262" y="296" width="176" height="44" rx="9" fill="#fbf3ee" stroke="#c2603f" stroke-width="1.5"/>
    <text x="350" y="323" text-anchor="middle" class="node">Customer 2</text>
    <rect x="452" y="288" width="9" height="60" rx="3" fill="#a04b2e"/>

    <!-- lane 3 -->
    <circle cx="128" cy="406" r="22" fill="#f4e3da" stroke="#c2603f" stroke-width="2"/>
    <text x="128" y="411" text-anchor="middle" class="mono" fill="#a04b2e">FDE</text>
    <line x1="154" y1="406" x2="252" y2="406" stroke="#c2603f" stroke-width="2.5" marker-end="url(#arrOpen)"/>
    <rect x="262" y="384" width="176" height="44" rx="9" fill="#fbf3ee" stroke="#c2603f" stroke-width="1.5"/>
    <text x="350" y="411" text-anchor="middle" class="node">Customer 3</text>
    <rect x="452" y="376" width="9" height="60" rx="3" fill="#a04b2e"/>
  </g>

  <text x="92" y="478" class="cap">Cost per deployment</text>
  <rect x="92" y="490" width="300" height="14" rx="5" fill="#c2603f"/>
  <rect x="92" y="512" width="300" height="14" rx="5" fill="#c2603f"/>
  <rect x="92" y="534" width="300" height="14" rx="5" fill="#c2603f"/>
  <text x="404" y="502" class="cap">1&#215;</text>
  <text x="404" y="524" class="cap">1&#215;</text>
  <text x="404" y="546" class="cap">1&#215;</text>
  <text x="92" y="582" class="tiny" font-weight="700" fill="#a04b2e">Revenue grows only by adding people.</text>

  <!-- ============ RIGHT: CLOSED LOOP ============ -->
  <rect x="620" y="110" width="520" height="500" rx="18" fill="#fff" stroke="#bfe0d6" stroke-width="2"/>
  <text x="652" y="152" class="h" fill="#0f766e">Closed loop</text>
  <text x="652" y="177" class="tiny">Role plus substrate. The work is written down.</text>

  <g>
    <!-- lane 1 -->
    <circle cx="688" cy="230" r="22" fill="#dff2ec" stroke="#0f766e" stroke-width="2"/>
    <text x="688" y="235" text-anchor="middle" class="mono" fill="#0f766e">FDE</text>
    <line x1="714" y1="230" x2="812" y2="230" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrClosed)"/>
    <rect x="822" y="208" width="176" height="44" rx="9" fill="#f0fbf7" stroke="#0f766e" stroke-width="1.5"/>
    <text x="910" y="235" text-anchor="middle" class="node">Customer 1</text>

    <!-- lane 2 -->
    <circle cx="688" cy="318" r="22" fill="#dff2ec" stroke="#0f766e" stroke-width="2"/>
    <text x="688" y="323" text-anchor="middle" class="mono" fill="#0f766e">FDE</text>
    <line x1="714" y1="318" x2="812" y2="318" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrClosed)"/>
    <rect x="822" y="296" width="176" height="44" rx="9" fill="#f0fbf7" stroke="#0f766e" stroke-width="1.5"/>
    <text x="910" y="323" text-anchor="middle" class="node">Customer 2</text>

    <!-- lane 3 -->
    <circle cx="688" cy="406" r="22" fill="#dff2ec" stroke="#0f766e" stroke-width="2"/>
    <text x="688" y="411" text-anchor="middle" class="mono" fill="#0f766e">FDE</text>
    <line x1="714" y1="406" x2="812" y2="406" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrClosed)"/>
    <rect x="822" y="384" width="176" height="44" rx="9" fill="#f0fbf7" stroke="#0f766e" stroke-width="1.5"/>
    <text x="910" y="411" text-anchor="middle" class="node">Customer 3</text>

    <!-- write-back paths into the substrate -->
    <path d="M1010 230 H1062 V452" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrClosed)"/>
    <path d="M1010 318 H1062" fill="none" stroke="#0f766e" stroke-width="2.5"/>
    <path d="M1010 406 H1062" fill="none" stroke="#0f766e" stroke-width="2.5"/>

    <!-- substrate band -->
    <rect x="652" y="456" width="410" height="52" rx="12" fill="#0f766e"/>
    <text x="857" y="480" text-anchor="middle" font-size="16" font-weight="740" fill="#eafff6">Open business ontology</text>
    <text x="857" y="499" text-anchor="middle" font-size="13" fill="#bfe8dc">typed objects, relationships, permissions, flows</text>

    <!-- feed-forward back to the next engagement -->
    <path d="M652 482 H614 V230 H666" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrClosed)"/>
    <text x="560" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e" transform="rotate(-90 560 352)">reused by the next deployment</text>
  </g>

  <text x="652" y="546" class="cap">Cost per deployment</text>
  <rect x="652" y="558" width="300" height="12" rx="5" fill="#0f766e"/>
  <rect x="652" y="576" width="188" height="12" rx="5" fill="#14b8a6"/>
  <rect x="652" y="594" width="112" height="12" rx="5" fill="#5eead4"/>
  <text x="964" y="568" class="cap">1&#215;</text>
  <text x="852" y="586" class="cap">0.6&#215;</text>
  <text x="776" y="604" class="cap">0.4&#215;</text>

  <text x="60" y="648" class="tiny">Palantir&#8217;s gross margin rose from 67.7% (2020) to roughly 82% (FY2025) while it kept sending engineers into customer buildings &#8212; the signature of a closed loop.</text>
</svg>
