<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="The lifecycle of one governed tool call: act as the user, runtime checks permission, controlled execution, write to audit">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#24342f" flood-opacity=".12"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .cap{font-size:14px;fill:#5d736b}.t{font-size:16px;font-weight:700}.s{font-size:13px;fill:#5d736b}
    </style>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="48" y="46" font-size="21" font-weight="760">One action, and the agent passes the exact same gates a person does</text>
  <text x="48" y="74" class="cap">"Raw interfaces" skip the middle three—which is exactly where an agent becomes a superuser</text>

  <g transform="translate(48 120)" filter="url(#sh)">
    <rect width="190" height="120" rx="16" fill="#eef7f1"/>
    <text x="20" y="36" class="t">1 · Call</text>
    <text x="20" y="64" class="s">agent requests a discount</text>
    <text x="20" y="84" class="s">change as "Zhang"</text>
    <text x="20" y="104" class="s">—not an anonymous superuser</text>
  </g>
  <g transform="translate(268 120)" filter="url(#sh)">
    <rect width="190" height="120" rx="16" fill="#22433d"/>
    <text x="20" y="36" class="t" style="fill:#eafff6">2 · Check perms</text>
    <text x="20" y="64" class="s" style="fill:#a9c4ba">runtime checks Zhang's</text>
    <text x="20" y="84" class="s" style="fill:#a9c4ba">rights: allowed?</text>
    <text x="20" y="104" class="s" style="fill:#a9c4ba">over limit → refused</text>
  </g>
  <g transform="translate(488 120)" filter="url(#sh)">
    <rect width="190" height="120" rx="16" fill="#eef7f1"/>
    <text x="20" y="36" class="t">3 · Controlled run</text>
    <text x="20" y="64" class="s">discount over 30%?</text>
    <text x="20" y="84" class="s">hits flow → awaits approval</text>
    <text x="20" y="104" class="s">commits only after</text>
  </g>
  <g transform="translate(708 120)" filter="url(#sh)">
    <rect width="244" height="120" rx="16" fill="#fff3df"/>
    <text x="20" y="36" class="t" fill="#9a6212">4 · Write audit</text>
    <text x="20" y="64" class="s">who · what · when</text>
    <text x="20" y="84" class="s">under which right · who approved</text>
    <text x="20" y="104" class="s">same ledger as humans</text>
  </g>

  <g stroke="#e8b04b" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M238 180 h30"/><path d="M458 180 h30"/><path d="M678 180 h30"/>
  </g>

  <text x="48" y="300" class="cap">MCP / A2A handle "how to connect"—these four steps handle "once connected, is it allowed, is it logged."</text>
  <text x="48" y="324" class="cap">Enterprises never lacked a connection protocol—they lack this layer behind it that enforces permission and keeps a trail.</text>
</svg>
