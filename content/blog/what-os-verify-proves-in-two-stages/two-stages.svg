<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="17.7.0 上 os verify 按顺序运行什么、退出码读什么。阶段 1 编写期规则：os validate 跑的那套规则表，49 条；被拒绝即退出 1，stdout 上是 error 与 errors[]，stderr 零行，运行时阶段不执行。阶段 2 运行时：进程内启动，对每个对象派生一条记录、经真实 HTTP 栈创建、读回、比对；状态有 verified、needs-fixture、skipped，只有创建、读取与保真失败计数。按需 --rls：全新启动，证明成员不能写它读不到的记录，用一个探测身份和每个声明岗位各一个身份；rls-consistent 与 rls-hole 为已证明，member-visible、probe-blocked、skipped 为未证明。hardFailures 由六项相加，为 0 时退出 0；needs-fixture、skipped、member-visible 只报告、不计数">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5e716b}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#2a7468}
      .label{font-size:16px;font-weight:760}
      .small{font-size:13px;fill:#55685f}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600;fill:#173a36}
      .ok{fill:#2a7468}
      .red{fill:#b4432f}
      .amber{fill:#8a6a3a}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">os verify 按顺序运行什么——退出码又读什么</text>
  <text x="60" y="80" class="note">ObjectStack 17.7.0。第一阶段通过，第二阶段才开始；按需探测会另起一个全新的栈。</text>

  <!-- STAGE 1 -->
  <g transform="translate(60 112)">
    <rect width="340" height="372" rx="20" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="22" y="32" class="cap">阶段 1 · 编写期规则</text>
    <text x="22" y="62" class="label">os validate 跑的那套规则表</text>
    <text x="22" y="84" class="small">17.7.0 上是 49 条，作用于按 os validate</text>
    <text x="22" y="102" class="small">的方式准备好的栈：规范化、按协议</text>
    <text x="22" y="120" class="small">schema 解析、整体判定一次，</text>
    <text x="22" y="138" class="small">再按包各判定一次</text>

    <g transform="translate(22 160)">
      <rect width="296" height="112" rx="12" fill="#fdf1ee" stroke="#e3c3bb"/>
      <text x="14" y="24" class="cap red">被拒绝 → 退出 1</text>
      <text x="14" y="46" class="mono">{ "error": "…", "errors": [ … ] }</text>
      <text x="14" y="68" class="small" style="fill:#4a5d57">运行时阶段未执行</text>
      <text x="14" y="86" class="small" style="fill:#4a5d57">stderr：0 行——什么都没启动</text>
      <text x="14" y="104" class="small" style="fill:#4a5d57">与 os validate 同一规则、路径与提示</text>
    </g>

    <g transform="translate(22 286)">
      <rect width="296" height="40" rx="12" fill="#eef7f2" stroke="#b9dcd0"/>
      <text x="14" y="25" class="label ok">通过 → 阶段 2 才可以开始</text>
    </g>
    <text x="22" y="344" class="small">建议级发现（warning、info）不会让它失败；</text>
    <text x="22" y="362" class="small">os validate 会打印它们——也要跑。</text>
  </g>

  <line x1="404" y1="298" x2="446" y2="298" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- STAGE 2 -->
  <g transform="translate(450 112)">
    <rect width="340" height="372" rx="20" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="22" y="32" class="cap">阶段 2 · 运行时</text>
    <text x="22" y="62" class="label">进程内启动，走真实 HTTP 栈</text>
    <text x="22" y="84" class="small">对每个对象，从字段派生一条记录，</text>
    <text x="22" y="102" class="small">创建、读回、比对——</text>
    <text x="22" y="120" class="small">CRUD 往返保真。</text>
    <text x="22" y="138" class="small">日志进 stderr；stdout 只有一份 JSON。</text>

    <g transform="translate(22 160)">
      <rect width="296" height="112" rx="12" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="14" y="24" class="cap">每个对象的状态</text>
      <text x="14" y="48" class="mono ok">verified</text>
      <text x="110" y="48" class="small">已创建、读回、相等</text>
      <text x="14" y="70" class="mono amber">needs-fixture</text>
      <text x="130" y="70" class="small">应用自己的规则拒绝了它</text>
      <text x="14" y="92" class="mono amber">skipped</text>
      <text x="110" y="92" class="small">必填关系没有可用记录</text>
    </g>

    <g transform="translate(22 286)">
      <rect width="296" height="62" rx="12" fill="#fdf1ee" stroke="#e3c3bb"/>
      <text x="14" y="24" class="cap red">计为失败</text>
      <text x="14" y="48" class="mono red" style="font-size:11px">createFailed · readFailed · fidelityGaps</text>
    </g>
    <text x="22" y="364" class="small">needs-fixture 与 skipped 只报告，不计数。</text>
  </g>

  <line x1="794" y1="298" x2="836" y2="298" stroke="#2a7468" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr)"/>

  <!-- RLS -->
  <g transform="translate(840 112)">
    <rect width="300" height="372" rx="20" fill="#ffffff" stroke="#2a7468" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="22" y="32" class="cap">按需 · --rls</text>
    <text x="22" y="62" class="label">第二次、全新的启动</text>
    <text x="22" y="84" class="small">只证明一条不变量：成员不能写</text>
    <text x="22" y="102" class="small">它读不到的记录。用一个探测身份，</text>
    <text x="22" y="120" class="small">再加每个声明岗位各一个身份</text>
    <text x="22" y="138" class="small">（CRM：声明 3 个，探测 3 个）。</text>

    <g transform="translate(22 160)">
      <rect width="256" height="134" rx="12" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="14" y="24" class="cap">每次探测的状态</text>
      <text x="14" y="46" class="mono ok">rls-consistent</text>
      <text x="150" y="46" class="small">已证明</text>
      <text x="14" y="66" class="mono red">rls-hole</text>
      <text x="150" y="66" class="small">已证明有洞</text>
      <text x="14" y="86" class="mono amber">member-visible</text>
      <text x="150" y="86" class="small">未证明</text>
      <text x="14" y="106" class="mono amber">probe-blocked</text>
      <text x="150" y="106" class="small">未证明</text>
      <text x="14" y="126" class="mono amber">skipped</text>
      <text x="150" y="126" class="small">未证明</text>
    </g>

    <g transform="translate(22 308)">
      <rect width="256" height="62" rx="12" fill="#fdf1ee" stroke="#e3c3bb"/>
      <text x="14" y="24" class="cap red">计为失败</text>
      <text x="14" y="46" class="mono red">holes · degraded probe · notRun</text>
    </g>
  </g>

  <line x1="600" y1="488" x2="600" y2="524" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>
  <g transform="translate(60 530)">
    <rect width="1080" height="120" rx="20" fill="#eef7f2" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="34" class="cap">退出码读的那一个计数</text>
    <text x="24" y="64" class="mono">hardFailures = createFailed + readFailed + fidelityGaps + holes + (degraded probe ? 1 : 0) + positions notRun</text>
    <text x="24" y="90" class="label ok">hardFailures = 0 → 退出 0</text>
    <text x="260" y="90" class="label red">否则 → 退出 1</text>
    <text x="500" y="90" class="small">不计数、但在报告里：needs-fixture、skipped、member-visible——</text>
    <text x="500" y="108" class="small">覆盖面只报告、不丢弃。先读 crud.summary 和 rls.totals.unproven，再读退出码。</text>
  </g>

  <text x="60" y="682" class="small">来源：@objectstack/cli@17.7.0 标签下的 cli.mdx 与 verify.ts；状态来自 packages/verify/src/rls.ts。数字实测于空白脚手架与 examples/app-crm。</text>
</svg>
