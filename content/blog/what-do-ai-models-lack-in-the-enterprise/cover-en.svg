<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="What do AI models lack in the enterprise? A world, hands and a fence: not intelligence; three things an enterprise has to supply, and one artifact, the executable business ontology, that supplies all three: the ontology as the world, actions exposed as tools as the hands, and permissions, row-level and field-level security and audit decided on every call as the fence">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em;fill:#2a7468}
      .title{font-size:54px;font-weight:800;fill:#173a36}
      .lead{font-size:19px;fill:#3f554f}
      .chip{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:600;fill:#2a7468}
      .kicker{font-size:12px;font-weight:780;letter-spacing:.12em;fill:#2a7468}
      .bandTitle{font-size:21px;font-weight:760;fill:#173a36}
      .small{font-size:14px;fill:#4f625c}
      .foot{font-size:13px;fill:#4f625c}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="118" class="eyebrow">WHAT THE MODEL LACKS</text>
  <text x="78" y="186" class="title">A world,</text>
  <text x="78" y="248" class="title">hands,</text>
  <text x="78" y="310" class="title">and a fence.</text>
  <text x="78" y="364" class="lead">Not intelligence. Three things an enterprise has to</text>
  <text x="78" y="391" class="lead">supply, and one artifact that supplies all three.</text>

  <g transform="translate(78 420)">
    <rect width="372" height="38" rx="19" fill="#ffffff" stroke="#b9dcd0"/>
    <text x="186" y="24" class="chip" text-anchor="middle">objectstack.config.ts → objectstack.json</text>
  </g>

  <g transform="translate(640 112)">
    <rect width="482" height="124" rx="18" fill="#f4faf7" stroke="#c9d8d1"/>
    <text x="28" y="32" class="kicker" style="fill:#2a7468">WORLD</text>
    <text x="28" y="62" class="bandTitle">The ontology</text>
    <text x="28" y="86" class="small">objects · fields · relations: the nouns, typed</text>
    <text x="28" y="106" class="small">derived into database · API · describe_object</text>
  </g>
  <g transform="translate(640 256)">
    <rect width="482" height="124" rx="18" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="28" y="32" class="kicker" style="fill:#a35a1f">HANDS</text>
    <text x="28" y="62" class="bandTitle">Actions exposed as tools</text>
    <text x="28" y="86" class="small">objects are tools by default; actions opt in</text>
    <text x="28" y="106" class="small">with ai: { exposed: true } — twelve MCP tools</text>
  </g>
  <g transform="translate(640 400)">
    <rect width="482" height="124" rx="18" fill="#eef1f8" stroke="#c7cde0"/>
    <text x="28" y="32" class="kicker" style="fill:#3d4f7c">FENCE</text>
    <text x="28" y="62" class="bandTitle">Decided on every call</text>
    <text x="28" y="86" class="small">permissions · row-level · field-level · audit</text>
    <text x="28" y="106" class="small">one middleware for REST, the Console and MCP</text>
  </g>

  <text x="78" y="618" class="foot">From the ObjectStack front page, mapped to the runtime mechanism that supplies each — with file and line.</text>
</svg>
