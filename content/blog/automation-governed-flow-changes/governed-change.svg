<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="自然语言变更进入流程治理">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.h{font-size:30px;font-weight:780}.t{font-size:18px;font-weight:740}.s{font-size:14px;fill:#647872}.box{fill:#fffefa;stroke:#d7dfdb}.green{fill:#eef7f3}.yellow{fill:#fff3d6}.blue{fill:#edf2ff}.red{fill:#fff0ec}.dark{fill:#173a36}.white{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f8faf7"/>
  <text x="70" y="64" class="h">自然语言是变更入口，不是直接发布按钮</text>
  <g transform="translate(70 108)">
    <rect width="1060" height="418" rx="30" class="box"/>
    <g transform="translate(48 76)">
      <rect width="190" height="92" rx="22" class="dark"/>
      <text x="95" y="38" text-anchor="middle" class="white" font-size="18" font-weight="760">一句话需求</text>
      <text x="95" y="64" text-anchor="middle" class="soft" font-size="14">调整审批阈值</text>
    </g>
    <g transform="translate(292 76)">
      <rect width="170" height="92" rx="22" class="green"/>
      <text x="85" y="38" text-anchor="middle" class="t">生成草案</text>
      <text x="85" y="64" text-anchor="middle" class="s">节点和条件</text>
    </g>
    <g transform="translate(516 76)">
      <rect width="170" height="92" rx="22" class="yellow"/>
      <text x="85" y="38" text-anchor="middle" class="t">展示差异</text>
      <text x="85" y="64" text-anchor="middle" class="s">改了什么</text>
    </g>
    <g transform="translate(740 76)">
      <rect width="170" height="92" rx="22" class="blue"/>
      <text x="85" y="38" text-anchor="middle" class="t">校验发布</text>
      <text x="85" y="64" text-anchor="middle" class="s">权限和版本</text>
    </g>
    <path d="M242 122 H288 M466 122 H512 M690 122 H736" stroke="#2a7468" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(230 252)">
      <rect width="210" height="82" rx="22" class="red"/>
      <text x="105" y="35" text-anchor="middle" class="t">发布前拦截</text>
      <text x="105" y="58" text-anchor="middle" class="s">坏条件 / 断路径</text>
    </g>
    <g transform="translate(505 252)">
      <rect width="210" height="82" rx="22" class="box"/>
      <text x="105" y="35" text-anchor="middle" class="t">影响范围</text>
      <text x="105" y="58" text-anchor="middle" class="s">新流程还是运行中</text>
    </g>
    <g transform="translate(780 252)">
      <rect width="170" height="82" rx="22" class="box"/>
      <text x="85" y="35" text-anchor="middle" class="t">回滚</text>
      <text x="85" y="58" text-anchor="middle" class="s">保留旧版本</text>
    </g>
  </g>
</svg>
