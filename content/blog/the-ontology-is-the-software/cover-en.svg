<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The ontology is the software — one executable business ontology: the runtime runs it, AI writes it, agents operate it, you own it">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8faf7"/><stop offset=".55" stop-color="#eef7f2"/><stop offset="1" stop-color="#fff3df"/></linearGradient><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f8b81"/></marker><marker id="ar-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c7a55"/></marker><marker id="ar-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b07a1a"/></marker><marker id="ar-onInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8cdc2"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g transform="translate(0 0)">
    <text x="96" y="76" font-size="16" font-weight="700" fill="#5d736b" text-anchor="start">THE README ESSAY · OCTOBER 2026</text>
    <text x="96" y="170" font-size="68" font-weight="780" fill="#173a36" text-anchor="start">The ontology</text>
    <text x="96" y="250" font-size="68" font-weight="780" fill="#1c7a55" text-anchor="start">is the software.</text>
    <text x="96" y="312" font-size="22" font-weight="500" fill="#5d736b" text-anchor="start">One executable business ontology. AI writes it, the runtime runs it, agents operate it, you own it.</text>
    <rect x="96" y="372" width="232" height="118" rx="16" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="118" y="418" font-size="21" font-weight="760" fill="#173a36" text-anchor="start">Executable</text>
    <text x="118" y="452" font-size="15" font-weight="400" fill="#5d736b" text-anchor="start">The runtime runs it</text>
    <rect x="348" y="372" width="232" height="118" rx="16" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="370" y="418" font-size="21" font-weight="760" fill="#173a36" text-anchor="start">AI-writable</text>
    <text x="370" y="452" font-size="15" font-weight="400" fill="#5d736b" text-anchor="start">AI writes it</text>
    <rect x="600" y="372" width="232" height="118" rx="16" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="622" y="418" font-size="21" font-weight="760" fill="#173a36" text-anchor="start">Agent-operable</text>
    <text x="622" y="452" font-size="15" font-weight="400" fill="#5d736b" text-anchor="start">Agents operate it</text>
    <rect x="852" y="372" width="232" height="118" rx="16" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="874" y="418" font-size="21" font-weight="760" fill="#173a36" text-anchor="start">You own it</text>
    <text x="874" y="452" font-size="15" font-weight="400" fill="#5d736b" text-anchor="start">Export it, run it anywhere</text>
    <rect x="96" y="530" width="1008" height="86" rx="16" fill="#22433d"/>
    <text x="128" y="566" font-size="19" font-weight="600" fill="#eafff6" text-anchor="start">What an enterprise has to be, so that an agent can read it, run it, and be stopped by it.</text>
    <text x="128" y="596" font-size="15" font-weight="400" fill="#a8cdc2" text-anchor="start">Small enough for a model to hold whole · run directly by the runtime · every call permission-checked and audited</text>
  </g>
</svg>
