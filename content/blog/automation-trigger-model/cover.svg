<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="统一触发模型">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset="1" stop-color="#eef6ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#263d35" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.title{font-size:38px;font-weight:780}.lead{font-size:18px;fill:#60746f}.label{font-size:18px;font-weight:750}.small{font-size:14px;fill:#647872}.dark{fill:#173a36}.white{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="78" y="86" class="title">流程从哪里开始</text>
  <text x="78" y="124" class="lead">定时、数据变化、人工按钮进入同一个引擎</text>
  <g transform="translate(96 166)" filter="url(#shadow)">
    <rect width="1008" height="370" rx="32" fill="#fffefa" stroke="#d8dfd6"/>
    <g transform="translate(70 65)">
      <rect width="180" height="82" rx="22" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="90" y="35" text-anchor="middle" class="label">记录变化</text>
      <text x="90" y="58" text-anchor="middle" class="small">状态 / 字段</text>
      <rect y="132" width="180" height="82" rx="22" fill="#fff3d6" stroke="#efc86c"/>
      <text x="90" y="167" text-anchor="middle" class="label">定时计划</text>
      <text x="90" y="190" text-anchor="middle" class="small">每天 / 每月</text>
    </g>
    <g transform="translate(414 84)">
      <rect width="200" height="170" rx="28" class="dark"/>
      <text x="100" y="56" text-anchor="middle" class="white" font-size="20" font-weight="780">统一流程</text>
      <text x="100" y="96" text-anchor="middle" class="soft" font-size="14">条件</text>
      <text x="100" y="126" text-anchor="middle" class="soft" font-size="14">动作</text>
    </g>
    <g transform="translate(760 65)">
      <rect width="180" height="82" rx="22" fill="#edf2ff" stroke="#bdc8ee"/>
      <text x="90" y="35" text-anchor="middle" class="label">人工操作</text>
      <text x="90" y="58" text-anchor="middle" class="small">按钮 / 审批</text>
      <rect y="132" width="180" height="82" rx="22" fill="#fff0ec" stroke="#e6b3a9"/>
      <text x="90" y="167" text-anchor="middle" class="label">外部事件</text>
      <text x="90" y="190" text-anchor="middle" class="small">Webhook / API</text>
    </g>
    <path d="M254 106 H410 M254 238 H410 M618 106 H756 M618 238 H756" stroke="#2a7468" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
