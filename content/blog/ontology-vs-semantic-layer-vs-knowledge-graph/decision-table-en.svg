<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="A matrix of five primitives across three layers: a thing, its attributes and links appear in all three under different names, while actions and permissions appear only in the ontology column">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:14px;fill:#5d736b}
      .head{font-size:16px;font-weight:740}
      .idea{font-size:15px;font-weight:660;fill:#3c574f}
      .cell{font-size:15px}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .none{font-size:15px;fill:#b3c0b9}
      .gapcap{font-size:12px;font-weight:740;letter-spacing:.1em;fill:#9a3b1f}
    </style>
  </defs>
  <rect width="1200" height="600" fill="#f8faf7"/>

  <text x="70" y="56" font-size="26" font-weight="780">Five primitives, three layers</text>
  <text x="70" y="84" class="tiny">The first three are the same idea under different names. The last two exist in one column only — that is the verb gap.</text>

  <!-- verb-gap band, drawn under the rows it marks -->
  <rect x="60" y="352" width="1080" height="124" rx="14" fill="#fdf1e8"/>

  <!-- ontology column tint -->
  <rect x="884" y="106" width="256" height="370" rx="14" fill="#eaf3ee"/>

  <!-- header row -->
  <g class="head">
    <text x="70" y="140">The idea</text>
    <text x="336" y="140">Semantic layer</text>
    <text x="612" y="140">Knowledge graph</text>
    <text x="900" y="140">Ontology</text>
  </g>
  <line x1="60" y1="158" x2="1140" y2="158" stroke="#c9d8cf" stroke-width="2"/>

  <!-- row 1 -->
  <g transform="translate(0 200)">
    <text x="70" class="idea">A thing</text>
    <text x="336" class="cell mono">dimension</text>
    <text x="612" class="cell mono">node</text>
    <text x="900" class="cell mono">class</text>
  </g>
  <line x1="60" y1="228" x2="1140" y2="228" stroke="#e3ece7" stroke-width="1.5"/>

  <!-- row 2 -->
  <g transform="translate(0 262)">
    <text x="70" class="idea">Its attributes</text>
    <text x="336" class="cell mono">attribute</text>
    <text x="612" class="cell mono">property</text>
    <text x="900" class="cell mono">typed field</text>
  </g>
  <line x1="60" y1="290" x2="1140" y2="290" stroke="#e3ece7" stroke-width="1.5"/>

  <!-- row 3 -->
  <g transform="translate(0 324)">
    <text x="70" class="idea">A link between things</text>
    <text x="336" class="cell mono">join</text>
    <text x="612" class="cell mono">edge</text>
    <text x="900" class="cell mono">relation</text>
  </g>
  <line x1="60" y1="352" x2="1140" y2="352" stroke="#c9d8cf" stroke-width="2"/>

  <!-- row 4 -->
  <g transform="translate(0 392)">
    <text x="70" class="idea">Something you may do to it</text>
    <text x="336" class="none">— none —</text>
    <text x="612" class="none">— none —</text>
    <text x="900" class="cell mono" font-weight="700" style="fill:#1f6b4a">action</text>
  </g>
  <line x1="60" y1="420" x2="1140" y2="420" stroke="#f0dccd" stroke-width="1.5"/>

  <!-- row 5 -->
  <g transform="translate(0 454)">
    <text x="70" class="idea">Who is allowed to do it</text>
    <text x="336" class="none">— none —</text>
    <text x="612" class="none">— none —</text>
    <text x="900" class="cell mono" font-weight="700" style="fill:#1f6b4a">permission</text>
  </g>

  <text x="70" y="504" class="gapcap">THE VERB GAP</text>

  <text x="70" y="548" class="tiny">A semantic layer and a knowledge graph describe the business precisely and cannot change it.</text>
  <text x="70" y="572" class="tiny">A layer that never had a way to express a permitted change does not acquire one by being renamed.</text>
</svg>
