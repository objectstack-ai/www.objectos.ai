<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="命名测试。中间是给 todo_task 加 budget: Field.currency 的五行 diff。左边是只写明对象、未经编辑就跟上了定义的七个面：SQLite 表从 27 列到 28 列，REST 记录从 27 个键到 28 个，REST 写入从 400 到 201，元数据接口从 27 个字段到 28 个，MCP describe_object 从 19 个字段到 20 个，MCP query_records 返回了新记录，控制台新建表单从 16 个输入项到 17 个。右边是写明了字段名、原样未动的四个投影：6 列的 All Tasks 视图、各 5 列的 overdue 与 due_today 视图、3 个度量的 task_metrics 数据集，以及 budget 回落为 Budget 的 zh-CN 翻译。底部是构建门禁的警告：字段 budget 已声明，但这个栈里没有任何东西显示或读取它，规则 field-no-consumers">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
      .h{font-size:22px;font-weight:780}
      .kicker{font-size:12px;font-weight:780;letter-spacing:.12em}
      .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
      .monoB{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:700}
      .row{font-size:14px}
      .num{font-size:14px;font-weight:760}
      .sub{font-size:12px}
      .note{font-size:13px}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f7d75"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#fbfdfc"/>

  <text x="60" y="52" class="h" fill="#173a36">命名测试：这个投影写明的是字段，还是只有对象？</text>

  <!-- centre: the diff -->
  <g transform="translate(450 96)">
    <rect width="300" height="150" rx="14" fill="#173a36"/>
    <text x="20" y="30" class="kicker" fill="#9fd3c4">这份 DIFF · src/objects/task.object.ts</text>
    <text x="20" y="62" class="monoB" fill="#b6f0d8" xml:space="preserve">+ budget: Field.currency({</text>
    <text x="20" y="84" class="monoB" fill="#b6f0d8" xml:space="preserve">+   label: 'Budget',</text>
    <text x="20" y="106" class="monoB" fill="#b6f0d8" xml:space="preserve">+   min: 0,</text>
    <text x="20" y="128" class="monoB" fill="#b6f0d8" xml:space="preserve">+ }),</text>
  </g>

  <!-- arrows -->
  <path d="M 450 171 L 388 171" stroke="#5f7d75" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 750 171 L 812 171" stroke="#5f7d75" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- left: derived -->
  <g transform="translate(60 96)">
    <rect width="328" height="150" rx="14" fill="#f4faf7" stroke="#c9d8d1"/>
    <text x="22" y="34" class="kicker" fill="#2a7468">只写明对象</text>
    <text x="22" y="64" class="h" fill="#173a36">推导：它跟上了</text>
    <text x="22" y="92" class="row" fill="#3f554f">每次调用都从对象生成。</text>
    <text x="22" y="112" class="row" fill="#3f554f">这份 diff 就是全部审阅。</text>
    <text x="22" y="134" class="sub" fill="#657872">7 个面 · 0 处编辑</text>
  </g>

  <!-- right: pinned -->
  <g transform="translate(812 96)">
    <rect width="328" height="150" rx="14" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="22" y="34" class="kicker" fill="#a35a1f">写明了字段</text>
    <text x="22" y="64" class="h" fill="#173a36">钉死：它没动</text>
    <text x="22" y="92" class="row" fill="#3f554f">逐字段的一次编写决定。</text>
    <text x="22" y="112" class="row" fill="#3f554f">原样未动；该不该动，</text>
    <text x="22" y="134" class="sub" fill="#657872">由审阅者判断 · 4 个投影</text>
  </g>

  <!-- left rows -->
  <g transform="translate(60 270)">
    <rect width="540" height="356" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="22" y="30" class="kicker" fill="#2a7468">之前 → 之后，实测</text>
    <line x1="22" y1="44" x2="518" y2="44" stroke="#e3ece8"/>

    <text x="22" y="72" class="row" fill="#173a36">SQLite 表 todo_task（PRAGMA table_info）</text>
    <text x="518" y="72" class="num" text-anchor="end" fill="#2a7468">27 → 28 列</text>
    <text x="22" y="90" class="sub" fill="#657872">budget float，由只做加法的同步加到已有的表上</text>

    <text x="22" y="120" class="row" fill="#173a36">GET /api/v1/data/todo_task</text>
    <text x="518" y="120" class="num" text-anchor="end" fill="#2a7468">27 → 28 个键</text>

    <text x="22" y="152" class="row" fill="#173a36">POST /api/v1/data/todo_task，带 budget: 1200</text>
    <text x="518" y="152" class="num" text-anchor="end" fill="#2a7468">400 → 201</text>
    <text x="22" y="170" class="sub" fill="#657872">之前：Unknown field 'budget' on object 'todo_task'（INVALID_FIELD）</text>

    <text x="22" y="200" class="row" fill="#173a36">GET /api/v1/meta/object/todo_task</text>
    <text x="518" y="200" class="num" text-anchor="end" fill="#2a7468">27 → 28 个字段</text>

    <text x="22" y="232" class="row" fill="#173a36">MCP describe_object</text>
    <text x="518" y="232" class="num" text-anchor="end" fill="#2a7468">19 → 20 个字段</text>

    <text x="22" y="264" class="row" fill="#173a36">MCP query_records，where budget ≥ 1000</text>
    <text x="518" y="264" class="num" text-anchor="end" fill="#2a7468">1 条记录，1200</text>

    <text x="22" y="296" class="row" fill="#173a36">控制台新建表单（未声明表单视图）</text>
    <text x="518" y="296" class="num" text-anchor="end" fill="#2a7468">16 → 17 个输入项</text>
    <text x="22" y="314" class="sub" fill="#657872">Budget 按声明顺序排在 Actual Hours 和 Notes 之间</text>

    <text x="22" y="340" class="sub" fill="#657872">按设计不变、也不是投影：OpenAPI（14 条路径）、MCP tools/list（12 个工具）</text>
  </g>

  <!-- right rows -->
  <g transform="translate(624 270)">
    <rect width="516" height="356" rx="14" fill="#ffffff" stroke="#e6d3b6"/>
    <text x="22" y="30" class="kicker" fill="#a35a1f">原样，没有变化</text>
    <line x1="22" y1="44" x2="494" y2="44" stroke="#f0e4d2"/>

    <text x="22" y="72" class="row" fill="#173a36">todo_task.default — All Tasks</text>
    <text x="494" y="72" class="num" text-anchor="end" fill="#a35a1f">6 列</text>
    <text x="22" y="90" class="mono" fill="#657872">columns: [{ field: 'subject' }, { field: 'status' }, …]</text>

    <text x="22" y="120" class="row" fill="#173a36">todo_task.overdue · todo_task.due_today</text>
    <text x="494" y="120" class="num" text-anchor="end" fill="#a35a1f">5 + 5 列</text>

    <text x="22" y="152" class="row" fill="#173a36">数据集 task_metrics（供给仪表盘）</text>
    <text x="494" y="152" class="num" text-anchor="end" fill="#a35a1f">3 个度量</text>
    <text x="22" y="170" class="mono" fill="#657872">measures: [{ name: 'est_hours', field: 'estimated_hours' }, …]</text>

    <text x="22" y="200" class="row" fill="#173a36">翻译包，zh-CN</text>
    <text x="494" y="200" class="num" text-anchor="end" fill="#a35a1f">19 个标签</text>
    <text x="22" y="218" class="mono" fill="#657872">budget → "Budget"（回落到声明的标签）</text>

    <text x="22" y="254" class="note" fill="#3f554f">每一个都写明了字段名，所以每一个都是</text>
    <text x="22" y="272" class="note" fill="#3f554f">运行时原样兑现的一个决定。审阅者问的是</text>
    <text x="22" y="290" class="note" fill="#3f554f">门禁的那个问题：这个字段该不该有消费者，</text>
    <text x="22" y="308" class="note" fill="#3f554f">是哪一个？</text>

    <text x="22" y="340" class="sub" fill="#657872">删除不同：同步从不删列，所以数据表会以漂移的形式滞后</text>
  </g>

  <!-- gate band -->
  <g transform="translate(60 650)">
    <rect width="1080" height="70" rx="12" fill="#fff7ea" stroke="#e6d3b6"/>
    <text x="22" y="28" class="kicker" fill="#a35a1f">门禁在启动前就说了 · os dev --compile，49 条编写期规则</text>
    <text x="22" y="52" class="mono" fill="#5a4630">⚠ object "todo_task" · field "budget": declared, but nothing in this stack displays or reads it (inert) — rule: field-no-consumers</text>
  </g>
</svg>
