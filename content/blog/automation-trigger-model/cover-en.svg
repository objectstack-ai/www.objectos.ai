<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A flow listed as active and bound to nothing, beside the four trigger types an ObjectStack engine resolves">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7faf8"/>
      <stop offset=".6" stop-color="#eef6f1"/>
      <stop offset="1" stop-color="#fdf1e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:17px;font-weight:720}
      .soft{font-size:13px;fill:#647872}.mono{font-family:ui-monospace,Menlo,monospace}
      .invert{fill:#eafff6}.warn{font-size:14px;font-weight:650;fill:#9a3b1f}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="80" font-size="33" font-weight="780">Active. Published. Wired to nothing.</text>
  <text x="96" y="115" class="tiny">Four trigger types, one non-trigger, and one build gate that refuses the fifth thing people write.</text>

  <!-- the status row -->
  <g transform="translate(96 152)" filter="url(#shadow)">
    <rect width="1008" height="104" rx="18" fill="#fffefa" stroke="#dbe5df"/>
    <g transform="translate(28 30)">
      <rect width="96" height="32" rx="10" fill="#1f6b4a"/>
      <text x="48" y="22" text-anchor="middle" class="invert" font-size="14" font-weight="700">active</text>
    </g>
    <text x="146" y="52" class="mono" font-size="16" font-weight="700">renewal_notice</text>
    <text x="146" y="74" class="soft">listed by the metadata API · build passes · zero runs, ever</text>
    <g transform="translate(700 26)">
      <rect width="128" height="40" rx="12" fill="#fdece4" stroke="#e6b3a9"/>
      <text x="64" y="26" text-anchor="middle" class="warn">bound: false</text>
    </g>
    <text x="852" y="52" class="mono" font-size="13" fill="#647872">triggerType:</text>
    <text x="852" y="72" class="mono" font-size="13" fill="#9a3b1f">'onCreate'</text>
  </g>

  <!-- resolution -->
  <g transform="translate(96 300)">
    <text x="0" y="0" class="label">What the engine will resolve</text>
    <g transform="translate(0 24)" filter="url(#shadow)">
      <rect width="612" height="286" rx="26" fill="#fffefa" stroke="#d8dfd6"/>

      <g transform="translate(34 34)">
        <rect width="252" height="72" rx="18" fill="#eef7f3" stroke="#bdd7cf"/>
        <text x="20" y="30" class="label">Record change</text>
        <text x="20" y="53" class="mono" font-size="12" fill="#647872">record-after-update</text>

        <rect y="94" width="252" height="72" rx="18" fill="#fff3d6" stroke="#efc86c"/>
        <text x="20" y="124" class="label">Time-relative</text>
        <text x="20" y="147" class="mono" font-size="12" fill="#647872">offsetDays: [60, 30, 7]</text>

        <rect y="188" width="252" height="64" rx="18" fill="#f2f0fb" stroke="#c9c2e6"/>
        <text x="20" y="216" class="label">Schedule</text>
        <text x="20" y="238" class="mono" font-size="12" fill="#647872">cron · interval · once</text>
      </g>

      <g transform="translate(320 34)">
        <rect width="252" height="72" rx="18" fill="#edf2ff" stroke="#bdc8ee"/>
        <text x="20" y="30" class="label">Inbound API</text>
        <text x="20" y="53" class="mono" font-size="12" fill="#647872">POST /automation/hooks</text>

        <rect y="94" width="252" height="72" rx="18" fill="#f4f6f5" stroke="#cfd8d3" stroke-dasharray="6 5"/>
        <text x="20" y="124" class="label">Button (no trigger)</text>
        <text x="20" y="147" class="soft">invoked, not triggered</text>

        <rect y="188" width="252" height="64" rx="18" fill="#fdece4" stroke="#e6b3a9"/>
        <text x="20" y="214" class="warn">Anything else</text>
        <text x="20" y="236" class="soft">refused at build, not at 3am</text>
      </g>
    </g>
  </g>

  <!-- what stays shared -->
  <g transform="translate(756 300)">
    <text x="0" y="0" class="label">What stays shared</text>
    <g transform="translate(0 24)" filter="url(#shadow)">
      <rect width="348" height="286" rx="26" fill="#173a36"/>
      <text x="30" y="48" class="invert" font-size="18" font-weight="760">One flow runtime</text>
      <g fill="#a8cdc2" font-size="14">
        <text x="30" y="92" style="fill:#a8cdc2">One condition gate — the engine owns it</text>
        <text x="30" y="126" style="fill:#a8cdc2">One action and approval vocabulary</text>
        <text x="30" y="160" style="fill:#a8cdc2">One identity rule: runAs, declared</text>
        <text x="30" y="194" style="fill:#a8cdc2">One run row, trigger stamped on it</text>
      </g>
      <rect x="30" y="218" width="288" height="42" rx="12" fill="#215c50"/>
      <text x="174" y="245" text-anchor="middle" class="invert" font-size="14" font-weight="650">Entry points multiply. This does not.</text>
    </g>
  </g>
</svg>
