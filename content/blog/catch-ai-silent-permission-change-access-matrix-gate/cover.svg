<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="在上线之前抓住 AI 悄悄改掉的权限：一处改动把 crm_opportunity 的 allowDelete 从 false 改成 true；os validate 通过且没有任何发现；os compile 构建失败，打印 'crm_sales_user' gains delete on 'crm_opportunity'，直到有人重新生成快照；CRM 示例已提交的访问矩阵共有七条记录">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .eyebrow{font-size:14px;font-weight:780;letter-spacing:.08em;fill:#2a7468}
      .title{font-size:48px;font-weight:800}
      .lead{font-size:19px;fill:#3f554f}
      .num{font-size:44px;font-weight:800;fill:#2a7468}
      .label{font-size:19px;font-weight:760}
      .label2{font-size:17px;font-weight:760}
      .small{font-size:13px;fill:#4b5d56}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;fill:#173a36}
      .ok{fill:#2a7468}
      .bad{fill:#a8432c}
      .foot{font-size:13px;fill:#4b5d56}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="118" class="eyebrow">访问矩阵快照门禁 · @OBJECTSTACK/CLI 18.2.0</text>
  <text x="78" y="186" class="title">上线之前，抓住</text>
  <text x="78" y="244" class="title">AI 悄悄改掉的</text>
  <text x="78" y="302" class="title">那一条权限。</text>
  <text x="78" y="354" class="lead">一处改动。os validate：通过，没有任何发现。</text>
  <text x="78" y="380" class="lead">os compile：构建失败，并打印出</text>
  <text x="78" y="406" class="lead">评审人需要签字的那一行。</text>
  <text x="78" y="458" class="small">矩阵报告的是有效能力，不是原始标志位：</text>
  <text x="78" y="476" class="small">权限集到底能做什么，连同对象的记录基线写在同一行。</text>

  <g transform="translate(650 112)" filter="url(#shadow)">
    <rect width="472" height="456" rx="28" fill="#fffefa" stroke="#d8dfd6"/>

    <g transform="translate(28 30)">
      <rect width="416" height="88" rx="16" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="20" y="34" class="label">1 处改动，一个词</text>
      <text x="20" y="60" class="mono">crm_opportunity: { …, allowDelete: false → true }</text>
      <text x="20" y="78" class="small">CRM 示例 src/security/sales-positions.ts 第 50 行</text>
    </g>

    <g transform="translate(28 130)">
      <rect width="416" height="88" rx="16" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="20" y="34" class="label ok">✓ os validate：通过，exit 0</text>
      <text x="20" y="60" class="small">跑了 53 条作者期规则，没有一条读取 allowDelete 的值；</text>
      <text x="20" y="78" class="small">两个值都合法、都可执行。没有任何发现。</text>
    </g>

    <g transform="translate(28 230)">
      <rect width="416" height="112" rx="16" fill="#fbeeea" stroke="#e5c4bb"/>
      <text x="20" y="34" class="label bad">✗ os compile：构建失败，exit 1</text>
      <text x="20" y="60" class="mono">Access matrix drift (1 change)</text>
      <text x="20" y="78" class="mono">• 'crm_sales_user' gains delete on 'crm_opportunity'</text>
      <text x="20" y="100" class="small">直到有人重新生成快照，并把它的 diff 提交进去</text>
    </g>

    <g transform="translate(28 354)">
      <rect width="416" height="74" rx="16" fill="#ffffff" stroke="#c9d8d1"/>
      <text x="20" y="50" class="num">7</text>
      <text x="62" y="32" class="label2">条记录，就是已提交的整张矩阵</text>
      <text x="62" y="54" class="small">CRM 声明的每一项授权，排成一张有序的表</text>
    </g>
  </g>

  <text x="78" y="630" class="foot">在 @objectstack/cli 18.2.0 自带的 CRM 示例上实测——这正是 npm create objectstack@latest 安装的版本。</text>
</svg>
