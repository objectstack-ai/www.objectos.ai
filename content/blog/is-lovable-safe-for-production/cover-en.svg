<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="It works is not the same as it is safe">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fbf3f1"/>
      <stop offset="1" stop-color="#f6eef7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#3a2330" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#2c1f29}.title{font-size:46px;font-weight:780}.sub{font-size:20px;fill:#6e5d68}.label{font-size:20px;font-weight:720}.tiny{font-size:15px;fill:#6e5d68}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#9a6b8a}.ok{fill:#1d7a5f}.warn{fill:#c0392b}.invert{fill:#f6eaf0}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="86" y="96" class="title">"It works" ≠ "It's safe"</text>
  <text x="86" y="134" class="sub">When the builder can't read the access control, who can vouch for it?</text>

  <g transform="translate(86 182)" filter="url(#shadow)">
    <rect width="430" height="410" rx="28" fill="#ffffff" stroke="#ecdfe6"/>
    <text x="34" y="54" class="label">What you see <tspan class="ok">✓</tspan></text>
    <rect x="34" y="78" width="362" height="48" rx="12" fill="#f3e9f0"/>
    <text x="52" y="108" class="tiny">Polished UI, login, Stripe</text>
    <rect x="34" y="138" width="170" height="120" rx="14" fill="#efe6ee"/>
    <rect x="216" y="138" width="180" height="56" rx="12" fill="#efe6ee"/>
    <rect x="216" y="202" width="180" height="56" rx="12" fill="#efe6ee"/>
    <rect x="34" y="276" width="362" height="48" rx="12" fill="#e9f6f0"/>
    <text x="52" y="306" class="tiny" style="fill:#1d7a5f">The demo dazzles. The buttons work.</text>
    <text x="34" y="364" class="tiny">Shipped by someone who doesn't read SQL.</text>
  </g>

  <g transform="translate(560 182)" filter="url(#shadow)">
    <rect width="554" height="410" rx="28" fill="#2c1f29"/>
    <text x="34" y="54" class="invert" font-size="20" font-weight="760">What you can't see ✗</text>
    <rect x="34" y="78" width="486" height="92" rx="12" fill="#3a2a36"/>
    <text x="50" y="108" class="mono">create policy "read" on customers</text>
    <text x="50" y="130" class="mono">  for select using ( true );  -- ?</text>
    <text x="50" y="156" class="mono">-- who can actually read row X?</text>
    <text x="34" y="214" class="invert" style="fill:#e8758a" font-size="58" font-weight="800">170+</text>
    <text x="210" y="200" class="invert" font-size="17">Lovable apps exposed via</text>
    <text x="210" y="226" class="invert" font-size="17">broken row-level security</text>
    <text x="210" y="250" class="tiny" style="fill:#c98ba8">CVE-2025-48757</text>
    <line x1="34" y1="284" x2="520" y2="284" stroke="#4a3744"/>
    <text x="34" y="324" class="invert" font-size="16">In a 4,000-app scan:</text>
    <text x="34" y="356" class="warn" style="fill:#e8758a" font-size="16">175 leaking live PII · 400+ exposed secrets</text>
    <text x="34" y="384" class="tiny" style="fill:#c98ba8">The scanner checks if a policy exists — not if it works.</text>
  </g>
</svg>
