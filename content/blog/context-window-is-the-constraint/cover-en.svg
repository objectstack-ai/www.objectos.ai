    <text x="126" y="604" font-size="13" font-weight="700" fill="#1c7a55" text-anchor="start">Context window</text>
    <text x="558" y="604" font-size="13" font-weight="600" fill="#b4553f" text-anchor="end">Read what it can, miss the rest</text>
    <rect x="612" y="290" width="492" height="326" rx="18" fill="#22433d"/>
    <text x="642" y="334" font-size="21" font-weight="760" fill="#eafff6" text-anchor="start">One ontology</text>
    <text x="642" y="362" font-size="15" font-weight="400" fill="#a8cdc2" text-anchor="start">The whole system, read in one pass.</text>
