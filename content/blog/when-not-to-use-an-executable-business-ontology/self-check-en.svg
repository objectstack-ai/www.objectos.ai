<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="The self-check in two stages: five exclusions, where any yes means the ontology is not the tool for that part; then the five questions before you start; and three verdicts.">
  <desc>Stage one, five exclusions: is the hard part a ledger, consolidation, tax or payroll calculation a packaged system already encodes, then the packaged system, build around it; does most of the value come from reading and writing systems you will keep and do not own, then a layer over them, federate read-only at most; is the data at rest in a lake or warehouse rather than the application's own records, then the warehouse stack; is the core a solver, an optimiser, a simulation or an interface unlike any business app, then code, behind a script action at most; must it run on a platform holding a named certification with no budget to certify your own, then a certified platform or an audit you own. Stage two, the five questions before you start: what we have, how it relates, what can be done, who may do it, what happens when. Three verdicts: five noes and five answers is a fit, a day's work because an agent does the writing; any yes in stage one splits the workload on that line; noes without answers means no tool helps yet, answer the five questions first and install nothing.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="60" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#2a7468">THE SELF-CHECK</text>
  <text x="60" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#173a36">Ten questions, two stages</text>

  <g transform="translate(60 104)">
    <rect width="520" height="470" rx="20" fill="#fffefa" stroke="#d8dfd6"/>
    <path d="M20 0h480a20 20 0 0 1 20 20v46H0V20A20 20 0 0 1 20 0z" fill="#a35a1f"/>
    <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#ffffff">STAGE ONE · ANY YES: NOT THE TOOL FOR THAT PART</text>
    <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#ffffff">Five exclusions</text>

    <circle cx="40" cy="104" r="14" fill="#9b2f2a"/>
    <text x="40" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="66" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#173a36">Is the hard part a ledger, consolidation, tax or payroll</text>
    <text x="66" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#173a36">calculation a packaged system already encodes?</text>
    <text x="66" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a35a1f">→ the packaged system; build around it</text>

    <circle cx="40" cy="182" r="14" fill="#9b2f2a"/>
    <text x="40" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="66" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#173a36">Does most of the value come from reading and writing</text>
    <text x="66" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#173a36">systems you will keep and do not own?</text>
    <text x="66" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a35a1f">→ a layer over them; federate read-only at most</text>

    <circle cx="40" cy="260" r="14" fill="#9b2f2a"/>
    <text x="40" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="66" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#173a36">Is the data you want to analyse at rest in a lake or</text>
    <text x="66" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#173a36">warehouse, not in the application's own records?</text>
    <text x="66" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a35a1f">→ the warehouse stack: engine, metric layer, BI</text>

    <circle cx="40" cy="338" r="14" fill="#9b2f2a"/>
    <text x="40" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
    <text x="66" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#173a36">Is the core a solver, an optimiser, a simulation, or</text>
    <text x="66" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#173a36">an interface unlike any business app?</text>
    <text x="66" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a35a1f">→ code; behind a script action at most</text>

    <circle cx="40" cy="416" r="14" fill="#9b2f2a"/>
    <text x="40" y="421" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
    <text x="66" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#173a36">Must it run on a platform that holds a named</text>
    <text x="66" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#173a36">certification, with no budget to certify your own?</text>
    <text x="66" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a35a1f">→ a certified platform, or an audit you own</text>
  </g>

  <g transform="translate(620 104)">
    <rect width="520" height="470" rx="20" fill="#fffefa" stroke="#d8dfd6"/>
    <path d="M20 0h480a20 20 0 0 1 20 20v46H0V20A20 20 0 0 1 20 0z" fill="#2a7468"/>
    <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#ffffff">STAGE TWO · CAN THE TEAM ANSWER THESE TODAY?</text>
    <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#ffffff">Five questions before you start</text>

    <circle cx="40" cy="104" r="14" fill="#2a7468"/>
    <text x="40" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
    <text x="66" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#173a36">What we have</text>
    <text x="66" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4f625c">the objects and their fields</text>

    <circle cx="40" cy="182" r="14" fill="#2a7468"/>
    <text x="40" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">7</text>
    <text x="66" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#173a36">How it relates</text>
    <text x="66" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4f625c">the lookups and master-detail links between them</text>

    <circle cx="40" cy="260" r="14" fill="#2a7468"/>
    <text x="40" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">8</text>
    <text x="66" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#173a36">What can be done</text>
    <text x="66" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4f625c">the actions a user or an agent may take on a record</text>

    <circle cx="40" cy="338" r="14" fill="#2a7468"/>
    <text x="40" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">9</text>
    <text x="66" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#173a36">Who may do it</text>
    <text x="66" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4f625c">permission sets, row-level and field-level security, sharing</text>

    <circle cx="40" cy="416" r="14" fill="#2a7468"/>
    <text x="40" y="421" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">10</text>
    <text x="66" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#173a36">What happens when</text>
    <text x="66" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4f625c">record triggers, scheduled jobs, approvals, workflows</text>
  </g>

  <g transform="translate(60 600)">
    <rect width="348" height="112" rx="16" fill="#173a36"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Five noes + five answers</text>
    <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#d6e7e1">A fit. The ontology is a day's work,</text>
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#d6e7e1">because an agent does the writing.</text>
  </g>
  <g transform="translate(426 600)">
    <rect width="348" height="112" rx="16" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#a35a1f">Any yes in stage one</text>
    <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a35a1f">Split the workload on that line and use</text>
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a35a1f">the table's alternative for the rest.</text>
  </g>
  <g transform="translate(792 600)">
    <rect width="348" height="112" rx="16" fill="#eef1f8" stroke="#c7cde0"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#3d4f7c">Noes, but no answers</text>
    <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#3d4f7c">No tool helps yet. Answer the five</text>
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#3d4f7c">questions first; install nothing.</text>
  </g>

  <text x="60" y="745" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4f625c">Stage one from when-to-use.mdx, Not a fit today; stage two from its Five questions before you start. objectstack origin/main 43567a8f, 2026-10-16.</text>
</svg>
