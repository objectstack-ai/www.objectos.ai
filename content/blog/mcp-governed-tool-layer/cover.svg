<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="多个 agent 通过 MCP 连接，背后是裸接口还是受治理的工具层">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:14px}
      .warn{font-size:14px;font-weight:650;fill:#9a3b1f}.ok{font-size:14px;font-weight:650;fill:#1f6b4a}.mono{font-family:ui-monospace,Menlo,monospace}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="78" font-size="34" font-weight="780">MCP 装上一万台服务器之后</text>
  <text x="96" y="113" class="tiny">协议已经标准化了——可它背后接的，是裸接口，还是一个受治理的工具层？</text>

  <!-- agents -->
  <g transform="translate(120 168)">
    <g font-size="15">
      <rect width="150" height="44" rx="12" fill="#22433d"/><text x="40" y="29" class="invert">Agent</text>
      <rect y="58" width="150" height="44" rx="12" fill="#22433d"/><text x="40" y="87" class="invert">Agent</text>
      <rect y="116" width="150" height="44" rx="12" fill="#22433d"/><text x="40" y="145" class="invert">Agent</text>
    </g>
  </g>

  <!-- MCP bus -->
  <g transform="translate(300 168)">
    <rect width="84" height="160" rx="14" fill="#e8b04b"/>
    <text x="42" y="74" text-anchor="middle" font-size="18" font-weight="780" fill="#22433d" class="mono">MCP</text>
    <text x="42" y="98" text-anchor="middle" font-size="12" fill="#7a5510">/ A2A</text>
    <g stroke="#bfa15a" stroke-width="3"><path d="M-30 22 h30"/><path d="M-30 80 h30"/><path d="M-30 138 h30"/></g>
    <path d="M84 80 h36" stroke="#bfa15a" stroke-width="3"/>
  </g>

  <!-- two backends -->
  <g transform="translate(430 152)" filter="url(#shadow)">
    <rect width="320" height="180" rx="18" fill="#fbece6"/>
    <text x="28" y="44" class="label" fill="#9a3b1f">裸接口直连</text>
    <text x="28" y="70" class="warn">数据库 · REST · 没有身份</text>
    <g class="warn" font-size="13">
      <text x="28" y="104">✗ 无权限边界</text>
      <text x="28" y="128">✗ 无审计留痕</text>
      <text x="28" y="152">✗ agent ≈ 超级用户</text>
    </g>
  </g>
  <g transform="translate(770 152)" filter="url(#shadow)">
    <rect width="334" height="180" rx="18" fill="#22433d"/>
    <text x="28" y="44" class="label invert">受治理的工具层</text>
    <text x="28" y="70" class="soft" fill="#a9c4ba">每次调用都带身份、权限、留痕</text>
    <g class="invert" font-size="13">
      <text x="28" y="104">✓ 以登录用户身份行动</text>
      <text x="28" y="128">✓ 运行时强制权限</text>
      <text x="28" y="152">✓ 人与 agent 共用一本账</text>
    </g>
  </g>

  <!-- runtime + data -->
  <g transform="translate(430 372)">
    <rect width="674" height="92" rx="16" fill="#eef7f1"/>
    <text x="28" y="42" class="label">ObjectOS 运行时</text>
    <text x="28" y="70" class="soft">对象 · 关系 · 权限 · 流程 · 审计——跑在你自己的服务器上</text>
    <g transform="translate(560 24)"><rect width="86" height="44" rx="10" fill="#22433d"/><text x="20" y="29" class="invert" font-size="14">你的数据</text></g>
  </g>
  <g stroke="#7fae9f" stroke-width="2.5" fill="none">
    <path d="M590 332 v40"/>
    <path d="M937 332 v40"/>
  </g>
</svg>
