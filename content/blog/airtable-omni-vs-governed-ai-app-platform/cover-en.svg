<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A reviewed diff versus an undo button">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7faf6"/>
      <stop offset="1" stop-color="#fff2dd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.title{font-size:46px;font-weight:780}.sub{font-size:20px;fill:#5d736b}.label{font-size:20px;font-weight:720}.tiny{font-size:15px;fill:#5d736b}.invert{fill:#eafff6}.soft{fill:#abd1c5}.add{fill:#2a7468}.del{fill:#d96b5f}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="86" y="96" class="title">A diff, not an undo button</text>
  <text x="86" y="132" class="sub">Govern what the AI changed — before it ships, not after</text>

  <g transform="translate(86 184)" filter="url(#shadow)">
    <rect width="470" height="404" rx="28" fill="#fffefa" stroke="#d9dfd6"/>
    <text x="36" y="58" class="label">Undo (after the fact)</text>
    <rect x="36" y="84" width="398" height="40" rx="12" fill="#f5efe6"/>
    <text x="52" y="110" class="tiny">App is already live</text>
    <rect x="36" y="136" width="398" height="40" rx="12" fill="#f5efe6"/>
    <text x="52" y="162" class="tiny">Checklist of steps taken</text>
    <g transform="translate(36 210)">
      <rect width="170" height="56" rx="28" fill="#173a36"/>
      <text x="48" y="36" class="invert" font-size="18" font-weight="720">↶ Undo</text>
    </g>
    <text x="36" y="318" class="tiny">No reviewed change.</text>
    <text x="36" y="344" class="tiny">No approval record.</text>
    <text x="36" y="370" class="tiny">Someone has to notice.</text>
  </g>

  <g transform="translate(644 184)" filter="url(#shadow)">
    <rect width="470" height="404" rx="28" fill="#173a36"/>
    <text x="36" y="58" class="invert" font-size="20" font-weight="760">Review the diff → Approve</text>
    <rect x="36" y="86" width="398" height="38" rx="10" fill="#0f2c28"/>
    <text x="52" y="111" class="add" font-size="15">+ field: renewal_risk (sensitive)</text>
    <rect x="36" y="132" width="398" height="38" rx="10" fill="#0f2c28"/>
    <text x="52" y="157" class="add" font-size="15">+ permission: CSM can edit</text>
    <rect x="36" y="178" width="398" height="38" rx="10" fill="#0f2c28"/>
    <text x="52" y="203" class="del" font-size="15">~ automation: weekly reminder</text>
    <g transform="translate(36 244)">
      <rect width="210" height="56" rx="28" fill="#f3c66d"/>
      <text x="40" y="36" font-size="18" font-weight="740">✓ Approve change</text>
    </g>
    <text x="36" y="344" class="soft" font-size="15">Runtime enforces object/field/action.</text>
    <text x="36" y="370" class="soft" font-size="15">Audited. Self-hostable. Reversible.</text>
  </g>
</svg>
