<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="是什么让业务应用 AI 可编写？类型、验证、审查、治理：Agent 与用户之间的四道门禁，旁边是 ObjectStack 17.7.0 上验证门禁的一次真实运行——三个故意犯的错被带着规则 id 定位到位地拒收，修好后的应用通过了 49 条规则">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7f8fb"/>
      <stop offset=".6" stop-color="#eef1f7"/>
      <stop offset="1" stop-color="#fdf3e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1b2a41" flood-opacity=".14"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1b2a41}
      .eyebrow{font-size:14px;font-weight:780;letter-spacing:.08em;fill:#2f4bb8}
      .title{font-size:52px;font-weight:800}
      .lead{font-size:18px;fill:#4a5a70}
      .chip{font-size:14px;font-weight:760}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#5b6a7c}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600}
      .small{font-size:13px;fill:#5b6a7c}
      .foot{font-size:13px;fill:#5b6a7c}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="112" class="eyebrow">AI 可编写的检验标准</text>
  <text x="78" y="170" class="title">是什么让</text>
  <text x="78" y="228" class="title">业务应用</text>
  <text x="78" y="286" class="title">AI 可编写？</text>
  <text x="78" y="334" class="lead">Agent 与用户之间隔着四道门禁。</text>
  <text x="78" y="358" class="lead">每一道都是一个错误</text>
  <text x="78" y="382" class="lead">在上线之前死掉的地方。</text>

  <g transform="translate(78 416)"><rect width="76" height="36" rx="18" fill="#e8edfb" stroke="#8ea3e6"/><text x="38" y="24" class="chip" text-anchor="middle" style="fill:#2f4bb8">类型</text></g>
  <g transform="translate(164 416)"><rect width="76" height="36" rx="18" fill="#e6f4f1" stroke="#8fcdc0"/><text x="38" y="24" class="chip" text-anchor="middle" style="fill:#176a5c">验证</text></g>
  <g transform="translate(250 416)"><rect width="76" height="36" rx="18" fill="#fdf1e3" stroke="#e9c48f"/><text x="38" y="24" class="chip" text-anchor="middle" style="fill:#8a4f0c">审查</text></g>
  <g transform="translate(336 416)"><rect width="76" height="36" rx="18" fill="#eeeef5" stroke="#b9b9d3"/><text x="38" y="24" class="chip" text-anchor="middle" style="fill:#4b4a7a">治理</text></g>

  <g transform="translate(650 112)" filter="url(#shadow)">
    <rect width="472" height="456" rx="24" fill="#ffffff" stroke="#d6dbe6"/>
    <rect x="0" y="22" width="472" height="26" fill="#f1f3f8"/>
    <rect x="0" y="0" width="472" height="48" rx="24" fill="#f1f3f8"/>
    <text x="24" y="30" class="mono" style="fill:#4a5a70">$ npm run validate</text>
    <text x="448" y="30" class="cap" text-anchor="end">17.7.0 · 49 条规则</text>

    <g transform="translate(24 66)">
      <rect width="424" height="84" rx="14" fill="#fff5f4" stroke="#efc6c2"/>
      <text x="18" y="30" class="mono" style="fill:#b3433a">✗ expression-invalid</text>
      <text x="18" y="52" class="small">谓词里的裸引用 status</text>
      <text x="18" y="70" class="small">会把 Resolve 藏在每一张工单上</text>
    </g>
    <g transform="translate(24 162)">
      <rect width="424" height="84" rx="14" fill="#fff5f4" stroke="#efc6c2"/>
      <text x="18" y="30" class="mono" style="fill:#b3433a">✗ action-name-undefined</text>
      <text x="18" y="52" class="small">rowActions 指向一个不存在的动作</text>
      <text x="18" y="70" class="small">一个渲染出来、点了却什么也不做的按钮</text>
    </g>
    <g transform="translate(24 258)">
      <rect width="424" height="84" rx="14" fill="#fff5f4" stroke="#efc6c2"/>
      <text x="18" y="30" class="mono" style="fill:#b3433a">✗ security-owd-unset</text>
      <text x="18" y="52" class="small">对象上没有 sharingModel</text>
      <text x="18" y="70" class="small">安全基线成了一次意外</text>
    </g>
    <g transform="translate(24 354)">
      <rect width="424" height="78" rx="14" fill="#e6f4f1" stroke="#8fcdc0"/>
      <text x="18" y="30" class="mono" style="fill:#176a5c">✓ Validation passed (240ms)</text>
      <text x="18" y="52" class="small">三处修好之后：同样的 49 条规则，</text>
      <text x="18" y="70" class="small">2 个对象 · 1 个动作 · 1 个视图 · 1 个权限集</text>
    </g>
  </g>

  <text x="78" y="612" class="foot">ObjectStack 17.7.0 上的一次真实运行：三个故意犯的错、三条定位到位的报错，然后一次干净通过。</text>
</svg>
