<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The FDE trap: Palantir earned about 1.01 million dollars of revenue per employee in FY2025 while Accenture earned about 89 thousand, an eleven times gap between two businesses that both embed engineers inside customers">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <linearGradient id="barGood" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#24342f" flood-opacity=".14"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}
      .soft{fill:#5d736b;font-size:15px}
      .label{font-size:19px;font-weight:720}
      .num{font-size:30px;font-weight:800}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="84" font-size="40" font-weight="800">The FDE trap</text>
  <text x="96" y="120" class="tiny">Both businesses embed engineers inside customers. One earns roughly 11&#215; more revenue per employee.</text>
  <text x="96" y="146" class="tiny">The gap is not the role &#8212; it is the substrate the role writes into.</text>

  <!-- panel -->
  <rect x="96" y="188" width="1008" height="330" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <text x="128" y="228" class="soft mono">FY2025 &#183; revenue &#247; employees, from each company&#8217;s annual filing</text>

  <!-- Palantir row -->
  <text x="128" y="292" class="label">Palantir</text>
  <text x="128" y="315" class="soft">$4.475B revenue &#183; 4,429 employees</text>
  <rect x="360" y="266" width="530" height="42" rx="8" fill="url(#barGood)"/>
  <text x="906" y="296" class="num" fill="#0f766e">~$1.01M</text>

  <!-- Accenture row -->
  <text x="128" y="410" class="label">Accenture</text>
  <text x="128" y="433" class="soft">$69.7B revenue &#183; ~779,000 employees</text>
  <rect x="360" y="384" width="47" height="42" rx="8" fill="#c2603f"/>
  <text x="423" y="414" class="num" fill="#a04b2e">~$89K</text>

  <!-- gap bracket -->
  <line x1="360" y1="330" x2="360" y2="372" stroke="#c7d6cf" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="890" y1="330" x2="890" y2="372" stroke="#c7d6cf" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="625" y="356" text-anchor="middle" class="soft" font-weight="700" fill="#173a36">11&#215; &#8212; same visible activity, different substrate</text>

  <text x="128" y="482" class="tiny">Revenue per employee is the cleanest public measure of whether deployment work compounds or is simply re-sold.</text>

  <text x="96" y="576" font-size="21" font-weight="740">Open-loop deployment</text>
  <text x="96" y="606" class="tiny">Forward-deployed work whose output terminates at the customer boundary, so deployment N+1</text>
  <text x="96" y="630" class="tiny">costs what deployment N cost. Its measurable signature is flat revenue per engineer.</text>
</svg>
