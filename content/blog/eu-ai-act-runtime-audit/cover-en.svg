<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Three audit questions and a runtime that can be signed off, over a 2026 compliance timeline">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:19px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:15px}.q{font-size:16px;fill:#2c4a43}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="78" font-size="32" font-weight="780">Is your AI runtime ready to be audited?</text>
  <text x="96" y="113" class="tiny">EU AI Act enforceable Aug 2026 · CADA proposed · the clock is running</text>

  <!-- timeline band -->
  <g transform="translate(96 150)">
    <line x1="0" y1="20" x2="1008" y2="20" stroke="#c4d3cc" stroke-width="3"/>
    <g text-anchor="middle">
      <circle cx="120" cy="20" r="9" fill="#7fae9f"/><text x="120" y="58" class="soft">2026·06 CADA proposed</text>
      <circle cx="540" cy="20" r="11" fill="#e8b04b"/><text x="540" y="58" class="soft" style="fill:#9a6212" font-weight="700">2026·08 enforcement</text>
      <circle cx="900" cy="20" r="9" fill="#7fae9f"/><text x="900" y="58" class="soft">penalties · sovereignty</text>
    </g>
  </g>

  <!-- Left: audit clipboard -->
  <g transform="translate(96 240)" filter="url(#shadow)">
    <rect width="500" height="360" rx="22" fill="#ffffff"/>
    <text x="36" y="56" class="label">The auditor asks three things</text>
    <g transform="translate(36 92)">
      <rect width="40" height="40" rx="10" fill="#fbece6"/><text x="11" y="29" font-size="22" fill="#9a3b1f">?</text>
      <text x="58" y="20" class="q">Is this data processed lawfully?</text>
      <text x="58" y="44" class="soft">Where it lives, who reads it, did it leave the EU</text>
    </g>
    <g transform="translate(36 168)">
      <rect width="40" height="40" rx="10" fill="#fbece6"/><text x="11" y="29" font-size="22" fill="#9a3b1f">?</text>
      <text x="58" y="20" class="q">Who authorized the AI to act?</text>
      <text x="58" y="44" class="soft">Change a discount, send a contract—on whose rights</text>
    </g>
    <g transform="translate(36 244)">
      <rect width="40" height="40" rx="10" fill="#fbece6"/><text x="11" y="29" font-size="22" fill="#9a3b1f">?</text>
      <text x="58" y="20" class="q">Was the AI's step recorded?</text>
      <text x="58" y="44" class="soft">Can you produce the full trail within 90 days</text>
    </g>
  </g>

  <!-- Right: a runtime that can sign off -->
  <g transform="translate(636 240)" filter="url(#shadow)">
    <rect width="468" height="360" rx="22" fill="#22433d"/>
    <text x="36" y="56" class="label invert">Governance lives in the runtime</text>
    <text x="36" y="84" class="soft" style="fill:#a9c4ba">Not in the prompt—a prompt can't be audited</text>
    <g transform="translate(36 112)" font-size="14">
      <rect width="396" height="40" rx="10" fill="#35564f"/><text x="18" y="26" class="invert">Permissions: enforced by the runtime, not prompts</text>
      <rect y="52" width="396" height="40" rx="10" fill="#35564f"/><text x="18" y="78" class="invert">Audit: humans and agents share one ledger</text>
      <rect y="104" width="396" height="40" rx="10" fill="#35564f"/><text x="18" y="130" class="invert">Data: runs on your own infrastructure</text>
    </g>
    <g transform="translate(300 270) rotate(-8)">
      <rect width="166" height="56" rx="12" fill="none" stroke="#e8b04b" stroke-width="3"/>
      <text x="20" y="37" font-size="20" font-weight="800" fill="#e8b04b">sign-off ✓</text>
    </g>
  </g>
</svg>
