<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="AI needs an ontology: closed platform versus open protocol">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24342f" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .small{font-size:22px;font-weight:650}.tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:15px}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="76" font-size="34" font-weight="780">AI needs an ontology</text>
  <text x="96" y="111" class="tiny">Two forms of the business semantic layer: locked in a platform, or written in your own repository</text>

  <!-- Left: closed platform -->
  <g transform="translate(86 168)" filter="url(#shadow)">
    <rect width="440" height="400" rx="22" fill="#ffffff"/>
    <text x="36" y="52" class="label">Closed platform</text>
    <text x="36" y="78" class="soft">Business definitions live in someone else's system</text>

    <rect x="36" y="104" width="368" height="232" rx="16" fill="#22433d"/>
    <text x="66" y="146" class="small invert">Ontology</text>
    <rect x="66" y="166" width="190" height="30" rx="8" fill="#35564f"/>
    <text x="80" y="187" font-size="15" class="invert">Objects · Relations · Permissions</text>
    <rect x="66" y="204" width="190" height="30" rx="8" fill="#35564f"/>
    <text x="80" y="225" font-size="15" class="invert">Actions · Flows · Audit</text>
    <!-- lock -->
    <g transform="translate(316 196)">
      <rect x="0" y="22" width="56" height="44" rx="10" fill="#e8b04b"/>
      <path d="M10 24 v-6 a18 18 0 0 1 36 0 v6" fill="none" stroke="#e8b04b" stroke-width="9"/>
      <circle cx="28" cy="42" r="6" fill="#22433d"/>
    </g>
    <text x="36" y="372" class="soft">Procurement to enter · Vendor-bound · Evolves by release</text>
  </g>

  <!-- Right: open protocol -->
  <g transform="translate(674 168)" filter="url(#shadow)">
    <rect width="440" height="400" rx="22" fill="#ffffff"/>
    <text x="36" y="52" class="label">Open protocol</text>
    <text x="36" y="78" class="soft">Business definitions are structured metadata in your repo</text>

    <g font-size="15">
      <rect x="36" y="100" width="170" height="44" rx="10" fill="#dff0e9"/>
      <text x="54" y="127">Objects &amp; relations</text>
      <rect x="222" y="100" width="182" height="44" rx="10" fill="#dff0e9"/>
      <text x="240" y="127">Permissions &amp; audit</text>
      <rect x="36" y="154" width="170" height="44" rx="10" fill="#dff0e9"/>
      <text x="54" y="181">Flows &amp; actions</text>
      <rect x="222" y="154" width="182" height="44" rx="10" fill="#dff0e9"/>
      <text x="240" y="181">API · UI · AI tools</text>
    </g>

    <!-- agents connecting -->
    <g stroke="#7fae9f" stroke-width="2.5" fill="none">
      <path d="M120 198 v44"/>
      <path d="M310 198 v44"/>
      <path d="M120 242 q100 56 190 0" opacity=".5"/>
    </g>
    <g font-size="15">
      <rect x="60" y="246" width="120" height="40" rx="20" fill="#22433d"/>
      <text x="84" y="271" class="invert">Agent A</text>
      <rect x="250" y="246" width="120" height="40" rx="20" fill="#22433d"/>
      <text x="274" y="271" class="invert">Agent B</text>
    </g>

    <text x="36" y="328" class="soft">Any agent can read the protocol and call governed tools</text>
    <text x="36" y="372" class="soft">One command to start · Your servers · Diffable, portable</text>
  </g>

  <!-- center arrow -->
  <g transform="translate(556 348)">
    <path d="M0 10 h66" stroke="#e8b04b" stroke-width="6" stroke-linecap="round"/>
    <path d="M58 -2 l16 12 -16 12" fill="none" stroke="#e8b04b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
