<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The ontology handover: when the forward-deployed engineer leaves, the ontology either stays locked in a platform or lives on as typed files in the client's repository">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24342f" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}
      .label{font-size:18px;font-weight:720}
      .soft{fill:#5d736b;font-size:15px}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
      .invert{fill:#eafff6}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="76" font-size="34" font-weight="780">The ontology handover</text>
  <text x="96" y="111" class="tiny">The forward-deployed engagement ends. Where the client&#8217;s ontology lives afterwards decides what it was worth.</text>

  <!-- timeline -->
  <line x1="96" y1="180" x2="1104" y2="180" stroke="#c7d6cf" stroke-width="2"/>
  <circle cx="200" cy="180" r="7" fill="#0f766e"/>
  <text x="200" y="215" text-anchor="middle" class="soft">FDE embeds</text>
  <circle cx="560" cy="180" r="7" fill="#0f766e"/>
  <text x="560" y="215" text-anchor="middle" class="soft">ontology modeled · app shipped</text>
  <circle cx="920" cy="180" r="7" fill="#b45309"/>
  <text x="920" y="215" text-anchor="middle" class="soft">FDE rolls off — the handover</text>

  <!-- outcome A: locked -->
  <rect x="96" y="270" width="470" height="230" rx="18" fill="#ffffff" stroke="#e2d6c3" stroke-width="2" filter="url(#shadow)"/>
  <text x="126" y="312" class="label">Outcome A — locked in a platform</text>
  <text x="126" y="345" class="soft">The ontology stays inside the vendor&#8217;s walls.</text>
  <text x="126" y="378" class="soft">&#8226; seats billed indefinitely</text>
  <text x="126" y="404" class="soft">&#8226; vendor specialists required for changes</text>
  <text x="126" y="430" class="soft">&#8226; the client&#8217;s own AI cannot touch it</text>
  <text x="126" y="472" class="tiny mono">renewal leverage: theirs</text>

  <!-- outcome B: open -->
  <rect x="634" y="270" width="470" height="230" rx="18" fill="#0f766e" filter="url(#shadow)"/>
  <text x="664" y="312" class="label invert">Outcome B — in the client&#8217;s repo</text>
  <text x="664" y="345" class="soft" fill="#c8ece2">Typed objects, flows, permissions — open files.</text>
  <text x="664" y="378" class="soft" fill="#c8ece2">&#8226; Apache-2.0, no license to renew</text>
  <text x="664" y="404" class="soft" fill="#c8ece2">&#8226; any coding agent + reviewer maintains it</text>
  <text x="664" y="430" class="soft" fill="#c8ece2">&#8226; the client&#8217;s AI operates it over MCP</text>
  <text x="664" y="472" class="tiny mono" fill="#c8ece2">renewal leverage: none needed</text>

  <text x="96" y="560" class="tiny">Ontology-first is the playbook that works. The open question is only where the ontology ends up.</text>
  <text x="96" y="610" class="soft mono">a complete CRM &#8776; 16k tokens of typed metadata &#8212; reviewable whole</text>
</svg>
