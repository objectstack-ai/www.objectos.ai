<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="三家封闭 agent 套件与一个开放自托管运行时的适用场景对比">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:14px}.h{font-size:16px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="78" font-size="34" font-weight="780">Agentforce、Copilot Studio 之外</text>
  <text x="96" y="113" class="tiny">这些套件在自家生态里都很强——前提是，你的世界确实都在某一家墙里</text>

  <!-- three ecosystem cards -->
  <g transform="translate(96 162)">
    <g filter="url(#shadow)">
      <rect width="330" height="190" rx="18" fill="#ffffff"/>
      <text x="26" y="46" class="h">Salesforce Agentforce</text>
      <text x="26" y="74" class="soft">CRM 原生 · 8000+ 客户</text>
      <text x="26" y="118" class="soft" style="fill:#1f6b4a">✓ 你已重度使用 Salesforce</text>
      <text x="26" y="150" class="soft" style="fill:#9a3b1f">⊘ 出了生态、要换模型就难</text>
    </g>
    <g filter="url(#shadow)" transform="translate(354 0)">
      <rect width="330" height="190" rx="18" fill="#ffffff"/>
      <text x="26" y="46" class="h">Microsoft Copilot Studio</text>
      <text x="26" y="74" class="soft">Agent 365 · 绑 GPT-5 与 M365</text>
      <text x="26" y="118" class="soft" style="fill:#1f6b4a">✓ 公司全在 Teams/365 里</text>
      <text x="26" y="150" class="soft" style="fill:#9a3b1f">⊘ 数据要自持、跨栈就别扭</text>
    </g>
    <g filter="url(#shadow)" transform="translate(708 0)">
      <rect width="330" height="190" rx="18" fill="#ffffff"/>
      <text x="26" y="46" class="h">ServiceNow AI Agents</text>
      <text x="26" y="74" class="soft">ITSM 之王 · 预置 agent 多</text>
      <text x="26" y="118" class="soft" style="fill:#1f6b4a">✓ 流程都在 ServiceNow 上</text>
      <text x="26" y="150" class="soft" style="fill:#9a3b1f">⊘ 业务定义被绑在平台里</text>
    </g>
  </g>

  <!-- open runtime band -->
  <g transform="translate(96 392)" filter="url(#shadow)">
    <rect width="1008" height="176" rx="22" fill="#22433d"/>
    <text x="36" y="58" class="label invert">开放 · 自托管运行时（ObjectStack）</text>
    <text x="36" y="90" class="soft" style="fill:#a9c4ba">业务定义在你仓库里 · 跑你自己的基础设施 · 模型可换 · 不按动作计费</text>
    <g transform="translate(36 112)" font-size="14">
      <rect width="300" height="44" rx="10" fill="#35564f"/><text x="18" y="29" class="invert">✓ 数据散在多个系统、要自持</text>
      <rect x="320" y="0" width="300" height="44" rx="10" fill="#35564f"/><text x="338" y="29" class="invert">✓ 想自由选模型、不被锁定</text>
      <rect x="640" y="0" width="332" height="44" rx="10" fill="#35564f"/><text x="658" y="29" class="invert">✓ 合规要求数据不出域</text>
    </g>
  </g>
</svg>
