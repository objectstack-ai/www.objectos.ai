<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The build invoice you remember versus the ossification toll you never booked">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}
      .label{font-size:19px;font-weight:720}
      .soft{fill:#5d736b;font-size:15px}
      .kicker{font-size:14px;font-weight:700;letter-spacing:1.4px}
      .money{font-size:52px;font-weight:800}
      .warn{font-size:15px;font-weight:650;fill:#9a3b1f}
      .ok{font-size:15px;font-weight:650;fill:#1f6b4a}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="78" font-size="32" font-weight="780">The invoice you remember, and the toll you never booked</text>
  <text x="96" y="113" class="tiny">Five years after the build, one ordinary change was quoted at 60% of what the whole system cost</text>

  <!-- Left: the build invoice -->
  <g transform="translate(86 168)" filter="url(#shadow)">
    <rect width="440" height="400" rx="22" fill="#ffffff"/>
    <text x="36" y="50" class="kicker" fill="#1f6b4a">2019 · THE BUILD</text>
    <text x="36" y="88" class="label">One invoice, one signature</text>
    <text x="36" y="130" class="money" fill="#1f6b4a">$45,000</text>
    <g transform="translate(36 158)">
      <rect width="368" height="118" rx="14" fill="#eef7f1"/>
      <g stroke="#8fb9a6" stroke-width="3" opacity=".8">
        <path d="M24 36 h236"/><path d="M24 62 h180"/><path d="M24 88 h268"/>
      </g>
    </g>
    <g transform="translate(36 300)">
      <rect width="128" height="34" rx="17" fill="#e3f1ea"/><text x="18" y="23" class="ok">budgeted</text>
      <rect x="140" y="0" width="112" height="34" rx="17" fill="#e3f1ea"/><text x="158" y="23" class="ok">approved</text>
    </g>
    <text x="36" y="368" class="soft">Booked once, on a line item called "the order system"</text>
  </g>

  <!-- Right: the ossification toll -->
  <g transform="translate(674 168)" filter="url(#shadow)">
    <rect width="440" height="400" rx="22" fill="#ffffff"/>
    <text x="36" y="50" class="kicker" fill="#9a3b1f">2020–2024 · THE TOLL</text>
    <text x="36" y="88" class="label">Collected quietly, every year</text>
    <text x="36" y="130" class="money" fill="#9a3b1f">$81,100</text>
    <g transform="translate(36 158)">
      <rect width="368" height="118" rx="14" fill="#fbece6"/>
      <g stroke="#d98b6a" stroke-width="3" opacity=".7">
        <path d="M24 30 h96"/><path d="M150 30 h84"/><path d="M264 30 h72"/>
        <path d="M24 60 h140"/><path d="M194 60 h60"/><path d="M284 60 h52"/>
        <path d="M24 90 h72"/><path d="M102 90 h118"/><path d="M250 90 h86"/>
      </g>
    </g>
    <g transform="translate(36 300)">
      <rect width="164" height="34" rx="17" fill="#fbece6"/><text x="18" y="23" class="warn">no line item</text>
      <rect x="176" y="0" width="188" height="34" rx="17" fill="#fbece6"/><text x="194" y="23" class="warn">nobody signed off</text>
    </g>
    <text x="36" y="368" class="warn">1.8× the purchase price — scattered across five budgets</text>
  </g>

  <text x="600" y="628" text-anchor="middle" class="tiny">Retainer + change requests + the quote to move one step forward. The waiting is not even in it.</text>
</svg>
