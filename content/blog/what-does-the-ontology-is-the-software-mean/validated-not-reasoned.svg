<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="三列对比：知识表示本体（OWL、RDF、知识图谱）描述一个领域，带类继承与公理，由推理引擎推理；语义层是你已在运行的系统之上的只读映射，描述业务但不运行业务；可执行业务本体是一家企业的应用，由 Zod schema 与 os validate 校验后运行，数据库、API、UI 与 Agent 工具由它推导。页脚补充：它也不是哲学意义上的形式本体">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5e716b}
      .cap{font-size:13px;font-weight:780;letter-spacing:.06em}
      .name{font-size:20px;font-weight:780}
      .sub{font-size:13px;fill:#5e716b}
      .row{font-size:14px;fill:#173a36}
      .small{font-size:13px;fill:#657872}
      .verdict{font-size:13px;font-weight:760}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">先校验、不推理：「本体」这个词的三种意思</text>
  <text x="60" y="80" class="note">同一个词，三样不同的东西。只有第三种才是「本体即软件」的意思。</text>

  <!-- 1 · 知识表示本体 -->
  <g transform="translate(60 112)">
    <rect width="350" height="440" rx="22" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="34" class="cap" style="fill:#5e716b">1 · 知识表示</text>
    <text x="22" y="66" class="name">知识本体</text>
    <text x="22" y="90" class="sub">OWL · RDF · 知识图谱</text>
    <line x1="22" y1="108" x2="328" y2="108" stroke="#e1e8e4"/>
    <text x="22" y="140" class="row">描述一个领域</text>
    <text x="22" y="170" class="row">带有类继承与公理</text>
    <text x="22" y="200" class="row">由推理引擎对它做推理</text>
    <text x="22" y="262" class="cap" style="fill:#5e716b">产出什么</text>
    <text x="22" y="286" class="small">运行时推导出的事实——</text>
    <text x="22" y="304" class="small">从未写在审阅者读得到的地方</text>
    <g transform="translate(22 356)">
      <rect width="306" height="60" rx="12" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="16" y="25" class="verdict" style="fill:#8a6a3a">不是这个。</text>
      <text x="16" y="45" class="small">没有继承、没有公理、没有推理器。</text>
    </g>
  </g>

  <!-- 2 · 语义层 -->
  <g transform="translate(435 112)">
    <rect width="350" height="440" rx="22" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="34" class="cap" style="fill:#5e716b">2 · 语义层</text>
    <text x="22" y="66" class="name">现有系统之上的一层</text>
    <text x="22" y="90" class="sub">架在你已经在运行的系统上</text>
    <line x1="22" y1="108" x2="328" y2="108" stroke="#e1e8e4"/>
    <text x="22" y="140" class="row">对既有数据的只读映射</text>
    <text x="22" y="170" class="row">描述业务</text>
    <text x="22" y="200" class="row">但不运行业务</text>
    <text x="22" y="262" class="cap" style="fill:#5e716b">产出什么</text>
    <text x="22" y="286" class="small">一致的指标与查询，</text>
    <text x="22" y="304" class="small">数据却住在别处</text>
    <g transform="translate(22 356)">
      <rect width="306" height="60" rx="12" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="16" y="25" class="verdict" style="fill:#8a6a3a">不是这个。</text>
      <text x="16" y="45" class="small">在这里，本体本身就是系统。</text>
    </g>
  </g>

  <!-- 3 · 可执行业务本体 -->
  <g transform="translate(810 112)">
    <rect width="350" height="440" rx="22" fill="#eef7f2" stroke="#2a7468" stroke-width="2"/>
    <text x="22" y="34" class="cap" style="fill:#2a7468">3 · 可执行业务本体</text>
    <text x="22" y="66" class="name">被运行的那份定义</text>
    <text x="22" y="90" class="sub">一家企业的应用，定义到足以运行</text>
    <line x1="22" y1="108" x2="328" y2="108" stroke="#b9dcd0"/>
    <text x="22" y="140" class="row">六类：对象与字段、关系、动作、</text>
    <text x="22" y="160" class="row">权限、流程、Agent 与工具定义</text>
    <text x="22" y="190" class="row">先校验：Zod schema 与 os validate</text>
    <text x="22" y="220" class="row">再运行——运行时不做任何推理</text>
    <text x="22" y="262" class="cap" style="fill:#2a7468">产出什么</text>
    <text x="22" y="286" class="small">数据库、API、UI</text>
    <text x="22" y="304" class="small">和 Agent 工具，全部由它推导</text>
    <g transform="translate(22 356)">
      <rect width="306" height="60" rx="12" fill="#ffffff" stroke="#2a7468" stroke-width="1.5"/>
      <text x="16" y="25" class="verdict" style="fill:#2a7468">就是这个。</text>
      <text x="16" y="45" class="small">跑的就是被校验过的东西。</text>
    </g>
  </g>

  <text x="60" y="596" class="small">它也不是哲学意义上的形式本体：不对「一般而言什么存在」作主张。它是一家企业的应用，被定义到足以运行的精确程度。</text>
  <text x="60" y="618" class="small" style="fill:#2a7468">来源：ObjectStack README「What we mean by ontology」一节，以及「业务本体」概念页。</text>
</svg>
