<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Three vendors' closed ontologies versus one open definition you can take with you">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:14px}.chip{font-size:15px;font-weight:650}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="78" font-size="32" font-weight="780">Everyone's racing to build the enterprise ontology</text>
  <text x="96" y="113" class="tiny">Same call—AI needs a business semantic layer—three vendors, three closed answers</text>

  <!-- Left: three locked vendor ontologies -->
  <g transform="translate(86 168)">
    <text x="0" y="-6" class="soft">Ontology, locked inside each platform</text>
    <g filter="url(#shadow)">
      <rect width="420" height="118" rx="16" fill="#22433d"/>
      <text x="28" y="50" class="chip invert">Palantir Foundry · Ontology</text>
      <g transform="translate(352 40)"><rect y="14" width="40" height="32" rx="7" fill="#e8b04b"/><path d="M7 16 v-5 a13 13 0 0 1 26 0 v5" fill="none" stroke="#e8b04b" stroke-width="7"/></g>
      <text x="28" y="84" class="soft" fill="#a9c4ba">Forward-deployed engineers · 7-figure deals</text>
    </g>
    <g filter="url(#shadow)" transform="translate(0 140)">
      <rect width="420" height="118" rx="16" fill="#2c4a43"/>
      <text x="28" y="50" class="chip invert">Microsoft Fabric IQ</text>
      <g transform="translate(352 40)"><rect y="14" width="40" height="32" rx="7" fill="#e8b04b"/><path d="M7 16 v-5 a13 13 0 0 1 26 0 v5" fill="none" stroke="#e8b04b" stroke-width="7"/></g>
      <text x="28" y="84" class="soft" fill="#a9c4ba">Bound to OneLake &amp; the 365 ecosystem</text>
    </g>
    <g filter="url(#shadow)" transform="translate(0 280)">
      <rect width="420" height="118" rx="16" fill="#35564f"/>
      <text x="28" y="50" class="chip invert">Google Enterprise Knowledge Graph</text>
      <g transform="translate(352 40)"><rect y="14" width="40" height="32" rx="7" fill="#e8b04b"/><path d="M7 16 v-5 a13 13 0 0 1 26 0 v5" fill="none" stroke="#e8b04b" stroke-width="7"/></g>
      <text x="28" y="84" class="soft" fill="#a9c4ba">Bound to Cloud &amp; Vertex</text>
    </g>
  </g>

  <!-- center -->
  <g transform="translate(540 360)">
    <text x="0" y="0" font-size="40" font-weight="800" fill="#e8b04b">?</text>
    <path d="M28 -12 h62" stroke="#e8b04b" stroke-width="6" stroke-linecap="round"/>
    <path d="M82 -24 l16 12 -16 12" fill="none" stroke="#e8b04b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: one open portable definition -->
  <g transform="translate(674 168)" filter="url(#shadow)">
    <rect width="440" height="398" rx="22" fill="#ffffff"/>
    <text x="36" y="52" class="label">One open definition, in your repo</text>
    <text x="36" y="78" class="soft">Objects · Relations · Permissions · Flows · API · AI tools</text>
    <g font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#2c4a43">
      <rect x="36" y="100" width="368" height="92" rx="12" fill="#f0f7f3"/>
      <text x="56" y="128">ObjectSchema.create({</text>
      <text x="76" y="152">name: 'crm_opportunity',</text>
      <text x="76" y="176">fields: { amount, probability }</text>
    </g>
    <g stroke="#7fae9f" stroke-width="2.5" fill="none">
      <path d="M120 192 v40"/><path d="M220 192 v40"/><path d="M320 192 v40"/>
    </g>
    <g font-size="15">
      <rect x="60" y="236" width="120" height="40" rx="20" fill="#22433d"/><text x="86" y="261" class="invert">Agent</text>
      <rect x="200" y="236" width="120" height="40" rx="20" fill="#22433d"/><text x="232" y="261" class="invert">App</text>
      <rect x="288" y="236" width="116" height="40" rx="20" fill="#22433d"/><text x="312" y="261" class="invert">Audit</text>
    </g>
    <text x="36" y="318" class="soft">Diffable · Portable · readable by any agent</text>
    <text x="36" y="356" class="soft">One command to start, on your own servers</text>
  </g>
</svg>
