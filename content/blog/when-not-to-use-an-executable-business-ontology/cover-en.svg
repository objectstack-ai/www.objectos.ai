<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="When not to use an executable business ontology: five workloads where it is the wrong tool today, each with what to use instead. Core ERP or finance of a large enterprise, the packaged system, build around it. Integrating many existing systems, a layer over those systems. Analytics over a data lake, the warehouse stack. Algorithm-heavy domains, code, behind an action if at all. A certified platform required, certification you own. The test under all five: is the hard part one of the six kinds?">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="72" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2a7468">AN HONEST LIST</text>
  <text x="72" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="50" font-weight="800" fill="#173a36">When not to use</text>
  <text x="72" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="50" font-weight="800" fill="#173a36">an executable</text>
  <text x="72" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="50" font-weight="800" fill="#173a36">business ontology</text>
  <text x="72" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#3f554f">Five workloads where it is the wrong tool today,</text>
  <text x="72" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#3f554f">what to use instead, and the fact that decides each.</text>

  <g transform="translate(72 410)">
    <rect width="372" height="38" rx="19" fill="#ffffff" stroke="#b9dcd0"/>
    <text x="186" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" fill="#2a7468">is the hard part one of the six kinds?</text>
  </g>

  <g transform="translate(640 92)">
    <rect width="488" height="82" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <circle cx="30" cy="41" r="15" fill="#9b2f2a"/>
    <text x="30" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="60" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#173a36">Core ERP or finance of a large enterprise</text>
    <text x="60" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#2a7468">→ the packaged system; build around it</text>
  </g>
  <g transform="translate(640 188)">
    <rect width="488" height="82" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <circle cx="30" cy="41" r="15" fill="#9b2f2a"/>
    <text x="30" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="60" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#173a36">Integrating many existing systems</text>
    <text x="60" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#2a7468">→ a layer over those systems</text>
  </g>
  <g transform="translate(640 284)">
    <rect width="488" height="82" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <circle cx="30" cy="41" r="15" fill="#9b2f2a"/>
    <text x="30" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="60" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#173a36">Analytics over a data lake</text>
    <text x="60" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#2a7468">→ the warehouse stack</text>
  </g>
  <g transform="translate(640 380)">
    <rect width="488" height="82" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <circle cx="30" cy="41" r="15" fill="#9b2f2a"/>
    <text x="30" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
    <text x="60" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#173a36">Algorithm-heavy domains</text>
    <text x="60" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#2a7468">→ code, behind an action if at all</text>
  </g>
  <g transform="translate(640 476)">
    <rect width="488" height="82" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <circle cx="30" cy="41" r="15" fill="#9b2f2a"/>
    <text x="30" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
    <text x="60" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#173a36">A certified platform required</text>
    <text x="60" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#2a7468">→ certification you own</text>
  </g>

  <text x="72" y="632" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4f625c">Sources: objectstack when-to-use.mdx and compare.mdx, origin/main 43567a8f, read 2026-10-16.</text>
</svg>
