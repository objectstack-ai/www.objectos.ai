<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="The action gate, in order, from the Actions as Tools docs: 1, the session is bound to the caller's principal, API key or OAuth login; 2, the author's ai.exposed opt-in, checked first and fail-closed, regardless of the caller's capabilities; 3, declared requiredPermissions enforced against the caller, the same declaration the REST route checks; 4, the subject record loaded under the caller's row-level security; 5, the body runs with the app's authority, flows honour runAs, and the dispatch is audit-logged against the real user. The un-exposed run stopped at step 2 for Ada; Sam's run stopped at step 3; Ada's run passed all five.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3730a3"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1e293b}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5b6478}
      .num{font-size:30px;font-weight:800;fill:#3730a3}
      .label{font-size:16px;font-weight:760}
      .small{font-size:13px;fill:#5b6478}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;fill:#3f4a63}
      .stop{font-size:13px;font-weight:760;fill:#b91c1c}
      .pass{font-size:13px;font-weight:760;fill:#166534}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#fbfbfe"/>

  <text x="60" y="52" class="h">The action gate, in order</text>
  <text x="60" y="80" class="note">Five steps from the docs, each one a place a run_action call can stop. Where the three runs of this post stopped is marked underneath.</text>

  <!-- step 1 -->
  <g transform="translate(60 118)">
    <rect width="200" height="230" rx="18" fill="#ffffff" stroke="#d9dcec" stroke-width="1.5"/>
    <text x="20" y="46" class="num">1</text>
    <text x="20" y="80" class="label">Bound to the caller</text>
    <text x="20" y="104" class="small">API key, or a browser login</text>
    <text x="20" y="122" class="small">on the app's own OAuth server</text>
    <text x="20" y="150" class="mono">ExecutionContext</text>
    <text x="20" y="168" class="mono">= the user's own</text>
    <text x="20" y="206" class="small">same context a REST</text>
    <text x="20" y="224" class="small">request would get</text>
  </g>
  <line x1="264" y1="233" x2="286" y2="233" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- step 2 -->
  <g transform="translate(290 118)">
    <rect width="200" height="230" rx="18" fill="#eef0fa" stroke="#3730a3" stroke-width="2"/>
    <text x="20" y="46" class="num">2</text>
    <text x="20" y="80" class="label">Author opt-in</text>
    <text x="20" y="104" class="small">ai.exposed: true, with an</text>
    <text x="20" y="122" class="small">ai.description of 40+ chars</text>
    <text x="20" y="150" class="mono">fail-closed</text>
    <text x="20" y="168" class="mono">before any permission</text>
    <text x="20" y="206" class="small">regardless of what the</text>
    <text x="20" y="224" class="small">caller is allowed to do</text>
  </g>
  <line x1="494" y1="233" x2="516" y2="233" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <g transform="translate(520 118)">
    <rect width="200" height="230" rx="18" fill="#eef0fa" stroke="#3730a3" stroke-width="2"/>
    <text x="20" y="46" class="num">3</text>
    <text x="20" y="80" class="label">Capability check</text>
    <text x="20" y="104" class="small">requiredPermissions against</text>
    <text x="20" y="122" class="small">the caller's permission sets</text>
    <text x="20" y="150" class="mono">approve_claims</text>
    <text x="20" y="168" class="mono">held? else refuse</text>
    <text x="20" y="206" class="small">the same declaration the</text>
    <text x="20" y="224" class="small">REST /actions route checks</text>
  </g>
  <line x1="724" y1="233" x2="746" y2="233" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- step 4 -->
  <g transform="translate(750 118)">
    <rect width="200" height="230" rx="18" fill="#ffffff" stroke="#d9dcec" stroke-width="1.5"/>
    <text x="20" y="46" class="num">4</text>
    <text x="20" y="80" class="label">Record under RLS</text>
    <text x="20" y="104" class="small">the subject record is loaded</text>
    <text x="20" y="122" class="small">as the caller</text>
    <text x="20" y="150" class="mono">cannot see it?</text>
    <text x="20" y="168" class="mono">reads as not-found</text>
    <text x="20" y="206" class="small">a hidden record is a</text>
    <text x="20" y="224" class="small">missing record, to this user</text>
  </g>
  <line x1="954" y1="233" x2="976" y2="233" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- step 5 -->
  <g transform="translate(980 118)">
    <rect width="160" height="230" rx="18" fill="#ffffff" stroke="#d9dcec" stroke-width="1.5"/>
    <text x="20" y="46" class="num">5</text>
    <text x="20" y="80" class="label">Body runs</text>
    <text x="20" y="104" class="small">with the app's</text>
    <text x="20" y="122" class="small">authority; flows</text>
    <text x="20" y="140" class="small">honour runAs</text>
    <text x="20" y="168" class="mono">audit-logged</text>
    <text x="20" y="186" class="mono">as the real user</text>
    <text x="20" y="224" class="small">the docs' claim,</text>
    <text x="20" y="242" class="small">not measured here</text>
  </g>

  <!-- where the runs stopped -->
  <g transform="translate(60 384)">
    <rect width="1080" height="130" rx="18" fill="#ffffff" stroke="#d9dcec" stroke-width="1.5"/>
    <text x="22" y="34" class="label">Where the three runs stopped</text>
    <text x="22" y="66" class="stop">before the opt-in, as Ada:</text>
    <text x="230" y="66" class="small">stopped at 2 — "is not exposed to AI — the app author must opt it in with ai: { exposed: true, description: … }"</text>
    <text x="22" y="92" class="stop">after the opt-in, as Sam:</text>
    <text x="230" y="92" class="small">stopped at 3 — "requires capability [approve_claims] — caller is missing [approve_claims]"</text>
    <text x="22" y="118" class="pass">after the opt-in, as Ada:</text>
    <text x="230" y="118" class="small">passed 1 to 5 — { "ok": true, … "status": "approved" }; updated_by is Ada, owner_id is still Sam</text>
  </g>
</svg>
