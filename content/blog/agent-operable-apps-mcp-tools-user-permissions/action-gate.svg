<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="动作门禁的顺序，出自「动作即工具」文档：第一步，会话绑定到调用者的主体，API 密钥或 OAuth 登录；第二步，作者的 ai.exposed 选入，最先检查、失败即关闭，与调用者的能力无关；第三步，声明的 requiredPermissions 对调用者强制执行，与 REST 路由检查的是同一份声明；第四步，主体记录在调用者的行级安全之下加载；第五步，动作体以应用的权限运行，流程遵循 runAs，分发以真实用户的名义写入审计。未选入的那次运行在 Ada 这里停在第二步；Sam 的运行停在第三步；Ada 的运行通过了全部五步。">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3730a3"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1e293b}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5b6478}
      .num{font-size:30px;font-weight:800;fill:#3730a3}
      .label{font-size:16px;font-weight:760}
      .small{font-size:13px;fill:#5b6478}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;fill:#3f4a63}
      .stop{font-size:13px;font-weight:760;fill:#b91c1c}
      .pass{font-size:13px;font-weight:760;fill:#166534}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#fbfbfe"/>

  <text x="60" y="52" class="h">动作门禁，按顺序</text>
  <text x="60" y="80" class="note">文档给出的五步，每一步都是 run_action 调用可能停下的地方。本文三次运行各停在哪里，标在下方。</text>

  <g transform="translate(60 118)">
    <rect width="200" height="230" rx="18" fill="#ffffff" stroke="#d9dcec" stroke-width="1.5"/>
    <text x="20" y="46" class="num">1</text>
    <text x="20" y="80" class="label">绑定到调用者</text>
    <text x="20" y="104" class="small">API 密钥，或在应用自己的</text>
    <text x="20" y="122" class="small">OAuth 服务器上浏览器登录</text>
    <text x="20" y="150" class="mono">ExecutionContext</text>
    <text x="20" y="168" class="mono">= 用户本人的</text>
    <text x="20" y="206" class="small">与一次 REST 请求</text>
    <text x="20" y="224" class="small">拿到的是同一个上下文</text>
  </g>
  <line x1="264" y1="233" x2="286" y2="233" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>

  <g transform="translate(290 118)">
    <rect width="200" height="230" rx="18" fill="#eef0fa" stroke="#3730a3" stroke-width="2"/>
    <text x="20" y="46" class="num">2</text>
    <text x="20" y="80" class="label">作者选入</text>
    <text x="20" y="104" class="small">ai.exposed: true，并带</text>
    <text x="20" y="122" class="small">40 字符以上的 ai.description</text>
    <text x="20" y="150" class="mono">fail-closed</text>
    <text x="20" y="168" class="mono">在任何权限之前</text>
    <text x="20" y="206" class="small">与调用者被允许做什么</text>
    <text x="20" y="224" class="small">无关</text>
  </g>
  <line x1="494" y1="233" x2="516" y2="233" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>

  <g transform="translate(520 118)">
    <rect width="200" height="230" rx="18" fill="#eef0fa" stroke="#3730a3" stroke-width="2"/>
    <text x="20" y="46" class="num">3</text>
    <text x="20" y="80" class="label">能力检查</text>
    <text x="20" y="104" class="small">requiredPermissions 对照</text>
    <text x="20" y="122" class="small">调用者持有的权限集</text>
    <text x="20" y="150" class="mono">approve_claims</text>
    <text x="20" y="168" class="mono">持有？否则拒绝</text>
    <text x="20" y="206" class="small">与 REST /actions 路由</text>
    <text x="20" y="224" class="small">检查的是同一份声明</text>
  </g>
  <line x1="724" y1="233" x2="746" y2="233" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>

  <g transform="translate(750 118)">
    <rect width="200" height="230" rx="18" fill="#ffffff" stroke="#d9dcec" stroke-width="1.5"/>
    <text x="20" y="46" class="num">4</text>
    <text x="20" y="80" class="label">RLS 之下的记录</text>
    <text x="20" y="104" class="small">主体记录以调用者的</text>
    <text x="20" y="122" class="small">身份加载</text>
    <text x="20" y="150" class="mono">看不见它？</text>
    <text x="20" y="168" class="mono">读作 not-found</text>
    <text x="20" y="206" class="small">对这个用户来说，被隐藏的</text>
    <text x="20" y="224" class="small">记录就是不存在的记录</text>
  </g>
  <line x1="954" y1="233" x2="976" y2="233" stroke="#3730a3" stroke-width="2.2" marker-end="url(#arr)"/>

  <g transform="translate(980 118)">
    <rect width="160" height="230" rx="18" fill="#ffffff" stroke="#d9dcec" stroke-width="1.5"/>
    <text x="20" y="46" class="num">5</text>
    <text x="20" y="80" class="label">动作体运行</text>
    <text x="20" y="104" class="small">以应用的权限；</text>
    <text x="20" y="122" class="small">流程遵循 runAs</text>
    <text x="20" y="168" class="mono">audit-logged</text>
    <text x="20" y="186" class="mono">以真实用户名义</text>
    <text x="20" y="224" class="small">文档的说法，</text>
    <text x="20" y="242" class="small">本文未测量</text>
  </g>

  <g transform="translate(60 384)">
    <rect width="1080" height="130" rx="18" fill="#ffffff" stroke="#d9dcec" stroke-width="1.5"/>
    <text x="22" y="34" class="label">三次运行各停在哪里</text>
    <text x="22" y="66" class="stop">选入之前，以 Ada 身份：</text>
    <text x="230" y="66" class="small">停在 2 —— "is not exposed to AI — the app author must opt it in with ai: { exposed: true, description: … }"</text>
    <text x="22" y="92" class="stop">选入之后，以 Sam 身份：</text>
    <text x="230" y="92" class="small">停在 3 —— "requires capability [approve_claims] — caller is missing [approve_claims]"</text>
    <text x="22" y="118" class="pass">选入之后，以 Ada 身份：</text>
    <text x="230" y="118" class="small">通过 1 到 5 —— { "ok": true, … "status": "approved" }；updated_by 是 Ada，owner_id 仍是 Sam</text>
  </g>
</svg>
