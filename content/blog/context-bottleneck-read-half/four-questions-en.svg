<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Four questions a write must answer that a read never had to: permission, idempotency, validation and audit, with the layer that can answer each">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.h{font-size:28px;font-weight:780}.sub{font-size:15px;fill:#647872}.q{font-size:20px;font-weight:780}.k{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#8a9691}.r{font-size:14px;fill:#5e716b}.w{font-size:14px;font-weight:600}.chip{font-size:12px;font-weight:780}.card{fill:#fffefa;stroke:#d7dfdb}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f8faf8"/>

  <text x="70" y="56" class="h">Four questions a retrieval path never had to answer</text>
  <text x="70" y="86" class="sub">A read is idempotent, side-effect free and reversible by closing the tab. A write is none of the three.</text>

  <!-- 1 PERMISSION -->
  <g transform="translate(70 118)">
    <rect width="512" height="164" rx="24" class="card"/>
    <text x="28" y="42" class="q">Permission</text>
    <text x="28" y="72" class="k">READ ASKS</text>
    <text x="150" y="72" class="r">may this principal see this row, this field?</text>
    <text x="28" y="102" class="k">WRITE ASKS</text>
    <text x="150" y="102" class="w">may it run this operation, on this record, now?</text>
    <rect x="24" y="118" width="464" height="30" rx="15" fill="#fff0ec" stroke="#e8b3a4"/>
    <text x="40" y="138" class="chip" fill="#b0563c">A semantic model has nouns. This is a predicate over a verb.</text>
  </g>

  <!-- 2 IDEMPOTENCY -->
  <g transform="translate(618 118)">
    <rect width="512" height="164" rx="24" class="card"/>
    <text x="28" y="42" class="q">Idempotency</text>
    <text x="28" y="72" class="k">READ ASKS</text>
    <text x="150" y="72" class="r">nothing — a repeat costs tokens</text>
    <text x="28" y="102" class="k">WRITE ASKS</text>
    <text x="150" y="102" class="w">have I already done this?</text>
    <rect x="24" y="118" width="464" height="30" rx="15" fill="#fff0ec" stroke="#e8b3a4"/>
    <text x="40" y="138" class="chip" fill="#b0563c">Retries and resumed conversations are normal. Someone owns the key.</text>
  </g>

  <!-- 3 VALIDATION -->
  <g transform="translate(70 302)">
    <rect width="512" height="164" rx="24" class="card"/>
    <text x="28" y="42" class="q">Validation</text>
    <text x="28" y="72" class="k">READ ASKS</text>
    <text x="150" y="72" class="r">is this column the type I think it is?</text>
    <text x="28" y="102" class="k">WRITE ASKS</text>
    <text x="150" y="102" class="w">is this change legal from the current state?</text>
    <rect x="24" y="118" width="464" height="30" rx="15" fill="#fff0ec" stroke="#e8b3a4"/>
    <text x="40" y="138" class="chip" fill="#b0563c">A precondition is not a storage constraint.</text>
  </g>

  <!-- 4 AUDIT -->
  <g transform="translate(618 302)">
    <rect width="512" height="164" rx="24" class="card"/>
    <text x="28" y="42" class="q">Audit</text>
    <text x="28" y="72" class="k">READ ASKS</text>
    <text x="150" y="72" class="r">who queried what, when</text>
    <text x="28" y="102" class="k">WRITE ASKS</text>
    <text x="150" y="102" class="w">who changed what, why, under whose authority</text>
    <rect x="24" y="118" width="464" height="30" rx="15" fill="#fff0ec" stroke="#e8b3a4"/>
    <text x="40" y="138" class="chip" fill="#b0563c">A log beside the change is not a record inside its transaction.</text>
  </g>

  <!-- WHO ANSWERS -->
  <g transform="translate(70 500)">
    <rect width="1060" height="152" rx="26" fill="#fffefa" stroke="#d7dfdb"/>
    <text x="32" y="42" class="k" fill="#647872">WHICH LAYER CAN ANSWER ALL FOUR</text>

    <g transform="translate(32 62)">
      <rect width="322" height="66" rx="18" fill="#f2f2ee" stroke="#dcdcd2"/>
      <text x="161" y="30" text-anchor="middle" class="w" fill="#7d8a84" font-weight="760">Context layer</text>
      <text x="161" y="52" text-anchor="middle" class="r">none of the four</text>
    </g>
    <g transform="translate(370 62)">
      <rect width="322" height="66" rx="18" fill="#fff3d6" stroke="#efc86c"/>
      <text x="161" y="30" text-anchor="middle" class="w" font-weight="760">AI gateway</text>
      <text x="161" y="52" text-anchor="middle" class="r">a pause, and a log of the call</text>
    </g>
    <g transform="translate(708 62)">
      <rect width="322" height="66" rx="18" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="161" y="30" text-anchor="middle" class="w" font-weight="760">The destination</text>
      <text x="161" y="52" text-anchor="middle" class="r">all four — if it enforces anything</text>
    </g>
  </g>
</svg>
