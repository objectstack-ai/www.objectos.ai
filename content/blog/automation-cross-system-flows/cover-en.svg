<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A run summary line reading acted equals zero beside unmeasured equals twelve, the three answers a cross-system step can report, and the fixed outbound delivery retry schedule">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7faf8"/>
      <stop offset=".6" stop-color="#eef6f1"/>
      <stop offset="1" stop-color="#fdf1e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.soft{font-size:13px;fill:#647872}
      .mono{font-family:ui-monospace,Menlo,monospace}
      .chip{font-size:19px;font-weight:740}
      .warn{fill:#9a3b1f}.col{font-size:12px;font-weight:700;fill:#5d736b;letter-spacing:.09em}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="82" font-size="35" font-weight="780">acted=0 does not mean nothing happened.</text>
  <text x="96" y="116" class="tiny">Cross-system flows: declare what each outbound call does, draw the failure path, keep one run record that refuses to overstate.</text>

  <!-- the run summary line -->
  <g transform="translate(96 152)" filter="url(#shadow)">
    <rect width="1008" height="132" rx="18" fill="#fffefa" stroke="#dbe5df"/>
    <text x="28" y="34" class="col">ONE TERMINAL RUN, ONE GREPPABLE LINE</text>
    <text x="28" y="72" class="mono" font-size="17" font-weight="700">[automation] run flow=renewal_check status=success selected=12</text>
    <text x="28" y="100" class="mono" font-size="17" font-weight="700">acted=0 skipped=0 <tspan class="warn">unmeasured=12</tspan></text>
    <g transform="translate(690 76)">
      <rect width="290" height="36" rx="11" fill="#fdece4" stroke="#e6b3a9"/>
      <text x="145" y="24" text-anchor="middle" font-size="14" font-weight="650" class="warn">cannot tell — not "did nothing"</text>
    </g>
  </g>

  <!-- three answers -->
  <text x="96" y="330" class="col">THE THREE ANSWERS A STEP MAY REPORT</text>

  <g transform="translate(96 348)">
    <rect width="320" height="112" rx="16" fill="#eef7f3" stroke="#c6ded4"/>
    <text x="24" y="42" class="chip mono">acted: 0</text>
    <text x="24" y="70" class="soft">A real zero — it could not have changed</text>
    <text x="24" y="90" class="soft">anything. Declared effect: read.</text>
  </g>
  <g transform="translate(440 348)">
    <rect width="320" height="112" rx="16" fill="#e7f2ec" stroke="#bcd6cb"/>
    <text x="24" y="42" class="chip mono">acted: 1</text>
    <text x="24" y="70" class="soft">The upstream accepted a change.</text>
    <text x="24" y="90" class="soft">Declared effect: write, dispatch ok.</text>
  </g>
  <g transform="translate(784 348)">
    <rect width="320" height="112" rx="16" fill="#fdece4" stroke="#e6b3a9"/>
    <text x="24" y="42" class="chip mono warn">unmeasured</text>
    <text x="24" y="70" class="soft">Reached the wire, not countable.</text>
    <text x="24" y="90" class="soft">Undeclared, threw, or still queued.</text>
  </g>

  <!-- the fixed delivery budget -->
  <g transform="translate(96 496)" filter="url(#shadow)">
    <rect width="1008" height="112" rx="18" fill="#fffefa" stroke="#dbe5df"/>
    <text x="28" y="34" class="col">OUTBOUND DELIVERY BUDGET — FIXED, NOT PER-WEBHOOK</text>
    <g transform="translate(28 54)">
      <g>
        <rect width="132" height="40" rx="12" fill="#eef7f3" stroke="#c6ded4"/>
        <text x="66" y="26" text-anchor="middle" class="mono" font-size="15" font-weight="700">~1s</text>
      </g>
      <g transform="translate(158 0)">
        <rect width="132" height="40" rx="12" fill="#eef7f3" stroke="#c6ded4"/>
        <text x="66" y="26" text-anchor="middle" class="mono" font-size="15" font-weight="700">~10s</text>
      </g>
      <g transform="translate(316 0)">
        <rect width="132" height="40" rx="12" fill="#eef7f3" stroke="#c6ded4"/>
        <text x="66" y="26" text-anchor="middle" class="mono" font-size="15" font-weight="700">~1m</text>
      </g>
      <g transform="translate(474 0)">
        <rect width="132" height="40" rx="12" fill="#eef7f3" stroke="#c6ded4"/>
        <text x="66" y="26" text-anchor="middle" class="mono" font-size="15" font-weight="700">~10m</text>
      </g>
      <g transform="translate(632 0)">
        <rect width="132" height="40" rx="12" fill="#eef7f3" stroke="#c6ded4"/>
        <text x="66" y="26" text-anchor="middle" class="mono" font-size="15" font-weight="700">~1h</text>
      </g>
      <g transform="translate(790 0)">
        <rect width="160" height="40" rx="12" fill="#173a36"/>
        <text x="80" y="26" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#eafff6">dead-letter</text>
      </g>
      <path d="M136 20 H154 M294 20 H312 M452 20 H470 M610 20 H628 M768 20 H786" stroke="#2a7468" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <text x="96" y="646" class="soft">Five attempts, ±20% jitter, then a dead-letter row someone has to own. ObjectOS Automation.</text>
</svg>
