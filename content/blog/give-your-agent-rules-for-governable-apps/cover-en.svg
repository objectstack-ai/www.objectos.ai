<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Style-only agent rules produce a leaky app; governability rules produce a governed app">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/><stop offset=".55" stop-color="#eef7f2"/><stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:14px}
      .warn{font-size:14px;font-weight:650;fill:#9a3b1f}.ok{font-size:14px;font-weight:650;fill:#1f6b4a}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}.mono text{font-family:inherit}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="96" y="78" font-size="32" font-weight="780">Stop hand-teaching AI your stack</text>
  <text x="96" y="113" class="tiny">An agent's rules file should constrain governability, not code style</text>

  <!-- Left: style-only rules -->
  <g transform="translate(86 162)" filter="url(#shadow)">
    <rect width="440" height="410" rx="22" fill="#ffffff"/>
    <text x="36" y="50" class="label">Style-only rules</text>
    <g transform="translate(36 70)" class="mono" fill="#5d736b">
      <rect width="368" height="120" rx="12" fill="#f3f6f4"/>
      <text x="20" y="34"># AGENTS.md</text>
      <text x="20" y="58">- 2-space indent</text>
      <text x="20" y="82">- use our UI library</text>
      <text x="20" y="106">- imperative commit messages</text>
    </g>
    <text x="36" y="232" class="soft">→ agent complied, the code is "clean"</text>
    <g transform="translate(36 250)"><rect width="368" height="96" rx="12" fill="#fbece6"/>
      <text x="20" y="34" class="mono" fill="#9a3b1f">GET /api/refunds</text>
      <text x="20" y="60" class="warn">returned everyone's refunds</text>
      <text x="20" y="82" class="warn">— no rule was about permissions</text>
    </g>
    <text x="36" y="384" class="warn">clean ≠ governable</text>
  </g>

  <!-- Right: governability rules -->
  <g transform="translate(674 162)" filter="url(#shadow)">
    <rect width="440" height="410" rx="22" fill="#ffffff"/>
    <text x="36" y="50" class="label">Governability rules</text>
    <g transform="translate(36 70)" class="mono" fill="#2c4a43">
      <rect width="368" height="120" rx="12" fill="#eef7f1"/>
      <text x="20" y="34"># AGENTS.md</text>
      <text x="20" y="58">- model as ObjectStack objects</text>
      <text x="20" y="82">- permissions via PermissionSet</text>
      <text x="20" y="106">- never hand-roll auth/queries</text>
    </g>
    <text x="36" y="232" class="soft">→ agent emits reviewable metadata</text>
    <g transform="translate(36 250)"><rect width="368" height="96" rx="12" fill="#22433d"/>
      <text x="20" y="34" class="mono invert">refund.read → by caller's rights</text>
      <text x="20" y="60" class="soft" style="fill:#a9c4ba">runtime enforces &amp; logs; invalid</text>
      <text x="20" y="82" class="soft" style="fill:#a9c4ba">metadata is rejected on the spot</text>
    </g>
    <text x="36" y="384" class="ok">governed by construction</text>
  </g>
</svg>
