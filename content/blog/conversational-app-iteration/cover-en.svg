<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Conversational application iteration loop">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8fbf8"/>
      <stop offset="1" stop-color="#edf2fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#26364d" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.title{font-size:34px;font-weight:780}.label{font-size:18px;font-weight:740}.tiny{font-size:15px;fill:#60746e}.invert{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="90" y="76" class="title">Changing business apps by conversation needs a loop</text>
  <text x="90" y="110" class="tiny">Natural language should create plans, confirmation, runtime changes, audit, and rollback</text>

  <g transform="translate(160 150)" filter="url(#shadow)">
    <rect width="880" height="388" rx="32" fill="#fffefa" stroke="#d8dfdb"/>
    <circle cx="440" cy="194" r="132" fill="#eef7f3" stroke="#cfddd5"/>
    <path d="M440 62 A132 132 0 0 1 572 194" fill="none" stroke="#2a7468" stroke-width="13" stroke-linecap="round"/>
    <path d="M572 194 A132 132 0 0 1 440 326" fill="none" stroke="#f0b94b" stroke-width="13" stroke-linecap="round"/>
    <path d="M440 326 A132 132 0 0 1 308 194" fill="none" stroke="#425a9c" stroke-width="13" stroke-linecap="round"/>
    <path d="M308 194 A132 132 0 0 1 440 62" fill="none" stroke="#d96b5f" stroke-width="13" stroke-linecap="round"/>
    <g fill="#173a36">
      <circle cx="440" cy="62" r="18"/><circle cx="572" cy="194" r="18"/>
      <circle cx="440" cy="326" r="18"/><circle cx="308" cy="194" r="18"/>
    </g>
    <g text-anchor="middle">
      <text x="440" y="38" class="label">Request</text>
      <text x="632" y="200" class="label">Change plan</text>
      <text x="440" y="366" class="label">Confirm</text>
      <text x="248" y="200" class="label">Audit</text>
    </g>
    <g transform="translate(360 150)">
      <rect width="160" height="88" rx="22" fill="#173a36"/>
      <text x="80" y="38" text-anchor="middle" class="invert" font-size="18" font-weight="760">Metadata</text>
      <text x="80" y="62" text-anchor="middle" class="soft" font-size="14">Fields · flows · access</text>
    </g>
    <text x="44" y="346" class="tiny">Every change explains its impact: objects, fields, views, workflows, permissions, automation, Agent tools</text>
  </g>
</svg>
