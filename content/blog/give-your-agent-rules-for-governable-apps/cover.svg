<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="只管风格的 agent 规则生成会泄露的应用，管可治理性的规则生成受治理的应用">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/><stop offset=".55" stop-color="#eef7f2"/><stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:14px}
      .warn{font-size:14px;font-weight:650;fill:#9a3b1f}.ok{font-size:14px;font-weight:650;fill:#1f6b4a}.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}.mono text{font-family:inherit}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="96" y="78" font-size="32" font-weight="780">别再手把手教 AI 你的技术栈</text>
  <text x="96" y="113" class="tiny">agent 的规则文件，应该约束的不是代码风格，而是"可治理性"</text>

  <!-- Left: style-only rules -->
  <g transform="translate(86 162)" filter="url(#shadow)">
    <rect width="440" height="410" rx="22" fill="#ffffff"/>
    <text x="36" y="50" class="label">只管风格的规则</text>
    <g transform="translate(36 70)" class="mono" fill="#5d736b">
      <rect width="368" height="120" rx="12" fill="#f3f6f4"/>
      <text x="20" y="34"># AGENTS.md</text>
      <text x="20" y="58">- 用 2 空格缩进</text>
      <text x="20" y="82">- 用我们的 UI 组件库</text>
      <text x="20" y="106">- 提交信息用祈使句</text>
    </g>
    <text x="36" y="232" class="soft">→ agent 照做了，代码很"规范"</text>
    <g transform="translate(36 250)"><rect width="368" height="96" rx="12" fill="#fbece6"/>
      <text x="20" y="34" class="mono" fill="#9a3b1f">GET /api/refunds</text>
      <text x="20" y="60" class="warn">返回了所有人的退款记录</text>
      <text x="20" y="82" class="warn">——规则里没一条管权限</text>
    </g>
    <text x="36" y="384" class="warn">规范 ≠ 可治理</text>
  </g>

  <!-- Right: governability rules -->
  <g transform="translate(674 162)" filter="url(#shadow)">
    <rect width="440" height="410" rx="22" fill="#ffffff"/>
    <text x="36" y="50" class="label">管可治理性的规则</text>
    <g transform="translate(36 70)" class="mono" fill="#2c4a43">
      <rect width="368" height="120" rx="12" fill="#eef7f1"/>
      <text x="20" y="34"># AGENTS.md</text>
      <text x="20" y="58">- 建模为 ObjectStack 对象</text>
      <text x="20" y="82">- 权限走 PermissionSet</text>
      <text x="20" y="106">- 绝不手写鉴权/查询拼接</text>
    </g>
    <text x="36" y="232" class="soft">→ agent 产出可审查的元数据</text>
    <g transform="translate(36 250)"><rect width="368" height="96" rx="12" fill="#22433d"/>
      <text x="20" y="34" class="mono invert">refund.read → 按调用者权限</text>
      <text x="20" y="60" class="soft" style="fill:#a9c4ba">运行时强制、留痕；非法元数据</text>
      <text x="20" y="82" class="soft" style="fill:#a9c4ba">直接被拒，agent 当场得到纠错</text>
    </g>
    <text x="36" y="384" class="ok">生成即受治理</text>
  </g>
</svg>
