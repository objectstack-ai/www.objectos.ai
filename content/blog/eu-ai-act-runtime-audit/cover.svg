<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="审计三问与一个能签字的 AI 运行时，背景是 2026 年合规时间表">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:19px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:15px}.q{font-size:16px;fill:#2c4a43}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="78" font-size="34" font-weight="780">你的 AI 运行时，准备好被审计了吗</text>
  <text x="96" y="113" class="tiny">EU AI Act 2026 年 8 月强制执行 · CADA 提案落地 · 倒计时已经开始</text>

  <!-- timeline band -->
  <g transform="translate(96 150)">
    <line x1="0" y1="20" x2="1008" y2="20" stroke="#c4d3cc" stroke-width="3"/>
    <g text-anchor="middle">
      <circle cx="120" cy="20" r="9" fill="#7fae9f"/><text x="120" y="58" class="soft">2026·06 CADA 提案</text>
      <circle cx="540" cy="20" r="11" fill="#e8b04b"/><text x="540" y="58" class="soft" style="fill:#9a6212" font-weight="700">2026·08 强制执行</text>
      <circle cx="900" cy="20" r="9" fill="#7fae9f"/><text x="900" y="58" class="soft">罚则 · 主权要求</text>
    </g>
  </g>

  <!-- Left: audit clipboard -->
  <g transform="translate(96 240)" filter="url(#shadow)">
    <rect width="500" height="360" rx="22" fill="#ffffff"/>
    <text x="36" y="56" class="label">审计员会问三件事</text>
    <g transform="translate(36 92)">
      <rect width="40" height="40" rx="10" fill="#fbece6"/><text x="11" y="29" font-size="22" fill="#9a3b1f">?</text>
      <text x="58" y="20" class="q">这些数据，处理得合法吗？</text>
      <text x="58" y="44" class="soft">数据在哪、谁能读、出没出过欧盟</text>
    </g>
    <g transform="translate(36 168)">
      <rect width="40" height="40" rx="10" fill="#fbece6"/><text x="11" y="29" font-size="22" fill="#9a3b1f">?</text>
      <text x="58" y="20" class="q">这个动作，谁授权 AI 做的？</text>
      <text x="58" y="44" class="soft">改折扣、发合同，按谁的权限算</text>
    </g>
    <g transform="translate(36 244)">
      <rect width="40" height="40" rx="10" fill="#fbece6"/><text x="11" y="29" font-size="22" fill="#9a3b1f">?</text>
      <text x="58" y="20" class="q">AI 参与的那步，留痕了吗？</text>
      <text x="58" y="44" class="soft">90 天内能不能拿出完整证据链</text>
    </g>
  </g>

  <!-- Right: a runtime that can sign off -->
  <g transform="translate(636 240)" filter="url(#shadow)">
    <rect width="468" height="360" rx="22" fill="#22433d"/>
    <text x="36" y="56" class="label invert">治理写在运行时里</text>
    <text x="36" y="84" class="soft" style="fill:#a9c4ba">不写在提示词里——提示词没法被审计</text>
    <g transform="translate(36 112)" font-size="15">
      <rect width="396" height="40" rx="10" fill="#35564f"/><text x="18" y="26" class="invert">权限：运行时强制，不靠提示词约束</text>
      <rect y="52" width="396" height="40" rx="10" fill="#35564f"/><text x="18" y="78" class="invert">审计：人与 agent 共用同一本账</text>
      <rect y="104" width="396" height="40" rx="10" fill="#35564f"/><text x="18" y="130" class="invert">数据：跑在你自己的基础设施上</text>
    </g>
    <g transform="translate(300 270) rotate(-8)">
      <rect width="150" height="56" rx="12" fill="none" stroke="#e8b04b" stroke-width="3"/>
      <text x="24" y="37" style="fill:#e8b04b" font-size="22" font-weight="800">可签字</text>
    </g>
  </g>
</svg>
