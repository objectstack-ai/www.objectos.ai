<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="A five-column legacy CSV passes through the crm_lead_feed mapping: Full Name, E-mail and Company are copied to name, email and company; Channel goes through a map that turns Webform into web and Partner Referral into partner; Legacy ID has no entry and is dropped. Below, a second file that differs only by its Legacy ID column lands 0 of 3 rows through an inline rename because the column reaches the write path and is refused as an unknown field, while the mapping lands 3 of 3">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4443a"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#51645d}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em}
      .label{font-size:15px;font-weight:760}
      .small{font-size:13px;fill:#55675f}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600}
      .mono2{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;fill:#51645d}
      .num{font-size:30px;font-weight:800}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">A mapping is a projection: only the columns it names survive</text>
  <text x="60" y="80" class="note">The file's headers and codes on the left, one crm_lead record on the right, and the twenty lines between them.</text>

  <!-- THE FILE -->
  <g transform="translate(60 112)">
    <rect width="300" height="300" rx="22" fill="#fdf4e8" stroke="#d9b98c" stroke-width="2"/>
    <text x="24" y="34" class="cap" style="fill:#8a6a3a">THE FILE: THEIR HEADERS AND CODES</text>
    <g transform="translate(24 52)"><rect width="252" height="40" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="26" class="mono">Full Name</text></g>
    <g transform="translate(24 100)"><rect width="252" height="40" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="26" class="mono">E-mail</text></g>
    <g transform="translate(24 148)"><rect width="252" height="40" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="26" class="mono">Company</text></g>
    <g transform="translate(24 196)"><rect width="252" height="40" rx="12" fill="#ffffff" stroke="#e6d3b6"/><text x="16" y="26" class="mono">Channel</text><text x="236" y="26" class="mono2" text-anchor="end">Webform</text></g>
    <g transform="translate(24 244)"><rect width="252" height="40" rx="12" fill="#ffffff" stroke="#e6d3b6" stroke-dasharray="5 4"/><text x="16" y="26" class="mono">Legacy ID</text><text x="236" y="26" class="mono2" text-anchor="end">L-1001</text></g>
  </g>

  <!-- THE MAPPING -->
  <g transform="translate(430 112)">
    <rect width="340" height="300" rx="22" fill="#f4faf7" stroke="#9fc6b8" stroke-width="2"/>
    <text x="24" y="34" class="cap" style="fill:#2a7468">defineMapping — crm_lead_feed</text>
    <text x="24" y="78" class="mono">source → target</text>
    <text x="24" y="126" class="mono">transform: 'none'</text>
    <text x="24" y="174" class="mono">transform: 'none'</text>
    <text x="24" y="222" class="mono">transform: 'map'</text>
    <text x="24" y="242" class="mono2">Webform → web · Partner Referral → partner</text>
    <text x="24" y="270" class="mono" style="fill:#b4443a">no entry — dropped</text>
    <text x="180" y="78" class="mono2">upsertKey: ['email']</text>
  </g>

  <!-- THE RECORD -->
  <g transform="translate(840 112)">
    <rect width="300" height="300" rx="22" fill="#ffffff" stroke="#c9d8d1" stroke-width="2"/>
    <text x="24" y="34" class="cap" style="fill:#2a7468">ONE crm_lead RECORD</text>
    <g transform="translate(24 52)"><rect width="252" height="40" rx="12" fill="#f4faf7" stroke="#c9d8d1"/><text x="16" y="26" class="mono">name</text></g>
    <g transform="translate(24 100)"><rect width="252" height="40" rx="12" fill="#f4faf7" stroke="#c9d8d1"/><text x="16" y="26" class="mono">email</text><text x="236" y="26" class="mono2" text-anchor="end">match key</text></g>
    <g transform="translate(24 148)"><rect width="252" height="40" rx="12" fill="#f4faf7" stroke="#c9d8d1"/><text x="16" y="26" class="mono">company</text></g>
    <g transform="translate(24 196)"><rect width="252" height="40" rx="12" fill="#f4faf7" stroke="#c9d8d1"/><text x="16" y="26" class="mono">source</text><text x="236" y="26" class="mono2" text-anchor="end">web</text></g>
    <text x="24" y="278" class="small">no field for the old key, and none appears</text>
  </g>

  <!-- arrows file → mapping → record -->
  <line x1="364" y1="184" x2="426" y2="184" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="364" y1="232" x2="426" y2="232" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="364" y1="280" x2="426" y2="280" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="364" y1="328" x2="426" y2="328" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="364" y1="376" x2="426" y2="376" stroke="#b4443a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrx)"/>
  <line x1="774" y1="184" x2="836" y2="184" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="774" y1="232" x2="836" y2="232" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="774" y1="280" x2="836" y2="280" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="774" y1="328" x2="836" y2="328" stroke="#2a7468" stroke-width="2" marker-end="url(#arr)"/>

  <!-- the measured contrast -->
  <text x="60" y="470" class="cap" style="fill:#2a7468">MEASURED — TWO THREE-ROW FILES, TWO ROUTES, 17.7.0</text>

  <g transform="translate(60 490)">
    <rect width="530" height="170" rx="18" fill="#fff5f3" stroke="#e3b8b2"/>
    <text x="24" y="44" class="num" style="fill:#b4443a">0 of 3</text>
    <text x="130" y="44" class="label">rows landed through an inline rename</text>
    <text x="24" y="76" class="small">A second file whose Channel cells are our own labels, so that</text>
    <text x="24" y="96" class="small">the Legacy ID column is the only difference. Unmapped columns pass</text>
    <text x="24" y="116" class="small">through under their own header, and every row was refused:</text>
    <text x="24" y="140" class="mono2">failed · INVALID_FIELD · field "Legacy ID"</text>
    <text x="24" y="160" class="small">Same verdict on the dry run and on the real run; nothing stored.</text>
  </g>

  <g transform="translate(610 490)">
    <rect width="530" height="170" rx="18" fill="#f4faf7" stroke="#9fc6b8"/>
    <text x="24" y="44" class="num" style="fill:#2a7468">3 of 3</text>
    <text x="130" y="44" class="label">rows landed through the mapping, both files</text>
    <text x="24" y="76" class="small">The artifact is a strict projection: Legacy ID was never offered to</text>
    <text x="24" y="96" class="small">the write path. The first file's Channel codes arrived translated</text>
    <text x="24" y="116" class="small">and were stored as:</text>
    <text x="24" y="140" class="mono2">created · created · created — source = web, partner, web</text>
    <text x="24" y="160" class="small">Dry run first, each time: created 3 reported, 0 rows stored.</text>
  </g>

  <text x="60" y="696" class="small">Numbers from the server's own import report. The first file fails the inline route a step earlier: its codes are never translated (invalid_option on source).</text>
</svg>
