<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="88% 的 agent 试点进不了生产，失败的不是模型而是脚下四层">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24342f" flood-opacity=".15"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .tiny{font-size:16px;fill:#5d736b}.label{font-size:18px;font-weight:720}.invert{fill:#eafff6}.soft{fill:#5d736b;font-size:14px}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="78" font-size="34" font-weight="780">88% 的 Agent 试点，进不了生产</text>
  <text x="96" y="113" class="tiny">失败的几乎从来不是模型——是它脚下缺了四层</text>

  <!-- Left: the stat -->
  <g transform="translate(96 168)" filter="url(#shadow)">
    <rect width="430" height="400" rx="22" fill="#22433d"/>
    <text x="36" y="120" style="fill:#e8b04b" font-size="120" font-weight="820">88%</text>
    <text x="36" y="160" class="label invert">止步于 PoC，进不了生产</text>
    <g transform="translate(36 210)" font-size="15">
      <rect width="358" height="44" rx="10" fill="#35564f"/><text x="18" y="29" class="invert">95% 拿不到可衡量 ROI</text>
      <rect y="56" width="358" height="44" rx="10" fill="#35564f"/><text x="18" y="85" class="invert">80% 的工作是数据与治理，不是模型</text>
      <rect y="112" width="358" height="44" rx="10" fill="#35564f"/><text x="18" y="141" class="invert">44% 卡在治理返工</text>
    </g>
  </g>

  <!-- Right: model on top of four layers -->
  <g transform="translate(674 168)">
    <g filter="url(#shadow)">
      <rect width="440" height="64" rx="14" fill="#fff3df"/>
      <text x="28" y="40" class="label" fill="#9a6212">模型　很强，但只是最上面一层</text>
    </g>
    <text x="452" y="40" font-size="13" fill="#5d736b" transform="translate(-440 0)"></text>
    <g transform="translate(0 84)" font-size="15">
      <rect width="440" height="68" rx="14" fill="#ffffff" filter="url(#shadow)"/>
      <text x="28" y="32" class="label">① 语义层</text><text x="28" y="56" class="soft">对象、关系、口径——AI 看懂业务的地方</text>
      <rect y="80" width="440" height="68" rx="14" fill="#ffffff" filter="url(#shadow)"/>
      <text x="28" y="112" class="label">② 权限层</text><text x="28" y="136" class="soft">谁能看什么、做什么，运行时强制</text>
      <rect y="160" width="440" height="68" rx="14" fill="#ffffff" filter="url(#shadow)"/>
      <text x="28" y="192" class="label">③ 流程与审批层</text><text x="28" y="216" class="soft">该停的时候停下来，等人签字</text>
      <rect y="240" width="440" height="68" rx="14" fill="#ffffff" filter="url(#shadow)"/>
      <text x="28" y="272" class="label">④ 审计层</text><text x="28" y="296" class="soft">每一步留痕，能交差、能签字</text>
    </g>
  </g>
</svg>
