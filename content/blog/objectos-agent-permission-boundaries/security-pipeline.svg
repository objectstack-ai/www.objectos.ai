<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="同一个请求的两条路径：事后过滤越过红线，查询下推在红线之前就不产生越界数据">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.h{font-size:28px;font-weight:780}.t{font-size:18px;font-weight:740}.s{font-size:14px;fill:#647872}.cap{font-size:13px;font-weight:780;fill:#2a7468}.warn{font-size:13px;font-weight:780;fill:#b0563c}.box{fill:#fffefa;stroke:#d7dfdb}.green{fill:#eef7f3;stroke:#bdd7cf}.red{fill:#fff0ec;stroke:#e8b3a4}.dark{fill:#173a36}.white{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="660" fill="#f8faf8"/>
  <text x="70" y="58" class="h">红线：数据进入模型上下文的那一刻</text>
  <text x="70" y="88" class="s">越界的行和字段必须在红线之前消失。红线之后再过滤，模型已经读过了——那是纸面权限。</text>

  <g transform="translate(70 118)">
    <rect width="1060" height="462" rx="30" class="box"/>

    <line x1="540" y1="28" x2="540" y2="392" stroke="#b0563c" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="540" y="418" text-anchor="middle" class="warn">红线 · 进入模型上下文</text>

    <text x="40" y="62" class="warn">事后过滤 · 纸面权限</text>
    <g transform="translate(40 78)">
      <rect width="230" height="92" rx="20" class="red"/>
      <text x="115" y="40" text-anchor="middle" class="t">先宽查询</text>
      <text x="115" y="66" text-anchor="middle" class="s">不带范围条件</text>
    </g>
    <g transform="translate(576 78)">
      <rect width="440" height="92" rx="20" class="red"/>
      <text x="24" y="38" class="t">越界的行已经在上下文里</text>
      <text x="24" y="66" class="s">再把它们丢掉，只是希望模型不要复述</text>
    </g>
    <path d="M270 124 H570" stroke="#b0563c" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="420" y="112" text-anchor="middle" class="s">全部行</text>

    <text x="40" y="234" class="cap">查询下推 · 真边界</text>
    <g transform="translate(40 250)">
      <rect width="230" height="92" rx="20" class="green"/>
      <text x="115" y="40" text-anchor="middle" class="t">谓词进入查询</text>
      <text x="115" y="66" text-anchor="middle" class="s">数据库自己求值</text>
    </g>
    <g transform="translate(576 250)">
      <rect width="440" height="92" rx="20" class="green"/>
      <text x="24" y="38" class="t">越界的行从未产生</text>
      <text x="24" y="66" class="s">没有东西可泄露，也不依赖模型守规矩</text>
    </g>
    <path d="M270 296 H570" stroke="#2a7468" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="420" y="284" text-anchor="middle" class="s">只剩可见行</text>

    <g transform="translate(40 356)">
      <rect width="230" height="36" rx="16" class="dark"/>
      <text x="115" y="24" text-anchor="middle" class="white" font-size="14" font-weight="740">数据层</text>
    </g>
    <g transform="translate(786 356)">
      <rect width="230" height="36" rx="16" class="dark"/>
      <text x="115" y="24" text-anchor="middle" class="white" font-size="14" font-weight="740">模型上下文</text>
    </g>

    <text x="530" y="446" text-anchor="middle" class="s">查询、字段、工具闸门三个执行点都在红线左边；动作体在右边，一旦被调用就是可信代码，没有数据层兜底。</text>
  </g>
</svg>
