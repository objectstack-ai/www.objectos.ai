      <text x="42" y="76" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Model API</text>
      <text x="42" y="114" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">optional boundary</text>
    </g>
    <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10">
