<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 328" role="img" aria-label="Four boxes on the left show where an enterprise definition lives today: in veterans’ heads, in policy documents, in spreadsheets, and in a few hundred thousand lines of code. A bus joins them into one dark box on the right, written down once: one definition with five parts — what we have, how it relates, what can be done, who may do it, and what happens when.">
  <defs><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f8b81"/></marker><marker id="ar-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c7a55"/></marker><marker id="ar-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b07a1a"/></marker><marker id="ar-onInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8cdc2"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style></defs>
  <rect width="900" height="328" fill="#f8faf7"/>
  <g transform="translate(30 30)">
    <rect x="0" y="0" width="360" height="58" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="11" y="25" font-size="14" font-weight="700" fill="#173a36" text-anchor="start">In veterans’ heads</text>
    <text x="11" y="47.25" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">“Ask Maria first”</text>
    <path d="M360 29 L420 29" fill="none" stroke="#6f8b81" stroke-width="1.6"/>
    <rect x="0" y="70" width="360" height="58" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="11" y="95" font-size="14" font-weight="700" fill="#173a36" text-anchor="start">In policy documents</text>
    <text x="11" y="117.25" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">Written, not followed</text>
    <path d="M360 99 L420 99" fill="none" stroke="#6f8b81" stroke-width="1.6"/>
    <rect x="0" y="140" width="360" height="58" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="11" y="165" font-size="14" font-weight="700" fill="#173a36" text-anchor="start">In spreadsheets</text>
    <text x="11" y="187.25" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">One version per department</text>
    <path d="M360 169 L420 169" fill="none" stroke="#6f8b81" stroke-width="1.6"/>
    <rect x="0" y="210" width="360" height="58" rx="12" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="11" y="235" font-size="14" font-weight="700" fill="#173a36" text-anchor="start">In a few hundred thousand lines of code</text>
    <text x="11" y="257.25" font-size="12.5" font-weight="400" fill="#5d736b" text-anchor="start">One change, four places</text>
    <path d="M360 239 L420 239" fill="none" stroke="#6f8b81" stroke-width="1.6"/>
    <path d="M420 29 L420 239" fill="none" stroke="#6f8b81" stroke-width="1.6"/>
    <path d="M420 134 L598 134" fill="none" stroke="#1c7a55" stroke-width="2.5" marker-end="url(#ar-accent)"/>
    <text x="510" y="120" font-size="12" font-weight="600" fill="#1c7a55" text-anchor="middle">Written down, once</text>
    <rect x="600" y="0" width="240" height="268" rx="14" fill="#22433d" stroke="#22433d" stroke-width="1"/>
    <text x="624" y="43" font-size="19" font-weight="700" fill="#eafff6" text-anchor="start">One definition</text>
    <text x="624" y="69.5" font-size="14.5" font-weight="400" fill="#a8cdc2" text-anchor="start"></text>
    <text x="624" y="90.525" font-size="14.5" font-weight="400" fill="#a8cdc2" text-anchor="start">what we have</text>
    <text x="624" y="111.55" font-size="14.5" font-weight="400" fill="#a8cdc2" text-anchor="start">how it relates</text>
    <text x="624" y="132.575" font-size="14.5" font-weight="400" fill="#a8cdc2" text-anchor="start">what can be done</text>
    <text x="624" y="153.6" font-size="14.5" font-weight="400" fill="#a8cdc2" text-anchor="start">who may do it</text>
    <text x="624" y="174.625" font-size="14.5" font-weight="400" fill="#a8cdc2" text-anchor="start">what happens when</text>
  </g>
</svg>
