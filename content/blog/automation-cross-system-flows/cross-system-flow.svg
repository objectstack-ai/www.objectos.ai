<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="跨系统自动化流程图：入口是 api 入站地址，接着读取对象、调用连接器、执行后续动作，失败分支进入补救，每一步写入运行日志">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#163b35}.h{font-size:30px;font-weight:780}.t{font-size:18px;font-weight:740}.s{font-size:14px;fill:#647872}.box{fill:#fffefa;stroke:#d7dfdb}.green{fill:#eef7f3}.yellow{fill:#fff3d6}.blue{fill:#edf2ff}.red{fill:#fff0ec}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f8faf8"/>
  <text x="70" y="60" class="h">外部调用也应该进入同一条流程</text>
  <text x="70" y="90" class="s">入口是 api 入站地址；Webhook 方向相反，是平台推给外部系统的出站订阅。</text>
  <g transform="translate(70 122)">
    <rect width="1060" height="418" rx="30" class="box"/>
    <g transform="translate(48 72)">
      <rect width="170" height="86" rx="22" class="green"/>
      <text x="85" y="35" text-anchor="middle" class="t">api 入站地址</text>
      <text x="85" y="60" text-anchor="middle" class="s">合同签署完成</text>
    </g>
    <g transform="translate(282 72)">
      <rect width="170" height="86" rx="22" class="yellow"/>
      <text x="85" y="35" text-anchor="middle" class="t">读取对象</text>
      <text x="85" y="60" text-anchor="middle" class="s">客户 / 合同</text>
    </g>
    <g transform="translate(516 72)">
      <rect width="170" height="86" rx="22" class="blue"/>
      <text x="85" y="35" text-anchor="middle" class="t">连接器调用</text>
      <text x="85" y="60" text-anchor="middle" class="s">查询应收状态</text>
    </g>
    <g transform="translate(750 72)">
      <rect width="190" height="86" rx="22" class="green"/>
      <text x="95" y="35" text-anchor="middle" class="t">后续动作</text>
      <text x="95" y="60" text-anchor="middle" class="s">创建任务和通知</text>
    </g>
    <path d="M222 115 H278 M456 115 H512 M690 115 H746" stroke="#2a7468" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(300 245)">
      <rect width="220" height="86" rx="22" class="red"/>
      <text x="110" y="35" text-anchor="middle" class="t">失败补救</text>
      <text x="110" y="60" text-anchor="middle" class="s">重试 / 人工复核</text>
    </g>
    <g transform="translate(620 245)">
      <rect width="220" height="86" rx="22" class="box"/>
      <text x="110" y="35" text-anchor="middle" class="t">运行日志</text>
      <text x="110" y="60" text-anchor="middle" class="s">调用结果可追踪</text>
    </g>
    <path d="M603 160 C603 210 410 210 410 241 M835 160 C835 210 730 210 730 241" fill="none" stroke="#d46b5f" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
