<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" role="img" aria-label="From a conversation into a governed business action">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.h{font-size:30px;font-weight:780}.t{font-size:17px;font-weight:740}.s{font-size:13px;fill:#657872}.box{fill:#fffefa;stroke:#d7dfdb}.green{fill:#eef7f2}.yellow{fill:#fff3d6}.blue{fill:#edf2ff}.dark{fill:#173a36}.white{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="594" fill="#f8faf7"/>
  <text x="70" y="64" class="h">One business action, serving both the person and the agent</text>
  <g transform="translate(70 108)">
    <rect width="1060" height="392" rx="30" class="box"/>
    <g transform="translate(55 140)">
      <rect width="220" height="110" rx="24" class="dark"/>
      <text x="110" y="44" text-anchor="middle" class="white" font-size="18" font-weight="760">User conversation</text>
      <text x="110" y="74" text-anchor="middle" class="soft" font-size="13">“Convert this lead for me”</text>
    </g>
    <g transform="translate(360 46)">
      <rect width="250" height="76" rx="20" class="green"/>
      <text x="125" y="45" text-anchor="middle" class="t">Exposed actions</text>
      <rect y="112" width="250" height="76" rx="20" class="yellow"/>
      <text x="125" y="157" text-anchor="middle" class="t">Risk and confirmation</text>
      <rect y="224" width="250" height="76" rx="20" class="blue"/>
      <text x="125" y="269" text-anchor="middle" class="t">Parameters and result</text>
    </g>
    <g transform="translate(720 46)">
      <rect width="245" height="300" rx="26" class="box"/>
      <text x="122" y="52" text-anchor="middle" class="t">The business action</text>
      <text x="122" y="106" text-anchor="middle" class="s">Update records</text>
      <text x="122" y="148" text-anchor="middle" class="s">Create tasks</text>
      <text x="122" y="190" text-anchor="middle" class="s">Start flows</text>
      <text x="122" y="232" text-anchor="middle" class="s">Enforce permissions</text>
      <text x="122" y="274" text-anchor="middle" class="s">Leave an audit trail</text>
    </g>
    <path d="M279 195 H356 M614 84 H716 M614 196 H716 M614 308 H716" stroke="#2a7468" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
