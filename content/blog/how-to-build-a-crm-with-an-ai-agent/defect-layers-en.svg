<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-label="Four machine layers and human review, showing which class of defect each one catches and the four defects found in this build">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f9fbf8"/>
      <stop offset="1" stop-color="#eef7f2"/>
    </linearGradient>
    <linearGradient id="teal2" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="amber2" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#b45309"/>
      <stop offset="1" stop-color="#e8973a"/>
    </linearGradient>
    <filter id="sh2" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#24342f" flood-opacity=".13"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .title{font-size:30px;font-weight:800}
      .sub{font-size:18px;fill:#5d736b}
      .stage{font-size:22px;font-weight:800;fill:#ffffff}
      .cmd{font-size:15px;fill:#d8f0ea;font-family:ui-monospace,"SF Mono",Menlo,monospace}
      .catches{font-size:17px;font-weight:700}
      .catchesS{font-size:16px;fill:#5d736b}
      .found{font-size:16px;fill:#8a5a12}
      .foundH{font-size:16px;fill:#7a4b12}
      .none{font-size:16px;fill:#8a9c95;font-style:italic}
      .tag{font-size:14px;font-weight:800;fill:#ffffff}
    </style>
  </defs>

  <rect width="1200" height="740" fill="url(#bg2)"/>

  <text class="title" x="64" y="66">Where each class of defect gets caught</text>
  <text class="sub" x="64" y="98">The four found while building this CRM — and the one only a person could find.</text>

  <!-- column headers -->
  <text class="catchesS" x="64" y="146" font-weight="700">LAYER</text>
  <text class="catchesS" x="404" y="146" font-weight="700">CATCHES</text>
  <text class="catchesS" x="770" y="146" font-weight="700">FOUND HERE</text>
  <line x1="64" y1="160" x2="1136" y2="160" stroke="#cfe2db" stroke-width="2"/>

  <!-- Row 1: validate -->
  <g filter="url(#sh2)"><rect x="64" y="180" width="304" height="88" rx="14" fill="url(#teal2)"/></g>
  <text class="stage" x="88" y="216">Author-time rules</text>
  <text class="cmd" x="88" y="244">objectstack validate</text>
  <text class="catches" x="404" y="212">A definition that is wrong on its face</text>
  <text class="catchesS" x="404" y="240">41 rules · missing decisions, bad shapes</text>
  <rect x="770" y="192" width="30" height="24" rx="7" fill="url(#amber2)"/>
  <text class="tag" x="781" y="209" text-anchor="middle">1</text>
  <text class="found" x="812" y="209">crm_deal declared no sharingModel —</text>
  <text class="found" x="812" y="233">the org-wide default nobody decided.</text>
  <text class="catchesS" x="812" y="256">rule: security-owd-unset</text>

  <!-- Row 2: build -->
  <g filter="url(#sh2)"><rect x="64" y="288" width="304" height="88" rx="14" fill="url(#teal2)"/></g>
  <text class="stage" x="88" y="324">Compile</text>
  <text class="cmd" x="88" y="352">objectstack build</text>
  <text class="catches" x="404" y="320">Protocol compliance; emits the artifact</text>
  <text class="catchesS" x="404" y="348">re-runs the same rules, writes 15.8 KB</text>
  <text class="none" x="770" y="334">nothing new — it passed clean</text>

  <!-- Row 3: boot -->
  <g filter="url(#sh2)"><rect x="64" y="396" width="304" height="88" rx="14" fill="url(#teal2)"/></g>
  <text class="stage" x="88" y="432">Boot</text>
  <text class="cmd" x="88" y="460">objectstack dev</text>
  <text class="catches" x="404" y="428">Valid metadata with nothing to run it</text>
  <text class="catchesS" x="404" y="456">capability wiring, executors, triggers</text>
  <rect x="770" y="400" width="30" height="24" rx="7" fill="url(#amber2)"/>
  <text class="tag" x="781" y="417" text-anchor="middle">2</text>
  <rect x="806" y="400" width="30" height="24" rx="7" fill="url(#amber2)"/>
  <text class="tag" x="817" y="417" text-anchor="middle">3</text>
  <text class="found" x="848" y="417">approval node had no executor;</text>
  <text class="found" x="848" y="441">record_change trigger never bound.</text>
  <text class="catchesS" x="848" y="464">The flow would never have fired.</text>

  <!-- Row 4: request -->
  <g filter="url(#sh2)"><rect x="64" y="504" width="304" height="88" rx="14" fill="url(#teal2)"/></g>
  <text class="stage" x="88" y="540">Runtime request</text>
  <text class="cmd" x="88" y="568">POST / PATCH /api/v1/data</text>
  <text class="catches" x="404" y="536">A request the definition forbids</text>
  <text class="catchesS" x="404" y="564">state machine, required fields, auth</text>
  <text class="none" x="770" y="542">no defects — it enforced as authored</text>

  <!-- Row 5: human -->
  <g filter="url(#sh2)"><rect x="64" y="612" width="304" height="88" rx="14" fill="url(#amber2)"/></g>
  <text class="stage" x="88" y="648">Human review</text>
  <text class="cmd" x="88" y="676" fill="#fbe8cf">reading the diff</text>
  <text class="catches" x="404" y="644" fill="#7a4b12">A decision that is valid but wrong</text>
  <text class="catchesS" x="404" y="672">no gate can check your requirements</text>
  <rect x="770" y="616" width="30" height="24" rx="7" fill="url(#amber2)"/>
  <text class="tag" x="781" y="633" text-anchor="middle">4</text>
  <text class="foundH" x="812" y="633">viewAllRecords: true on crm_deal —</text>
  <text class="foundH" x="812" y="657">every rep saw every deal. Validated,</text>
  <text class="foundH" x="812" y="681">built and booted perfectly.</text>
</svg>
