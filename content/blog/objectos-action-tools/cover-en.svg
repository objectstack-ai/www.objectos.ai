<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="AI moves work forward through governed business actions">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7faf6"/>
      <stop offset="1" stop-color="#fff4e3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.title{font-size:38px;font-weight:780}.lead{font-size:18px;fill:#5e716b}.label{font-size:18px;font-weight:760}.small{font-size:13px;fill:#657872}.invert{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="78" y="86" class="title">AI that acts, not just advises</text>
  <text x="78" y="124" class="lead">A conversation can trigger a governed business action — and only the ones you exposed</text>
  <g transform="translate(96 160)" filter="url(#shadow)">
    <rect width="1008" height="370" rx="32" fill="#fffefa" stroke="#d8dfd6"/>
    <g transform="translate(40 70)">
      <rect width="250" height="220" rx="28" fill="#173a36"/>
      <text x="125" y="54" text-anchor="middle" class="invert" font-size="19" font-weight="780">Intent</text>
      <text x="125" y="96" text-anchor="middle" class="soft" font-size="13">Convert this lead</text>
      <text x="125" y="128" text-anchor="middle" class="soft" font-size="13">Create a follow-up task</text>
      <text x="125" y="160" text-anchor="middle" class="soft" font-size="13">Start the approval</text>
    </g>
    <g transform="translate(364 70)">
      <rect width="280" height="220" rx="28" fill="#eef7f2" stroke="#bdd7cf"/>
      <text x="140" y="52" text-anchor="middle" class="label">Action definition</text>
      <text x="140" y="94" text-anchor="middle" class="small">Which actions AI may call</text>
      <text x="140" y="126" text-anchor="middle" class="small">What inputs they take</text>
      <text x="140" y="158" text-anchor="middle" class="small">Whether confirmation is required</text>
    </g>
    <g transform="translate(718 70)">
      <rect width="250" height="220" rx="28" fill="#edf2ff" stroke="#bdc8ee"/>
      <text x="125" y="52" text-anchor="middle" class="label">The same runtime</text>
      <text x="125" y="94" text-anchor="middle" class="small">Permissions</text>
      <text x="125" y="126" text-anchor="middle" class="small">Confirmation</text>
      <text x="125" y="158" text-anchor="middle" class="small">Audit</text>
      <text x="125" y="190" text-anchor="middle" class="small">Data updated</text>
    </g>
    <path d="M296 180 H358 M650 180 H712" stroke="#2a7468" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
