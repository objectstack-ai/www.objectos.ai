<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="One misspelled field name planted in three places on the bundled CRM, and what os validate on @objectstack/cli 18.2.0 answers. In a flow update_record node: an error, flow-node-write-unknown-field, anchored on the fields key, with Did you mean converted_opportunity, exit 1, reviewable as data. In a hook body written as ctx.input.probabilty: a warning, hook-body-write-unknown-field, anchored on the whole handler, with Did you mean probability, exit 0 and a green build, reviewable as code. In the hook body as the CRM ships it, through a local alias of ctx.input: nothing at all, exit 0, output identical to the clean run. A bar across the bottom: at run time all three are refused with INVALID_FIELD 400, the backstop that names the field but not the line that wrote it">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5e716b}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em}
      .name{font-size:20px;font-weight:780}
      .sub{font-size:13px;fill:#5e716b}
      .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#173a36}
      .row{font-size:14px}
      .small{font-size:13px;fill:#5e716b}
      .verdict{font-size:22px;font-weight:800}
      .exit{font-size:13px;font-weight:760}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">One misspelled field, three answers from os validate</text>
  <text x="60" y="80" class="note">The same mistake planted in the CRM's flow and in its hook, measured on @objectstack/cli 18.2.0. The runtime refuses all three; the gate does not.</text>

  <!-- 1 · flow node -->
  <g transform="translate(60 112)">
    <rect width="350" height="430" rx="22" fill="#eef7f2" stroke="#2a7468" stroke-width="2"/>
    <text x="22" y="34" class="cap" style="fill:#2a7468">1 · FLOW NODE · REVIEWS AS DATA</text>
    <text x="22" y="66" class="name">update_record fields map</text>
    <text x="22" y="90" class="sub">src/flows/convert-lead.flow.ts</text>
    <rect x="22" y="106" width="306" height="54" rx="10" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="36" y="129" class="code">fields: { status: 'converted', …</text>
    <text x="36" y="149" class="code">  converted_oportunity: { cel… } }</text>
    <text x="22" y="200" class="verdict" style="fill:#b3261e">✗ error</text>
    <text x="22" y="226" class="row">flow-node-write-unknown-field</text>
    <text x="22" y="252" class="row">"Did you mean 'converted_opportunity'?"</text>
    <text x="22" y="278" class="row">at flows[0].nodes[6].config.fields.</text>
    <text x="22" y="298" class="row">converted_oportunity — the exact key</text>
    <g transform="translate(22 346)">
      <rect width="306" height="60" rx="12" fill="#ffffff" stroke="#2a7468" stroke-width="1.5"/>
      <text x="16" y="25" class="exit" style="fill:#2a7468">exit 1 — the build fails</text>
      <text x="16" y="45" class="small">a literal key next to a literal object: a certainty</text>
    </g>
  </g>

  <!-- 2 · hook body, literal -->
  <g transform="translate(425 112)">
    <rect width="350" height="430" rx="22" fill="#ffffff" stroke="#e6d3b6" stroke-width="1.5"/>
    <text x="22" y="34" class="cap" style="fill:#8a6a3a">2 · HOOK BODY · REVIEWS AS CODE</text>
    <text x="22" y="66" class="name">Literal write to ctx.input</text>
    <text x="22" y="90" class="sub">the shape the write-set lint recognizes</text>
    <rect x="22" y="106" width="306" height="54" rx="10" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="36" y="138" class="code">if (…) ctx.input.probabilty = 100;</text>
    <text x="22" y="200" class="verdict" style="fill:#8a6a3a">⚠ warning</text>
    <text x="22" y="226" class="row">hook-body-write-unknown-field</text>
    <text x="22" y="252" class="row">"Did you mean 'probability'?"</text>
    <text x="22" y="278" class="row">at hooks[0].handler — the whole body</text>
    <text x="22" y="304" class="row">judged on the body lowered from the handler</text>
    <g transform="translate(22 346)">
      <rect width="306" height="60" rx="12" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="16" y="25" class="exit" style="fill:#8a6a3a">exit 0 — the build is green</text>
      <text x="16" y="45" class="small">a parser's best effort: advisory by design</text>
    </g>
  </g>

  <!-- 3 · hook body, aliased -->
  <g transform="translate(790 112)">
    <rect width="350" height="430" rx="22" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="34" class="cap" style="fill:#5e716b">3 · HOOK AS SHIPPED · REVIEWS AS CODE</text>
    <text x="22" y="66" class="name">Write through an alias</text>
    <text x="22" y="90" class="sub">src/hooks/opportunity.hook.ts, as in the repository</text>
    <rect x="22" y="106" width="306" height="54" rx="10" fill="#f6f8f7" stroke="#c9d8d1"/>
    <text x="36" y="129" class="code">const input = ctx.input;</text>
    <text x="36" y="149" class="code">if (…) input.probabilty = 100;</text>
    <text x="22" y="200" class="verdict" style="fill:#5e716b">— nothing</text>
    <text x="22" y="226" class="row">no rule fires; v1 does no data-flow analysis</text>
    <text x="22" y="252" class="row">output byte-identical to the clean run</text>
    <text x="22" y="278" class="row">"A missing warning is not a clean bill</text>
    <text x="22" y="298" class="row">of health."</text>
    <g transform="translate(22 346)">
      <rect width="306" height="60" rx="12" fill="#f6f8f7" stroke="#c9d8d1"/>
      <text x="16" y="25" class="exit" style="fill:#5e716b">exit 0 — silence</text>
      <text x="16" y="45" class="small">found on the first real write, not at validate</text>
    </g>
  </g>

  <!-- runtime bar -->
  <g transform="translate(60 568)">
    <rect width="1080" height="92" rx="16" fill="#173a36"/>
    <text x="24" y="34" class="cap" style="fill:#b9dcd0">AT RUN TIME · ALL THREE</text>
    <text x="24" y="62" class="code" style="fill:#ffffff">400  { "code": "INVALID_FIELD", "error": "Unknown field 'probabilty' on object 'crm_opportunity'" }</text>
    <text x="24" y="82" class="small" style="fill:#b9dcd0">The backstop is the same on every driver. What differs is when you find out, and whether the message names the line that wrote it.</text>
  </g>

  <text x="60" y="694" class="small">Measured: os validate and the REST API of examples/app-crm on the published @objectstack/cli 18.2.0; quotations from the hooks and hook-bodies docs.</text>
</svg>
