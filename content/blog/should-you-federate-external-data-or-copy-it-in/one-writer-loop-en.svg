<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="One writer per row, measured on 18.4.0: a pull job copies the ERP's PARTS table into the synced object syncdemo_part (run 1 read 6, run 2 read 3 of 7, run 3 read 3); a member's or an admin's edit of a copied row answers 403; a change goes back only through the declared action, which calls the ERP's API, and the next pull brings it home.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d58f0"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#087f5b"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .h{font-size:24px;font-weight:700;fill:#151a17}
      .t{font-size:18px;fill:#515b55}
      .m{font-family:ui-monospace,Menlo,monospace;font-size:17px;fill:#151a17}
      .b{font-size:18px;font-weight:700;fill:#3d58f0}
      .g{font-size:18px;font-weight:700;fill:#087f5b}
      .r{font-size:18px;font-weight:700;fill:#bd4b4b}
      .c{font-family:ui-monospace,Menlo,monospace;font-size:16px;fill:#151a17}
      .k{font-size:15px;font-weight:700;letter-spacing:.08em;fill:#626c66}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="40" y="44" class="k">ONE WRITER PER ROW · MEASURED ON @OBJECTSTACK/CLI 18.4.0</text>

  <rect x="40" y="80" width="300" height="190" rx="16" fill="#f3f7f2" stroke="#dfe7df" stroke-width="2"/>
  <text x="64" y="120" class="h">The old ERP</text>
  <text x="64" y="152" class="t">its own database, never</text>
  <text x="64" y="176" class="t">migrated, read-only to us</text>
  <text x="64" y="214" class="m">PARTS · 6 rows, then 7</text>
  <text x="64" y="244" class="m">UPDATED_AT = watermark</text>

  <rect x="860" y="80" width="300" height="190" rx="16" fill="#eef2ff" stroke="#3d58f0" stroke-width="2"/>
  <text x="884" y="120" class="h">The local copy</text>
  <text x="884" y="152" class="m">syncdemo_part</text>
  <text x="884" y="180" class="m">managedBy: 'synced'</text>
  <text x="884" y="214" class="t">reports, flows and AI</text>
  <text x="884" y="238" class="t">read it like any object</text>

  <path d="M346 130 H 852" stroke="#3d58f0" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="420" y="114" class="b">the pull: the only writer of a row</text>
  <rect x="372" y="150" width="456" height="38" rx="19" fill="#f3f7f2"/>
  <text x="392" y="175" class="c">run 1 · read 6 · created 6</text>
  <rect x="372" y="196" width="456" height="38" rx="19" fill="#f3f7f2"/>
  <text x="392" y="221" class="c">run 2 · read 3 of 7 · created 1 · updated 2</text>
  <rect x="372" y="242" width="456" height="38" rx="19" fill="#f3f7f2"/>
  <text x="392" y="267" class="c">run 3 · read 3 · updated 3</text>

  <rect x="820" y="318" width="340" height="104" rx="16" fill="#fbeeee" stroke="#bd4b4b" stroke-width="2"/>
  <text x="844" y="354" class="r">Edit the copy: refused</text>
  <text x="844" y="384" class="m">PATCH, POST, DELETE</text>
  <text x="844" y="408" class="m">→ 403 PERMISSION_DENIED</text>
  <path d="M1010 276 V 312" stroke="#bd4b4b" stroke-width="3" fill="none" stroke-dasharray="6 6"/>

  <rect x="40" y="470" width="1120" height="210" rx="16" fill="#f3f7f2" stroke="#dfe7df" stroke-width="2"/>
  <text x="226" y="506" class="g">Change the source: one declared door, then the next pull reconciles</text>
  <rect x="820" y="530" width="316" height="124" rx="12" fill="#ffffff" stroke="#dfe7df"/>
  <text x="840" y="566" class="h">Action</text>
  <text x="840" y="596" class="m">syncdemo_send_price</text>
  <text x="840" y="624" class="t">gated, audited, reviewed</text>
  <rect x="430" y="530" width="340" height="124" rx="12" fill="#ffffff" stroke="#dfe7df"/>
  <text x="450" y="566" class="h">Flow → connector</text>
  <text x="450" y="596" class="m">connector_action</text>
  <text x="450" y="624" class="m">PATCH /parts/P-2001</text>
  <rect x="64" y="530" width="316" height="124" rx="12" fill="#ffffff" stroke="#dfe7df"/>
  <text x="84" y="566" class="h">ERP API</text>
  <text x="84" y="596" class="m">unit_price 3.80 → 4.10</text>
  <text x="84" y="624" class="t">copy still 3.80 until run 3</text>
  <path d="M814 592 H 778" stroke="#087f5b" stroke-width="4" fill="none" marker-end="url(#ag)"/>
  <path d="M424 592 H 388" stroke="#087f5b" stroke-width="4" fill="none" marker-end="url(#ag)"/>
  <path d="M190 524 V 278" stroke="#087f5b" stroke-width="4" fill="none" marker-end="url(#ag)" stroke-dasharray="10 8"/>
  <path d="M978 524 V 428" stroke="#087f5b" stroke-width="4" fill="none" stroke-dasharray="10 8"/>
</svg>
