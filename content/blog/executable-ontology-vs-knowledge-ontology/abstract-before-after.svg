<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="一个键，三个版本：对象 schema 上的 abstract，用每个已发布的 @objectstack/spec 解析同一个对象实测。15.1.1，2026-07-17，之前：abstract: z.boolean().optional().default(false).describe('Is abstract base object (cannot be instantiated)')；台账写着 dead、没有运行时读者，抽象对象照样建表、照样可以实例化；结论是被解析、无人读取——create() 与 parse() 都接受。16.0.0，2026-07-21：ADR-0049 要么强制执行要么移除，没有已承诺的继承功能，于是这个键被移除；create() 抛错并点名这次移除，parse() 仍然静默丢弃这个键；结论是只关了一半，两个入口关了一个。17.7.0，2026-10-06，之后：Unrecognized key(s) on this object: abstract——abstract 已从规范移除（ADR-0049），对象继承/抽象并未实现，Remove the key；结论是每个键都有读者——create() 抛错，parse() 拒绝。下方是 ADR-0049 的三种状态：已强制执行，有运行时读者改变某个决定；实验性，显式标注并记录为尚未强制执行；不存在，从规范中移除。第四种状态——被解析、未标注、未强制执行——是被禁止的。">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#52655f}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#52655f}
      .capA{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#7a5a2c}
      .capB{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#256a5e}
      .code{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#173a36}
      .row{font-size:13px;fill:#173a36}
      .sub{font-size:13px;fill:#52655f}
      .strong{font-size:14px;font-weight:780;fill:#173a36}
      .verdictA{font-size:13px;font-weight:780;fill:#7a5a2c}
      .verdictB{font-size:13px;font-weight:780;fill:#256a5e}
      .chipT{font-size:14px;font-weight:780;fill:#173a36}
      .chipS{font-size:13px;fill:#52655f}
      .small{font-size:13px;fill:#52655f}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">一个键，三个版本：对象 schema 上的 abstract</text>
  <text x="60" y="80" class="note">同一个对象，依次用每个已发布的 @objectstack/spec 解析；日期为 npm 发布日期。</text>

  <!-- 时间线 -->
  <line x1="60" y1="112" x2="1140" y2="112" stroke="#c9d8d1" stroke-width="2"/>
  <circle cx="230" cy="112" r="7" fill="#e6d3b6"/>
  <circle cx="600" cy="112" r="7" fill="#e6d3b6"/>
  <circle cx="970" cy="112" r="7" fill="#256a5e"/>

  <!-- 15.1.1 -->
  <g transform="translate(60 132)">
    <rect width="340" height="318" rx="20" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="32" class="capA">15.1.1 · 2026-07-17 · 之前</text>
    <g transform="translate(22 48)">
      <rect width="296" height="86" rx="10" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="12" y="22" class="code">abstract: z.boolean()</text>
      <text x="12" y="40" class="code">&#160;&#160;.optional().default(false)</text>
      <text x="12" y="58" class="code">&#160;&#160;.describe('Is abstract base</text>
      <text x="12" y="76" class="code">&#160;&#160;object (cannot be instantiated)')</text>
    </g>
    <text x="22" y="164" class="strong">台账：dead · 没有运行时读者</text>
    <text x="22" y="188" class="row">抽象对象照样建表，</text>
    <text x="22" y="208" class="row">照样可以实例化。</text>
    <g transform="translate(22 236)">
      <rect width="296" height="60" rx="12" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="16" y="25" class="verdictA">被解析，无人读取。</text>
      <text x="16" y="45" class="sub">create() 接受 · parse() 接受</text>
    </g>
  </g>

  <!-- 16.0.0 -->
  <g transform="translate(430 132)">
    <rect width="340" height="318" rx="20" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="32" class="capA">16.0.0 · 2026-07-21</text>
    <g transform="translate(22 48)">
      <rect width="296" height="86" rx="10" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="12" y="24" class="strong">ADR-0049：要么强制执行，要么移除</text>
      <text x="12" y="46" class="row">没有已承诺的继承功能，</text>
      <text x="12" y="66" class="row">于是这个键被移除。</text>
    </g>
    <text x="22" y="164" class="strong">create()：抛错，点名这次移除</text>
    <text x="22" y="188" class="row">parse()：仍然静默丢弃这个键——</text>
    <text x="22" y="208" class="row">编写路径关上了，解析路径没有。</text>
    <g transform="translate(22 236)">
      <rect width="296" height="60" rx="12" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="16" y="25" class="verdictA">只关了一半。</text>
      <text x="16" y="45" class="sub">两个入口关了一个</text>
    </g>
  </g>

  <!-- 17.7.0 -->
  <g transform="translate(800 132)">
    <rect width="340" height="318" rx="20" fill="#eef7f2" stroke="#256a5e" stroke-width="2"/>
    <text x="22" y="32" class="capB">17.7.0 · 2026-10-06 · 之后</text>
    <g transform="translate(22 48)">
      <rect width="296" height="86" rx="10" fill="#ffffff" stroke="#b9dcd0"/>
      <text x="12" y="22" class="code">Unrecognized key(s) on this</text>
      <text x="12" y="40" class="code">object: `abstract`.</text>
      <text x="12" y="58" class="code">&#160;&#160;• abstract was removed from the</text>
      <text x="12" y="76" class="code">&#160;&#160;spec (ADR-0049) … Remove the key.</text>
    </g>
    <text x="22" y="164" class="strong">墓碑，附带处方</text>
    <text x="22" y="188" class="row">对象继承/抽象并未实现。</text>
    <text x="22" y="208" class="row">Remove the key.</text>
    <g transform="translate(22 236)">
      <rect width="296" height="60" rx="12" fill="#ffffff" stroke="#256a5e" stroke-width="1.5"/>
      <text x="16" y="25" class="verdictB">每个键都有读者。</text>
      <text x="16" y="45" class="sub">create() 抛错 · parse() 拒绝</text>
    </g>
  </g>

  <!-- ADR-0049 的三种状态 -->
  <text x="60" y="490" class="cap">ADR-0049——一个键恰好处于三种状态之一</text>
  <g transform="translate(60 502)">
    <rect width="350" height="56" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="24" class="chipT">已强制执行</text>
    <text x="18" y="44" class="chipS">有运行时读者，它改变某个决定</text>
  </g>
  <g transform="translate(425 502)">
    <rect width="350" height="56" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="24" class="chipT">实验性</text>
    <text x="18" y="44" class="chipS">显式标注，并记录为尚未强制执行</text>
  </g>
  <g transform="translate(790 502)">
    <rect width="350" height="56" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="18" y="24" class="chipT">不存在</text>
    <text x="18" y="44" class="chipS">从规范中移除</text>
  </g>
  <text x="60" y="582" class="small">第四种状态——被解析、未标注、未强制执行——是被禁止的。abstract 没有读者、也没有已承诺的功能，所以它不存在。</text>
  <text x="60" y="602" class="small">来源：npm 上的 @objectstack/spec 15.1.1、16.0.0 与 17.7.0；packages/spec/src/data/object.zod.ts；docs/adr/0049；packages/spec/liveness/README.md。</text>
</svg>
