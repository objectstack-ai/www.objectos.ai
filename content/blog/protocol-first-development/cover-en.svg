<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Protocol-first development: a platform offers control, revenue and lock-in; a protocol offers freedom, interoperability and long-term sustainability, and ObjectStack chose the protocol">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8faf7"/><stop offset=".55" stop-color="#eef7f2"/><stop offset="1" stop-color="#fff3df"/></linearGradient><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f8b81"/></marker><marker id="ar-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c7a55"/></marker><marker id="ar-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b07a1a"/></marker><marker id="ar-onInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8cdc2"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g transform="translate(0 0)">
    <text x="96" y="76" font-size="16" font-weight="700" fill="#5d736b" text-anchor="start">OPEN STANDARDS OVER PROPRIETARY PLATFORMS · JANUARY 2024</text>
    <text x="96" y="158" font-size="60" font-weight="780" fill="#173a36" text-anchor="start">Protocol-first</text>
    <text x="96" y="230" font-size="60" font-weight="780" fill="#1c7a55" text-anchor="start">development</text>
    <rect x="96" y="296" width="470" height="310" rx="18" fill="#ffffff" stroke="#d7dfdb" stroke-width="1"/>
    <text x="126" y="338" font-size="24" font-weight="760" fill="#173a36" text-anchor="start">Platform</text>
    <text x="126" y="366" font-size="15" font-weight="400" fill="#5d736b" text-anchor="start">Build it, own the ecosystem</text>
    <rect x="126" y="392" width="410" height="46" rx="10" fill="#f4f1ea" stroke="#d7dfdb" stroke-width="1"/>
    <text x="148" y="422" font-size="17" font-weight="600" fill="#173a36" text-anchor="start">Control</text>
    <rect x="126" y="454" width="410" height="46" rx="10" fill="#f4f1ea" stroke="#d7dfdb" stroke-width="1"/>
    <text x="148" y="484" font-size="17" font-weight="600" fill="#173a36" text-anchor="start">Revenue</text>
    <rect x="126" y="516" width="410" height="46" rx="10" fill="#f4f1ea" stroke="#d7dfdb" stroke-width="1"/>
    <text x="148" y="546" font-size="17" font-weight="600" fill="#173a36" text-anchor="start">Lock-in</text>
    <rect x="634" y="296" width="470" height="310" rx="18" fill="#22433d"/>
    <text x="664" y="338" font-size="24" font-weight="760" fill="#eafff6" text-anchor="start">Protocol</text>
    <text x="664" y="366" font-size="15" font-weight="400" fill="#a8cdc2" text-anchor="start">Publish it, let anyone implement it</text>
    <rect x="664" y="392" width="410" height="46" rx="10" fill="#2f5a51" stroke="#4f8577" stroke-width="1"/>
    <text x="686" y="422" font-size="17" font-weight="600" fill="#eafff6" text-anchor="start">Freedom</text>
    <rect x="664" y="454" width="410" height="46" rx="10" fill="#2f5a51" stroke="#4f8577" stroke-width="1"/>
    <text x="686" y="484" font-size="17" font-weight="600" fill="#eafff6" text-anchor="start">Interoperability</text>
    <rect x="664" y="516" width="410" height="46" rx="10" fill="#2f5a51" stroke="#4f8577" stroke-width="1"/>
    <text x="686" y="546" font-size="17" font-weight="600" fill="#eafff6" text-anchor="start">Long-term sustainability</text>
    <text x="600" y="648" font-size="16" font-weight="700" fill="#1c7a55" text-anchor="middle">ObjectStack chose the protocol →</text>
  </g>
</svg>
