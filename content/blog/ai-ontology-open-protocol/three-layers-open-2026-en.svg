<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Three layers decide portability: the interface is open via MCP, the definition is opening as code in a repository, and the runtime did not move">
  <defs>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#24342f" flood-opacity=".13"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h1{font-size:26px;font-weight:780}
      .sub{font-size:14px;fill:#5d736b}
      .layer{font-size:23px;font-weight:760}
      .gloss{font-size:15px;fill:#5d736b}
      .verdict{font-size:20px;font-weight:720}
      .v-open{fill:#1c7a55}
      .v-part{fill:#8a6412}
      .v-shut{fill:#a8452f}
      .detail{font-size:15px;fill:#5d736b}
      .foot{font-size:15px;font-weight:640;fill:#22433d}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#f8faf7"/>

  <text x="70" y="58" class="h1">Three layers decide portability</text>
  <text x="70" y="86" class="sub">What the ontology category opened in 2026 — and the one layer it did not</text>

  <g filter="url(#shadow3)">
    <!-- interface -->
    <g transform="translate(70 132)">
      <rect width="1060" height="110" rx="16" fill="#ffffff"/>
      <text x="32" y="46" class="layer">Interface</text>
      <text x="32" y="78" class="gloss">How an agent calls the ontology</text>
      <line x1="660" y1="22" x2="660" y2="88" stroke="#dfe9e2" stroke-width="2"/>
      <text x="700" y="46" class="verdict v-open">Open</text>
      <text x="700" y="78" class="detail">MCP, adopted by the vendors themselves</text>
    </g>

    <!-- definition -->
    <g transform="translate(70 264)">
      <rect width="1060" height="110" rx="16" fill="#ffffff"/>
      <text x="32" y="46" class="layer">Definition</text>
      <text x="32" y="78" class="gloss">The objects, actions and permissions</text>
      <line x1="660" y1="22" x2="660" y2="88" stroke="#dfe9e2" stroke-width="2"/>
      <text x="700" y="46" class="verdict v-part">Opening in form</text>
      <text x="700" y="78" class="detail">Code in a repo, bound to one platform</text>
    </g>

    <!-- runtime -->
    <g transform="translate(70 396)">
      <rect width="1060" height="110" rx="16" fill="#fff6e4"/>
      <text x="32" y="46" class="layer">Runtime</text>
      <text x="32" y="78" class="gloss">What executes an action and enforces the rules</text>
      <line x1="660" y1="22" x2="660" y2="88" stroke="#ecd8ad" stroke-width="2"/>
      <text x="700" y="46" class="verdict v-shut">Unmoved</text>
      <text x="700" y="78" class="detail">No vendor shipped a substitutable one</text>
    </g>
  </g>

  <text x="70" y="542" class="foot">The runtime is the last closed layer — the one a platform business cannot open without changing what it sells.</text>
</svg>
