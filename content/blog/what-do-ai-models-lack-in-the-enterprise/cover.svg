<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="AI 模型进了企业还缺什么？一个世界、一双手、一道围栏：缺的不是智力，而是企业要供给的三样东西，以及同时供给这三样的那一个工件——可执行的业务本体：本体是世界，以工具形式暴露的动作是双手，每一次调用都裁决的权限、行级与字段级安全和审计是围栏">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em;fill:#2a7468}
      .title{font-size:60px;font-weight:800;fill:#173a36}
      .lead{font-size:19px;fill:#3f554f}
      .chip{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:600;fill:#2a7468}
      .kicker{font-size:12px;font-weight:780;letter-spacing:.12em;fill:#2a7468}
      .bandTitle{font-size:21px;font-weight:760;fill:#173a36}
      .small{font-size:14px;fill:#4f625c}
      .foot{font-size:13px;fill:#4f625c}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="118" class="eyebrow">模型缺的是什么</text>
  <text x="78" y="196" class="title">一个世界，</text>
  <text x="78" y="266" class="title">一双手，</text>
  <text x="78" y="336" class="title">一道围栏。</text>
  <text x="78" y="398" class="lead">缺的不是智力。企业要供给的三样东西，</text>
  <text x="78" y="425" class="lead">以及同时供给这三样的那一个工件。</text>

  <g transform="translate(78 454)">
    <rect width="372" height="38" rx="19" fill="#ffffff" stroke="#b9dcd0"/>
    <text x="186" y="24" class="chip" text-anchor="middle">objectstack.config.ts → objectstack.json</text>
  </g>

  <g transform="translate(640 112)">
    <rect width="482" height="124" rx="18" fill="#f4faf7" stroke="#c9d8d1"/>
    <text x="28" y="32" class="kicker" style="fill:#2a7468">世界</text>
    <text x="28" y="62" class="bandTitle">本体</text>
    <text x="28" y="86" class="small">对象 · 字段 · 关系：类型化的名词</text>
    <text x="28" y="106" class="small">推导出数据库 · API · describe_object</text>
  </g>
  <g transform="translate(640 256)">
    <rect width="482" height="124" rx="18" fill="#fdf4e8" stroke="#e6d3b6"/>
    <text x="28" y="32" class="kicker" style="fill:#a35a1f">双手</text>
    <text x="28" y="62" class="bandTitle">以工具形式暴露的动作</text>
    <text x="28" y="86" class="small">对象默认就是工具；动作要主动开启</text>
    <text x="28" y="106" class="small">ai: { exposed: true }，十二个 MCP 工具</text>
  </g>
  <g transform="translate(640 400)">
    <rect width="482" height="124" rx="18" fill="#eef1f8" stroke="#c7cde0"/>
    <text x="28" y="32" class="kicker" style="fill:#3d4f7c">围栏</text>
    <text x="28" y="62" class="bandTitle">每一次调用都裁决</text>
    <text x="28" y="86" class="small">权限 · 行级 · 字段级 · 共享 · 审计</text>
    <text x="28" y="106" class="small">REST、Console 与 MCP 走同一道中间件</text>
  </g>

  <text x="78" y="618" class="foot">出自 ObjectStack 首页的一句话，逐项对到运行时里供给它的机制，附文件与行号。</text>
</svg>
