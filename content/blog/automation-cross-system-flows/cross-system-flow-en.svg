<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="A cross-system step: an inbound api hook feeds a connector action that crosses the runtime boundary to an opaque finance system, with a fault edge routing failure to a manual review task, and a note that a status code proves delivery but not effect">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:27px;font-weight:780}.t{font-size:17px;font-weight:730}
      .s{font-size:13px;fill:#647872}
      .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#647872}
      .col{font-size:12px;font-weight:700;fill:#5d736b;letter-spacing:.09em}
      .box{fill:#fffefa;stroke:#d7dfdb}
      .warn{fill:#9a3b1f}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d46b5f"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#f8faf8"/>

  <text x="70" y="52" class="h">Everything past the dashed line is a declaration, not an observation.</text>
  <text x="70" y="82" class="s">The engine can prove what it wrote to its own tables. Across the wire it can only report what the action declared it would do.</text>

  <!-- crossing -->
  <g transform="translate(70 108)">
    <rect width="1060" height="300" rx="26" class="box"/>

    <!-- boundary -->
    <path d="M600 24 V276" stroke="#a8bcb4" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="584" y="48" text-anchor="end" class="col">YOUR RUNTIME</text>
    <text x="616" y="48" class="col">THE OTHER SYSTEM</text>

    <!-- row 1 -->
    <g transform="translate(36 78)">
      <rect width="180" height="82" rx="20" fill="#eef7f3" stroke="#c6ded4"/>
      <text x="90" y="34" text-anchor="middle" class="t">Inbound api hook</text>
      <text x="90" y="58" text-anchor="middle" class="mono">contract signed</text>
    </g>

    <g transform="translate(258 78)">
      <rect width="290" height="82" rx="20" fill="#edf2ff" stroke="#c3cfe8"/>
      <text x="145" y="32" text-anchor="middle" class="t">connector_action</text>
      <text x="145" y="54" text-anchor="middle" class="mono">finance_erp.get_receivable_balance</text>
      <g transform="translate(95 62)">
        <rect width="100" height="20" rx="7" fill="#fffefa" stroke="#c3cfe8"/>
        <text x="50" y="14" text-anchor="middle" class="mono" font-size="11">effect: read</text>
      </g>
    </g>

    <g transform="translate(660 78)">
      <rect width="240" height="82" rx="20" fill="#eef1f0" stroke="#b9c6c1" stroke-dasharray="7 6"/>
      <text x="120" y="34" text-anchor="middle" class="t" fill="#5d736b">Finance ERP</text>
      <text x="120" y="58" text-anchor="middle" class="s">opaque to your engine</text>
    </g>

    <path d="M220 119 H252" stroke="#2a7468" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M552 119 H654" stroke="#2a7468" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- what comes back -->
    <g transform="translate(660 196)">
      <rect width="360" height="66" rx="16" fill="#fffefa" stroke="#dbe5df"/>
      <text x="20" y="28" class="t" font-size="15">A status code proves delivery.</text>
      <text x="20" y="50" class="s">It does not prove what the request changed.</text>
    </g>

    <!-- fault path -->
    <g transform="translate(258 196)">
      <rect width="290" height="66" rx="16" fill="#fff0ec" stroke="#e6b3a9"/>
      <text x="145" y="28" text-anchor="middle" class="t" font-size="15">Manual review task</text>
      <text x="145" y="50" text-anchor="middle" class="mono warn">edge type: fault</text>
    </g>
    <path d="M403 164 V190" stroke="#d46b5f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  </g>

  <!-- three answers -->
  <text x="70" y="452" class="col">SO THE STEP REPORTS ONE OF EXACTLY THREE THINGS</text>

  <g transform="translate(70 470)">
    <rect width="336" height="122" rx="18" fill="#eef7f3" stroke="#c6ded4"/>
    <text x="24" y="40" class="t" font-size="20" font-family="ui-monospace,Menlo,monospace">acted: 0</text>
    <text x="24" y="68" class="s">A real zero. This step could not have</text>
    <text x="24" y="88" class="s">changed anything upstream.</text>
    <text x="24" y="110" class="mono">declared read · GET / HEAD / OPTIONS</text>
  </g>
  <g transform="translate(432 470)">
    <rect width="336" height="122" rx="18" fill="#e7f2ec" stroke="#bcd6cb"/>
    <text x="24" y="40" class="t" font-size="20" font-family="ui-monospace,Menlo,monospace">acted: 1</text>
    <text x="24" y="68" class="s">The upstream accepted a change,</text>
    <text x="24" y="88" class="s">and said so.</text>
    <text x="24" y="110" class="mono">declared write · dispatch succeeded</text>
  </g>
  <g transform="translate(794 470)">
    <rect width="336" height="122" rx="18" fill="#fdece4" stroke="#e6b3a9"/>
    <text x="24" y="40" class="t warn" font-size="20" font-family="ui-monospace,Menlo,monospace">unmeasured</text>
    <text x="24" y="68" class="s">Cannot tell. An effect happened or</text>
    <text x="24" y="88" class="s">may have, and is not countable.</text>
    <text x="24" y="110" class="mono">undeclared · a write that threw · queued</text>
  </g>

  <g transform="translate(70 614)">
    <rect width="1060" height="56" rx="16" fill="#173a36"/>
    <text x="28" y="34" fill="#eafff6" font-size="15" font-family="ui-monospace,Menlo,monospace">acted=0 unmeasured=12  →  twelve calls went out and none of them is countable. Not the same as "did nothing".</text>
  </g>
</svg>
