<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ObjectStack 自托管运行时架构</title>
  <desc id="desc">开源 ObjectStack Runtime 位于客户可控边界内，ObjectOS 是可选的商业运营层，AI 模型可按需接入。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="52%" stop-color="#10241f"/>
      <stop offset="100%" stop-color="#16213b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#020617" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity=".12" stroke="#94a3b8" stroke-width="1">
    <path d="M0 190H1600M0 390H1600M0 590H1600M0 790H1600"/>
    <path d="M210 0V1000M510 0V1000M810 0V1000M1110 0V1000M1410 0V1000"/>
  </g>
  <g transform="translate(150 130)" filter="url(#shadow)">
    <rect width="1300" height="740" rx="34" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="70" y="72" width="730" height="580" rx="26" fill="#101f1b" stroke="#10b981" stroke-opacity=".55" stroke-width="2"/>
    <g transform="translate(112 112)">
      <circle cx="18" cy="18" r="18" fill="#10b981"/>
      <path d="M11 18h14M18 11v14" stroke="#052e1f" stroke-width="3" stroke-linecap="round"/>
      <text x="52" y="26" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">私有运行环境</text>
    </g>
    <g transform="translate(120 240)">
      <rect width="280" height="126" rx="20" fill="url(#panel)" stroke="#475569"/>
      <text x="32" y="54" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">ObjectStack</text>
      <text x="32" y="90" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">运行时 · 开源</text>
    </g>
    <g transform="translate(478 240)">
      <rect width="224" height="126" rx="20" fill="#102233" stroke="#2563eb"/>
      <text x="32" y="54" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">AI</text>
      <text x="32" y="90" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="18">智能体</text>
    </g>
    <path d="M400 336H438V417H478" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
    <g transform="translate(120 470)">
      <rect width="170" height="94" rx="16" fill="#152033" stroke="#475569"/>
      <text x="34" y="58" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">数据库</text>
    </g>
    <g transform="translate(342 470)">
      <rect width="170" height="94" rx="16" fill="#152033" stroke="#475569"/>
      <text x="34" y="58" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">身份系统</text>
    </g>
    <g transform="translate(564 470)">
      <rect width="170" height="94" rx="16" fill="#152033" stroke="#475569"/>
      <text x="34" y="58" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">文件</text>
    </g>
    <g stroke="#10b981" stroke-width="4" stroke-linecap="round" opacity=".82">
      <path d="M400 303H478"/>
      <path d="M205 470V366"/>
      <path d="M427 470V366"/>
      <path d="M649 470V366"/>
    </g>
    <!-- painted after the connectors so the Files–AI line runs behind the label, not through it -->
    <g transform="translate(478 390)">
      <rect width="224" height="54" rx="14" fill="#142033" stroke="#60a5fa" stroke-dasharray="8 8"/>
      <text x="112" y="34" text-anchor="middle" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">ObjectOS · 可选商业运营层</text>
    </g>
    <g transform="translate(890 190)">
      <rect width="360" height="178" rx="24" fill="#172033" stroke="#64748b" stroke-dasharray="12 12" stroke-width="2"/>
      <text x="42" y="76" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">模型 API</text>
      <text x="42" y="114" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">可选边界</text>
    </g>
    <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10">
      <path d="M770 303H890"/>
    </g>
    <g transform="translate(890 482)">
      <rect width="360" height="132" rx="22" fill="#201a11" stroke="#f59e0b" stroke-opacity=".76" stroke-width="2"/>
      <text x="42" y="60" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">审计</text>
      <text x="42" y="96" fill="#fef3c7" font-family="Inter, Arial, sans-serif" font-size="18">审批 · 策略</text>
    </g>
  </g>
</svg>
