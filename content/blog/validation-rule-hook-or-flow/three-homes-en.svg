<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="A decision tree with three homes for a business rule. First question: can it be decided from the one record being written, with no I/O? Yes: a validation rule on the object, script, cross_field or state_machine, which runs on insert and update and never on delete, and reviews as data. No, second question: must it change the record before it is saved, or intercept a read? Yes: a before hook, which runs inline, cannot pause, and reviews as code. No: a flow, the default, for side effects, approvals, anything that pauses or runs on a clock, which reviews as data. Footer: blocking a delete is a beforeDelete hook, because validation rules have no delete event">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5e716b}
      .q{font-size:17px;font-weight:760}
      .qs{font-size:13px;fill:#5e716b}
      .yn{font-size:12px;font-weight:780;letter-spacing:.08em;fill:#5e716b}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em}
      .name{font-size:21px;font-weight:780}
      .row{font-size:14px}
      .small{font-size:13px;fill:#5e716b}
      .verdict{font-size:13px;font-weight:760}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a9b95"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">Three homes, two questions</text>
  <text x="60" y="80" class="note">The decision the docs carry as a table, drawn as the two questions a reviewer asks of every rule in a diff.</text>

  <!-- Question 1 -->
  <g transform="translate(60 118)">
    <rect width="330" height="120" rx="18" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="34" class="cap" style="fill:#5e716b">QUESTION 1</text>
    <text x="22" y="64" class="q">Decidable from the one record</text>
    <text x="22" y="88" class="q">being written, with no I/O?</text>
    <text x="22" y="108" class="qs">incoming write + prior record, nothing else</text>
  </g>

  <!-- Question 2 -->
  <g transform="translate(60 372)">
    <rect width="330" height="120" rx="18" fill="#ffffff" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="22" y="34" class="cap" style="fill:#5e716b">QUESTION 2</text>
    <text x="22" y="64" class="q">Must it change the record before</text>
    <text x="22" y="88" class="q">it is saved, or intercept a read?</text>
    <text x="22" y="108" class="qs">the pending payload, or beforeFind / afterFind</text>
  </g>

  <!-- arrows -->
  <line x1="225" y1="238" x2="225" y2="368" stroke="#8a9b95" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="200" y="290" width="50" height="22" rx="11" fill="#fbfdfc"/>
  <text x="225" y="306" class="yn" text-anchor="middle">NO</text>

  <line x1="390" y1="178" x2="470" y2="178" stroke="#8a9b95" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="405" y="156" width="50" height="22" rx="11" fill="#fbfdfc"/>
  <text x="430" y="172" class="yn" text-anchor="middle">YES</text>

  <line x1="390" y1="432" x2="470" y2="432" stroke="#8a9b95" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="405" y="410" width="50" height="22" rx="11" fill="#fbfdfc"/>
  <text x="430" y="426" class="yn" text-anchor="middle">YES</text>

  <line x1="225" y1="492" x2="225" y2="570" stroke="#8a9b95" stroke-width="2"/>
  <line x1="225" y1="570" x2="810" y2="570" stroke="#8a9b95" stroke-width="2"/>
  <line x1="810" y1="570" x2="810" y2="518" stroke="#8a9b95" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="200" y="520" width="50" height="22" rx="11" fill="#fbfdfc"/>
  <text x="225" y="536" class="yn" text-anchor="middle">NO</text>

  <!-- Home 1: validation rule -->
  <g transform="translate(474 104)">
    <rect width="330" height="150" rx="18" fill="#f4faf7" stroke="#2a7468" stroke-width="1.5"/>
    <text x="22" y="32" class="cap" style="fill:#2a7468">HOME 1 · REVIEWS AS DATA</text>
    <text x="22" y="62" class="name">Validation rule</text>
    <text x="22" y="86" class="row">on the object: script · cross_field · state_machine</text>
    <text x="22" y="108" class="row">runs on every insert and update, whoever writes</text>
    <text x="22" y="132" class="small">never on delete: a delete has no payload to validate</text>
  </g>

  <!-- Home 2: before hook -->
  <g transform="translate(474 358)">
    <rect width="330" height="150" rx="18" fill="#fdf4e8" stroke="#e6d3b6" stroke-width="1.5"/>
    <text x="22" y="32" class="cap" style="fill:#8a6a3a">HOME 2 · REVIEWS AS CODE</text>
    <text x="22" y="62" class="name">Before hook</text>
    <text x="22" y="86" class="row">beforeInsert / beforeUpdate rewrite ctx.input</text>
    <text x="22" y="108" class="row">runs inline — cannot pause, cannot wait</text>
    <text x="22" y="132" class="small">the backstop for what a node graph cannot express</text>
  </g>

  <!-- Home 3: flow -->
  <g transform="translate(840 358)">
    <rect width="300" height="150" rx="18" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="22" y="32" class="cap" style="fill:#2a7468">HOME 3 · REVIEWS AS DATA</text>
    <text x="22" y="62" class="name">Flow — the default</text>
    <text x="22" y="86" class="row">side effects after a save, approvals,</text>
    <text x="22" y="108" class="row">anything that pauses or runs on a clock</text>
    <text x="22" y="132" class="small">a node's writes are a literal fields map</text>
  </g>

  <!-- footer -->
  <g transform="translate(60 606)">
    <rect width="1080" height="56" rx="14" fill="#ffffff" stroke="#c9d8d1"/>
    <text x="22" y="24" class="verdict" style="fill:#8a6a3a">Blocking a delete is a beforeDelete hook.</text>
    <text x="22" y="44" class="small">Validation rules run only on insert and update; there is no 'delete' validation event. Source: the ObjectStack hooks and validation docs at @objectstack/cli 17.7.0.</text>
  </g>
</svg>
