<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="One shared rule registry of 42 rules, 29 of which can fail a build, sits behind four doors. The three CLI commands each run all 29 gating rules; the runtime publish gate used by Studio, REST and MCP runs 16 of them. The remaining 13, including the row-level-security and sharing-rule enforceability gates, run on the CLI only.">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1b2338}
      .h{font-size:28px;font-weight:780}
      .hsub{font-size:17px;fill:#5b6480}
      .cap{font-size:15px;font-weight:780;letter-spacing:.07em;fill:#6b7492}
      .door{font-size:22px;font-weight:760}
      .mono{font-size:17px;fill:#4d5773}
      .num{font-size:56px;font-weight:800}
      .numsub{font-size:17px;fill:#4d5773}
      .wallname{font-size:24px;font-weight:770;fill:#f2f6ff}
      .wallsub{font-size:17px;fill:#c2cdea}
      .gapnum{font-size:56px;font-weight:800;fill:#8a5a12}
      .gapcap{font-size:15px;font-weight:780;letter-spacing:.07em;fill:#8a5a12}
      .gaptext{font-size:17px;fill:#6b5426}
    </style>
  </defs>
  <rect width="1000" height="560" fill="#f7f9fb"/>

  <text x="40" y="46" class="h">Four doors into one metadata wall</text>
  <text x="40" y="78" class="hsub">Which door your agent wrote through decides how many gating rules already ran.</text>

  <!-- the wall -->
  <g transform="translate(40 106)">
    <rect width="920" height="98" rx="18" fill="#1f2a4a"/>
    <text x="28" y="42" class="wallname">One shared author-time rule registry</text>
    <text x="28" y="72" class="wallsub">42 rules — 29 of them can fail a build</text>
  </g>

  <!-- doors 1-3 -->
  <g transform="translate(40 232)">
    <rect width="450" height="176" rx="18" fill="#eef2fb" stroke="#c6d2ee"/>
    <text x="28" y="38" class="cap">DOORS 1-3 — THE CLI</text>
    <text x="28" y="72" class="door">A pull request</text>
    <text x="28" y="100" class="mono">os validate / os build / os lint</text>
    <text x="28" y="152" class="num">29</text>
    <text x="112" y="152" class="numsub">gating rules run</text>
  </g>

  <!-- door 4 -->
  <g transform="translate(510 232)">
    <rect width="450" height="176" rx="18" fill="#eef2fb" stroke="#c6d2ee"/>
    <text x="28" y="38" class="cap">DOOR 4 — RUNTIME PUBLISH</text>
    <text x="28" y="72" class="door">An agent writing live</text>
    <text x="28" y="100" class="mono">Studio / REST /meta / MCP</text>
    <text x="28" y="152" class="num">16</text>
    <text x="112" y="152" class="numsub">gating rules run</text>
  </g>

  <!-- the gap -->
  <g transform="translate(40 436)">
    <rect width="920" height="96" rx="18" fill="#fdf6e7" stroke="#ecd9ae"/>
    <text x="28" y="66" class="gapnum">13</text>
    <text x="112" y="38" class="gapcap">THE GAP YOU INHERIT</text>
    <text x="112" y="68" class="gaptext">Gating rules that run on the CLI only — including the enforceability</text>
    <text x="112" y="90" class="gaptext">gates for row-level security predicates and sharing rules.</text>
  </g>
</svg>
