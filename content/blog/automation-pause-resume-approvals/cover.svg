<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="审批暂停和恢复">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#263d35" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}.title{font-size:38px;font-weight:780}.lead{font-size:18px;fill:#60746f}.label{font-size:19px;font-weight:750}.small{font-size:14px;fill:#647872}.dark{fill:#173a36}.white{fill:#eafff6}.soft{fill:#a8cdc2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="78" y="86" class="title">审批不是另一套系统</text>
  <text x="78" y="124" class="lead">真正的业务流程必须会等待，也必须能继续</text>
  <g transform="translate(96 168)" filter="url(#shadow)">
    <rect width="1008" height="366" rx="32" fill="#fffefa" stroke="#d8dfd6"/>
    <g transform="translate(60 120)">
      <rect width="170" height="90" rx="22" fill="#eef7f3" stroke="#bdd7cf"/>
      <text x="85" y="38" text-anchor="middle" class="label">触发流程</text>
      <text x="85" y="63" text-anchor="middle" class="small">提交折扣</text>
    </g>
    <g transform="translate(318 120)">
      <rect width="170" height="90" rx="22" class="dark"/>
      <text x="85" y="38" text-anchor="middle" class="white" font-size="18" font-weight="760">暂停</text>
      <text x="85" y="63" text-anchor="middle" class="soft" font-size="14">等待审批</text>
    </g>
    <g transform="translate(576 120)">
      <rect width="170" height="90" rx="22" fill="#fff3d6" stroke="#efc86c"/>
      <text x="85" y="38" text-anchor="middle" class="label">恢复</text>
      <text x="85" y="63" text-anchor="middle" class="small">通过 / 拒绝</text>
    </g>
    <g transform="translate(834 120)">
      <rect width="130" height="90" rx="22" fill="#edf2ff" stroke="#bdc8ee"/>
      <text x="65" y="38" text-anchor="middle" class="label">继续</text>
      <text x="65" y="63" text-anchor="middle" class="small">后续动作</text>
    </g>
    <path d="M234 165 H314 M492 165 H572 M750 165 H830" stroke="#2a7468" stroke-width="5" stroke-linecap="round"/>
    <text x="512" y="282" text-anchor="middle" class="small">流程没有结束，只是在等待一个明确的业务信号。</text>
  </g>
</svg>
