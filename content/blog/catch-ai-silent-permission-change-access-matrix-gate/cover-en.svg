<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Catch an AI's silent permission change before it ships: one edit flips allowDelete from false to true on crm_opportunity; os validate passes with no finding; os compile fails the build with the line 'crm_sales_user' gains delete on 'crm_opportunity' until a human regenerates the snapshot; the committed access matrix of the CRM example has seven entries">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .eyebrow{font-size:13px;font-weight:780;letter-spacing:.1em;fill:#2a7468}
      .title{font-size:48px;font-weight:800}
      .lead{font-size:19px;fill:#3f554f}
      .num{font-size:44px;font-weight:800;fill:#2a7468}
      .label{font-size:19px;font-weight:760}
      .label2{font-size:17px;font-weight:760}
      .small{font-size:13px;fill:#4b5d56}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;fill:#173a36}
      .ok{fill:#2a7468}
      .bad{fill:#a8432c}
      .foot{font-size:13px;fill:#4b5d56}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="118" class="eyebrow">ACCESS-MATRIX SNAPSHOT GATE · @OBJECTSTACK/CLI 17.7.0</text>
  <text x="78" y="186" class="title">Catch an AI's silent</text>
  <text x="78" y="244" class="title">permission change</text>
  <text x="78" y="302" class="title">before it ships.</text>
  <text x="78" y="354" class="lead">One edit. os validate: passed, no finding.</text>
  <text x="78" y="380" class="lead">os compile: build failed, with the one line</text>
  <text x="78" y="406" class="lead">a reviewer needs to sign.</text>
  <text x="78" y="458" class="small">The matrix reports effective capability, not raw flags:</text>
  <text x="78" y="476" class="small">what a permission set can actually do, with the object's record baseline on the row.</text>

  <g transform="translate(650 112)" filter="url(#shadow)">
    <rect width="472" height="456" rx="28" fill="#fffefa" stroke="#d8dfd6"/>

    <g transform="translate(28 30)">
      <rect width="416" height="88" rx="16" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="20" y="34" class="label">1 edit, one word</text>
      <text x="20" y="60" class="mono">crm_opportunity: { …, allowDelete: false → true }</text>
      <text x="20" y="78" class="small">src/security/sales-positions.ts, line 45 of the CRM example</text>
    </g>

    <g transform="translate(28 130)">
      <rect width="416" height="88" rx="16" fill="#f4faf7" stroke="#c9d8d1"/>
      <text x="20" y="34" class="label ok">✓ os validate — passed, exit 0</text>
      <text x="20" y="60" class="small">49 author-time rules ran. None reads allowDelete's value;</text>
      <text x="20" y="78" class="small">both values are valid, both enforceable. No finding.</text>
    </g>

    <g transform="translate(28 230)">
      <rect width="416" height="112" rx="16" fill="#fbeeea" stroke="#e5c4bb"/>
      <text x="20" y="34" class="label bad">✗ os compile — build failed, exit 1</text>
      <text x="20" y="60" class="mono">Access matrix drift (1 change)</text>
      <text x="20" y="78" class="mono">• 'crm_sales_user' gains delete on 'crm_opportunity'</text>
      <text x="20" y="100" class="small">until a human regenerates the snapshot and commits its diff</text>
    </g>

    <g transform="translate(28 354)">
      <rect width="416" height="74" rx="16" fill="#ffffff" stroke="#c9d8d1"/>
      <text x="20" y="50" class="num">7</text>
      <text x="62" y="32" class="label2">entries in the committed matrix</text>
      <text x="62" y="54" class="small">every grant the CRM declares, as one sorted table</text>
    </g>
  </g>

  <text x="78" y="630" class="foot">Measured on the bundled CRM example at @objectstack/cli 17.7.0 — the version npm create objectstack@latest installs.</text>
</svg>
