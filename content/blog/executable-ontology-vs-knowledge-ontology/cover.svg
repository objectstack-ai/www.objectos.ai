<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="可执行本体 vs 知识本体：没有继承，没有公理，没有推理器。同一个键 abstract: true 在 @objectstack/spec 的两个版本里：15.1.1 能解析、键被保留、运行时没有读者，抽象对象照样建表；17.7.0 被拒绝，并给出处方 Remove the key。你能写下的每一个键，运行时都有读者，否则它就被移除。">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6faf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff2e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233832" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .eyebrow{font-size:14px;font-weight:780;letter-spacing:.08em;fill:#256a5e}
      .title{font-size:52px;font-weight:800}
      .lead{font-size:19px;fill:#3f554f}
      .chip{font-size:14px;font-weight:760;fill:#256a5e}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#52655f}
      .code{font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:700;fill:#173a36}
      .ver{font-size:16px;font-weight:780}
      .small{font-size:13px;fill:#52655f}
      .verdictA{font-size:12px;font-weight:780;letter-spacing:.06em;fill:#7a5a2c}
      .verdictB{font-size:12px;font-weight:780;letter-spacing:.06em;fill:#256a5e}
      .arrow{font-size:13px;font-weight:760;fill:#256a5e}
      .foot{font-size:13px;fill:#52655f}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="78" y="112" class="eyebrow">可执行本体 VS 知识本体</text>
  <text x="78" y="178" class="title">没有继承，</text>
  <text x="78" y="238" class="title">没有公理，</text>
  <text x="78" y="298" class="title">没有推理器。</text>
  <text x="78" y="350" class="lead">为什么这三个「不」正是重点：</text>
  <text x="78" y="376" class="lead">你能写下的每一个键，运行时都有读者，</text>
  <text x="78" y="402" class="lead">否则它就被移除。</text>

  <g transform="translate(78 440)"><rect width="96" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="48" y="23" class="chip" text-anchor="middle">可执行</text></g>
  <g transform="translate(184 440)"><rect width="150" height="36" rx="18" fill="#ffffff" stroke="#b9dcd0"/><text x="75" y="23" class="chip" text-anchor="middle">先校验，不推理</text></g>

  <g transform="translate(650 104)" filter="url(#shadow)">
    <rect width="472" height="472" rx="28" fill="#fffefa" stroke="#d8dfd6"/>
    <text x="28" y="40" class="cap">一个键，两个版本</text>
    <g transform="translate(28 56)">
      <rect width="416" height="52" rx="12" fill="#eef7f2" stroke="#b9dcd0"/>
      <text x="208" y="34" class="code" text-anchor="middle">abstract: true</text>
    </g>

    <g transform="translate(28 128)">
      <rect width="416" height="124" rx="16" fill="#fdf4e8" stroke="#e6d3b6"/>
      <text x="20" y="32" class="ver">@objectstack/spec 15.1.1</text>
      <text x="20" y="58" class="small">能解析，键被保留，运行时没有读者：</text>
      <text x="20" y="78" class="small">抽象对象照样建表。</text>
      <text x="20" y="106" class="verdictA">被解析，无人读取</text>
    </g>

    <text x="236" y="284" class="arrow" text-anchor="middle">ADR-0049：要么强制执行，要么移除</text>

    <g transform="translate(28 300)">
      <rect width="416" height="124" rx="16" fill="#eef7f2" stroke="#b9dcd0"/>
      <text x="20" y="32" class="ver">@objectstack/spec 17.7.0</text>
      <text x="20" y="58" class="small">被拒绝：Unrecognized key(s) on this object.</text>
      <text x="20" y="78" class="small">消息以「Remove the key.」结尾</text>
      <text x="20" y="106" class="verdictB">每个键都有读者</text>
    </g>

    <text x="28" y="452" class="small">中间没有建过继承，被移除的是那个承诺。</text>
  </g>

  <text x="78" y="618" class="foot">在已发布的包上实测；每一句引文都在 ObjectStack 仓库里。</text>
</svg>
