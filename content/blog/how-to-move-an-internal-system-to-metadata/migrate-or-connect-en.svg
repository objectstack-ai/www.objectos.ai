<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-label="Decision tree: four questions — do you own the schema, is anyone asking it to change, is the behaviour the repeating kind, and can this object's writes move without a transaction spanning both databases — with three exits to connect-and-stop and one to migrate this object">
  <defs>
    <linearGradient id="dbg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f9fbf8"/>
      <stop offset="1" stop-color="#eef6f1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d736b"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .q{font-size:17px;font-weight:700}
      .qs{font-size:13.5px;fill:#5d736b}
      .edge{font-size:13px;font-weight:750;fill:#5d736b}
      .exit{font-size:16px;font-weight:760;fill:#1f6b4a}
      .exit-warn{font-size:16px;font-weight:760;fill:#7a4a12}
      .exits{font-size:13px;fill:#41564f}
      .start{font-size:15px;font-weight:700;fill:#f2f8f4}
      .go{font-size:19px;font-weight:800;fill:#7a4a12}
      .gos{font-size:13.5px;fill:#5d4218}
      .hdr{font-size:22px;font-weight:780}
      .cap{font-size:13.5px;fill:#5d736b}
    </style>
  </defs>
  <rect width="1000" height="760" fill="url(#dbg)"/>

  <text x="44" y="46" class="hdr">Migrate this object, or connect it and stop?</text>
  <text x="44" y="72" class="cap">Ask it per object, after the read-only connection exists — not per system, before it does.</text>

  <!-- Start -->
  <g transform="translate(44 96)">
    <rect width="470" height="44" rx="12" fill="#173a36"/>
    <text x="24" y="28" class="start">An internal system you want off</text>
  </g>

  <!-- Q1 -->
  <g transform="translate(44 172)">
    <rect width="470" height="76" rx="12" fill="#ffffff" stroke="#c8dbd1" stroke-width="1.5"/>
    <text x="22" y="32" class="q">1. Do you own the schema?</text>
    <text x="22" y="56" class="qs">Not a licensed ERP, vendor CRM or certified MES</text>
  </g>
  <g transform="translate(44 276)">
    <rect width="470" height="76" rx="12" fill="#ffffff" stroke="#c8dbd1" stroke-width="1.5"/>
    <text x="22" y="32" class="q">2. Is anyone actually asking it to change?</text>
    <text x="22" y="56" class="qs">Score the six-question health check honestly — 3 or more</text>
  </g>
  <g transform="translate(44 380)">
    <rect width="470" height="76" rx="12" fill="#ffffff" stroke="#c8dbd1" stroke-width="1.5"/>
    <text x="22" y="32" class="q">3. Is the behaviour the repeating kind?</text>
    <text x="22" y="56" class="qs">Objects, fields, permissions, approvals, views, processes</text>
  </g>
  <g transform="translate(44 484)">
    <rect width="470" height="90" rx="12" fill="#ffffff" stroke="#c8dbd1" stroke-width="1.5"/>
    <text x="22" y="32" class="q">4. Can it move without a transaction</text>
    <text x="22" y="54" class="q">spanning both databases?</text>
    <text x="22" y="76" class="qs">No cross-datasource joins, no cross-datasource transactions</text>
  </g>

  <!-- vertical NO/yes flow arrows -->
  <path d="M 279 140 L 279 168" stroke="#5d736b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 279 248 L 279 272" stroke="#5d736b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 279 352 L 279 376" stroke="#5d736b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 279 456 L 279 480" stroke="#5d736b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 279 574 L 279 604" stroke="#5d736b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="290" y="264" class="edge">YES</text>
  <text x="290" y="368" class="edge">YES</text>
  <text x="290" y="472" class="edge">YES</text>
  <text x="290" y="596" class="edge">YES</text>

  <!-- right-hand NO exits -->
  <path d="M 514 210 L 596 210" stroke="#5d736b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 514 314 L 596 314" stroke="#5d736b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 514 418 L 596 418" stroke="#5d736b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 514 529 L 596 529" stroke="#5d736b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="530" y="202" class="edge">NO</text>
  <text x="530" y="306" class="edge">NO</text>
  <text x="530" y="410" class="edge">NO</text>
  <text x="530" y="521" class="edge">NO</text>

  <g transform="translate(604 178)">
    <rect width="352" height="64" rx="12" fill="#e4f1ea" stroke="#9dc6b1" stroke-width="1.5"/>
    <text x="20" y="28" class="exit">Connect. Stay connected.</text>
    <text x="20" y="50" class="exits">You cannot migrate a schema you do not own.</text>
  </g>
  <g transform="translate(604 282)">
    <rect width="352" height="64" rx="12" fill="#e4f1ea" stroke="#9dc6b1" stroke-width="1.5"/>
    <text x="20" y="28" class="exit">Connect. Nothing to buy.</text>
    <text x="20" y="50" class="exits">A system nobody changes is finished, not ossified.</text>
  </g>
  <g transform="translate(604 386)">
    <rect width="352" height="64" rx="12" fill="#e4f1ea" stroke="#9dc6b1" stroke-width="1.5"/>
    <text x="20" y="28" class="exit">Connect. Keep the engine as code.</text>
    <text x="20" y="50" class="exits">Novel logic gets worse as declarations.</text>
  </g>
  <g transform="translate(604 497)">
    <rect width="352" height="64" rx="12" fill="#fdf0e2" stroke="#dcb98c" stroke-width="1.5"/>
    <text x="20" y="28" class="exit-warn">Move it with its cluster.</text>
    <text x="20" y="50" class="exits">Objects sharing a transaction cut over together.</text>
  </g>

  <!-- Terminal: migrate -->
  <g transform="translate(44 608)">
    <rect width="470" height="82" rx="14" fill="#fdf0e2" stroke="#c2762a" stroke-width="2"/>
    <text x="24" y="36" class="go">Migrate this object</text>
    <text x="24" y="62" class="gos">Reconcile its rules first — the disagreement rate is the gate.</text>
  </g>

  <text x="44" y="726" class="cap">Three of the five endpoints are &#8220;connect and stop&#8221;, and that is the honest distribution. Re-validation cost is a fifth question</text>
  <text x="44" y="746" class="cap">for regulated systems: price it before the engineering, because that is where the bill actually lands.</text>
</svg>
