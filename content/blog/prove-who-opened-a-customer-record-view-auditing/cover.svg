<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="是谁打开了这条客户记录？在 ObjectStack 17.7.0 上，sys_audit_log 账本里有两行 read：一个人经 REST，一个 AI Agent 经 MCP get_record，old_value、new_value 与 ip_address 均为 null。列表读取、未登记对象的读取和被拒绝的读取都没有留下行。一行查看记录永远不记的四件事：字段值、查看者看到了什么、IP 与 user agent、被拒绝的读取。">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7faf8"/>
      <stop offset=".6" stop-color="#edf6f1"/>
      <stop offset="1" stop-color="#fdf3e3"/>
    </linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#173a36}
      .h{font-size:34px;font-weight:800;fill:#173a36}
      .sub{font-size:17px;fill:#5d736b}
      .tag{font-size:12px;font-weight:780;letter-spacing:.08em;fill:#2a7468}
      .th{font-size:12px;font-weight:760;fill:#5d736b;letter-spacing:.04em}
      .m{font-family:ui-monospace,Menlo,monospace;font-size:14px;fill:#173a36}
      .mm{font-family:ui-monospace,Menlo,monospace;font-size:13px;fill:#5d736b}
      .who{font-size:14px;font-weight:720;fill:#173a36}
      .no{font-size:14px;fill:#8a7466}
      .nom{font-size:13px;fill:#b0452a}
      .li{font-size:16px;font-weight:720;fill:#173a36}
      .lis{font-size:13px;fill:#5d736b}
      .num{font-size:22px;font-weight:800;fill:#ffffff}
      .ver{font-size:13px;font-weight:720;fill:#2a7468}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="72" y="74" class="h">是谁打开了这条客户记录？什么时候？</text>
  <text x="72" y="104" class="sub">sys_audit_log 中的 read 动作，在 @objectstack/cli 17.7.0 上实测：五次读取，两行记录</text>

  <!-- Left: the ledger -->
  <g transform="translate(72 140)">
    <rect width="660" height="470" rx="20" fill="#ffffff" stroke="#d5e4de"/>
    <text x="28" y="38" class="tag">SYS_AUDIT_LOG · FILTER action = read</text>
    <text x="28" y="66" class="th">created_at</text>
    <text x="150" y="66" class="th">user_id</text>
    <text x="212" y="66" class="th">object · record</text>
    <text x="392" y="66" class="th">old / new</text>
    <text x="512" y="66" class="th">ip · user agent</text>
    <line x1="28" y1="78" x2="632" y2="78" stroke="#d5e4de" stroke-width="2"/>

    <!-- row 1: a person -->
    <rect x="14" y="92" width="628" height="70" rx="12" fill="#eef7f2"/>
    <text x="28" y="118" class="m">02:33:05.512</text>
    <text x="150" y="118" class="m">PdP4…</text>
    <text x="212" y="118" class="m">crm_contact · h7UV…</text>
    <text x="392" y="118" class="m">null · null</text>
    <text x="512" y="118" class="m">null · null</text>
    <text x="28" y="146" class="who">Dana，一名销售代表 · GET /api/v1/data/crm_contact/:id</text>

    <!-- row 2: an agent -->
    <rect x="14" y="172" width="628" height="70" rx="12" fill="#eef7f2"/>
    <text x="28" y="198" class="m">02:33:05.618</text>
    <text x="150" y="198" class="m">S8My…</text>
    <text x="212" y="198" class="m">crm_contact · Hwvc…</text>
    <text x="392" y="198" class="m">null · null</text>
    <text x="512" y="198" class="m">null · null</text>
    <text x="28" y="226" class="who">一个 AI Agent，x-api-key · MCP get_record</text>

    <line x1="28" y1="262" x2="632" y2="262" stroke="#d5e4de" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="28" y="292" class="tag" style="fill:#8a7466">三次没有留下行的读取</text>
    <text x="28" y="322" class="no">GET /api/v1/data/crm_contact</text>
    <text x="330" y="322" class="nom">列表读取 · 永远不记录</text>
    <text x="28" y="352" class="no">GET /api/v1/data/crm_account/:id</text>
    <text x="330" y="352" class="nom">对象不在 readAudit.objects 中</text>
    <text x="28" y="382" class="no">GET /api/v1/data/crm_contact/:id → 403</text>
    <text x="330" y="382" class="nom">被拒绝 · 钩子从未到达</text>

    <text x="28" y="428" class="mm">"total": 2 — 读取五秒之后，已越过 flushIntervalMs</text>
    <text x="28" y="450" class="mm">行在 objectstack.telemetry.db，不在 objectstack.db</text>
  </g>

  <!-- Right: four things never recorded -->
  <g transform="translate(762 140)">
    <rect width="366" height="470" rx="20" fill="#173a36"/>
    <text x="26" y="40" class="tag" style="fill:#9fd6c4">一行查看记录永远不记</text>

    <g transform="translate(26 70)">
      <rect width="40" height="40" rx="10" fill="#2a7468"/><text x="13" y="28" class="num">1</text>
      <text x="56" y="19" class="li" style="fill:#eafff6">字段值，永远不记</text>
      <text x="56" y="40" class="lis" style="fill:#9fd6c4">old_value 与 new_value 保持 null</text>
    </g>
    <g transform="translate(26 160)">
      <rect width="40" height="40" rx="10" fill="#2a7468"/><text x="13" y="28" class="num">2</text>
      <text x="56" y="19" class="li" style="fill:#eafff6">查看者看到了什么</text>
      <text x="56" y="40" class="lis" style="fill:#9fd6c4">只记一次打开，不记遮蔽后的字段</text>
    </g>
    <g transform="translate(26 250)">
      <rect width="40" height="40" rx="10" fill="#2a7468"/><text x="13" y="28" class="num">3</text>
      <text x="56" y="19" class="li" style="fill:#eafff6">IP 地址、user agent</text>
      <text x="56" y="40" class="lis" style="fill:#9fd6c4">这一行点名主体，不点名通道</text>
    </g>
    <g transform="translate(26 340)">
      <rect width="40" height="40" rx="10" fill="#2a7468"/><text x="13" y="28" class="num">4</text>
      <text x="56" y="19" class="li" style="fill:#eafff6">被拒绝或失败的读取</text>
      <text x="56" y="40" class="lis" style="fill:#9fd6c4">afterFind 只在读取成功后运行</text>
    </g>

    <text x="26" y="440" class="ver" style="fill:#9fd6c4">边界靠声明，而不是靠发现</text>
  </g>
</svg>
