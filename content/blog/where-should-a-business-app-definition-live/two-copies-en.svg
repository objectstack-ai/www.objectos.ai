<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Two ways to keep a business app's rules. Left, a definition: the files in your repository are the authoritative copy, where every change is a diff with a name and a reason; the build checks the files and turns them into the running system, which is rebuilt from them at each deploy. Right, configuration: an administrator changes settings in an admin screen, the running system and its database are the authoritative copy, and a file, if you keep one, describes what is running.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7468"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173a36}
      .h{font-size:26px;font-weight:780}
      .note{font-size:14px;fill:#5e716b}
      .cap{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#2a7468}
      .badge{font-size:12px;font-weight:780;letter-spacing:.07em;fill:#ffffff}
      .label{font-size:17px;font-weight:760}
      .small{font-size:13.5px;fill:#55685f}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fbfdfc"/>

  <text x="60" y="52" class="h">Two ways to keep a business app's rules: which copy wins?</text>
  <text x="60" y="80" class="note">The authoritative copy is the one that wins when the running system and any other copy disagree.</text>

  <g transform="translate(60 112)">
    <rect width="520" height="488" rx="20" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="34" class="cap">DEFINITION · THE REPOSITORY WINS</text>

    <rect x="24" y="56" width="472" height="104" rx="14" fill="#e6f4ec" stroke="#2a7468" stroke-width="2.5"/>
    <rect x="318" y="70" width="162" height="28" rx="14" fill="#2a7468"/>
    <text x="399" y="89" class="badge" text-anchor="middle">AUTHORITATIVE</text>
    <text x="44" y="92" class="label">Files in your repository</text>
    <text x="44" y="120" class="small">Every change is a diff with a name</text>
    <text x="44" y="140" class="small">and a written reason.</text>

    <line x1="260" y1="166" x2="260" y2="202" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

    <rect x="24" y="210" width="472" height="92" rx="14" fill="#f4f7f6" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="44" y="244" class="label">The build</text>
    <text x="44" y="270" class="small">Checks the files, then turns them</text>
    <text x="44" y="290" class="small">into the running system.</text>

    <line x1="260" y1="308" x2="260" y2="344" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

    <rect x="24" y="352" width="472" height="78" rx="14" fill="#f4f7f6" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="44" y="386" class="label">Running system</text>
    <text x="44" y="412" class="small">Rebuilt from the files at each deploy.</text>

    <text x="24" y="466" class="small">To change it: edit a file, read the diff, build.</text>
  </g>

  <g transform="translate(620 112)">
    <rect width="520" height="488" rx="20" fill="#ffffff" stroke="#2a7468" stroke-width="2"/>
    <text x="24" y="34" class="cap">CONFIGURATION · THE RUNNING SYSTEM WINS</text>

    <rect x="24" y="56" width="472" height="104" rx="14" fill="#f4f7f6" stroke="#c9d8d1" stroke-width="1.5"/>
    <text x="44" y="92" class="label">Admin screen</text>
    <text x="44" y="120" class="small">An administrator changes the settings</text>
    <text x="44" y="140" class="small">of the running system directly.</text>

    <line x1="260" y1="166" x2="260" y2="202" stroke="#2a7468" stroke-width="2.5" marker-end="url(#arr)"/>

    <rect x="24" y="210" width="472" height="92" rx="14" fill="#e6f4ec" stroke="#2a7468" stroke-width="2.5"/>
    <rect x="318" y="224" width="162" height="28" rx="14" fill="#2a7468"/>
    <text x="399" y="243" class="badge" text-anchor="middle">AUTHORITATIVE</text>
    <text x="44" y="244" class="label">Running system</text>
    <text x="44" y="270" class="small">Its database holds the current rules.</text>

    <line x1="260" y1="308" x2="260" y2="344" stroke="#2a7468" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arr)"/>

    <rect x="24" y="352" width="472" height="78" rx="14" fill="#ffffff" stroke="#9fb3ab" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="44" y="386" class="label">A file, if you keep one</text>
    <text x="44" y="412" class="small">Describes what is running.</text>

    <text x="24" y="466" class="small">To change it: change the setting in the screen.</text>
  </g>
</svg>
