<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="能跑不等于安全">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fbf3f1"/>
      <stop offset="1" stop-color="#f6eef7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#3a2330" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#2c1f29}.title{font-size:46px;font-weight:780}.sub{font-size:20px;fill:#6e5d68}.label{font-size:20px;font-weight:720}.tiny{font-size:15px;fill:#6e5d68}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#9a6b8a}.ok{fill:#1d7a5f}.invert{fill:#f6eaf0}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="86" y="96" class="title">"能跑" ≠ "安全"</text>
  <text x="86" y="134" class="sub">当搭它的人读不懂访问控制，谁来为它背书？</text>

  <g transform="translate(86 182)" filter="url(#shadow)">
    <rect width="430" height="410" rx="28" fill="#ffffff" stroke="#ecdfe6"/>
    <text x="34" y="54" class="label">你看得见的 <tspan class="ok">✓</tspan></text>
    <rect x="34" y="78" width="362" height="48" rx="12" fill="#f3e9f0"/>
    <text x="52" y="108" class="tiny">精致 UI、登录、Stripe 收款</text>
    <rect x="34" y="138" width="170" height="120" rx="14" fill="#efe6ee"/>
    <rect x="216" y="138" width="180" height="56" rx="12" fill="#efe6ee"/>
    <rect x="216" y="202" width="180" height="56" rx="12" fill="#efe6ee"/>
    <rect x="34" y="276" width="362" height="48" rx="12" fill="#e9f6f0"/>
    <text x="52" y="306" class="tiny" style="fill:#1d7a5f">演示惊艳，按钮都能点。</text>
    <text x="34" y="364" class="tiny">是一个读不懂 SQL 的人发布的。</text>
  </g>

  <g transform="translate(560 182)" filter="url(#shadow)">
    <rect width="554" height="410" rx="28" fill="#2c1f29"/>
    <text x="34" y="54" class="invert" font-size="20" font-weight="760">你看不见的 ✗</text>
    <rect x="34" y="78" width="486" height="92" rx="12" fill="#3a2a36"/>
    <text x="50" y="108" class="mono">create policy "read" on customers</text>
    <text x="50" y="130" class="mono">  for select using ( true );  -- ?</text>
    <text x="50" y="156" class="mono">-- 到底谁能读到第 X 行？</text>
    <text x="34" y="214" class="invert" style="fill:#e8758a" font-size="58" font-weight="800">170+</text>
    <text x="210" y="200" class="invert" font-size="17">个 Lovable 应用因行级安全</text>
    <text x="210" y="226" class="invert" font-size="17">失效而暴露</text>
    <text x="210" y="250" class="tiny" style="fill:#c98ba8">CVE-2025-48757</text>
    <line x1="34" y1="284" x2="520" y2="284" stroke="#4a3744"/>
    <text x="34" y="324" class="invert" font-size="16">一次 4,000 应用扫描中：</text>
    <text x="34" y="356" style="fill:#e8758a" font-size="16">175 个泄露实时 PII · 400+ 暴露密钥</text>
    <text x="34" y="384" class="tiny" style="fill:#c98ba8">扫描器只查策略"是否存在"——不查是否"有效"。</text>
  </g>
</svg>
